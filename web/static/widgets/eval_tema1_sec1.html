<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Evaluación — Tema 1, Sección 1 — Eulalia</title>
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: system-ui, -apple-system, sans-serif; background: #f8fafc; color: #1e293b; min-height: 100vh; }

.header { background: #4250b3; padding: 14px 24px; display: flex; align-items: center; gap: 12px; }
.header a { color: #fff; text-decoration: none; font-weight: 700; font-size: 18px; }
.header a:hover { opacity: 0.85; }
.header .sep { color: rgba(255,255,255,0.5); margin: 0 4px; }
.header .title { color: #fff; font-size: 16px; font-weight: 600; }

.container { max-width: 720px; margin: 0 auto; padding: 32px 20px; }

h2 { font-size: 22px; margin-bottom: 8px; color: #4250b3; }
.subtitle { font-size: 15px; color: #64748b; margin-bottom: 24px; line-height: 1.6; }

/* Progress bar */
.progress-bar { background: #e2e8f0; border-radius: 8px; height: 8px; margin-bottom: 28px; overflow: hidden; }
.progress-fill { height: 100%; background: #4250b3; border-radius: 8px; transition: width 0.4s ease; }
.progress-text { font-size: 13px; color: #94a3b8; margin-bottom: 8px; }

/* Question card */
.question-card {
    background: #fff; border: 2px solid #e2e8f0; border-radius: 12px;
    padding: 24px; margin-bottom: 24px; animation: fadeIn 0.3s ease;
}
@keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

.question-num { font-size: 12px; font-weight: 700; color: #94a3b8; text-transform: uppercase; margin-bottom: 8px; }
.question-text { font-size: 16px; font-weight: 600; line-height: 1.5; margin-bottom: 16px; }

.options { display: flex; flex-direction: column; gap: 8px; }
.option-btn {
    padding: 12px 16px; background: #fff; border: 2px solid #e2e8f0; border-radius: 8px;
    font-size: 14px; cursor: pointer; text-align: left; transition: all 0.2s;
    font-family: inherit; color: #1e293b; line-height: 1.4;
}
.option-btn:hover:not(.disabled) { border-color: #4250b3; background: #f5f3ff; }
.option-btn.correct { border-color: #16a34a; background: #f0fdf4; color: #166534; }
.option-btn.wrong { border-color: #dc2626; background: #fef2f2; color: #991b1b; }
.option-btn.disabled { pointer-events: none; opacity: 0.6; }
.option-btn.disabled.correct { opacity: 1; }

.feedback-box {
    margin-top: 16px; padding: 14px; border-radius: 8px;
    font-size: 14px; line-height: 1.6; display: none;
}
.feedback-box.show { display: block; }
.feedback-box.ok { background: #f0fdf4; border: 1px solid #bbf7d0; color: #166534; }
.feedback-box.fail { background: #fef2f2; border: 1px solid #fecaca; color: #991b1b; }

/* Buttons */
.btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 10px 24px; border-radius: 8px; font-size: 14px; font-weight: 600;
    border: none; cursor: pointer; transition: all 0.2s; font-family: inherit;
}
.btn-primary { background: #4250b3; color: #fff; }
.btn-primary:hover { background: #3740a0; }
.btn-secondary { background: #e2e8f0; color: #475569; }
.btn-secondary:hover { background: #cbd5e1; }

.nav-buttons { display: flex; justify-content: space-between; margin-top: 24px; }

/* Results */
.results-card {
    background: #fff; border: 2px solid #e2e8f0; border-radius: 16px;
    padding: 32px; text-align: center; animation: fadeIn 0.4s ease;
}
.score-circle {
    width: 120px; height: 120px; border-radius: 50%; margin: 0 auto 20px;
    display: flex; align-items: center; justify-content: center; flex-direction: column;
    font-size: 36px; font-weight: 800; color: #fff;
}
.score-circle.pass { background: linear-gradient(135deg, #16a34a, #22c55e); }
.score-circle.fail { background: linear-gradient(135deg, #dc2626, #ef4444); }
.score-circle .score-label { font-size: 12px; font-weight: 600; opacity: 0.9; }

.result-msg { font-size: 18px; font-weight: 700; margin-bottom: 8px; }
.result-msg.pass { color: #16a34a; }
.result-msg.fail { color: #dc2626; }
.result-detail { font-size: 14px; color: #64748b; line-height: 1.6; margin-bottom: 20px; }

/* Review topics */
.review-box {
    background: #fef2f2; border: 2px solid #fecaca; border-radius: 12px;
    padding: 20px; margin: 20px 0; text-align: left;
}
.review-box h3 { color: #991b1b; font-size: 15px; margin-bottom: 10px; }
.review-box ul { margin-left: 20px; font-size: 14px; color: #7f1d1d; line-height: 1.8; }
.review-box li { margin-bottom: 4px; }

.result-buttons { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 16px; }

/* Consultar al profesor */
.consult-fab {
    position: fixed; bottom: 24px; right: 24px; z-index: 90;
    background: #7c3aed; color: #fff; border: none; border-radius: 50%;
    width: 56px; height: 56px; font-size: 24px; cursor: pointer;
    box-shadow: 0 4px 12px rgba(124,58,237,0.4); transition: all 0.2s;
    display: flex; align-items: center; justify-content: center;
}
.consult-fab:hover { background: #6d28d9; transform: scale(1.08); }
.consult-fab .fab-tooltip {
    position: absolute; right: 64px; background: #1e293b; color: #fff;
    padding: 6px 12px; border-radius: 6px; font-size: 12px; font-weight: 600;
    white-space: nowrap; opacity: 0; pointer-events: none; transition: opacity 0.2s;
}
.consult-fab:hover .fab-tooltip { opacity: 1; }

.consult-overlay {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4);
    z-index: 100; align-items: center; justify-content: center;
}
.consult-overlay.show { display: flex; }
.consult-modal {
    background: #fff; border-radius: 14px; padding: 28px; width: 90%; max-width: 480px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.15); animation: fadeIn 0.3s ease;
}
.consult-modal h3 { font-size: 18px; color: #7c3aed; margin-bottom: 6px; }
.consult-modal .cm-sub { font-size: 13px; color: #64748b; margin-bottom: 16px; line-height: 1.5; }
.consult-modal textarea {
    width: 100%; min-height: 100px; padding: 12px; border: 2px solid #e2e8f0;
    border-radius: 8px; font-family: inherit; font-size: 14px; line-height: 1.5;
    resize: vertical; transition: border-color 0.2s;
}
.consult-modal textarea:focus { outline: none; border-color: #7c3aed; }
.consult-modal .cm-count { font-size: 11px; color: #94a3b8; text-align: right; margin-top: 4px; }
.consult-modal .cm-btns { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }
.consult-modal .cm-btn {
    padding: 8px 20px; border-radius: 8px; font-size: 13px; font-weight: 600;
    border: none; cursor: pointer; font-family: inherit; transition: all 0.2s;
}
.consult-modal .cm-cancel { background: #e2e8f0; color: #475569; }
.consult-modal .cm-cancel:hover { background: #cbd5e1; }
.consult-modal .cm-send { background: #7c3aed; color: #fff; }
.consult-modal .cm-send:hover { background: #6d28d9; }
.consult-modal .cm-send:disabled { opacity: 0.5; cursor: not-allowed; }
.consult-modal .cm-ok { display: none; text-align: center; padding: 20px 0; }
.consult-modal .cm-ok.show { display: block; }
.consult-modal .cm-ok p { font-size: 15px; color: #16a34a; font-weight: 600; margin-bottom: 4px; }
.consult-modal .cm-ok span { font-size: 13px; color: #64748b; }
</style>
</head>
<body>

<div class="header">
    <a href="/tutores-virtuales/eulalia">Eulalia</a>
    <span class="sep">›</span>
    <span class="title">Tema 1 — Evaluación: Fonología y fonética</span>
</div>

<div class="container">
    <div id="quiz-area"></div>
    <div id="results-area" style="display:none;"></div>
</div>

<!-- Consultar al profesor -->
<button class="consult-fab" onclick="consultOpen()" title="Consultar al profesor">
    <span class="fab-tooltip">Consultar al profesor</span>
    &#9993;
</button>
<div class="consult-overlay" id="consult-overlay" onclick="if(event.target===this)consultClose()">
    <div class="consult-modal">
        <div id="consult-form">
            <h3>Consultar al profesor</h3>
            <p class="cm-sub">Escribe tu duda sobre este ejercicio. El profesor la recibirá y te responderá.</p>
            <textarea id="consult-text" placeholder="Escribe tu consulta aquí..." oninput="consultCount()"></textarea>
            <div class="cm-count"><span id="consult-count">0</span> caracteres</div>
            <div class="cm-btns">
                <button class="cm-btn cm-cancel" onclick="consultClose()">Cancelar</button>
                <button class="cm-btn cm-send" id="consult-send" onclick="consultSend()" disabled>Enviar consulta</button>
            </div>
        </div>
        <div class="cm-ok" id="consult-ok">
            <p>&#10003; Consulta enviada</p>
            <span>El profesor la revisará y te responderá.</span>
            <div class="cm-btns" style="justify-content:center; margin-top:16px;">
                <button class="cm-btn cm-cancel" onclick="consultClose()">Cerrar</button>
            </div>
        </div>
    </div>
</div>

<script>

// ── Progress tracking ──
function saveProgress(widgetId, score, maxScore) {
    try {
        var progress = JSON.parse(localStorage.getItem('lali_progress') || '{}');
        var pct = Math.round(score / maxScore * 100);
        var prev = progress[widgetId];
        // Only update if better score or not yet saved
        if (!prev || pct > prev.score) {
            progress[widgetId] = { completed: pct >= 75, score: pct, date: new Date().toISOString().split('T')[0] };
            localStorage.setItem('lali_progress', JSON.stringify(progress));
        }
    } catch(e) {}
}

// ── Question bank ──
// Each question has: topic (for review feedback), text, options, correct index, explanation
const QUESTIONS = [
    {
        topic: "Definición de fonología y fonética",
        text: "¿Cuál es la diferencia principal entre fonología y fonética?",
        options: [
            "La fonología estudia los sonidos concretos y la fonética las unidades abstractas.",
            "La fonología estudia los fonemas (unidades abstractas) y la fonética los sonidos concretos asociados a ellos.",
            "La fonología y la fonética estudian lo mismo pero con métodos diferentes.",
            "La fonología estudia la escritura y la fonética la pronunciación."
        ],
        correct: 1,
        explanation: "La fonología se ocupa de los fonemas como unidades abstractas del sistema lingüístico, mientras que la fonética estudia las propiedades de los sonidos concretos que se asocian a esos fonemas."
    },
    {
        topic: "Concepto de fonema",
        text: "¿Qué es un fonema?",
        options: [
            "Un sonido concreto que producimos al hablar.",
            "Una letra del alfabeto.",
            "Una clase de sonidos y una representación mental que nos permite reconocerlos y producirlos.",
            "Un sinónimo de sílaba."
        ],
        correct: 2,
        explanation: "Los fonemas no son sonidos concretos, sino clases de sonidos (como el \"rojo\" agrupa muchos tonos de rojo) y representaciones mentales que compartimos en nuestro cerebro."
    },
    {
        topic: "Fonema vs alófono",
        text: "Si un hablante pronuncia la /g/ de \"gato\" como oclusiva [g] y otro la pronuncia como aproximante [ɣ], ¿qué tipo de cambio se produce?",
        options: [
            "Un cambio fonológico: cambia el significado de la palabra.",
            "Un cambio alofónico: cambia el matiz fonético pero no el significado.",
            "Un error de pronunciación que impide la comunicación.",
            "Un cambio morfológico."
        ],
        correct: 1,
        explanation: "Son dos alófonos del mismo fonema /g/. El significado no cambia (sigue siendo \"gato\"), solo varía el matiz fonético. Es como un semáforo con un rojo más apagado: sigue significando \"parar\"."
    },
    {
        topic: "Fonema vs alófono",
        text: "¿Qué ocurre si en la palabra \"pato\" sustituimos /p/ por /g/?",
        options: [
            "Nada, porque son alófonos del mismo fonema.",
            "Cambia el matiz pero se entiende igual.",
            "Cambia el significado: \"pato\" pasa a ser \"gato\". Es un cambio fonológico.",
            "La palabra deja de existir en español."
        ],
        correct: 2,
        explanation: "Al sustituir un fonema por otro, el significado cambia por completo. Este es un cambio fonológico, equivalente a poner azul donde debería ir rojo en un semáforo."
    },
    {
        topic: "Representación mental",
        text: "¿Por qué podemos reconocer la misma letra \"A\" escrita en tipografías, tamaños y colores muy diferentes?",
        options: [
            "Porque todas las \"A\" tienen exactamente la misma forma.",
            "Porque memorizamos cada variante posible de la letra.",
            "Porque tenemos una representación mental abstracta de la letra A que nos permite reconocerla pese a la variación física.",
            "Porque el contexto nos dice qué letra es."
        ],
        correct: 2,
        explanation: "Tenemos una representación mental abstracta que nos permite tanto reconocer (percepción) como producir (producción) la letra, igual que ocurre con los fonemas."
    },
    {
        topic: "Subdisciplinas de la fonética",
        text: "¿Cuáles son las tres subdisciplinas de la fonética y a qué fase de la comunicación se asocian?",
        options: [
            "Fonética articulatoria (producción), fonética acústica (transmisión) y fonética perceptiva (recepción).",
            "Fonética sintáctica, fonética semántica y fonética pragmática.",
            "Fonética vocálica, fonética consonántica y fonética suprasegmental.",
            "Fonética histórica, fonética comparada y fonética experimental."
        ],
        correct: 0,
        explanation: "Las tres subdisciplinas corresponden a las tres fases del proceso de comunicación: producción (articulatoria), transmisión (acústica) y recepción (perceptiva)."
    },
    {
        topic: "Concepto de fonema",
        text: "¿Cómo se representan los fonemas en fonología?",
        options: [
            "Entre corchetes: [p].",
            "Entre barras: /p/.",
            "Entre paréntesis: (p).",
            "Entre comillas: \"p\"."
        ],
        correct: 1,
        explanation: "En fonología, los fonemas se representan entre barras (por ejemplo, /p/). Los corchetes se usan para la transcripción fonética de los sonidos concretos (alófonos)."
    },
    {
        topic: "Fonema vs alófono",
        text: "En la analogía del semáforo, ¿a qué equivaldría un cambio alofónico?",
        options: [
            "A cambiar el rojo por azul.",
            "A apagar el semáforo.",
            "A que el rojo sea un poco más apagado o más brillante, pero siga siendo rojo.",
            "A añadir un cuarto color al semáforo."
        ],
        correct: 2,
        explanation: "Un cambio alofónico es como un cambio de matiz: el rojo puede ser más apagado o más brillante, pero sigue perteneciendo a la categoría \"rojo\" y sigue significando \"parar\"."
    },
    {
        topic: "Definición de fonología y fonética",
        text: "¿Qué estudia la fonética articulatoria?",
        options: [
            "Las propiedades acústicas del sonido durante su transmisión.",
            "Los mecanismos de percepción del habla.",
            "El proceso de fonación y articulación de los sonidos del habla.",
            "Las reglas de combinación de fonemas en sílabas."
        ],
        correct: 2,
        explanation: "La fonética articulatoria estudia cómo se producen los sonidos del habla: el proceso de fonación y articulación."
    },
    {
        topic: "Representación mental",
        text: "Cuando produces una /a/, ¿qué guía tu producción?",
        options: [
            "Copias exactamente una /a/ concreta que oíste antes.",
            "Tu representación mental abstracta de /a/ guía la producción de un sonido nuevo.",
            "Lees la transcripción fonética y la reproduces.",
            "No hay ningún mecanismo: la producción es aleatoria."
        ],
        correct: 1,
        explanation: "No copiamos un sonido concreto, sino que nuestra representación mental abstracta del fonema guía la producción. Por eso cada vez que decimos /a/ suena ligeramente diferente, pero siempre es reconocible como /a/."
    }
];

// ── Topic → review guidance ──
const REVIEW_GUIDE = {
    "Definición de fonología y fonética": "Repasa la diferencia entre fonología (unidades abstractas, fonemas) y fonética (sonidos concretos), así como las tres subdisciplinas de la fonética: articulatoria, acústica y perceptiva.",
    "Concepto de fonema": "Repasa qué es un fonema: una clase de sonidos y una representación mental, no un sonido concreto. Recuerda que se representan entre barras /p/.",
    "Fonema vs alófono": "Repasa la diferencia entre cambio fonológico (cambia el significado, como pato→gato) y cambio alofónico (cambia el matiz pero no el significado, como [g] vs [ɣ]). Recuerda la analogía del semáforo.",
    "Representación mental": "Repasa el concepto de representación mental: la categoría abstracta en tu cerebro que te permite tanto reconocer (percepción) como producir (producción) un fonema. Recuerda el ejercicio de la letra A.",
    "Subdisciplinas de la fonética": "Repasa las tres subdisciplinas: fonética articulatoria (producción), fonética acústica (transmisión) y fonética perceptiva (recepción)."
};

// ── Quiz state ──
const PASS_THRESHOLD = 0.8;
let currentQ = 0;
let answers = new Array(QUESTIONS.length).fill(null); // null or {chosen, correct}
let answered = false;

function render() {
    if (currentQ >= QUESTIONS.length) { showResults(); return; }
    const q = QUESTIONS[currentQ];
    answered = false;

    let html = '';
    html += '<div class="progress-text">Pregunta ' + (currentQ + 1) + ' de ' + QUESTIONS.length + '</div>';
    html += '<div class="progress-bar"><div class="progress-fill" style="width:' + ((currentQ / QUESTIONS.length) * 100) + '%"></div></div>';

    html += '<div class="question-card">';
    html += '<div class="question-num">Pregunta ' + (currentQ + 1) + '</div>';
    html += '<div class="question-text">' + q.text + '</div>';
    html += '<div class="options">';
    q.options.forEach((opt, i) => {
        html += '<button class="option-btn" id="opt-' + i + '" onclick="answer(' + i + ')">' + opt + '</button>';
    });
    html += '</div>';
    html += '<div class="feedback-box" id="feedback"></div>';
    html += '</div>';

    html += '<div class="nav-buttons">';
    if (currentQ > 0) {
        html += '<button class="btn btn-secondary" onclick="prevQ()">‹ Anterior</button>';
    } else {
        html += '<span></span>';
    }
    html += '<button class="btn btn-primary" id="next-btn" style="display:none" onclick="nextQ()">Siguiente ›</button>';
    html += '</div>';

    document.getElementById('quiz-area').innerHTML = html;
    document.getElementById('results-area').style.display = 'none';

    // If already answered, restore state
    if (answers[currentQ] !== null) {
        restoreAnswer();
    }
}

function answer(chosen) {
    if (answered) return;
    answered = true;
    const q = QUESTIONS[currentQ];
    const isCorrect = chosen === q.correct;
    answers[currentQ] = { chosen: chosen, correct: isCorrect };

    // Disable all options
    q.options.forEach((_, i) => {
        const btn = document.getElementById('opt-' + i);
        btn.classList.add('disabled');
        if (i === q.correct) btn.classList.add('correct');
        if (i === chosen && !isCorrect) btn.classList.add('wrong');
    });

    // Show feedback
    const fb = document.getElementById('feedback');
    fb.className = 'feedback-box show ' + (isCorrect ? 'ok' : 'fail');
    fb.innerHTML = (isCorrect ? '<strong>¡Correcto!</strong> ' : '<strong>Incorrecto.</strong> ') + q.explanation;

    document.getElementById('next-btn').style.display = '';
}

function restoreAnswer() {
    const a = answers[currentQ];
    const q = QUESTIONS[currentQ];
    answered = true;

    q.options.forEach((_, i) => {
        const btn = document.getElementById('opt-' + i);
        btn.classList.add('disabled');
        if (i === q.correct) btn.classList.add('correct');
        if (i === a.chosen && !a.correct) btn.classList.add('wrong');
    });

    const fb = document.getElementById('feedback');
    fb.className = 'feedback-box show ' + (a.correct ? 'ok' : 'fail');
    fb.innerHTML = (a.correct ? '<strong>¡Correcto!</strong> ' : '<strong>Incorrecto.</strong> ') + q.explanation;
    document.getElementById('next-btn').style.display = '';
}

function nextQ() { currentQ++; render(); window.scrollTo({ top: 0, behavior: 'smooth' }); }
function prevQ() { currentQ--; render(); window.scrollTo({ top: 0, behavior: 'smooth' }); }

function showResults() {
    document.getElementById('quiz-area').innerHTML = '';
    const total = QUESTIONS.length;
    const correct = answers.filter(a => a && a.correct).length;
    const pct = Math.round((correct / total) * 100);
    const passed = (correct / total) >= PASS_THRESHOLD;

    // Find failed topics
    const failedTopics = new Set();
    answers.forEach((a, i) => {
        if (a && !a.correct) failedTopics.add(QUESTIONS[i].topic);
    });

    let html = '<div class="results-card">';
    html += '<div class="score-circle ' + (passed ? 'pass' : 'fail') + '">';
    html += pct + '%<div class="score-label">' + correct + '/' + total + '</div></div>';

    if (passed) {
        html += '<div class="result-msg pass">¡Has superado la evaluación!</div>';
        html += '<div class="result-detail">Has demostrado un buen dominio de los conceptos de fonología y fonética. Puedes avanzar a la siguiente sección.</div>';
    } else {
        html += '<div class="result-msg fail">Necesitas repasar antes de avanzar</div>';
        html += '<div class="result-detail">Has obtenido un ' + pct + '%. Necesitas al menos un 80% para avanzar a la siguiente sección.</div>';
    }

    if (failedTopics.size > 0) {
        html += '<div class="review-box"><h3>Repasa estos temas:</h3><ul>';
        failedTopics.forEach(topic => {
            const guide = REVIEW_GUIDE[topic] || topic;
            html += '<li><strong>' + topic + ':</strong> ' + guide + '</li>';
        });
        html += '</ul></div>';
    }

    html += '<div class="result-buttons">';
    if (!passed) {
        html += '<button class="btn btn-primary" onclick="retry()">Repetir evaluación</button>';
    }
    html += '<button class="btn btn-secondary" onclick="reviewAnswers()">Revisar respuestas</button>';
    html += '<button class="btn btn-' + (passed ? 'primary' : 'secondary') + '" onclick="window.location.href=\'/tutores-virtuales/eulalia\'">' + (passed ? 'Continuar al tutor ›' : 'Volver al tutor') + '</button>';
    html += '</div></div>';

    document.getElementById('results-area').innerHTML = html;
    document.getElementById('results-area').style.display = '';
    saveProgress('eval_tema1_sec1', correct, total);
}

function retry() {
    currentQ = 0;
    answers.fill(null);
    render();
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

function reviewAnswers() {
    currentQ = 0;
    render();
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

// Start
render();

// ── Consultar al profesor ──
var CONSULT_WIDGET = 'Evaluación — Tema 1, Sección 1';
function consultOpen() {
    document.getElementById('consult-overlay').classList.add('show');
    document.getElementById('consult-form').style.display = '';
    document.getElementById('consult-ok').classList.remove('show');
    document.getElementById('consult-text').value = '';
    document.getElementById('consult-count').textContent = '0';
    document.getElementById('consult-send').disabled = true;
}
function consultClose() {
    document.getElementById('consult-overlay').classList.remove('show');
}
function consultCount() {
    var n = document.getElementById('consult-text').value.trim().length;
    document.getElementById('consult-count').textContent = n;
    document.getElementById('consult-send').disabled = n < 10;
}
async function consultSend() {
    var text = document.getElementById('consult-text').value.trim();
    if (text.length < 10) return;
    document.getElementById('consult-send').disabled = true;
    document.getElementById('consult-send').textContent = 'Enviando...';
    try {
        var res = await fetch('/api/public-agent/eulalia/consulta-profesor', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ consulta: text, widget: CONSULT_WIDGET, contexto: document.title })
        });
        var data = await res.json();
        if (data.error) throw new Error(data.error);
        document.getElementById('consult-form').style.display = 'none';
        document.getElementById('consult-ok').classList.add('show');
    } catch(e) {
        alert('Error al enviar: ' + e.message);
    } finally {
        document.getElementById('consult-send').textContent = 'Enviar consulta';
    }
}
</script>
