<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Análisis de errores fonológicos — Eulalia</title>
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: system-ui, -apple-system, sans-serif; background: #f8fafc; color: #1e293b; min-height: 100vh; }

.header { background: #4250b3; padding: 14px 24px; display: flex; align-items: center; gap: 12px; }
.header a { color: #fff; text-decoration: none; font-weight: 700; font-size: 18px; }
.header a:hover { opacity: 0.85; }
.header .sep { color: rgba(255,255,255,0.5); margin: 0 4px; }
.header .title { color: #fff; font-size: 16px; font-weight: 600; }

.container { max-width: 740px; margin: 0 auto; padding: 32px 20px; }

h2 { font-size: 22px; margin-bottom: 8px; color: #4250b3; }
.subtitle { font-size: 15px; color: #64748b; margin-bottom: 24px; line-height: 1.6; }

.btn { padding: 8px 20px; border-radius: 8px; font-size: 14px; font-weight: 600; border: none; cursor: pointer; font-family: inherit; transition: all 0.2s; }
.btn-primary { background: #4250b3; color: #fff; }
.btn-primary:hover { background: #3740a0; }
.btn-secondary { background: #e2e8f0; color: #475569; }
.btn-secondary:hover { background: #cbd5e1; }

.exercise-card {
    background: #fff; border: 2px solid #e2e8f0; border-radius: 12px;
    padding: 20px 24px; margin-bottom: 16px;
}
.ex-label { font-size: 12px; font-weight: 700; color: #94a3b8; text-transform: uppercase; margin-bottom: 8px; }
.ex-pair { display: flex; gap: 16px; align-items: center; margin-bottom: 12px; font-size: 15px; }
.ex-target { font-family: 'Doulos SIL', serif; font-weight: 700; color: #4250b3; }
.ex-arrow { color: #94a3b8; }
.ex-produced { font-family: 'Doulos SIL', serif; font-weight: 700; color: #dc2626; }

.answer-select {
    width: 100%; padding: 8px 12px; border: 2px solid #e2e8f0; border-radius: 6px;
    font-family: inherit; font-size: 13px; transition: border-color 0.2s;
}
.answer-select:focus { outline: none; border-color: #4250b3; }
.answer-select.correct { border-color: #16a34a; background: #f0fdf4; }
.answer-select.incorrect { border-color: #dc2626; background: #fef2f2; }

.ex-feedback { margin-top: 8px; font-size: 13px; display: none; line-height: 1.6; }
.ex-feedback.show { display: block; }

.results-bar {
    background: #fff; border: 2px solid #e2e8f0; border-radius: 12px;
    padding: 16px 24px; margin-top: 20px; display: none; text-align: center;
}
.results-bar.show { display: block; }
.score { font-size: 36px; font-weight: 800; }
.score.good { color: #16a34a; }
.score.mid { color: #f59e0b; }
.score.bad { color: #dc2626; }

.action-bar { display: flex; gap: 8px; margin-top: 16px; justify-content: center; }

</style>
</head>
<body>

<div class="header">
    <a href="/tutores-virtuales/eulalia">Eulalia</a>
    <span class="sep">›</span>
    <span class="title">Practica</span>
    <span class="sep">›</span>
    <span class="title">Tema 2</span>
    <span class="sep">›</span>
    <span class="title">Análisis de errores</span>
</div>

<div class="container">
    <h2>Análisis de errores fonológicos</h2>
    <p class="subtitle">Clasifica cada error: ¿es un error de estructura de palabra, de sílaba o sistémico? Indica el subtipo concreto.</p>

    <div style="margin-bottom:20px;">
        <button class="btn btn-primary" onclick="generateExercise()">Nuevo ejercicio</button>
    </div>

    <div id="exercise-area"></div>

    <div class="results-bar" id="results-bar">
        <div class="score" id="score-text"></div>
        <div style="font-size:13px; color:#64748b; margin-top:4px;" id="results-detail"></div>
    </div>

    <div class="action-bar" id="action-bar" style="display:none;">
        <button class="btn btn-primary" onclick="checkAll()">Comprobar</button>
        <button class="btn btn-secondary" onclick="showSolutions()">Ver soluciones</button>
        <button class="btn btn-secondary" onclick="generateExercise()">Nuevo ejercicio</button>
    </div>
</div>

</div>

<script>
// ── Error exercise bank ──
var EXERCISES = [
    {target:"/ma.ɾi.ˈpo.sa/", produced:"/ˈpo.sa/", type:"palabra", subtype:"Omisión de sílaba átona", explanation:"Se omiten las dos primeras sílabas átonas /ma.ɾi/."},
    {target:"/ˈtɾen/", produced:"/ˈten/", type:"silaba", subtype:"Simplificación de ataque", explanation:"El grupo consonántico /tɾ/ se reduce a /t/."},
    {target:"/ˈka.sa/", produced:"/ˈta.sa/", type:"sistemico", subtype:"Adelantamiento", explanation:"La velar /k/ se sustituye por la dental /t/ (lugar más anterior)."},
    {target:"/ˈme.sa/", produced:"/ˈse.ma/", type:"palabra", subtype:"Metátesis", explanation:"Se intercambian las posiciones de /m/ y /s/."},
    {target:"/ˈtie.ne/", produced:"/ˈte.ne/", type:"silaba", subtype:"Simplificación de núcleo", explanation:"Se pierde la semiconsonante /i/ del diptongo /ie/."},
    {target:"/ˈde.do/", produced:"/ˈte.to/", type:"sistemico", subtype:"Ensordecimiento", explanation:"La sonora /d/ se sustituye por la sorda /t/."},
    {target:"/ˈpan/", produced:"/ˈpa/", type:"silaba", subtype:"Omisión de coda", explanation:"Se omite la consonante /n/ en posición de coda."},
    {target:"/ˈka.na/", produced:"/ˈna.na/", type:"palabra", subtype:"Asimilación regresiva", explanation:"La /k/ se asimila a la /n/ que viene después."},
    {target:"/ˈke.so/", produced:"/ˈke.ko/", type:"palabra", subtype:"Asimilación progresiva", explanation:"La /s/ se asimila a la /k/ anterior."},
    {target:"/ˈpie/", produced:"/ˈie/", type:"silaba", subtype:"Omisión de ataque", explanation:"Se omite la consonante /p/ en posición de ataque."},
    {target:"/ˈplan/", produced:"/ˈpan/", type:"silaba", subtype:"Simplificación de ataque", explanation:"El grupo /pl/ se reduce a /p/."},
    {target:"/θa.ˈpa.to/", produced:"/ˈpa.to/", type:"palabra", subtype:"Omisión de sílaba átona", explanation:"Se omite la primera sílaba átona /θa/."},
    {target:"/ˈten/", produced:"/ˈte/", type:"silaba", subtype:"Omisión de coda", explanation:"Se omite la /n/ final."},
    {target:"/ˈma.la.ga/", produced:"/ˈma.ga.la/", type:"palabra", subtype:"Metátesis", explanation:"Se intercambian las sílabas /la/ y /ga/."},
    {target:"/ma.ˈɲa.na/", produced:"/ma.ˈna.na/", type:"palabra", subtype:"Asimilación regresiva", explanation:"La /ɲ/ se asimila a la /n/ posterior."},
    {target:"/ˈta.θa/", produced:"/ˈta.ta/", type:"palabra", subtype:"Asimilación progresiva", explanation:"La /θ/ se asimila a la /t/ anterior."},
    {target:"/ˈbo.ka/", produced:"/ˈmo.ka/", type:"sistemico", subtype:"Nasalización", explanation:"La oclusiva sonora /b/ se sustituye por la nasal /m/."},
    {target:"/ˈma.no/", produced:"/ˈba.no/", type:"sistemico", subtype:"Desnasalización", explanation:"La nasal /m/ se sustituye por la oral /b/."},
    {target:"/ˈka.sa/", produced:"/ˈxa.sa/", type:"sistemico", subtype:"Lenición", explanation:"La oclusiva /k/ se suaviza a la fricativa /x/."},
    {target:"/ˈxa.mon/", produced:"/ˈka.mon/", type:"sistemico", subtype:"Fortición", explanation:"La fricativa /x/ se refuerza a la oclusiva /k/."},
    {target:"/ˈpe.ro/", produced:"/ˈke.ro/", type:"sistemico", subtype:"Posteriorización", explanation:"La bilabial /p/ se sustituye por la velar /k/."},
    {target:"/ˈta.pa/", produced:"/ˈda.pa/", type:"sistemico", subtype:"Sonorización", explanation:"La sorda /t/ se sustituye por la sonora /d/."},
    {target:"/es.ˈtɾe.ʝa/", produced:"/e.ˈte.ʝa/", type:"silaba", subtype:"Simplificación de ataque", explanation:"El grupo /tɾ/ se reduce a /t/, y se omite la /s/ en coda."},
    {target:"/ma.ɾi.ˈpo.sa/", produced:"/ˈsa/", type:"palabra", subtype:"Omisión de sílaba tónica", explanation:"Se omite la sílaba tónica y las átonas, quedando solo /sa/."},
];

var ERROR_TYPES = [
    {value: "", label: "— Selecciona —"},
    {value: "palabra|Asimilación regresiva", label: "Estructura de palabra: Asimilación regresiva"},
    {value: "palabra|Asimilación progresiva", label: "Estructura de palabra: Asimilación progresiva"},
    {value: "palabra|Metátesis", label: "Estructura de palabra: Metátesis"},
    {value: "palabra|Omisión de sílaba átona", label: "Estructura de palabra: Omisión de sílaba átona"},
    {value: "palabra|Omisión de sílaba tónica", label: "Estructura de palabra: Omisión de sílaba tónica"},
    {value: "silaba|Omisión de ataque", label: "Estructura de sílaba: Omisión de ataque"},
    {value: "silaba|Simplificación de ataque", label: "Estructura de sílaba: Simplificación de ataque"},
    {value: "silaba|Simplificación de núcleo", label: "Estructura de sílaba: Simplificación de núcleo"},
    {value: "silaba|Omisión de coda", label: "Estructura de sílaba: Omisión de coda"},
    {value: "sistemico|Sonorización", label: "Sistémico: Sonorización"},
    {value: "sistemico|Ensordecimiento", label: "Sistémico: Ensordecimiento"},
    {value: "sistemico|Nasalización", label: "Sistémico: Nasalización"},
    {value: "sistemico|Desnasalización", label: "Sistémico: Desnasalización"},
    {value: "sistemico|Lenición", label: "Sistémico: Lenición"},
    {value: "sistemico|Fortición", label: "Sistémico: Fortición"},
    {value: "sistemico|Adelantamiento", label: "Sistémico: Adelantamiento"},
    {value: "sistemico|Posteriorización", label: "Sistémico: Posteriorización"},
];

var currentItems = [];

function generateExercise() {
    var shuffled = EXERCISES.slice().sort(function() { return Math.random() - 0.5; });
    currentItems = shuffled.slice(0, 6);

    var area = document.getElementById('exercise-area');
    area.innerHTML = '';

    var optionsHtml = ERROR_TYPES.map(function(t) {
        return '<option value="' + t.value + '">' + t.label + '</option>';
    }).join('');

    currentItems.forEach(function(item, i) {
        var card = document.createElement('div');
        card.className = 'exercise-card';
        card.innerHTML =
            '<div class="ex-label">Error ' + (i + 1) + '</div>' +
            '<div class="ex-pair">' +
                '<span class="ex-target">' + item.target + '</span>' +
                '<span class="ex-arrow">→</span>' +
                '<span class="ex-produced">' + item.produced + '</span>' +
            '</div>' +
            '<select class="answer-select" id="answer-' + i + '">' + optionsHtml + '</select>' +
            '<div class="ex-feedback" id="fb-' + i + '"></div>';
        area.appendChild(card);
    });

    document.getElementById('action-bar').style.display = 'flex';
    document.getElementById('results-bar').classList.remove('show');
}

function checkAll() {
    var correct = 0;
    currentItems.forEach(function(item, i) {
        var sel = document.getElementById('answer-' + i);
        var fb = document.getElementById('fb-' + i);
        var answer = sel.value;
        var expected = item.type + '|' + item.subtype;

        fb.classList.add('show');

        if (answer === expected) {
            correct++;
            sel.className = 'answer-select correct';
            fb.innerHTML = '<span style="color:#16a34a;font-weight:600;">✓ Correcto.</span> ' + item.explanation;
        } else if (!answer) {
            sel.className = 'answer-select incorrect';
            fb.innerHTML = '<span style="color:#dc2626;">Sin respuesta.</span><br>Respuesta correcta: <strong>' + item.subtype + '</strong>. ' + item.explanation;
        } else {
            sel.className = 'answer-select incorrect';
            fb.innerHTML = '<span style="color:#dc2626;">✗ Incorrecto.</span><br>Respuesta correcta: <strong>' + item.subtype + '</strong>. ' + item.explanation;
        }
    });

    var total = currentItems.length;
    var pct = Math.round(correct / total * 100);
    var scoreEl = document.getElementById('score-text');
    scoreEl.textContent = correct + ' / ' + total;
    scoreEl.className = 'score ' + (pct >= 80 ? 'good' : (pct >= 50 ? 'mid' : 'bad'));
    document.getElementById('results-detail').textContent = pct + '% de aciertos';
    document.getElementById('results-bar').classList.add('show');

    // Save progress (localStorage + server)
    try {
        var progress = JSON.parse(localStorage.getItem('lali_progress') || '{}');
        var prev = progress['ejercicio_errores'];
        if (!prev || pct > prev.score) {
            progress['ejercicio_errores'] = { completed: pct >= 75, score: pct, date: new Date().toISOString().split('T')[0] };
            localStorage.setItem('lali_progress', JSON.stringify(progress));
        }
    } catch(e) {}
    if (typeof guardarProgreso === 'function') {
        guardarProgreso('ejercicio_errores', correct, total, {tipo: 'errores_fonologicos'});
    }
}

function showSolutions() {
    currentItems.forEach(function(item, i) {
        var sel = document.getElementById('answer-' + i);
        var fb = document.getElementById('fb-' + i);
        fb.classList.add('show');
        var answer = sel.value;
        var expected = item.type + '|' + item.subtype;
        if (answer === expected) {
            sel.className = 'answer-select correct';
            fb.innerHTML = '<span style="color:#16a34a;font-weight:600;">✓ Correcto.</span> ' + item.explanation;
        } else {
            sel.className = 'answer-select incorrect';
            fb.innerHTML = '<strong>' + item.subtype + '</strong>: ' + item.explanation;
        }
    });
}

// Generate first exercise on load
generateExercise();

</script>
<script src="/static/eulalia/progreso.js"></script>
<script src="/static/eulalia/informar_profesor.js"></script>
</body>
</html>
