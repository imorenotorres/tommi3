<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Test de errores fonológicos — Eulalia</title>
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: system-ui, -apple-system, sans-serif; background: #f8fafc; color: #1e293b; min-height: 100vh; }

.header { background: #4250b3; padding: 14px 24px; display: flex; align-items: center; gap: 12px; }
.header a { color: #fff; text-decoration: none; font-weight: 700; font-size: 18px; }
.header a:hover { opacity: 0.85; }
.header .sep { color: rgba(255,255,255,0.5); margin: 0 4px; }
.header .title { color: #fff; font-size: 16px; font-weight: 600; }

.container { max-width: 740px; margin: 0 auto; padding: 32px 20px; }

h2 { font-size: 22px; margin-bottom: 8px; color: #4250b3; }
.subtitle { font-size: 15px; color: #64748b; margin-bottom: 20px; line-height: 1.6; }

.btn { padding: 8px 20px; border-radius: 8px; font-size: 14px; font-weight: 600; border: none; cursor: pointer; font-family: inherit; transition: all 0.2s; }
.btn-primary { background: #4250b3; color: #fff; }
.btn-primary:hover { background: #3740a0; }
.btn-secondary { background: #e2e8f0; color: #475569; }
.btn-secondary:hover { background: #cbd5e1; }

.level-tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 20px; }
.level-tab {
    padding: 6px 18px; border-radius: 20px; font-size: 13px; font-weight: 600;
    border: 2px solid #e2e8f0; background: #fff; color: #64748b; cursor: pointer;
    transition: all 0.15s;
}
.level-tab:hover { border-color: #4250b3; color: #4250b3; }
.level-tab.active { background: #4250b3; color: #fff; border-color: #4250b3; }

.exercise-card {
    background: #fff; border: 2px solid #e2e8f0; border-radius: 12px;
    padding: 20px 24px; margin-bottom: 16px;
}
.ex-label { font-size: 12px; font-weight: 700; color: #94a3b8; text-transform: uppercase; margin-bottom: 6px; }
.ex-word { font-size: 13px; color: #64748b; margin-bottom: 6px; }
.ex-pair { display: flex; gap: 16px; align-items: center; margin-bottom: 14px; font-size: 16px; }
.ex-target   { font-family: 'Doulos SIL', serif; font-weight: 700; color: #4250b3; }
.ex-arrow    { color: #94a3b8; }
.ex-produced { font-family: 'Doulos SIL', serif; font-weight: 700; color: #dc2626; }

.answer-select {
    width: 100%; padding: 8px 12px; border: 2px solid #e2e8f0; border-radius: 6px;
    font-family: inherit; font-size: 13px; transition: border-color 0.2s;
}
.answer-select:focus { outline: none; border-color: #4250b3; }
.answer-select.correct { border-color: #16a34a; background: #f0fdf4; }
.answer-select.incorrect { border-color: #dc2626; background: #fef2f2; }
.answer-select.partial { border-color: #f59e0b; background: #fffbeb; }

/* Second question for systemic errors */
.extra-rasgos { display: none; margin-top: 12px; background: #f8fafc; border-radius: 8px; padding: 12px 14px; }
.extra-title { font-size: 12px; font-weight: 700; color: #475569; margin-bottom: 8px; }
.rasgo-row { display: flex; gap: 8px; align-items: center; margin-bottom: 6px; }
.rasgo-row label { font-size: 13px; color: #475569; min-width: 120px; }
.rasgo-select {
    flex: 1; padding: 6px 10px; border: 2px solid #e2e8f0; border-radius: 6px;
    font-family: inherit; font-size: 13px;
}
.rasgo-select.correct  { border-color: #16a34a; background: #f0fdf4; }
.rasgo-select.incorrect{ border-color: #dc2626; background: #fef2f2; }

.ex-feedback { margin-top: 10px; font-size: 13px; display: none; line-height: 1.7; }
.ex-feedback.show { display: block; }

.results-bar {
    background: #fff; border: 2px solid #e2e8f0; border-radius: 12px;
    padding: 16px 24px; margin-top: 20px; display: none; text-align: center;
}
.results-bar.show { display: block; }
.score { font-size: 36px; font-weight: 800; }
.score.good { color: #16a34a; }
.score.mid  { color: #f59e0b; }
.score.bad  { color: #dc2626; }

.action-bar { display: flex; gap: 8px; margin-top: 16px; justify-content: center; flex-wrap: wrap; }
</style>
</head>
<body>

<div class="header">
    <a href="/tutores-virtuales/eulalia">Eulalia</a>
    <span class="sep">›</span>
    <span class="title">Practica</span>
    <span class="sep">›</span>
    <span class="title">Tema 2</span>
    <span class="sep">›</span>
    <span class="title">Test de errores</span>
</div>

<div class="container">
    <h2>Test de errores fonológicos</h2>
    <p class="subtitle">Se muestra la producción correcta y la producida por un paciente. Indica el tipo de error. Para errores sistémicos, especifica también qué valor fonológico debería tener y cuál ha producido el paciente.</p>

    <div style="display:flex;gap:10px;align-items:center;margin-bottom:20px;flex-wrap:wrap;">
        <select id="level-select" onchange="onLevelChange()" style="padding:8px 14px;border:2px solid #e2e8f0;border-radius:8px;font-family:inherit;font-size:14px;min-width:280px;">
            <option value="">— Selecciona un nivel —</option>
            <option value="palabra">Nivel básico: solo Estructura de palabra</option>
            <option value="silaba">Nivel básico: solo Estructura de sílaba</option>
            <option value="sistemico">Nivel básico: solo errores sistémicos</option>
            <option value="todos">Nivel avanzado: todos los errores</option>
        </select>
        <select id="count-select" style="padding:8px 14px;border:2px solid #e2e8f0;border-radius:8px;font-family:inherit;font-size:14px;display:none;">
            <option value="4">4 items</option>
            <option value="8">8 items</option>
            <option value="12">12 items</option>
        </select>
        <button class="btn btn-primary" id="start-btn" onclick="generateExercise()" disabled>Empezar</button>
    </div>

    <div id="exercise-area"></div>

    <div class="results-bar" id="results-bar">
        <div class="score" id="score-text"></div>
        <div style="font-size:13px; color:#64748b; margin-top:4px;" id="results-detail"></div>
    </div>

    <div class="action-bar" id="action-bar" style="display:none;">
        <button class="btn btn-primary"   onclick="checkAll()">Comprobar</button>
        <button class="btn btn-secondary" onclick="showSolutions()">Ver soluciones</button>
        <button class="btn btn-secondary" onclick="generateExercise()">Nuevo ejercicio</button>
    </div>
</div>

// ── State ─────────────────────────────────────────────────────────────────────
var currentLevel = '';
var currentItems = [];

function onLevelChange() {
    currentLevel = document.getElementById('level-select').value;
    var countSel = document.getElementById('count-select');
    if (currentLevel && currentLevel !== 'todos') {
        countSel.style.display = '';
    } else {
        countSel.style.display = 'none';
    }
    document.getElementById('start-btn').disabled = !currentLevel;
}

// ── Exercise generation ───────────────────────────────────────────────────────
function generateExercise() {
    if (!currentLevel) return;

    var pool;
    if (currentLevel === 'todos') {
        // Pick exactly 4 from each subgroup and shuffle the combined list
        var byType = {palabra: [], silaba: [], sistemico: []};
        EXERCISES_TODOS.forEach(function(e) { byType[e.nivel].push(e); });
        pool = [];
        ['palabra','silaba','sistemico'].forEach(function(t) {
            var sh = byType[t].slice().sort(function(){return Math.random()-0.5;});
            pool = pool.concat(sh.slice(0, 4));
        });
        currentItems = pool.sort(function(){return Math.random()-0.5;});
    } else {
        var count = parseInt(document.getElementById('count-select').value) || 6;
        var shuffled = EXERCISES.filter(function(e) { return e.nivel === currentLevel; })
                                .sort(function(){return Math.random()-0.5;});
        var usedWords = {};
        var deduped = [];
        shuffled.forEach(function(e) {
            var key = e.word || e.target;
            if (!usedWords[key]) { usedWords[key] = true; deduped.push(e); }
        });
        currentItems = deduped.slice(0, count);
    }

    var area = document.getElementById('exercise-area');
    area.innerHTML = '';

    // Filter dropdown options to match selected level (show all if "todos")
    var filteredTypes = currentLevel === 'todos'
        ? ERROR_TYPES
        : ERROR_TYPES.filter(function(t) {
            return t.value === '' || t.value.split('|')[0] === currentLevel;
          });

    var optionsHtml = filteredTypes.map(function(t) {
        return '<option value="' + t.value + '">' + t.label + '</option>';
    }).join('');

    currentItems.forEach(function(item, i) {
        var card = document.createElement('div');
        card.className = 'exercise-card';
        card.innerHTML =
            '<div class="ex-label">Error ' + (i + 1) + '</div>' +
            (item.word ? '<div class="ex-word">Palabra: <em>' + item.word + '</em></div>' : '') +
            '<div class="ex-pair">' +
                '<span class="ex-target">' + item.target + '</span>' +
                '<span class="ex-arrow">→</span>' +
                '<span class="ex-produced">' + item.produced + '</span>' +
            '</div>' +
            '<select class="answer-select" id="answer-' + i + '" onchange="onTypeChange(this,' + i + ')">' +
                optionsHtml +
            '</select>' +
            '<div class="extra-rasgos" id="extra-' + i + '"></div>' +
            '<div class="ex-feedback" id="fb-' + i + '"></div>';
        area.appendChild(card);
    });

    document.getElementById('action-bar').style.display = 'flex';
    document.getElementById('results-bar').classList.remove('show');
}

// ── Conditional value dropdowns ───────────────────────────────────────────────
function buildValueDropdowns(i, rasgo) {
    var label = RASGO_LABELS[rasgo] || rasgo;
    var vals = RASGO_VALUES[rasgo] || [];
    var opts = '<option value="">— elige —</option>' +
        vals.map(function(v) { return '<option value="' + v + '">' + v + '</option>'; }).join('');
    return '<div class="extra-title">' + label + ':</div>' +
        '<div class="rasgo-row">' +
            '<label>Debería ser:</label>' +
            '<select class="rasgo-select" id="val-correct-' + i + '">' + opts + '</select>' +
        '</div>' +
        '<div class="rasgo-row">' +
            '<label>Ha producido:</label>' +
            '<select class="rasgo-select" id="val-produced-' + i + '">' + opts + '</select>' +
        '</div>';
}

function onTypeChange(sel, i) {
    var parts = sel.value.split('|');
    var type  = parts[0] || '';
    var rasgo = parts[1] || '';
    var extra = document.getElementById('extra-' + i);

    if (type === 'sistemico' && RASGO_VALUES[rasgo]) {
        extra.innerHTML = buildValueDropdowns(i, rasgo);
        extra.style.display = 'block';
    } else {
        extra.style.display = 'none';
        extra.innerHTML = '';
    }
}

// ── Scoring helpers ───────────────────────────────────────────────────────────
function getRasgoSels(i) {
    return {
        correct:  document.getElementById('val-correct-' + i),
        produced: document.getElementById('val-produced-' + i)
    };
}

// ── Check ─────────────────────────────────────────────────────────────────────
function checkAll() {
    var earned = 0, total = 0;
    var byGroup = {
        palabra:   {earned:0, total:0},
        silaba:    {earned:0, total:0},
        sistemico: {earned:0, total:0}
    };

    currentItems.forEach(function(item, i) {
        var sel    = document.getElementById('answer-' + i);
        var fb     = document.getElementById('fb-' + i);
        var answer = sel.value;
        fb.classList.add('show');

        var isSistemic = item.type === 'sistemico';
        var weight = isSistemic ? 3 : 1;
        total += weight;
        byGroup[item.type].total += weight;

        var itemEarned = 0;

        if (!answer) {
            sel.className = 'answer-select incorrect';
            fb.innerHTML = '<span style="color:#dc2626;">Sin respuesta.</span> ' + _correctAnswer(item);
        } else {
            var parts      = answer.split('|');
            var selType    = parts[0] || '';
            var selSubtype = parts[1] || '';

            if (!isSistemic) {
                var ok = selType === item.type && selSubtype === item.subtype;
                sel.className = 'answer-select ' + (ok ? 'correct' : 'incorrect');
                fb.innerHTML = ok
                    ? '<span style="color:#16a34a;font-weight:600;">✓ Correcto.</span> ' + item.explanation
                    : '<span style="color:#dc2626;">✗ Incorrecto.</span> ' + _correctAnswer(item);
                if (ok) itemEarned = 1;
            } else {
                var rasgoOk = selType === 'sistemico' && selSubtype === item.rasgo;
                if (!rasgoOk) {
                    sel.className = 'answer-select incorrect';
                    fb.innerHTML = '<span style="color:#dc2626;">✗ Incorrecto.</span> ' + _correctAnswer(item);
                } else {
                    itemEarned = 1;
                    var sels = getRasgoSels(i);
                    var cVal = sels.correct  ? sels.correct.value  : '';
                    var pVal = sels.produced ? sels.produced.value : '';
                    var cOk  = cVal === item.rasgo_correct;
                    var pOk  = pVal === item.rasgo_produced;
                    if (sels.correct)  sels.correct.className  = 'rasgo-select ' + (cOk ? 'correct' : 'incorrect');
                    if (sels.produced) sels.produced.className = 'rasgo-select ' + (pOk ? 'correct' : 'incorrect');
                    if (cOk && pOk) {
                        sel.className = 'answer-select correct';
                        fb.innerHTML = '<span style="color:#16a34a;font-weight:600;">✓ Correcto.</span> ' + item.explanation;
                        itemEarned = 3;
                    } else {
                        sel.className = 'answer-select partial';
                        var hint = 'Rasgo correcto. Valor correcto: <strong>' + item.rasgo_correct + '</strong>';
                        if (!cOk) hint += ' (marcaste: ' + (cVal || '—') + ')';
                        hint += '. Valor producido: <strong>' + item.rasgo_produced + '</strong>';
                        if (!pOk) hint += ' (marcaste: ' + (pVal || '—') + ')';
                        fb.innerHTML = '<span style="color:#f59e0b;font-weight:600;">⚠ Rasgo correcto, pero revisa los valores.</span><br>' + hint + '. ' + item.explanation;
                        itemEarned = 1 + (cOk || pOk ? 1 : 0);
                    }
                }
            }
        }

        if (item.alt_interp) {
            fb.innerHTML += '<br><span style="color:#475569;font-size:12px;margin-top:6px;display:block;padding:6px 8px;background:#f1f5f9;border-radius:6px;">' + item.alt_interp + '</span>';
        }

        earned += itemEarned;
        byGroup[item.type].earned += itemEarned;
    });

    var pct = total > 0 ? Math.round(earned / total * 100) : 0;
    var scoreEl = document.getElementById('score-text');
    scoreEl.textContent = earned + ' / ' + total + ' pts';
    scoreEl.className = 'score ' + (pct >= 80 ? 'good' : (pct >= 50 ? 'mid' : 'bad'));

    var detailEl = document.getElementById('results-detail');
    if (currentLevel === 'todos') {
        var groupLabels = {palabra:'Estructura de palabra', silaba:'Estructura de sílaba', sistemico:'Errores sistémicos'};
        var breakdown = ['palabra','silaba','sistemico'].map(function(t) {
            var g = byGroup[t];
            if (!g.total) return null;
            var gpct = Math.round(g.earned / g.total * 100);
            var color = gpct >= 80 ? '#16a34a' : (gpct >= 50 ? '#f59e0b' : '#dc2626');
            return '<span style="color:' + color + ';font-weight:600;">' + groupLabels[t] + ': ' + g.earned + '/' + g.total + ' pts (' + gpct + '%)</span>';
        }).filter(Boolean);
        detailEl.innerHTML = pct + '% global &nbsp;|&nbsp; ' + breakdown.join(' &nbsp;|&nbsp; ');
    } else {
        detailEl.textContent = pct + '% de aciertos';
    }
    document.getElementById('results-bar').classList.add('show');

    if (typeof guardarProgreso === 'function') {
        guardarProgreso('ejercicio_errores', earned, total, {tipo: 'errores_fonologicos'});
    }
}

function _correctAnswer(item) {
    if (item.type === 'sistemico') {
        return 'Rasgo afectado: <strong>' + RASGO_LABELS[item.rasgo] + '</strong>. '
             + 'Debería ser: <strong>' + item.rasgo_correct + '</strong>; '
             + 'producido: <strong>' + item.rasgo_produced + '</strong>. '
             + item.explanation;
    }
    return 'Respuesta correcta: <strong>' + item.subtype + '</strong>. ' + item.explanation;
}

// ── Show solutions ────────────────────────────────────────────────────────────
function showSolutions() {
    currentItems.forEach(function(item, i) {
        var sel = document.getElementById('answer-' + i);
        var fb  = document.getElementById('fb-' + i);
        fb.classList.add('show');

        if (item.type === 'sistemico') {
            sel.value = 'sistemico|' + item.rasgo;
            onTypeChange(sel, i);
            var sels = getRasgoSels(i);
            if (sels.correct)  sels.correct.value  = item.rasgo_correct;
            if (sels.produced) sels.produced.value = item.rasgo_produced;
        } else {
            sel.value = item.type + '|' + item.subtype;
        }
        sel.className = 'answer-select correct';
        fb.innerHTML = _correctAnswer(item);
        if (item.alt_interp) {
            fb.innerHTML += '<br><span style="color:#475569;font-size:12px;margin-top:6px;display:block;padding:6px 8px;background:#f1f5f9;border-radius:6px;">' + item.alt_interp + '</span>';
        }
    });
}
