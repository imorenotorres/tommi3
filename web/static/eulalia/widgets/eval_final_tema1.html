<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">

<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: system-ui, -apple-system, sans-serif; background: #f8fafc; color: #1e293b; min-height: 100vh; }

.header { background: #4250b3; padding: 14px 24px; display: flex; align-items: center; gap: 12px; }
.header a { color: #fff; text-decoration: none; font-weight: 700; font-size: 18px; }
.header a:hover { opacity: 0.85; }
.header .sep { color: rgba(255,255,255,0.5); margin: 0 4px; }
.header .title { color: #fff; font-size: 16px; font-weight: 600; }

.container { max-width: 720px; margin: 0 auto; padding: 32px 20px; }
h2 { font-size: 22px; margin-bottom: 8px; color: #4250b3; }
.subtitle { font-size: 15px; color: #64748b; margin-bottom: 24px; line-height: 1.6; }

/* Mode selection */
.mode-card {
    background: #fff; border: 2px solid #e2e8f0; border-radius: 12px;
    padding: 24px; margin-bottom: 16px;
}
.mode-title { font-size: 16px; font-weight: 700; margin-bottom: 16px; }

.progress-overview { margin-bottom: 20px; }
.progress-row {
    display: flex; align-items: center; gap: 10px; padding: 8px 0;
    border-bottom: 1px solid #f1f5f9; font-size: 13px;
}
.progress-icon { font-size: 16px; width: 24px; text-align: center; }
.progress-name { flex: 1; }
.progress-score { font-weight: 600; min-width: 50px; text-align: right; }
.progress-score.done { color: #16a34a; }
.progress-score.pending { color: #94a3b8; }

.mode-buttons { display: flex; gap: 12px; flex-wrap: wrap; }
.mode-btn {
    flex: 1; min-width: 200px; padding: 16px; border-radius: 10px; border: 2px solid #e2e8f0;
    background: #fff; cursor: pointer; transition: all 0.2s; font-family: inherit; text-align: left;
}
.mode-btn:hover { border-color: #4250b3; background: #f5f3ff; }
.mode-btn h4 { font-size: 14px; color: #4250b3; margin-bottom: 4px; }
.mode-btn p { font-size: 12px; color: #64748b; line-height: 1.4; }

/* Quiz */
.progress-bar { background: #e2e8f0; border-radius: 8px; height: 8px; margin-bottom: 8px; overflow: hidden; }
.progress-fill { height: 100%; background: #4250b3; border-radius: 8px; transition: width 0.4s; }
.progress-text { font-size: 13px; color: #94a3b8; margin-bottom: 20px; }

.question-card {
    background: #fff; border: 2px solid #e2e8f0; border-radius: 12px;
    padding: 24px; margin-bottom: 20px; animation: fadeIn 0.3s;
}
@keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

.q-section { font-size: 11px; font-weight: 700; color: #94a3b8; text-transform: uppercase; margin-bottom: 4px; }
.q-type { font-size: 11px; color: #4250b3; font-weight: 600; margin-bottom: 10px; }
.q-text { font-size: 15px; font-weight: 600; line-height: 1.5; margin-bottom: 16px; }

/* Multiple choice */
.options { display: flex; flex-direction: column; gap: 8px; }
.option-btn {
    padding: 12px 16px; background: #fff; border: 2px solid #e2e8f0; border-radius: 8px;
    font-size: 14px; cursor: pointer; text-align: left; transition: all 0.2s;
    font-family: inherit; color: #1e293b; line-height: 1.4;
}
.option-btn:hover:not(.disabled) { border-color: #4250b3; background: #f5f3ff; }
.option-btn.correct { border-color: #16a34a; background: #f0fdf4; color: #166534; }
.option-btn.wrong { border-color: #dc2626; background: #fef2f2; color: #991b1b; }
.option-btn.disabled { pointer-events: none; opacity: 0.6; }
.option-btn.disabled.correct { opacity: 1; }

/* Open answer */
textarea {
    width: 100%; min-height: 100px; padding: 12px; border: 2px solid #e2e8f0;
    border-radius: 8px; font-family: inherit; font-size: 14px; line-height: 1.6;
    resize: vertical;
}
textarea:focus { outline: none; border-color: #4250b3; }

/* Statement to correct */
.statement-box {
    font-size: 14px; line-height: 1.6; padding: 14px; background: #fef9c3;
    border: 1px solid #fde68a; border-radius: 8px; margin-bottom: 12px; font-style: italic;
}

.feedback-inline {
    margin-top: 12px; padding: 12px; border-radius: 8px; font-size: 13px; line-height: 1.6; display: none;
}
.feedback-inline.show { display: block; }
.feedback-inline.ok { background: #f0fdf4; border: 1px solid #bbf7d0; color: #166534; }
.feedback-inline.fail { background: #fef2f2; border: 1px solid #fecaca; color: #991b1b; }
.feedback-inline.partial { background: #fffbeb; border: 1px solid #fde68a; color: #78350f; }

.btn {

    padding: 10px 24px; border-radius: 8px; font-size: 14px; font-weight: 600;

}
.btn-primary { background: #4250b3; color: #fff; }
.btn-primary:hover { background: #3740a0; }
.btn-secondary { background: #e2e8f0; color: #475569; }
.btn-secondary:hover { background: #cbd5e1; }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-review { background: #fff; color: #92400e; border: 1px solid #fde68a; font-size: 12px; padding: 6px 14px; }
.btn-review:hover { background: #fef9c3; }
.btn-review.sent { color: #16a34a; border-color: #bbf7d0; cursor: default; }

.nav-buttons { display: flex; justify-content: flex-end; margin-top: 16px; gap: 8px; align-items: center; }

.loading { display: none; align-items: center; gap: 10px; margin-top: 12px; font-size: 13px; color: #64748b; }
.loading.show { display: flex; }
.spinner { width: 18px; height: 18px; border: 3px solid #e2e8f0; border-top-color: #4250b3; border-radius: 50%; animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* Results */
.results-card {
    background: #fff; border: 2px solid #e2e8f0; border-radius: 16px;
    padding: 32px; text-align: center;

.score-circle {

.score-circle.pass { background: linear-gradient(135deg, #16a34a, #22c55e); }
.score-circle.fail { background: linear-gradient(135deg, #dc2626, #ef4444); }
.score-circle.mid { background: linear-gradient(135deg, #f59e0b, #fbbf24); }
.score-circle .sc-label { font-size: 10px; font-weight: 600; opacity: 0.9; }

.result-msg { font-size: 18px; font-weight: 700; margin-bottom: 8px; }
.result-detail { font-size: 14px; color: #64748b; line-height: 1.6; margin-bottom: 16px; }

.section-results { text-align: left; margin: 16px 0; }
.sec-row { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-bottom: 1px solid #f1f5f9; font-size: 13px; }
.sec-icon { font-size: 16px; width: 24px; text-align: center; }
.sec-name { flex: 1; }
.sec-score { font-weight: 600; }

.review-box {
    background: #fef2f2; border: 2px solid #fecaca; border-radius: 12px;
    padding: 16px; margin: 16px 0; text-align: left;
}
.review-box h3 { color: #991b1b; font-size: 14px; margin-bottom: 8px; }
.review-box ul { margin-left: 16px; font-size: 13px; color: #7f1d1d; line-height: 1.8; }

.result-buttons { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 16px; }

</style>

<script>

// ── Request professor review ──
function requestReview(btnId) {
    var email = localStorage.getItem('lali_review_email') || '';
    email = prompt('Introduce tu email para que el profesor pueda responderte:', email);
    if (!email || email.indexOf('@') < 0) { alert('Necesitas introducir un email válido.'); return; }
    localStorage.setItem('lali_review_email', email);

    var q = currentQuestions[currentIdx];
    var answerEl = document.getElementById('open-answer') || document.getElementById('error-answer');
    var answerText = answerEl ? answerEl.value.trim() : '';
    var feedbackEl = document.getElementById('feedback');
    var evalText = feedbackEl ? feedbackEl.textContent : '';

    var btn = document.getElementById(btnId);
    btn.disabled = true;
    btn.textContent = 'Enviando...';

    fetch('/api/public-agent/eulalia/solicitar-revision', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
            widget: 'eval_final_tema1',
            email: email,
            pregunta: q.text + (q.statement ? ' — "' + q.statement + '"' : ''),
            respuesta_alumno: answerText,
            evaluacion_ia: evalText
        })
    })
    .then(function(r) { return r.json(); })
    .then(function() {
        btn.textContent = '✓ Revisión solicitada';
        btn.className = 'btn btn-review sent';
    })
    .catch(function() {
        try {
            var pending = JSON.parse(localStorage.getItem('lali_revisiones') || '[]');
            pending.push({ date: new Date().toISOString(), email: email, pregunta: q.text, respuesta: answerText, evaluacion: evalText });
            localStorage.setItem('lali_revisiones', JSON.stringify(pending));
        } catch(e) {}
        btn.textContent = '✓ Guardada (se enviará luego)';
        btn.className = 'btn btn-review sent';
    });
}

// ── Progress tracking ──
function saveProgress(widgetId, score, maxScore) {
    try {
        var progress = JSON.parse(localStorage.getItem('lali_progress') || '{}');
        var pct = Math.round(score / maxScore * 100);
        var prev = progress[widgetId];
        if (!prev || pct > prev.score) {
            progress[widgetId] = { completed: pct >= 75, score: pct, date: new Date().toISOString().split('T')[0] };
            localStorage.setItem('lali_progress', JSON.stringify(progress));
        }
    } catch(e) {}
}

function getProgress() {
    try { return JSON.parse(localStorage.getItem('lali_progress') || '{}'); } catch(e) { return {}; }
}

// ── Question bank ──
// Each question: section, type (mc|open|error), text, and type-specific fields
// mc: options[], correct (index), explanation
// open: rubrica[], referencia
// error: statement, error, rubrica[]

var ALL_QUESTIONS = [
    // --- 1.1 Fonología y fonética ---
    { section: '1.1', widget: 'pregunta_foneticas', type: 'mc',
      text: '¿Cuál de las siguientes afirmaciones es correcta?',

        { descripcion: 'Explica correctamente la fonética perceptiva (audición/recepción).' }

      referencia: 'La fonética articulatoria estudia cómo se producen los sonidos (fase de producción). La acústica estudia las propiedades físicas del sonido (fase de transmisión). La perceptiva estudia los mecanismos de audición y percepción del habla (fase de recepción).' },

    // --- 1.2 Estructuralismo y generativismo ---
    { section: '1.2', widget: 'detecta_errores_1_2', type: 'mc',
      text: 'Según los estructuralistas, ¿qué es el "habla"?',

      rubrica: [
        { descripcion: 'Identifica que la descripción corresponde a la ruta indirecta, no a la directa.' },

    { section: '1.3.1', widget: 'define_fonema', type: 'open',

    { id: 'eval_final_tema1', name: 'Autoevaluación Tema 1', section: 'global' }
];

// Practice exercises (no cuentan para progreso, pero se reconocen)
var PRACTICE_WIDGETS = [
    { id: 'clasificacion_pa_ba', name: 'Clasifica 15 sílabas «pa»', section: '1.3.1' },
    { id: 'representacion_mental', name: '¿Qué es una representación mental?', section: '1.3.1' },
    { id: 'reflexion_lengua_social', name: 'Reflexión: Lengua e identidad social', section: '1.2' },
    { id: 'pseudopalabras', name: 'Crea pseudopalabras', section: '1.2' },
    { id: 'analisis_silabas', name: 'Análisis de sílabas', section: '1.3.3' }
];

var currentQuestions = [];
var currentIdx = 0;
var results = []; // {section, correct, total}

// ── Mode selection ──
function showModeSelection() {
    var progress = getProgress();

    var html = '<h2>Autoevaluación — Tema 1</h2>';
    html += '<p class="subtitle">Comprueba tu dominio de todos los contenidos del Tema 1.</p>';

    html += '<div class="mode-card">';

    // Progress exercises (count for advancement)
    html += '<div class="mode-title">📊 Ejercicios de progreso</div>';
    html += '<div class="progress-overview">';
    var progressDone = 0;
    PROGRESS_WIDGETS.forEach(function(w) {
        var p = progress[w.id];
        var done = p && p.completed;
        if (done) progressDone++;
        html += '<div class="progress-row">';
        html += '<span class="progress-icon">' + (done ? '✓' : '○') + '</span>';
        html += '<span class="progress-name">' + w.name + ' <span style="color:#94a3b8;font-size:11px;">(' + (SECTION_NAMES[w.section] || w.section) + ')</span></span>';
        html += '<span class="progress-score ' + (done ? 'done' : 'pending') + '">' + (p ? p.score + '%' : 'Pendiente') + '</span>';
        html += '</div>';
    });
    html += '</div>';

    // Practice exercises (recognition)
    html += '<div class="mode-title" style="margin-top:16px;">🎮 Ejercicios de práctica realizados</div>';
    html += '<div class="progress-overview">';
    var practiceDone = 0;
    PRACTICE_WIDGETS.forEach(function(w) {
        var p = progress[w.id];
        var done = p && p.completed;
        if (done) practiceDone++;
        html += '<div class="progress-row">';
        html += '<span class="progress-icon">' + (done ? '✓' : '·') + '</span>';
        html += '<span class="progress-name">' + w.name + '</span>';
        html += '<span class="progress-score" style="color:' + (done ? '#16a34a' : '#cbd5e1') + ';">' + (done ? 'Realizado' : '—') + '</span>';
        html += '</div>';
    });
    html += '</div>';

    if (practiceDone > 0) {
        html += '<p style="font-size:12px;color:#64748b;margin-top:8px;">La evaluación incluirá preguntas relacionadas con los ejercicios de práctica que hayas realizado.</p>';
    }

    // Count pending progress widgets
    var pendingProgressIds = PROGRESS_WIDGETS.filter(function(w) {
        var p = progress[w.id];
        return !p || !p.completed;
    }).map(function(w) { return w.id; });

    // Get sections that have pending progress widgets
    var pendingSections = [];
    PROGRESS_WIDGETS.forEach(function(w) {
        var p = progress[w.id];
        if ((!p || !p.completed) && pendingSections.indexOf(w.section) < 0) pendingSections.push(w.section);
    });

    html += '<div class="mode-buttons" style="margin-top:16px;">';
    html += '<button class="mode-btn" onclick="startEval(\'full\')">';
    html += '<h4>Evaluación completa</h4>';
    html += '<p>' + ALL_QUESTIONS.length + ' preguntas de todas las secciones</p>';
    html += '</button>';

    if (pendingSections.length > 0 && pendingSections.length < Object.keys(SECTION_NAMES).length) {
        var pendingQs = ALL_QUESTIONS.filter(function(q) { return pendingSections.indexOf(q.section) >= 0; });
        html += '<button class="mode-btn" onclick="startEval(\'pending\')">';
        html += '<h4>Solo secciones pendientes</h4>';
        html += '<p>' + pendingQs.length + ' preguntas de las secciones con ejercicios de progreso pendientes</p>';
        html += '</button>';
    }
    html += '</div></div>';

    document.getElementById('mode-area').innerHTML = html;
    document.getElementById('quiz-area').innerHTML = '';
    document.getElementById('results-area').innerHTML = '';
}

// ── Start evaluation ──
function startEvalFailed() {
    var failed = window._failedSections || [];
    if (failed.length === 0) { showModeSelection(); return; }
    currentQuestions = ALL_QUESTIONS.filter(function(q) { return failed.indexOf(q.section) >= 0; });
    currentQuestions.sort(function() { return Math.random() - 0.5; });
    currentIdx = 0;
    results = [];
    document.getElementById('mode-area').innerHTML = '';
    document.getElementById('results-area').innerHTML = '';
    renderQuestion();
}

function startEval(mode) {
    var progress = getProgress();
    if (mode === 'pending') {
        // Find sections with pending progress widgets
        var pendingSections = [];
        PROGRESS_WIDGETS.forEach(function(w) {
            var p = progress[w.id];
            if ((!p || !p.completed) && pendingSections.indexOf(w.section) < 0) pendingSections.push(w.section);
        });
        currentQuestions = ALL_QUESTIONS.filter(function(q) { return pendingSections.indexOf(q.section) >= 0; });
    } else {
        currentQuestions = ALL_QUESTIONS.slice();
    }
    // Shuffle
    currentQuestions.sort(function() { return Math.random() - 0.5; });
    currentIdx = 0;
    results = [];
    document.getElementById('mode-area').innerHTML = '';
    renderQuestion();
}

// ── Render question ──
function renderQuestion() {
    if (currentIdx >= currentQuestions.length) { showFinalResults(); return; }
    var q = currentQuestions[currentIdx];
    var html = '';

    html += '<div class="progress-text">Pregunta ' + (currentIdx + 1) + ' de ' + currentQuestions.length + '</div>';
    html += '<div class="progress-bar"><div class="progress-fill" style="width:' + (currentIdx / currentQuestions.length * 100) + '%"></div></div>';

    html += '<div class="question-card">';
    html += '<div class="q-section">' + SECTION_NAMES[q.section] + '</div>';
    html += '<div class="q-type">' + (q.type === 'mc' ? 'Opción múltiple' : q.type === 'open' ? 'Respuesta abierta' : 'Detecta el error') + '</div>';

    if (q.type === 'mc') {
        html += '<div class="q-text">' + q.text + '</div>';
        html += '<div class="options">';
        q.options.forEach(function(opt, i) {
            html += '<button class="option-btn" id="opt-' + i + '" onclick="answerMC(' + i + ')">' + opt + '</button>';
        });
        html += '</div>';
        html += '<div class="feedback-inline" id="feedback"></div>';
        html += '<div class="nav-buttons" id="nav-btns" style="display:none;">';
        html += '<button class="btn btn-primary" onclick="nextQuestion()">Siguiente →</button></div>';

    } else if (q.type === 'open') {
        html += '<div class="q-text">' + q.text + '</div>';
        html += '<textarea id="open-answer" placeholder="Escribe tu respuesta..."></textarea>';
        html += '<div class="nav-buttons"><button class="btn btn-primary" id="btn-submit-open" onclick="answerOpen()">Evaluar</button></div>';
        html += '<div class="loading" id="loading"><div class="spinner"></div> Evaluando...</div>';
        html += '<div class="feedback-inline" id="feedback"></div>';
        html += '<div class="nav-buttons" id="nav-btns" style="display:none;">';
        html += '<button class="btn btn-review" id="btn-review-open" onclick="requestReview(\'btn-review-open\')">📩 Pedir revisión al profesor</button>';
        html += '<button class="btn btn-primary" onclick="nextQuestion()">Siguiente →</button></div>';

    } else if (q.type === 'error') {
        html += '<div class="q-text">' + q.text + '</div>';
        html += '<div class="statement-box">"' + q.statement + '"</div>';
        html += '<textarea id="error-answer" placeholder="¿Cuál es el error? Explica la corrección..."></textarea>';
        html += '<div class="nav-buttons"><button class="btn btn-primary" id="btn-submit-error" onclick="answerError()">Evaluar</button></div>';
        html += '<div class="loading" id="loading"><div class="spinner"></div> Evaluando...</div>';
        html += '<div class="feedback-inline" id="feedback"></div>';
        html += '<div class="nav-buttons" id="nav-btns" style="display:none;">';
        html += '<button class="btn btn-review" id="btn-review-error" onclick="requestReview(\'btn-review-error\')">📩 Pedir revisión al profesor</button>';
        html += '<button class="btn btn-primary" onclick="nextQuestion()">Siguiente →</button></div>';
    }

    html += '</div>';
    document.getElementById('quiz-area').innerHTML = html;
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

// ── Answer handlers ──
function answerMC(chosen) {
    var q = currentQuestions[currentIdx];
    var isCorrect = chosen === q.correct;
    results.push({ section: q.section, correct: isCorrect ? 1 : 0, total: 1 });

    q.options.forEach(function(_, i) {
        var btn = document.getElementById('opt-' + i);
        btn.classList.add('disabled');
        if (i === q.correct) btn.classList.add('correct');
        if (i === chosen && !isCorrect) btn.classList.add('wrong');
    });

    var fb = document.getElementById('feedback');
    fb.className = 'feedback-inline show ' + (isCorrect ? 'ok' : 'fail');
    fb.innerHTML = (isCorrect ? '<strong>✓ Correcto.</strong> ' : '<strong>✗ Incorrecto.</strong> ') + q.explanation;
    document.getElementById('nav-btns').style.display = '';
}

async function answerOpen() {
    var q = currentQuestions[currentIdx];
    var text = document.getElementById('open-answer').value.trim();
    if (text.length < 15) { alert('Escribe al menos 15 caracteres.'); return; }

    document.getElementById('btn-submit-open').disabled = true;
    document.getElementById('loading').classList.add('show');

    try {
        var res = await fetch('/api/public-agent/eulalia/evaluar-definicion', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ concepto: q.text, definicion: text, rubrica: q.rubrica, referencia: q.referencia })
        });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        var data = await res.json();
        if (data.error) throw new Error(data.error);
        var criterios = data.criterios || [];
        if (criterios.length === 0) throw new Error('La LLM no devolvió criterios');
        var passed = criterios.filter(function(c) { return c.cumplido; }).length;
        results.push({ section: q.section, correct: passed, total: criterios.length });

        var fb = document.getElementById('feedback');
        var allOk = passed === criterios.length;
        fb.className = 'feedback-inline show ' + (allOk ? 'ok' : passed > 0 ? 'partial' : 'fail');
        fb.innerHTML = '<strong>' + (allOk ? '✓' : '~') + ' ' + passed + '/' + criterios.length + ' criterios.</strong> ' + (data.comentario_general || '');
    } catch(e) {
        document.getElementById('loading').classList.remove('show');
        document.getElementById('btn-submit-open').disabled = false;
        var fb = document.getElementById('feedback');
        fb.className = 'feedback-inline show fail';
        fb.innerHTML = '<strong>Error técnico:</strong> ' + e.message + '. Pulsa "Evaluar" para reintentar.';
        return;
    }
    document.getElementById('loading').classList.remove('show');
    document.getElementById('nav-btns').style.display = '';
}

async function answerError() {
    var q = currentQuestions[currentIdx];
    var text = document.getElementById('error-answer').value.trim();
    if (text.length < 15) { alert('Escribe al menos 15 caracteres.'); return; }

    document.getElementById('btn-submit-error').disabled = true;
    document.getElementById('loading').classList.add('show');

    try {
        var res = await fetch('/api/public-agent/eulalia/evaluar-definicion', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                concepto: 'Detectar error',
                definicion: 'Afirmación: "' + q.statement + '"\nExplicación: ' + text,
                rubrica: q.rubrica,
                referencia: 'El error es: ' + q.error
            })
        });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        var data = await res.json();
        if (data.error) throw new Error(data.error);
        var criterios = data.criterios || [];
        if (criterios.length === 0) throw new Error('La LLM no devolvió criterios');
        var passed = criterios.filter(function(c) { return c.cumplido; }).length;
        results.push({ section: q.section, correct: passed, total: criterios.length });

        var fb = document.getElementById('feedback');
        var allOk = passed === criterios.length;
        fb.className = 'feedback-inline show ' + (allOk ? 'ok' : passed > 0 ? 'partial' : 'fail');
        var fbHtml = '<strong>' + (allOk ? '✓' : '~') + ' ' + passed + '/' + criterios.length + ' criterios.</strong> ' + (data.comentario_general || '');
        if (!allOk) fbHtml += '<br><br><strong>El error era:</strong> ' + q.error;
        fb.innerHTML = fbHtml;
    } catch(e) {
        document.getElementById('loading').classList.remove('show');
        document.getElementById('btn-submit-error').disabled = false;
        var fb = document.getElementById('feedback');
        fb.className = 'feedback-inline show fail';
        fb.innerHTML = '<strong>Error técnico:</strong> ' + e.message + '. Pulsa "Evaluar" para reintentar.';
        return;
    }
    document.getElementById('loading').classList.remove('show');
    document.getElementById('nav-btns').style.display = '';
}

function nextQuestion() {
    currentIdx++;
    renderQuestion();
}

// ── Final results ──
function showFinalResults() {
    document.getElementById('quiz-area').innerHTML = '';

    // Aggregate by section
    var sectionScores = {};
    results.forEach(function(r) {
        if (!sectionScores[r.section]) sectionScores[r.section] = { correct: 0, total: 0 };
        sectionScores[r.section].correct += r.correct;
        sectionScores[r.section].total += r.total;
    });

    var totalCorrect = 0, totalTotal = 0;
    Object.keys(sectionScores).forEach(function(s) {
        totalCorrect += sectionScores[s].correct;
        totalTotal += sectionScores[s].total;
    });

    var pct = totalTotal > 0 ? Math.round(totalCorrect / totalTotal * 100) : 0;
    var cls = pct >= 80 ? 'pass' : pct >= 50 ? 'mid' : 'fail';
    var msg = pct >= 80 ? '¡Excelente! Dominas los contenidos del Tema 1.' :
              pct >= 50 ? 'Buen trabajo, pero hay secciones que debes reforzar.' :
              'Necesitas repasar el Tema 1 antes de continuar.';

    var html = '<div class="results-card">';
    html += '<div class="score-circle ' + cls + '">' + pct + '%<div class="sc-label">' + totalCorrect + '/' + totalTotal + '</div></div>';
    html += '<div class="result-msg">' + msg + '</div>';

    // Per-section breakdown
    html += '<div class="section-results">';
    var failedSections = [];
    Object.keys(SECTION_NAMES).forEach(function(sec) {
        var s = sectionScores[sec];
        if (!s) return;
        var secPct = Math.round(s.correct / s.total * 100);
        var icon = secPct >= 75 ? '✓' : '✗';
        if (secPct < 75) failedSections.push(sec);
        html += '<div class="sec-row">';
        html += '<span class="sec-icon">' + icon + '</span>';
        html += '<span class="sec-name">' + SECTION_NAMES[sec] + '</span>';
        html += '<span class="sec-score" style="color:' + (secPct >= 75 ? '#16a34a' : '#dc2626') + '">' + secPct + '%</span>';
        html += '</div>';
    });
    html += '</div>';

    // Review suggestions
    if (failedSections.length > 0) {
        html += '<div class="review-box"><h3>Repasa estas secciones:</h3><ul>';
        failedSections.forEach(function(sec) {
            html += '<li><strong>' + SECTION_NAMES[sec] + '</strong></li>';
        });
        html += '</ul></div>';
    }

    html += '<div class="result-buttons">';
    if (failedSections.length > 0) {
        html += '<button class="btn btn-primary" onclick="startEvalFailed()">Repetir solo las secciones falladas (' + failedSections.length + ')</button>';
    }
    html += '<button class="btn btn-secondary" onclick="showModeSelection()">Repetir evaluación completa</button>';
    html += '<button class="btn btn-secondary" onclick="window.close()">Volver al curso</button>';
    html += '</div></div>';

    // Store failed sections for retry
    window._failedSections = failedSections;

    // Save global progress (localStorage + server)
    saveProgress('eval_final_tema1', totalCorrect, totalTotal);
    if (typeof guardarProgreso === 'function') {
        guardarProgreso('eval_final_tema1', totalCorrect, totalTotal, {
            secciones: sectionScores
        });
    }

    // Save per-section progress — mark progress widgets as completed
    // if their section scored >= 75%
    Object.keys(sectionScores).forEach(function(sec) {
        var s = sectionScores[sec];
        var secPct = Math.round(s.correct / s.total * 100);
        if (secPct >= 75) {
            PROGRESS_WIDGETS.forEach(function(w) {
                if (w.section === sec) {
                    saveProgress(w.id, secPct, 100);
                    if (typeof guardarProgreso === 'function') {
                        guardarProgreso(w.id, secPct, 100, {section: sec});
                    }
                }
            });
        }
    });

    document.getElementById('results-area').innerHTML = html;
}

// Init
showModeSelection();

</script>

<script src="/static/eulalia/progreso.js"></script>
