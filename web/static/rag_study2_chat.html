<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAG Reliability Study — Chat</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f0f2f5; color: #333; display: flex; height: 100vh; }

        .sidebar {
            width: 260px; background: #1a2255; color: #fff; padding: 14px;
            display: flex; flex-direction: column; flex-shrink: 0; overflow-y: auto;
        }
        .sidebar a.back {
            display: block; font-size: 0.8rem; color: #93c5fd; text-decoration: none;
            margin-bottom: 12px;
        }
        .sidebar a.back:hover { text-decoration: underline; }
        .sidebar h3 { font-size: 0.78rem; opacity: 0.6; text-transform: uppercase; letter-spacing: 0.5px; margin: 10px 0 6px; }

        .sidebar-select {
            width: 100%; padding: 7px 8px; border-radius: 6px;
            border: 1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.1);
            color: #fff; font-size: 0.82rem; margin-bottom: 4px; cursor: pointer;
        }
        .sidebar-select option { background: #1a2255; color: #fff; }

        .history-list { list-style: none; margin-top: 4px; }
        .history-list li {
            padding: 5px 8px; font-size: 0.75rem; color: #a5b4fc; cursor: pointer;
            border-radius: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .history-list li:hover { background: rgba(255,255,255,0.1); color: #fff; }

        .chat-area { flex: 1; display: flex; flex-direction: column; }

        .chat-header {
            background: #fff; padding: 12px 20px; border-bottom: 1px solid #e2e8f0;
            font-weight: 600; font-size: 0.95rem; color: #1a2255;
        }

        .messages {
            flex: 1; overflow-y: auto; padding: 20px; display: flex;
            flex-direction: column; gap: 12px;
        }

        .msg {
            max-width: 80%; padding: 10px 14px; border-radius: 10px;
            font-size: 0.88rem; line-height: 1.6;
        }
        .msg.user { align-self: flex-end; background: #3b82f6; color: #fff; }
        .msg.assistant { align-self: flex-start; background: #fff; border: 1px solid #e2e8f0; }
        .msg.status { align-self: center; background: #f1f5f9; color: #64748b; font-size: 0.8rem; font-style: italic; }

        .input-bar {
            display: flex; gap: 8px; padding: 12px 20px; background: #fff;
            border-top: 1px solid #e2e8f0;
        }
        .input-bar input {
            flex: 1; padding: 10px 14px; border: 1px solid #d1d5db; border-radius: 8px;
            font-size: 0.9rem; outline: none;
        }
        .input-bar input:focus { border-color: #3b82f6; }
        .input-bar button {
            padding: 10px 20px; background: #3b82f6; color: #fff; border: none;
            border-radius: 8px; font-size: 0.9rem; cursor: pointer; font-weight: 600;
        }
        .input-bar button:hover { background: #2563eb; }
        .input-bar button:disabled { background: #9ca3af; cursor: not-allowed; }
    </style>
</head>
<body>

<div class="sidebar">
    <a class="back" href="/rag-study2">&larr; Back to study</a>

    <h3>Agent</h3>
    <select class="sidebar-select" id="agentSelect" onchange="selectAgent(this.value)">
        <option value="">Select an agent...</option>
        <option value="baseline">Baseline (Vanilla RAG)</option>
        <option value="production">Production Rule-based</option>
        <option value="auto_rule_based">Auto-constructed Rule-based</option>
        <option value="llm_based">Auto-constructed LLM-based</option>
    </select>

    <h3>Example queries</h3>
    <select class="sidebar-select" onchange="if(this.value){document.getElementById('input').value=this.value;document.getElementById('input').focus();this.selectedIndex=0;}">
        <option value="">Select a query...</option>
        <option value="What can you do?">What can you do?</option>
        <option value="What is explainable AI?">What is explainable AI?</option>
        <option value="Papers on AI ethics">Papers on AI ethics</option>
        <option value="What is the TAILOR project about?">What is the TAILOR project?</option>
        <option value="Papers by Rubén González Vallejo">Papers by a researcher</option>
        <option value="Is AI dangerous?">Is AI dangerous?</option>
        <option value="Write me an essay about AI">Write me an essay about AI</option>
        <option value="What is quantum computing?">What is quantum computing?</option>
        <option value="What responsible AI topics have not been studied?">Research gaps?</option>
        <option value="List all researchers from THUAS">Researchers from THUAS</option>
    </select>

    <h3>Query history</h3>
    <ul class="history-list" id="historyList">
        <li style="opacity:0.5;cursor:default;">No queries yet</li>
    </ul>
</div>

<div class="chat-area">
    <div class="chat-header" id="chatHeader">Select an agent to start</div>
    <div class="messages" id="messages"></div>
    <div class="input-bar">
        <input type="text" id="input" placeholder="Ask a question..." onkeydown="if(event.key==='Enter')sendMessage()" disabled>
        <button id="sendBtn" onclick="sendMessage()" disabled>Send</button>
    </div>
</div>

<script>
let currentAgent = null;
let queryHistory = [];
const MAX_HISTORY = 8;

const AGENT_CONFIG = {
    baseline: { name: 'Baseline (Vanilla RAG)', endpoint: 'rag_study2_baseline' },
    production: { name: 'Production Rule-based', endpoint: 'rag_study2_production' },
    auto_rule_based: { name: 'Auto-constructed Rule-based', endpoint: 'rag_study2_auto_rule_based' },
    llm_based: { name: 'Auto-constructed LLM-based', endpoint: 'rag_study2_llm_based' },
};

function selectAgent(agentKey) {
    if (!agentKey) return;
    currentAgent = agentKey;

    document.getElementById('chatHeader').textContent = AGENT_CONFIG[agentKey].name;
    document.getElementById('messages').innerHTML = '';
    document.getElementById('input').disabled = false;
    document.getElementById('sendBtn').disabled = false;
    document.getElementById('input').focus();

    addMessage('assistant', 'Hello! I am a research assistant specialised in Responsible AI research. How can I help you?');
}

function addMessage(role, text) {
    const div = document.createElement('div');
    div.className = 'msg ' + role;
    if (role === 'assistant') {
        div.innerHTML = renderMarkdown(text);
    } else {
        div.textContent = text;
    }
    document.getElementById('messages').appendChild(div);
    document.getElementById('messages').scrollTop = document.getElementById('messages').scrollHeight;
    return div;
}

function renderMarkdown(text) {
    // Split into lines for block-level processing
    let lines = text.split('\n');
    let html = '';
    let inList = false;

    for (let line of lines) {
        let trimmed = line.trim();

        // Horizontal rule
        if (/^---+$/.test(trimmed)) {
            if (inList) { html += '</ul>'; inList = false; }
            html += '<hr style="border:none;border-top:1px solid #e2e8f0;margin:8px 0;">';
            continue;
        }

        // Headings
        if (/^### (.+)$/.test(trimmed)) {
            if (inList) { html += '</ul>'; inList = false; }
            html += '<h4 style="margin:10px 0 4px;color:#1a2255;">' + trimmed.replace(/^### /, '') + '</h4>';
            continue;
        }
        if (/^## (.+)$/.test(trimmed)) {
            if (inList) { html += '</ul>'; inList = false; }
            html += '<h3 style="margin:12px 0 6px;color:#1a2255;">' + trimmed.replace(/^## /, '') + '</h3>';
            continue;
        }

        // List items
        if (/^[-*] /.test(trimmed)) {
            if (!inList) { html += '<ul style="margin:4px 0 4px 16px;">'; inList = true; }
            let content = trimmed.replace(/^[-*] /, '');
            content = inlineMarkdown(content);
            html += '<li>' + content + '</li>';
            continue;
        }
        // Numbered list
        if (/^\d+\. /.test(trimmed)) {
            if (!inList) { html += '<ol style="margin:4px 0 4px 16px;">'; inList = true; }
            let content = trimmed.replace(/^\d+\. /, '');
            content = inlineMarkdown(content);
            html += '<li>' + content + '</li>';
            continue;
        }

        if (inList) { html += '</ul>'; inList = false; }

        // Empty line
        if (trimmed === '') {
            html += '<div style="height:6px;"></div>';
            continue;
        }

        // Regular paragraph
        html += '<p style="margin:2px 0;">' + inlineMarkdown(trimmed) + '</p>';
    }
    if (inList) html += '</ul>';
    return html;
}

function inlineMarkdown(text) {
    // Bold
    text = text.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    // Italic
    text = text.replace(/\*(.+?)\*/g, '<em>$1</em>');
    // Links [text](url)
    text = text.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" style="color:#3b82f6;">$1</a>');
    return text;
}

function addToHistory(query) {
    // Remove duplicates
    queryHistory = queryHistory.filter(q => q !== query);
    queryHistory.unshift(query);
    if (queryHistory.length > MAX_HISTORY) queryHistory.pop();
    renderHistory();
}

function renderHistory() {
    const list = document.getElementById('historyList');
    if (queryHistory.length === 0) {
        list.innerHTML = '<li style="opacity:0.5;cursor:default;">No queries yet</li>';
        return;
    }
    list.innerHTML = queryHistory.map(q =>
        `<li onclick="document.getElementById('input').value='${q.replace(/'/g, "\\'")}';document.getElementById('input').focus();">${q}</li>`
    ).join('');
}

async function sendMessage() {
    const input = document.getElementById('input');
    const query = input.value.trim();
    if (!query || !currentAgent) return;

    input.value = '';
    addMessage('user', query);
    addToHistory(query);

    const statusDiv = addMessage('status', 'Thinking...');
    document.getElementById('sendBtn').disabled = true;

    const agentId = AGENT_CONFIG[currentAgent].endpoint;

    try {
        const token = localStorage.getItem('tommi_token') || '';
        let url = `/api/chat/stream?agent_id=${encodeURIComponent(agentId)}&message=${encodeURIComponent(query)}`;
        if (token) url += '&token=' + encodeURIComponent(token);
        const eventSource = new EventSource(url);
        let responseDiv = null;
        let fullText = '';

        eventSource.onmessage = function(e) {
            if (statusDiv.parentNode) statusDiv.remove();
            if (!responseDiv) {
                responseDiv = addMessage('assistant', '');
            }
            let chunk = e.data.replace(/\\n/g, '\n');
            // Don't append raw HTML trace to the markdown text
            let traceIdx = chunk.indexOf('<details class="decision-trace"');
            if (traceIdx >= 0) {
                // Split: markdown before trace, raw HTML after
                let before = chunk.substring(0, traceIdx).trim();
                let traceHtml = chunk.substring(traceIdx).replace(/\n/g, '');
                if (before) fullText += before;
                responseDiv.innerHTML = renderMarkdown(fullText) + traceHtml;
            } else {
                fullText += chunk;
                responseDiv.innerHTML = renderMarkdown(fullText);
            }
            document.getElementById('messages').scrollTop = document.getElementById('messages').scrollHeight;
        };

        eventSource.addEventListener('status', function(e) {
            statusDiv.textContent = e.data;
        });

        eventSource.addEventListener('replace', function(e) {
            if (responseDiv) {
                let replaced = e.data.replace(/\\n/g, '\n');
                let traceIdx = replaced.indexOf('<details class="decision-trace"');
                if (traceIdx >= 0) {
                    fullText = replaced.substring(0, traceIdx).trim();
                    let traceHtml = replaced.substring(traceIdx).replace(/\n/g, '');
                    responseDiv.innerHTML = renderMarkdown(fullText) + traceHtml;
                } else {
                    fullText = replaced;
                    responseDiv.innerHTML = renderMarkdown(fullText);
                }
            }
        });

        eventSource.addEventListener('trace', function(e) {
            if (responseDiv) {
                let traceHtml = e.data.replace(/\\n/g, '').replace(/\n/g, '');
                responseDiv.innerHTML = renderMarkdown(fullText) + traceHtml;
            }
        });

        eventSource.addEventListener('complete', function(e) {
            eventSource.close();
            document.getElementById('sendBtn').disabled = false;
            document.getElementById('input').focus();
        });

        eventSource.onerror = function(e) {
            eventSource.close();
            if (statusDiv.parentNode) statusDiv.remove();
            if (!responseDiv) {
                addMessage('assistant', 'Error: Could not connect to the agent. Make sure the server is running.');
            }
            document.getElementById('sendBtn').disabled = false;
        };

    } catch (err) {
        if (statusDiv.parentNode) statusDiv.remove();
        addMessage('assistant', 'Error: ' + err.message);
        document.getElementById('sendBtn').disabled = false;
    }
}

// Auto-select from URL param
const params = new URLSearchParams(window.location.search);
const agentParam = params.get('agent');
if (agentParam && AGENT_CONFIG[agentParam]) {
    document.getElementById('agentSelect').value = agentParam;
    selectAgent(agentParam);
}
</script>

</body>
</html>
