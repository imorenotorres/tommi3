<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mi progreso — Eulalia</title>
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: system-ui, -apple-system, sans-serif; background: #f8fafc; color: #1e293b; min-height: 100vh; }

.header { background: #4250b3; padding: 14px 24px; display: flex; align-items: center; gap: 12px; }
.header a { color: #fff; text-decoration: none; font-weight: 700; font-size: 18px; }
.header a:hover { opacity: 0.85; }
.header .sep { color: rgba(255,255,255,0.5); margin: 0 4px; }
.header .title { color: #fff; font-size: 16px; font-weight: 600; }

.container { max-width: 800px; margin: 0 auto; padding: 32px 20px; }
h2 { font-size: 22px; margin-bottom: 8px; color: #4250b3; }
.subtitle { font-size: 15px; color: #64748b; margin-bottom: 24px; line-height: 1.6; }

/* Student selector (professor only) */
.student-selector { margin-bottom: 20px; }
.student-selector select { padding: 8px 12px; border: 2px solid #e2e8f0; border-radius: 6px; font-size: 14px; font-family: inherit; }

/* Progress grid */
.progress-section { margin-bottom: 24px; }
.section-title { font-size: 14px; font-weight: 700; color: #475569; margin-bottom: 10px; padding-bottom: 6px; border-bottom: 2px solid #e2e8f0; }

.progress-grid { display: flex; flex-direction: column; gap: 6px; }
.progress-row {
    display: flex; align-items: center; gap: 12px; padding: 8px 12px;
    background: #fff; border-radius: 8px; border: 1px solid #e2e8f0;
}
.prog-label { flex: 1; font-size: 13px; font-weight: 600; color: #1e293b; }
.prog-bar-track { width: 120px; height: 8px; background: #e2e8f0; border-radius: 4px; overflow: hidden; }
.prog-bar-fill { height: 100%; border-radius: 4px; transition: width 0.3s; }
.prog-bar-fill.good { background: #16a34a; }
.prog-bar-fill.mid { background: #f59e0b; }
.prog-bar-fill.low { background: #dc2626; }
.prog-bar-fill.none { background: #cbd5e1; }
.prog-score { font-size: 12px; font-weight: 700; width: 40px; text-align: right; }
.prog-score.good { color: #16a34a; }
.prog-score.mid { color: #f59e0b; }
.prog-score.low { color: #dc2626; }
.prog-score.none { color: #94a3b8; }
.prog-date { font-size: 11px; color: #94a3b8; width: 80px; text-align: right; }

/* Summary */
.summary-card {
    background: #fff; border: 2px solid #e2e8f0; border-radius: 12px;
    padding: 20px; margin-bottom: 24px; display: flex; gap: 20px; align-items: center;
}
.summary-circle {
    width: 80px; height: 80px; border-radius: 50%; display: flex;
    align-items: center; justify-content: center; flex-direction: column;
    font-size: 28px; font-weight: 800; color: #fff; flex-shrink: 0;
}
.summary-circle.good { background: linear-gradient(135deg, #16a34a, #22c55e); }
.summary-circle.mid { background: linear-gradient(135deg, #f59e0b, #fbbf24); }
.summary-circle.low { background: linear-gradient(135deg, #dc2626, #ef4444); }
.summary-circle.none { background: #cbd5e1; }
.summary-circle .sc-label { font-size: 10px; font-weight: 600; opacity: 0.9; }
.summary-text { font-size: 14px; color: #475569; line-height: 1.6; }

/* Professor: student table */
.students-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.students-table th { background: #4250b3; color: #fff; padding: 8px 10px; text-align: left; font-size: 12px; }
.students-table td { padding: 6px 10px; border-bottom: 1px solid #e2e8f0; }
.students-table tr:hover td { background: #f8fafc; }
.students-table .cell-score { font-weight: 700; text-align: center; }
</style>
</head>
<body>

<div class="header">
    <a href="/tutores-virtuales/eulalia">Eulalia</a>
    <span class="sep">›</span>
    <span class="title">Evalúa tu progreso</span>
    <span class="sep">›</span>
    <span class="title">Mi progreso</span>
</div>

<div class="container">
    <h2 id="page-title">Mi progreso</h2>
    <p class="subtitle" id="page-subtitle">Aquí puedes ver tu avance en los ejercicios de práctica con Eulalia.</p>

    <div id="content">
        <div style="color:#94a3b8;font-style:italic;">Cargando...</div>
    </div>
</div>

<script src="/static/lalitutor/informar_profesor.js"></script>
<script>

// Exercise definitions (must match IDs used in widgets)
var EXERCISES = [
    // Tema 1 — Evaluación continua
    {id: 'concepto_fonema', nombre: 'Define: Fonema', tema: 1, tipo: 'concepto'},
    {id: 'concepto_alofono', nombre: 'Define: Alófono', tema: 1, tipo: 'concepto'},
    {id: 'concepto_representacion_mental', nombre: 'Define: Representación mental', tema: 1, tipo: 'concepto'},
    {id: 'concepto_pseudopalabra', nombre: 'Define: Pseudopalabra', tema: 1, tipo: 'concepto'},
    {id: 'eval_final_tema1', nombre: 'Autoevaluación Tema 1', tema: 1, tipo: 'ejercicio'},
    // Tema 2 — Evaluación continua
    {id: 'concepto_silaba', nombre: 'Define: Sílaba', tema: 2, tipo: 'concepto'},
    {id: 'concepto_palabra_prosodica', nombre: 'Define: Palabra prosódica', tema: 2, tipo: 'concepto'},
    {id: 'concepto_transcripcion_fonologica', nombre: 'Define: Transcripción fonológica', tema: 2, tipo: 'concepto'},
    {id: 'concepto_ppc', nombre: 'Define: PPC', tema: 2, tipo: 'concepto'},
    {id: 'concepto_asimilacion', nombre: 'Define: Asimilación', tema: 2, tipo: 'concepto'},
    {id: 'concepto_errores_sistemicos', nombre: 'Define: Errores sistémicos', tema: 2, tipo: 'concepto'},
    {id: 'concepto_errores_estructura_palabra', nombre: 'Define: Errores de estructura de palabra', tema: 2, tipo: 'concepto'},
    {id: 'concepto_errores_estructura_silaba', nombre: 'Define: Errores de estructura de sílaba', tema: 2, tipo: 'concepto'},
    {id: 'concepto_medidas_cuantitativas', nombre: 'Define: Medidas cuantitativas', tema: 2, tipo: 'concepto'},
    {id: 'transcripcion_ejercicio', nombre: 'Transcripción fonológica', tema: 2, tipo: 'ejercicio'},
    {id: 'ejercicio_errores', nombre: 'Clasificar errores (individual)', tema: 2, tipo: 'ejercicio'},
    {id: 'informe_errores', nombre: 'Informe de errores (completo)', tema: 2, tipo: 'ejercicio'},
    // Tema 3 — Evaluación continua
    {id: 'transcripcion_fonetica', nombre: 'Transcripción fonética (global)', tema: 3, tipo: 'ejercicio'},
    {id: 'transcripcion_fonetica_n1', nombre: 'Nivel 1: Diptongos e hiatos', tema: 3, tipo: 'ejercicio'},
    {id: 'transcripcion_fonetica_n2', nombre: 'Nivel 2: Oclusivas', tema: 3, tipo: 'ejercicio'},
    {id: 'transcripcion_fonetica_n3', nombre: 'Nivel 3: Fricativas y africadas', tema: 3, tipo: 'ejercicio'},
    {id: 'transcripcion_fonetica_n4', nombre: 'Nivel 4: Nasales', tema: 3, tipo: 'ejercicio'},
    {id: 'transcripcion_fonetica_n5', nombre: 'Nivel 5: Laterales y vibrantes', tema: 3, tipo: 'ejercicio'},
    {id: 'transcripcion_fonetica_n6', nombre: 'Nivel 6: Oraciones completas', tema: 3, tipo: 'ejercicio'},
    {id: 'transcripcion_fonetica_n7', nombre: 'Nivel 7: Fonosintaxis', tema: 3, tipo: 'ejercicio'},
];

function getToken() {
    return localStorage.getItem('tutores_token') || '';
}

function esc(str) {
    var d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
}

var _evalConfig = null;

async function loadProgress() {
    var token = getToken();
    var url = '/api/public-agent/eulalia/progreso-practica';
    if (token) url += '?token=' + encodeURIComponent(token);

    // Load eval config
    try {
        var cfgRes = await fetch('/api/public-agent/eulalia/evaluacion-config');
        if (cfgRes.ok) _evalConfig = await cfgRes.json();
    } catch(e) {}

    // Load from localStorage first
    var local = {};
    try { local = JSON.parse(localStorage.getItem('lali_progress') || '{}'); } catch(e2) {}

    try {
        var res = await fetch(url);
        var data = await res.json();
        // Merge: use the best score from either source
        var serverProg = data.progreso || {};
        var merged = Object.assign({}, serverProg);
        Object.keys(local).forEach(function(key) {
            var lp = local[key];
            var sp = merged[key];
            if (!sp || (lp && lp.score > (sp.score || 0))) {
                merged[key] = lp;
            }
        });
        render({role: data.role, username: data.username, progreso: merged});
    } catch(e) {
        render({role: 'estudiante', username: 'local', progreso: local});
    }
}

function calcularCalificacion(progreso) {
    if (!_evalConfig || !_evalConfig.temas) return null;
    var resultado = { temas: {}, total: 0, maximo: 0 };

    Object.keys(_evalConfig.temas).forEach(function(temaId) {
        var tema = _evalConfig.temas[temaId];
        var notaTema = 0;

        (tema.componentes || []).forEach(function(comp) {
            if (comp.tipo === 'conceptos') {
                var aprobados = 0;
                (comp.ejercicios || []).forEach(function(ejId) {
                    var p = progreso[ejId];
                    if (p && ((p.completed) || (p.score >= 75))) aprobados++;
                });
                var items = Math.min(aprobados, comp.minimo_items || aprobados);
                notaTema += items * (comp.puntos_por_item || 0);
                notaTema = Math.min(notaTema, comp.puntuacion_maxima || 999);
            }
            else if (comp.tipo === 'test') {
                (comp.ejercicios || []).forEach(function(ejId) {
                    var p = progreso[ejId];
                    if (p && p.score >= (comp.umbral_aprobado || 75)) {
                        notaTema += comp.puntuacion_maxima || 0;
                    }
                });
            }
            else if (comp.tipo === 'transcripcion_examen' && comp.examen) {
                // Based on best score in level 6 with 12 items
                var p = progreso['transcripcion_fonetica'];
                if (p) {
                    // Use the global score as proxy
                    notaTema += (comp.examen.puntuacion_maxima || 2) * (p.score / 100);
                }
            }
        });

        notaTema = Math.min(notaTema, tema.puntuacion_maxima || 2);
        resultado.temas[temaId] = { nota: Math.round(notaTema * 100) / 100, maximo: tema.puntuacion_maxima };
        resultado.total += notaTema;
        resultado.maximo += tema.puntuacion_maxima;
    });

    resultado.total = Math.round(resultado.total * 100) / 100;
    return resultado;
}

function render(data) {
    var contentEl = document.getElementById('content');

    if (data.role === 'profesor') {
        renderProfesor(data.progreso, contentEl);
    } else {
        renderEstudiante(data.username, data.progreso, contentEl);
    }
}

// Map exercise IDs to widget URLs
var WIDGET_URLS = {
    'conceptos': '/tutores-virtuales/eulalia/widgets/conceptos?tema=1',
    'concepto_fonema': '/tutores-virtuales/eulalia/widgets/conceptos?tema=1',
    'concepto_alofono': '/tutores-virtuales/eulalia/widgets/conceptos?tema=1',
    'concepto_representacion_mental': '/tutores-virtuales/eulalia/widgets/conceptos?tema=1',
    'concepto_pseudopalabra': '/tutores-virtuales/eulalia/widgets/conceptos?tema=1',
    'eval_final_tema1': '/tutores-virtuales/eulalia/widgets/eval_final_tema1',
    'concepto_silaba': '/tutores-virtuales/eulalia/widgets/conceptos?tema=2',
    'concepto_palabra_prosodica': '/tutores-virtuales/eulalia/widgets/conceptos?tema=2',
    'concepto_transcripcion_fonologica': '/tutores-virtuales/eulalia/widgets/conceptos?tema=2',
    'concepto_ppc': '/tutores-virtuales/eulalia/widgets/conceptos?tema=2',
    'concepto_asimilacion': '/tutores-virtuales/eulalia/widgets/conceptos?tema=2',
    'concepto_errores_sistemicos': '/tutores-virtuales/eulalia/widgets/conceptos?tema=2',
    'concepto_errores_estructura_palabra': '/tutores-virtuales/eulalia/widgets/conceptos?tema=2',
    'concepto_errores_estructura_silaba': '/tutores-virtuales/eulalia/widgets/conceptos?tema=2',
    'concepto_medidas_cuantitativas': '/tutores-virtuales/eulalia/widgets/conceptos?tema=2',
    'transcripcion_ejercicio': '/tutores-virtuales/eulalia/widgets/transcripcion_ejercicio',
    'ejercicio_errores': '/tutores-virtuales/eulalia/widgets/ejercicio_errores',
    'informe_errores': '/tutores-virtuales/eulalia/widgets/informe_errores',
    'transcripcion_fonetica': '/tutores-virtuales/eulalia/widgets/transcripcion_fonetica',
    'transcripcion_fonetica_n1': '/tutores-virtuales/eulalia/widgets/transcripcion_fonetica',
    'transcripcion_fonetica_n2': '/tutores-virtuales/eulalia/widgets/transcripcion_fonetica',
    'transcripcion_fonetica_n3': '/tutores-virtuales/eulalia/widgets/transcripcion_fonetica',
    'transcripcion_fonetica_n4': '/tutores-virtuales/eulalia/widgets/transcripcion_fonetica',
    'transcripcion_fonetica_n5': '/tutores-virtuales/eulalia/widgets/transcripcion_fonetica',
    'transcripcion_fonetica_n6': '/tutores-virtuales/eulalia/widgets/transcripcion_fonetica',
    'transcripcion_fonetica_n7': '/tutores-virtuales/eulalia/widgets/transcripcion_fonetica',
};

function scoreClass(pct) {
    if (pct >= 75) return 'good';
    if (pct >= 50) return 'mid';
    if (pct > 0) return 'low';
    return 'none';
}

function renderEstudiante(username, progreso, container) {
    // Summary
    var completed = 0;
    var total = EXERCISES.length;
    EXERCISES.forEach(function(ex) {
        var p = progreso[ex.id];
        if (p && ((typeof p === 'object' && p.completed) || (typeof p === 'number' && p >= 75))) completed++;
    });
    var globalPct = Math.round(completed / total * 100);
    var cls = scoreClass(globalPct);

    var html = '';

    // Two summary cards: practice + grade
    html += '<div style="display:flex;gap:16px;flex-wrap:wrap;margin-bottom:16px;">';

    // Card 1: % practicado
    html += '<div class="summary-card" style="flex:1;min-width:200px;">';
    html += '<div class="summary-circle ' + cls + '">' + completed + '/' + total + '<div class="sc-label">practicados</div></div>';
    html += '<div class="summary-text">';
    if (globalPct >= 75) html += '<strong>¡Buen trabajo!</strong> Has completado la mayoría de los ejercicios.';
    else if (globalPct >= 50) html += 'Vas por buen camino. Sigue practicando.';
    else if (completed > 0) html += 'Has empezado. ¡Ánimo!';
    else html += 'Aún no has completado ningún ejercicio.';
    html += '</div></div>';

    // Card 2: Calificación estimada
    var calif = calcularCalificacion(progreso);
    if (calif) {
        var califCls = scoreClass(Math.round(calif.total / calif.maximo * 100));
        html += '<div class="summary-card" style="flex:1;min-width:200px;">';
        html += '<div class="summary-circle ' + califCls + '">' + calif.total + '/' + calif.maximo + '<div class="sc-label">calificación</div></div>';
        html += '<div class="summary-text" style="font-size:12px;">';
        Object.keys(calif.temas).forEach(function(tid) {
            var t = calif.temas[tid];
            if (t.maximo > 0) {
                var tCls = t.nota >= t.maximo * 0.75 ? 'color:#16a34a' : t.nota > 0 ? 'color:#f59e0b' : 'color:#94a3b8';
                html += '<div style="' + tCls + '">Tema ' + tid + ': ' + t.nota + '/' + t.maximo + '</div>';
            }
        });
        html += '<div style="margin-top:4px;color:#94a3b8;font-size:11px;">Estimación basada en ejercicios realizados</div>';
        html += '</div></div>';
    }

    html += '</div>';

    // By tema
    var temas = [1, 2, 3];
    temas.forEach(function(tema) {
        var exs = EXERCISES.filter(function(e) { return e.tema === tema; });
        if (exs.length === 0) return;
        html += '<div class="progress-section">';
        html += '<div class="section-title">Tema ' + tema + '</div>';
        html += '<div class="progress-grid">';
        exs.forEach(function(ex) {
            var p = progreso[ex.id];
            var pct = 0, date = '';
            if (p && typeof p === 'object') { pct = p.score || 0; date = p.date || ''; }
            else if (typeof p === 'number') { pct = p; }
            var c = scoreClass(pct);
            var widgetUrl = WIDGET_URLS[ex.id] || '';
            html += '<div class="progress-row">';
            if (pct < 75 && widgetUrl) {
                var widgetName = widgetUrl.replace('/tutores-virtuales/eulalia/widgets/', '');
                html += '<div class="prog-label"><a href="#" onclick="try{parent.openWidget(\'' + widgetName + '\')}catch(e){window.open(\'' + widgetUrl + '\',\'_blank\')};return false;" style="color:#4250b3;text-decoration:none;" title="Hacer este ejercicio">' + ex.nombre + ' →</a></div>';
            } else {
                html += '<div class="prog-label">' + ex.nombre + '</div>';
            }
            html += '<div class="prog-bar-track"><div class="prog-bar-fill ' + c + '" style="width:' + pct + '%"></div></div>';
            html += '<div class="prog-score ' + c + '">' + (pct > 0 ? pct + '%' : '—') + '</div>';
            html += '<div class="prog-date">' + date + '</div>';
            html += '</div>';
        });
        html += '</div></div>';
    });

    container.innerHTML = html;
}

function renderProfesor(allProgreso, container) {
    document.getElementById('page-title').textContent = 'Progreso de los estudiantes';
    document.getElementById('page-subtitle').textContent = 'Vista general del progreso de todos los estudiantes en los ejercicios de práctica.';

    var students = Object.keys(allProgreso).sort();
    if (students.length === 0) {
        container.innerHTML = '<div style="color:#94a3b8;padding:20px;text-align:center;">No hay datos de progreso aún.</div>';
        return;
    }

    // Summary table
    var html = '<table class="students-table"><thead><tr><th>Estudiante</th>';
    EXERCISES.forEach(function(ex) {
        html += '<th style="font-size:10px;max-width:60px;overflow:hidden;text-overflow:ellipsis;" title="' + ex.nombre + '">' + ex.id.replace('concepto_', '').substring(0, 8) + '</th>';
    });
    html += '<th>Media</th></tr></thead><tbody>';

    students.forEach(function(student) {
        var prog = allProgreso[student];
        html += '<tr><td style="font-weight:600;">' + esc(student) + '</td>';
        var totalPct = 0, count = 0;
        EXERCISES.forEach(function(ex) {
            var p = prog[ex.id];
            var pct = 0;
            if (p && typeof p === 'object') pct = p.score || 0;
            else if (typeof p === 'number') pct = p;
            var c = scoreClass(pct);
            html += '<td class="cell-score" style="color:' + (c === 'good' ? '#16a34a' : c === 'mid' ? '#f59e0b' : c === 'low' ? '#dc2626' : '#cbd5e1') + ';">' + (pct > 0 ? pct : '—') + '</td>';
            totalPct += pct; count++;
        });
        var avg = Math.round(totalPct / count);
        var ac = scoreClass(avg);
        html += '<td class="cell-score" style="font-size:14px;color:' + (ac === 'good' ? '#16a34a' : ac === 'mid' ? '#f59e0b' : '#dc2626') + ';">' + avg + '%</td>';
        html += '</tr>';
    });

    html += '</tbody></table>';

    // Individual student detail (selectable)
    html += '<div style="margin-top:24px;"><label style="font-size:13px;font-weight:600;color:#475569;">Ver detalle de:</label> ';
    html += '<select id="student-select" onchange="showStudentDetail()" style="padding:6px 10px;border:2px solid #e2e8f0;border-radius:6px;font-size:13px;font-family:inherit;">';
    html += '<option value="">— Selecciona —</option>';
    students.forEach(function(s) { html += '<option value="' + esc(s) + '">' + esc(s) + '</option>'; });
    html += '</select></div>';
    html += '<div id="student-detail" style="margin-top:16px;"></div>';

    container.innerHTML = html;

    // Store for detail view
    window._allProgreso = allProgreso;
}

window.showStudentDetail = function() {
    var student = document.getElementById('student-select').value;
    var detailEl = document.getElementById('student-detail');
    if (!student || !window._allProgreso[student]) {
        detailEl.innerHTML = '';
        return;
    }
    renderEstudiante(student, window._allProgreso[student], detailEl);
};

loadProgress();

</script>
</body>
</html>
