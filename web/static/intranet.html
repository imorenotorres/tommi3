<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UNINOVIS Intranet</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f0f2f5; color: #333; min-height: 100vh; }

        /* Top bar */
        .topbar { background: #1a2255; color: #fff; padding: 10px 24px; display: flex; justify-content: space-between; align-items: center; }
        .topbar h1 { font-size: 1.2em; font-weight: 600; }
        .topbar .user-info { font-size: 0.82em; display: flex; align-items: center; gap: 10px; }
        .topbar .user-info span { opacity: 0.85; }
        .topbar button { background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.3); color: #fff; padding: 4px 14px; border-radius: 4px; cursor: pointer; font-size: 0.8em; }
        .topbar button:hover { background: rgba(255,255,255,0.25); }

        /* Main content */
        .main { max-width: 1000px; margin: 0 auto; padding: 20px; }
        .welcome { margin-bottom: 20px; }
        .welcome h2 { color: #2D3876; font-size: 1.2em; margin-bottom: 4px; }
        .welcome .roles-badge { display: inline-block; background: #e8e0f0; color: #2D3876; padding: 2px 10px; border-radius: 10px; font-size: 0.75em; font-weight: 600; margin-left: 4px; }

        /* Tabs */
        .wp-tabs { display: flex; gap: 0; border-bottom: 2px solid #e2e8f0; margin-bottom: 16px; overflow-x: auto; }
        .wp-tab {
            padding: 8px 16px; font-size: 0.82em; font-weight: 600; color: #666;
            cursor: pointer; border-bottom: 3px solid transparent; white-space: nowrap;
            transition: color 0.15s, border-color 0.15s; user-select: none;
        }
        .wp-tab:hover { color: #4250b3; }
        .wp-tab.active { color: #4250b3; border-bottom-color: #4250b3; }

        /* Sections */
        .section { margin-bottom: 20px; }
        .section-title { font-size: 0.82em; font-weight: 700; color: #666; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; padding-left: 2px; }
        .wp-panel { display: none; }
        .wp-panel.active { display: block; }

        /* Tool grid */
        .tools-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
        .tool-card {
            background: #fff; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.07);
            padding: 14px 14px; text-decoration: none; color: #333;
            transition: transform 0.15s, box-shadow 0.15s;
            display: flex; flex-direction: column; border-left: 4px solid #2D3876;
            position: relative;
        }
        .server-badge { position: absolute; top: 6px; right: 8px; font-size: 0.58em; font-weight: 600; padding: 1px 6px; border-radius: 6px; }
        .server-agora { background: #d1ecf1; color: #0c5460; }
        .server-gloria { background: #e8e0f0; color: #4250b3; }
        .tool-card:hover { transform: translateY(-2px); box-shadow: 0 4px 16px rgba(0,0,0,0.12); }
        .tool-card .tool-icon { font-size: 1.3em; margin-bottom: 4px; }
        .tool-card h3 { color: #2D3876; font-size: 0.88em; margin-bottom: 2px; }
        .tool-card p { color: #666; font-size: 0.72em; line-height: 1.3; flex: 1; }
        .tool-card .tool-tag { margin-top: 6px; font-size: 0.62em; font-weight: 600; padding: 2px 8px; border-radius: 8px; display: inline-block; align-self: flex-start; }
        .tag-active { background: #e8e0f0; color: #374399; }
        .tag-prototype { background: #f8d7da; color: #721c24; }
        .tag-testing { background: #d1ecf1; color: #0c5460; }
        .tag-pilot { background: #cce5ff; color: #004085; }
        .tag-pre-pilot { background: #e0e7ff; color: #3730a3; }
        .tag-construction { background: #fce4ec; color: #880e4f; }
        .tag-data-update { background: #fef3c7; color: #92400e; }
        .tag-soon { background: #fff3cd; color: #856404; }

        .footer { text-align: center; color: #aaa; font-size: 0.75em; padding: 16px; }

        @media (max-width: 600px) {
            .tools-grid { grid-template-columns: 1fr 1fr; }
            .login-box { padding: 24px 20px; }
        }
    </style>

// Tools grouped by functionality
var SECTIONS = [

            { id: 'learning_support', name: 'Learning Support', icon: '\uD83C\uDFEB', desc: 'Resources and tools to support student learning.', url: 'https://uninovis.widening.eu/learningsupportcatalogue', status: 'construction', external: true },
            { id: 'unigracon', name: 'UNIGRACON', icon: '\uD83C\uDF93', desc: 'Grade converter between partner universities.', url: '/unigracon/', status: 'data-update' },

            { id: 'internships', name: 'Internships', icon: '\uD83D\uDCBC', desc: 'Internship opportunities and placements across partner institutions.', url: 'https://uninovis.widening.eu/internships', status: 'active', external: true },
            { id: 'researcher_connect', name: 'Researcher Connect', icon: '\uD83D\uDD2C', desc: 'Find and connect with researchers. Search by interests and expertise.', url: 'https://uninovis.widening.eu/researcher-connect', status: 'prototype', external: true },
            { id: 'research_proposals', name: 'Research Proposals', icon: '\uD83D\uDCDD', desc: 'Post and discover research collaboration opportunities and funding calls.', url: 'https://uninovis.widening.eu/research-proposals', status: 'prototype', external: true },
            { id: 'research_portfolio', name: 'Research Portfolio', icon: '\uD83D\uDCCA', desc: 'Portfolio of research activities and outputs across UNINOVIS.', url: 'https://uninovis.widening.eu/research-portfolio', status: 'active', external: true },
            { id: 'research_explorers', name: 'Research Explorers', icon: '\uD83C\uDF10', desc: 'AI-powered research assistants for each Excellence Hub.', url: '/research-explorers', status: 'pilot' },
            { id: 'european_projects', name: 'European Projects', icon: '\uD83C\uDDEA\uD83C\uDDFA', desc: 'Search European research funding calls and projects.', url: '/european-projects', status: 'pilot' },

            { id: 'event_calendar', name: 'Event Tracker', icon: '\uD83D\uDCC6', desc: 'Shared calendar with filters, iCal sync, and participant management.', url: '/event-calendar/', status: 'pilot' },

            { id: 'matomo_analytics', name: 'Site Analytics', icon: '\uD83D\uDCC8', desc: 'Website traffic, page views, visitors, and referrers from Matomo.', url: '/matomo-analytics/', status: 'prototype' },

            { id: 'agent_management', name: 'Agent Management', icon: '\u2699\uFE0F', desc: 'Agent visibility, access control, data export, and log management.', url: '#', status: 'active', action: 'openAgentManagement' },
            { id: 'tool_visibility', name: 'Tool Visibility', icon: '\uD83D\uDC41', desc: 'Configure which intranet tools are visible to each role.', url: '#', status: 'active', action: 'openToolVisibility' },
        ]

function canAccess(toolId, roles) {
    if (!TOOL_ACCESS[toolId]) return true;
    if (TOOL_ACCESS[toolId].indexOf('public') !== -1) return true;
    for (var i = 0; i < roles.length; i++) {
        if (TOOL_ACCESS[toolId].indexOf(roles[i]) !== -1) return true;
    }
    return false;
}

function sectionVisible(section, roles) {
    // Show section if user has any of the section's target roles, or is superuser/tester
    for (var i = 0; i < roles.length; i++) {
        if (section.roles.indexOf(roles[i]) !== -1) return true;
        if (roles[i] === 'superuser' || roles[i] === 'tester') return true;
    }
    return false;
}

// ── Auth ─────────────────────────────────────────────────────────
var authToken = localStorage.getItem('tommi_token') || localStorage.getItem('uninovis_token') || '';
var authUser = null;

async function checkAuth() {
    if (!authToken) { showLogin(); return; }
    try {
        var resp = await fetch('/directory/api/auth-check', { headers: { 'Authorization': 'Bearer ' + authToken } });
        if (resp.ok) {
            authUser = await resp.json();
            // Guest/public sessions mean no real authentication — show login
            if (!authUser || authUser.role === 'public' || authUser.username === 'guest') {
                authToken = '';
                authUser = null;
                localStorage.removeItem('tommi_token');
                localStorage.removeItem('uninovis_token');
                showLogin();
                return;
            }
            var params = new URLSearchParams(window.location.search);
            var redirect = params.get('redirect');
            if (redirect) { window.location.href = redirect; return; }
            showMain();
        } else {
            authToken = '';
            showLogin();
        }
    } catch (e) { showLogin(); }
}

function showLogin() {
    window.location.href = '/login?redirect=/';
}

async function showMain() {
    document.getElementById('mainContent').style.display = '';
    document.getElementById('topUserInfo').style.display = '';

    var roles = (authUser.roles && Array.isArray(authUser.roles)) ? authUser.roles : [authUser.role];
    var name = authUser.username.split('@')[0].replace(/\./g, ' ');
    name = name.split(' ').map(function(w) { return w.charAt(0).toUpperCase() + w.slice(1); }).join(' ');

    document.getElementById('topUsername').textContent = authUser.username;
    var roleBadges = roles.map(function(r) { return '<span class="roles-badge">' + r.replace('_', ' ') + '</span>'; }).join(' ');
    document.getElementById('welcomeMsg').innerHTML = 'Welcome to UNINOVIS Intranet site.<br><span style="font-size:0.75em;font-weight:400;color:#666;">From here you have access to services only accessible to UNINOVIS members.</span>';

    // Load server-side tool access overrides before rendering
    await loadToolAccess();

    // Hide "Edit my profile" if user doesn't have directory access
    // Show "Edit my profile" for staff roles that have directory access
    var canEditProfile = roles.indexOf('admin_staff') !== -1 || roles.indexOf('teaching_staff') !== -1 || roles.indexOf('tester') !== -1 || roles.indexOf('superuser') !== -1;
    if (!canEditProfile) {
        document.getElementById('editProfileLink').style.display = 'none';
    }

    renderSections(roles);
}

function doLogout() {
    fetch('/api/auth/logout', { method: 'POST', headers: { 'Authorization': 'Bearer ' + authToken } }).catch(function(){});
    authToken = ''; authUser = null;
    localStorage.removeItem('tommi_token');
    localStorage.removeItem('uninovis_token');
    localStorage.removeItem('uninovis_admin_token');
    window.location.href = '/login';
}

// ── Render card HTML for a tool ──────────────────────────────────
function renderToolCard(tool) {
    var tagClass = tool.status === 'active' ? 'tag-active' : tool.status === 'pilot' ? 'tag-pilot' : tool.status === 'pre-pilot' ? 'tag-pre-pilot' : tool.status === 'construction' ? 'tag-construction' : tool.status === 'prototype' ? 'tag-prototype' : tool.status === 'testing' ? 'tag-testing' : tool.status === 'data-update' ? 'tag-data-update' : 'tag-soon';
    var tagText = tool.status === 'active' ? 'Active' : tool.status === 'pilot' ? 'Pilot' : tool.status === 'pre-pilot' ? 'Pre-pilot' : tool.status === 'construction' ? 'In construction' : tool.status === 'prototype' ? 'Untested Prototype' : tool.status === 'testing' ? 'Status: Data collection' : tool.status === 'data-update' ? 'Data update required' : 'Coming soon';
    var href = (tool.status === 'active' || tool.status === 'pilot' || tool.status === 'pre-pilot' || tool.status === 'construction' || tool.status === 'prototype' || tool.status === 'testing' || tool.status === 'data-update') ? tool.url : '#';
    var clickAttr = '';
    if (tool.status === 'soon') {
        clickAttr = ' onclick="event.preventDefault();" style="opacity:0.6;cursor:default;"';
    } else if (tool.action) {
        clickAttr = ' onclick="event.preventDefault();' + tool.action + '()"';
        href = '#';
    }
    var targetAttr = tool.external ? ' target="_blank" rel="noopener"' : '';
    var isAgora = tool.url && tool.url.indexOf('uninovis.widening.eu') !== -1;
    var serverBadge = isAgora ? '<span class="server-badge server-agora">Agora</span>' : '<span class="server-badge server-gloria">Gloria</span>';
    return '<a class="tool-card" href="' + href + '"' + clickAttr + targetAttr + '>'
        + serverBadge
        + '<div class="tool-icon">' + tool.icon + '</div>'
        + '<h3>' + tool.name + '</h3>'
        + '<p>' + tool.desc + '</p>'
        + '<span class="tool-tag ' + tagClass + '">' + tagText + '</span>'
        + '</a>';
}

// ── Flat view for students and teaching staff ────────────────────
// Map each WP section to a user-friendly label
var FLAT_LABELS = {
    'learning': 'Learning & Mobility',
    'research': 'Research & Innovation',
    'events': 'Events & Communication',
    'admin': 'Administration',
    'platform': 'Digital Platform',
};

function renderFlatView(roles) {
    var html = '';
    // Use the same SECTIONS but with friendly labels, skip superuser
    SECTIONS.forEach(function(section) {
        if (section.id === 'superuser') return;
        if (!sectionVisible(section, roles)) return;
        var label = FLAT_LABELS[section.id] || section.title;
        var toolsHtml = '';
        section.tools.forEach(function(tool) {
            if (!canAccess(tool.id, roles)) return;
            toolsHtml += renderToolCard(tool);
        });
        if (!toolsHtml) return;
        html += '<div class="section">'
            + '<div class="section-title">' + label + '</div>'
            + '<div class="tools-grid">' + toolsHtml + '</div>'
            + '</div>';
    });

    if (!html) {
        html = '<p style="color:#888;text-align:center;">No tools available for your role. Contact an administrator.</p>';
    }
    document.getElementById('toolSections').innerHTML = html;
}

// ── Tabbed view for admin staff, testers, superusers ─────────────
function renderTabbedView(roles) {
    var visibleSections = SECTIONS.filter(function(s) { return sectionVisible(s, roles); });
    visibleSections.sort(function(a, b) {
        var aIsWP = a.title.match(/^WP(\d)/);
        var bIsWP = b.title.match(/^WP(\d)/);
        if (aIsWP && bIsWP) return parseInt(aIsWP[1]) - parseInt(bIsWP[1]);
        if (aIsWP) return -1;
        if (bIsWP) return 1;
        return a.title.localeCompare(b.title);
    });

    var tabsHtml = '<div class="wp-tabs">';
    var panelsHtml = '';
    var hasContent = false;

    var statusOrder = ['active', 'pilot', 'pre-pilot', 'construction', 'prototype', 'data-update', 'testing', 'soon'];

    visibleSections.forEach(function(section) {
        // Group accessible tools by status
        var toolsByStatus = {};
        section.tools.forEach(function(tool) {
            if (!canAccess(tool.id, roles)) return;
            if (!toolsByStatus[tool.status]) toolsByStatus[tool.status] = [];
            toolsByStatus[tool.status].push(tool);
        });

        // Build panel with rows sorted by status
        var panelContent = '';
        statusOrder.forEach(function(status) {
            if (!toolsByStatus[status]) return;
            panelContent += '<div class="tools-grid">';
            toolsByStatus[status].forEach(function(tool) {
                panelContent += renderToolCard(tool);
            });
            panelContent += '</div>';
        });

        if (!panelContent) return;
        hasContent = true;
        var isFirst = (panelsHtml === '');
        var tabLabel = section.title.match(/^(WP\d)/) ? section.title.match(/^(WP\d)/)[1] : (section.id === 'superuser' ? 'Sys Admin' : section.title);
        tabsHtml += '<div class="wp-tab' + (isFirst ? ' active' : '') + '" data-tab="' + section.id + '" onclick="switchTab(\'' + section.id + '\')" title="' + section.title + '">' + tabLabel + '</div>';
        panelsHtml += '<div class="wp-panel' + (isFirst ? ' active' : '') + '" id="panel-' + section.id + '">'
            + panelContent
            + '</div>';
    });

    tabsHtml += '</div>';

    if (!hasContent) {
        document.getElementById('toolSections').innerHTML = '<p style="color:#888;text-align:center;">No tools available for your role. Contact an administrator.</p>';
    } else {
        document.getElementById('toolSections').innerHTML = tabsHtml + panelsHtml;
    }
}

// ── Main render function ─────────────────────────────────────────
function renderSections(roles) {
    var isAdmin = roles.indexOf('admin_staff') !== -1 || roles.indexOf('tester') !== -1 || roles.indexOf('superuser') !== -1;
    if (isAdmin) {
        renderTabbedView(roles);
    } else {
        renderFlatView(roles);
    }
}

function switchTab(tabId) {
    document.querySelectorAll('.wp-tab').forEach(function(t) { t.classList.remove('active'); });
    document.querySelectorAll('.wp-panel').forEach(function(p) { p.classList.remove('active'); });
    var tab = document.querySelector('.wp-tab[data-tab="' + tabId + '"]');
    var panel = document.getElementById('panel-' + tabId);
    if (tab) tab.classList.add('active');
    if (panel) panel.classList.add('active');
}

// ── DP Status summary ────────────────────────────────────────────
function openDPStatus() {
    var existing = document.getElementById('dp-overlay');
    if (existing) existing.remove();

    var overlay = document.createElement('div');
    overlay.id = 'dp-overlay';
    overlay.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);z-index:1000;display:flex;justify-content:center;align-items:center;';

    var statusColors = {
        active: { bg: '#d4edda', color: '#155724', label: 'Active' },
        pilot: { bg: '#cce5ff', color: '#004085', label: 'Pilot' },
        prototype: { bg: '#f8d7da', color: '#721c24', label: 'Untested Prototype' },
        testing: { bg: '#d1ecf1', color: '#0c5460', label: 'Data collection' },
        soon: { bg: '#fff3cd', color: '#856404', label: 'Coming soon' }
    };

    var html = '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">'
        + '<h2 style="margin:0;font-size:1.15rem;color:#2D3876;">Status of Digital Platform Services</h2>'
        + '<button onclick="document.getElementById(\'dp-overlay\').remove()" style="background:none;border:none;font-size:1.5rem;cursor:pointer;color:#888;">&times;</button>'
        + '</div>';

    // Count totals
    var totals = { active: 0, pilot: 0, prototype: 0, testing: 0, soon: 0 };

    // Sort sections: WPs in order, System Administration last
    var sortedSections = SECTIONS.slice().sort(function(a, b) {
        var aIsWP = a.title.match(/^WP(\d)/);
        var bIsWP = b.title.match(/^WP(\d)/);
        if (aIsWP && bIsWP) return parseInt(aIsWP[1]) - parseInt(bIsWP[1]);
        if (aIsWP) return -1;
        if (bIsWP) return 1;
        return a.title.localeCompare(b.title);
    });

    sortedSections.forEach(function(section) {
        var tools = section.tools;
        if (!tools || !tools.length) return;

        html += '<h3 style="font-size:0.9rem;color:#4250b3;margin:14px 0 6px 0;border-bottom:1px solid #e2e8f0;padding-bottom:4px;">' + section.title + '</h3>';
        html += '<table style="width:100%;border-collapse:collapse;font-size:0.82rem;margin-bottom:4px;">';
        tools.forEach(function(tool) {
            var s = statusColors[tool.status] || statusColors.soon;
            totals[tool.status] = (totals[tool.status] || 0) + 1;
            var isAgora = tool.url && tool.url.indexOf('uninovis.widening.eu') !== -1;
            var server = isAgora ? '<span style="font-size:0.72em;padding:1px 5px;border-radius:4px;background:#d1ecf1;color:#0c5460;">Agora</span>' : '<span style="font-size:0.72em;padding:1px 5px;border-radius:4px;background:#e8e0f0;color:#4250b3;">Gloria</span>';
            html += '<tr style="border-bottom:1px solid #f0f0f0;">'
                + '<td style="padding:4px 8px;">' + tool.name + '</td>'
                + '<td style="padding:4px 8px;text-align:center;">' + server + '</td>'
                + '<td style="padding:4px 8px;text-align:right;"><span style="font-size:0.75em;font-weight:600;padding:2px 8px;border-radius:8px;background:' + s.bg + ';color:' + s.color + ';">' + s.label + '</span></td>'
                + '</tr>';
        });
        html += '</table>';
    });

    // Summary bar
    var summaryHtml = '<div style="display:flex;gap:12px;flex-wrap:wrap;margin-bottom:14px;">';
    Object.keys(statusColors).forEach(function(key) {
        if (totals[key]) {
            var s = statusColors[key];
            summaryHtml += '<div style="text-align:center;padding:6px 14px;border-radius:8px;background:' + s.bg + ';color:' + s.color + ';font-size:0.82rem;">'
                + '<div style="font-size:1.2rem;font-weight:700;">' + totals[key] + '</div>'
                + '<div style="font-size:0.7rem;">' + s.label + '</div></div>';
        }
    });
    summaryHtml += '</div>';

    var panel = document.createElement('div');
    panel.style.cssText = 'background:#fff;border-radius:12px;padding:24px;width:680px;max-width:95vw;max-height:85vh;overflow-y:auto;box-shadow:0 8px 32px rgba(0,0,0,0.2);';
    panel.innerHTML = html.replace('</h2></div>', '</h2></div>' + summaryHtml);

    // Re-insert summary after header
    var headerEnd = html.indexOf('</div>') + 6;
    panel.innerHTML = html.substring(0, headerEnd) + summaryHtml + html.substring(headerEnd);

    overlay.appendChild(panel);
    overlay.addEventListener('click', function(e) { if (e.target === overlay) overlay.remove(); });
    document.body.appendChild(overlay);
}

function umMsg(text, ok) {

    if (!el) return;

    el.style.background = ok ? '#dcfce7' : '#fee2e2';

async function umFetch(path, opts) {
    opts = opts || {};
    opts.headers = Object.assign({ 'Authorization': 'Bearer ' + authToken, 'Content-Type': 'application/json' }, opts.headers || {});
    return fetch(path, opts);
}

async function umLoadUsers() {
    try {
        var res = await umFetch('/api/auth/users');
        _umUsers = await res.json();

        // Load directory data to get university and name info
        try {
            var dirRes = await umFetch('/directory/api/data');
            var dirData = await dirRes.json();
            _umDirUsers = {};
            (dirData.users || []).forEach(function(du) {
                if (du.email) {
                    du.email.toLowerCase().split(';').forEach(function(e) {
                        _umDirUsers[e.trim()] = du;
                    });
                }
            });
            // Populate university filter
            var unis = new Set();
            (dirData.users || []).forEach(function(du) { if (du.university) unis.add(du.university); });
            _umUniversities = Array.from(unis).sort();
            var uniSel = document.getElementById('um-uni-filter');
            if (uniSel) {
                var val = uniSel.value;
                uniSel.innerHTML = '<option value="">All universities</option>';
                _umUniversities.forEach(function(u) {
                    uniSel.innerHTML += '<option value="' + u + '">' + u + '</option>';
                });
                uniSel.value = val;
            }
        } catch (e) { /* Directory not available, continue without it */ }

        umRender();
    } catch (e) {
        document.getElementById('um-list').innerHTML = '<p style="color:#dc3545;">Error loading users</p>';
    }
}

function umGetDirInfo(username) {
    return _umDirUsers[username.toLowerCase()] || null;
}

function umRender() {
    var container = document.getElementById('um-list');
    if (!container) return;
    var search = (document.getElementById('um-search').value || '').toLowerCase();
    var roleFilter = document.getElementById('um-role-filter').value;
    var uniFilter = (document.getElementById('um-uni-filter') || {}).value || '';
    var sortBy = (document.getElementById('um-sort') || {}).value || 'name';

    // Enrich users with directory info
    var enriched = _umUsers.map(function(u) {
        var dir = umGetDirInfo(u.username);
        return {
            username: u.username,
            role: u.role,
            roles: u.roles || [u.role],
            provisional_password: u.provisional_password,
            pending_invite: u.pending_invite,
            name: dir ? (dir.first_name + ' ' + dir.family_name) : '',
            university: dir ? (dir.university || '') : '',
        };
    });

    // Filter
    var filtered = enriched.filter(function(u) {
        if (search) {
            var s = u.username.toLowerCase() + ' ' + u.name.toLowerCase();
            if (s.indexOf(search) === -1) return false;
        }
        if (roleFilter && u.roles.indexOf(roleFilter) === -1) return false;
        if (uniFilter && u.university !== uniFilter) return false;
        return true;
    });

    // Sort
    filtered.sort(function(a, b) {
        if (sortBy === 'name') {
            return (a.name || a.username).localeCompare(b.name || b.username);
        } else if (sortBy === 'email') {
            return a.username.localeCompare(b.username);
        } else {
            var c = (a.university || 'ZZZ').localeCompare(b.university || 'ZZZ');
            return c !== 0 ? c : (a.name || a.username).localeCompare(b.name || b.username);
        }
    });

    // Group by university if sorting by university
    var html = '';
    if (sortBy === 'university') {
        var groups = {};
        var order = [];
        filtered.forEach(function(u) {
            var uni = u.university || '(No university)';
            if (!groups[uni]) { groups[uni] = []; order.push(uni); }
            groups[uni].push(u);
        });
        order.forEach(function(uni) {
            html += '<div style="margin-top:10px;margin-bottom:4px;padding:4px 8px;background:#e9ecef;border-radius:4px;font-weight:600;font-size:0.82rem;color:#2D3876;">'
                + uni + ' <span style="font-weight:400;color:#666;">(' + groups[uni].length + ')</span></div>';
            html += umTableHtml(groups[uni]);
        });
    } else {
        html = umTableHtml(filtered);
    }

    html += '<p style="font-size:0.75rem;color:#888;margin-top:6px;">' + filtered.length + ' of ' + _umUsers.length + ' users</p>';
    container.innerHTML = html;
}

function umTableHtml(users) {
    var html = '<table style="width:100%;border-collapse:collapse;font-size:0.82rem;">'
        + '<tr style="border-bottom:2px solid #e2e8f0;"><th style="text-align:left;padding:6px;">Name</th><th style="text-align:left;padding:6px;">Email</th><th style="text-align:left;padding:6px;">Uni</th><th style="text-align:left;padding:6px;">Roles</th><th style="padding:6px;width:110px;">Actions</th></tr>';
    users.forEach(function(u) {
        var roleBadges = u.roles.map(function(r) {
            return '<span style="display:inline-block;background:#e8e0f0;color:#2D3876;padding:1px 6px;border-radius:8px;font-size:0.68rem;margin-right:2px;">' + r + '</span>';
        }).join('');
        var nameDisplay = u.name || '<span style="color:#aaa;">-</span>';
        var uniDisplay = u.university ? '<span style="font-size:0.72rem;">' + u.university + '</span>' : '<span style="color:#aaa;font-size:0.72rem;">-</span>';
        var statusBadge = '';
        if (u.pending_invite) statusBadge = ' <span style="color:#856404;font-size:0.65rem;background:#fff3cd;padding:1px 4px;border-radius:4px;">invited</span>';
        else if (u.provisional_password) statusBadge = ' <span style="color:#ea4335;font-size:0.65rem;">(prov.)</span>';
        var esc_user = u.username.replace(/'/g, "\\'");
        html += '<tr style="border-bottom:1px solid #f0f0f0;">'
            + '<td style="padding:4px 6px;">' + nameDisplay + statusBadge + '</td>'
            + '<td style="padding:4px 6px;font-size:0.78rem;color:#555;">' + u.username + '</td>'
            + '<td style="padding:4px 6px;">' + uniDisplay + '</td>'
            + '<td style="padding:4px 6px;">' + roleBadges + '</td>'
            + '<td style="padding:4px 6px;text-align:center;white-space:nowrap;">'
            + '<button onclick="umEditRoles(\'' + esc_user + '\')" style="background:none;border:1px solid #ccc;border-radius:3px;padding:2px 6px;cursor:pointer;font-size:0.7rem;margin-right:2px;">Roles</button>';
        if (u.pending_invite) {
            html += '<button onclick="umResendInvite(\'' + esc_user + '\')" style="background:none;border:1px solid #2D3876;color:#2D3876;border-radius:3px;padding:2px 6px;cursor:pointer;font-size:0.7rem;margin-right:2px;">Resend</button>';
        }
        html += '<button onclick="umDeleteUser(\'' + esc_user + '\')" style="background:none;border:1px solid #dc3545;color:#dc3545;border-radius:3px;padding:2px 6px;cursor:pointer;font-size:0.7rem;">Del</button>'
            + '</td></tr>';
    });
    html += '</table>';
    return html;
}

async function umCreateUser() {
    var username = document.getElementById('um-new-user').value.trim();
    var password = document.getElementById('um-new-pwd').value;
    var sel = document.getElementById('um-new-roles');
    var roles = [];
    for (var i = 0; i < sel.options.length; i++) {
        if (sel.options[i].selected) roles.push(sel.options[i].value);
    }
    if (!username || !password) { umMsg('Username and password required', false); return; }
    if (!roles.length) roles = ['student'];
    try {
        var res = await umFetch('/api/auth/users', {
            method: 'POST',
            body: JSON.stringify({ username: username, password: password, role: roles[0], roles: roles })
        });
        if (!res.ok) { var err = await res.json(); umMsg(err.detail || 'Error', false); return; }
        umMsg('User created', true);
        document.getElementById('um-new-user').value = '';
        document.getElementById('um-new-pwd').value = '';
        umLoadUsers();
    } catch (e) { umMsg('Request failed', false); }
}

async function umEditRoles(username) {
    var user = _umUsers.find(function(u) { return u.username === username; });
    if (!user) return;
    var currentRoles = user.roles || [user.role];
    var allRoles = ['student', 'admin_staff', 'teaching_staff', 'tester', 'superuser'];
    var checkboxes = allRoles.map(function(r) {
        var checked = currentRoles.indexOf(r) !== -1 ? ' checked' : '';
        return '<label style="display:block;font-size:0.85rem;margin:2px 0;"><input type="checkbox" value="' + r + '"' + checked + '> ' + r + '</label>';
    }).join('');

    var dialog = document.createElement('div');
    dialog.id = 'um-role-dialog';
    dialog.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.4);z-index:1100;display:flex;justify-content:center;align-items:center;';
    dialog.innerHTML = '<div style="background:#fff;border-radius:10px;padding:20px;width:300px;max-width:90vw;box-shadow:0 8px 32px rgba(0,0,0,0.2);position:relative;">'
        + '<button onclick="document.getElementById(\'um-role-dialog\').remove()" style="position:absolute;top:8px;right:10px;background:none;border:none;font-size:1.3rem;cursor:pointer;color:#888;">&times;</button>'
        + '<h3 style="margin:0 0 12px 0;font-size:0.95rem;color:#2D3876;">Roles for ' + username + '</h3>'
        + '<div id="um-role-checks">' + checkboxes + '</div>'
        + '<div style="display:flex;justify-content:flex-end;gap:8px;margin-top:14px;">'
        + '<button onclick="umSaveRoles(\'' + username.replace(/'/g, "\\'") + '\')" style="background:#2D3876;color:#fff;border:none;border-radius:4px;padding:5px 14px;cursor:pointer;font-size:0.85rem;">Save</button>'
        + '<button onclick="document.getElementById(\'um-role-dialog\').remove()" style="background:#2D3876;color:#fff;border:none;border-radius:4px;padding:5px 14px;cursor:pointer;font-size:0.85rem;">Close</button>'
        + '<button onclick="document.getElementById(\'um-role-dialog\').remove()" style="background:#e9ecef;border:1px solid #ccc;border-radius:4px;padding:5px 14px;cursor:pointer;font-size:0.85rem;">Cancel</button>'
        + '</div></div>';
    dialog.addEventListener('click', function(e) { if (e.target === dialog) dialog.remove(); });
    document.body.appendChild(dialog);
}

async function umSaveRoles(username) {
    var checks = document.querySelectorAll('#um-role-checks input:checked');
    var roles = [];
    checks.forEach(function(cb) { roles.push(cb.value); });
    if (!roles.length) { alert('Select at least one role'); return; }
    try {
        var res = await umFetch('/api/auth/users/' + encodeURIComponent(username) + '/role', {
            method: 'PUT',
            body: JSON.stringify({ role: roles[0], roles: roles })
        });
        if (!res.ok) { var err = await res.json(); umMsg(err.detail || 'Error', false); return; }
        var dialog = document.getElementById('um-role-dialog');
        if (dialog) dialog.remove();
        umMsg('Roles updated for ' + username, true);
        umLoadUsers();
    } catch (e) { umMsg('Request failed', false); }
}

async function umDeleteUser(username) {
    if (!confirm('Delete user ' + username + '?')) return;
    try {
        var res = await umFetch('/api/auth/users/' + encodeURIComponent(username), { method: 'DELETE' });
        if (!res.ok) { var err = await res.json(); umMsg(err.detail || 'Error', false); return; }
        umMsg('User deleted', true);
        umLoadUsers();
    } catch (e) { umMsg('Request failed', false); }
}

async function umCheckSmtp() {
    try {
        var res = await umFetch('/api/auth/smtp-status');
        var data = await res.json();
        var el = document.getElementById('um-smtp-status');
        if (el) {
            if (data.configured) {
                el.textContent = 'Email service is configured and ready.';
                el.style.color = '#34a853';
            } else {
                el.innerHTML = 'Email not configured. Add SMTP_HOST, SMTP_USER, SMTP_PASSWORD to web/.env';
                el.style.color = '#ea4335';
            }
        }
    } catch (e) {}
}

async function umInviteUser() {
    var email = document.getElementById('um-invite-email').value.trim();
    var role = document.getElementById('um-invite-role').value;
    if (!email) { umMsg('Enter an email address', false); return; }
    try {
        var res = await umFetch('/api/auth/invite', {
            method: 'POST',
            body: JSON.stringify({ username: email, role: role })
        });
        var data = await res.json();
        if (!res.ok) { umMsg(data.detail || 'Error', false); return; }
        if (data.email_sent) {
            umMsg('Invitation sent to ' + email, true);
        } else {
            umMsg('User created but email could not be sent. ' + (data.warning || ''), false);
        }
        document.getElementById('um-invite-email').value = '';
        umLoadUsers();
    } catch (e) { umMsg('Request failed', false); }
}

async function umResendInvite(username) {
    try {
        var res = await umFetch('/api/auth/invite/resend/' + encodeURIComponent(username), { method: 'POST' });

async function amUpdateVisibility(agentId) {
    var selEl = document.getElementById('am-level-' + agentId.replace(/[^a-zA-Z0-9_-]/g, '_'));
    var usersEl = document.getElementById('am-users-' + agentId.replace(/[^a-zA-Z0-9_-]/g, '_'));
    var level = selEl ? selEl.value : 'restricted';
    var allowedUsers = usersEl ? usersEl.value.split(',').map(function(s) { return s.trim(); }).filter(Boolean) : [];

    try {
        var res = await umFetch('/api/agents/' + encodeURIComponent(agentId) + '/visibility', {
            method: 'PUT',
            body: JSON.stringify({ level: level, allowed_users: allowedUsers })
        });
        if (!res.ok) { var err = await res.json(); amMsg(err.detail || 'Error', false); return; }
        var levelColors = { hidden: '#dc2626', restricted: '#d97706', open: '#16a34a' };
        if (selEl) selEl.style.color = levelColors[level] || '#64748b';
        var note = allowedUsers.length ? ' (restricted to ' + allowedUsers.length + ' user' + (allowedUsers.length > 1 ? 's' : '') + ')' : '';
        amMsg('Updated ' + agentId + ': ' + level + note, true);
    } catch (e) { amMsg('Request failed', false); }
}

async function amResetLogs(agentId) {
    if (!confirm('Archive and reset logs for ' + agentId + '?')) return;
    try {
        var res = await umFetch('/api/agents/' + encodeURIComponent(agentId) + '/reset-logs', { method: 'POST' });
        if (!res.ok) { var err = await res.json(); amMsg(err.detail || 'Error', false); return; }
        amMsg('Logs reset for ' + agentId, true);
    } catch (e) { amMsg('Request failed', false); }
}

function tvRender() {
    var container = document.getElementById('tv-grid');
    if (!container) return;

    var roleLabels = {
        public: 'Public', student: 'Student', admin_staff: 'Admin staff',
        teaching_staff: 'Teaching staff', tester: 'Tester', superuser: 'Superuser'
    };

    var html = '<table style="width:100%;border-collapse:collapse;">'
        + '<tr style="border-bottom:2px solid #e2e8f0;"><th style="text-align:left;padding:6px 8px;">Tool</th>';
    ALL_ROLES.forEach(function(r) {
        var extra = r === 'superuser' ? ' <span style="font-size:0.65rem;color:#888;">(always)</span>'
                 : r === 'public' ? ' <span style="font-size:0.65rem;color:#888;">(no login)</span>' : '';
        html += '<th style="text-align:center;padding:6px 4px;font-size:0.78rem;">' + roleLabels[r] + extra + '</th>';
    });
    html += '</tr>';

    // Sort tools by label
    var toolIds = Object.keys(_tvData).sort(function(a, b) {
        return (TOOL_LABELS[a] || a).localeCompare(TOOL_LABELS[b] || b);
    });

    toolIds.forEach(function(toolId) {
        var roles = _tvData[toolId] || [];
        var label = TOOL_LABELS[toolId] || toolId;
        html += '<tr style="border-bottom:1px solid #f0f0f0;">';
        html += '<td style="padding:6px 8px;font-weight:500;">' + label + ' <span style="color:#94a3b8;font-size:0.7rem;">' + toolId + '</span></td>';
        ALL_ROLES.forEach(function(r) {
            var checked = roles.indexOf(r) !== -1 ? ' checked' : '';
            var disabled = r === 'superuser' ? ' checked disabled' : '';
            html += '<td style="text-align:center;padding:6px 4px;">'
                + '<input type="checkbox" data-tool="' + toolId + '" data-role="' + r + '"' + checked + disabled + ' style="cursor:pointer;">'
                + '</td>';
        });
        html += '</tr>';
    });

    html += '</table>';
    container.innerHTML = html;
}

async function tvSave() {
    // Collect checkbox states
    var newAccess = {};
    var checkboxes = document.querySelectorAll('#tv-grid input[type="checkbox"]');
    checkboxes.forEach(function(cb) {
        var tool = cb.getAttribute('data-tool');
        var role = cb.getAttribute('data-role');
        if (!tool || !role) return;
        if (!newAccess[tool]) newAccess[tool] = [];
        if (cb.checked) newAccess[tool].push(role);
    });
    // Ensure superuser is always included
    for (var tool in newAccess) {
        if (newAccess[tool].indexOf('superuser') === -1) {
            newAccess[tool].push('superuser');
        }
    }

    try {
        var res = await umFetch('/api/tool-access', {
            method: 'PUT',
            body: JSON.stringify({ tool_access: newAccess })
        });
        if (!res.ok) { var err = await res.json(); tvMsg(err.detail || 'Error saving', false); return; }
        // Update local TOOL_ACCESS
        for (var key in newAccess) { TOOL_ACCESS[key] = newAccess[key]; }
        tvMsg('Saved. Changes take effect on next page load.', true);
    } catch (e) { tvMsg('Request failed', false); }
}

function laRenderSummary(data, container) {
    var t = data.totals;
    var periodLabel = data.period === 'hour' ? 'Last hour' : data.period === 'day' ? 'Last 24 hours' : data.period === '3days' ? 'Last 3 days' : data.period === 'week' ? 'Last 7 days' : data.start.split('T')[0] + ' to ' + data.end.split('T')[0];

    var html = '<div style="display:flex;gap:16px;flex-wrap:wrap;margin-bottom:12px;">'
        + '<div style="background:#fff;padding:10px 16px;border-radius:8px;border:1px solid #e2e8f0;text-align:center;min-width:100px;">'
        + '<div style="font-size:1.4rem;font-weight:700;color:#2D3876;">' + t.requests + '</div>'
        + '<div style="font-size:0.72rem;color:#888;">Requests</div></div>'
        + '<div style="background:#fff;padding:10px 16px;border-radius:8px;border:1px solid #e2e8f0;text-align:center;min-width:100px;">'
        + '<div style="font-size:1.4rem;font-weight:700;color:#2D3876;">' + t.sessions + '</div>'
        + '<div style="font-size:0.72rem;color:#888;">Sessions</div></div>'
        + '<div style="background:#fff;padding:10px 16px;border-radius:8px;border:1px solid #e2e8f0;text-align:center;min-width:100px;">'
        + '<div style="font-size:1.4rem;font-weight:700;color:#2D3876;">' + t.unique_users + '</div>'
        + '<div style="font-size:0.72rem;color:#888;">Unique Users</div></div>'
        + '</div>';

    html += '<div style="font-size:0.75rem;color:#888;margin-bottom:6px;">' + periodLabel + '</div>';

    // Only show Research Explorer agents
    var EXPLORER_AGENTS = {
        'responsible_ai3': 'EH: Responsible AI',
        'health_wellbeing_sistems': 'EH: Health & Wellbeing Systems',
        'nlp_eh': 'EH: AI & Language',
        'robotics_ai': 'EH: AI & Robotics',
        'proyectoseuopeos': 'European Projects'
    };
    var agents = Object.keys(data.per_agent).filter(function(a) { return EXPLORER_AGENTS[a]; });
    if (agents.length > 0) {
        agents.sort(function(a, b) { return data.per_agent[b].requests - data.per_agent[a].requests; });
        html += '<table style="width:100%;border-collapse:collapse;font-size:0.82rem;">'
            + '<tr style="border-bottom:2px solid #e2e8f0;"><th style="text-align:left;padding:4px 6px;">Agent</th>'
            + '<th style="text-align:right;padding:4px 6px;">Requests</th>'
            + '<th style="text-align:right;padding:4px 6px;">Sessions</th>'
            + '<th style="text-align:right;padding:4px 6px;">Users</th></tr>';
        agents.forEach(function(aid) {
            var a = data.per_agent[aid];
            html += '<tr style="border-bottom:1px solid #f0f0f0;">'
                + '<td style="padding:4px 6px;">' + (EXPLORER_AGENTS[aid] || aid) + '</td>'
                + '<td style="text-align:right;padding:4px 6px;">' + a.requests + '</td>'
                + '<td style="text-align:right;padding:4px 6px;">' + a.sessions + '</td>'
                + '<td style="text-align:right;padding:4px 6px;">' + a.unique_users + '</td></tr>';
        });
        html += '</table>';
    } else {
        html += '<p style="color:#888;">No activity in this period.</p>';
    }

    container.innerHTML = html;
}

function laFormatSize(bytes) {
    if (bytes < 1024) return bytes + ' B';
    if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
    return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
}

async function laLoadFiles() {
    var container = document.getElementById('la-files');
    if (!container) return;
    try {
        var res = await umFetch('/api/logs/files');
        var files = await res.json();
        if (!files.length) { container.innerHTML = '<p style="color:#888;">No log files.</p>'; return; }

        var html = '<table style="width:100%;border-collapse:collapse;font-size:0.82rem;">'
            + '<tr style="border-bottom:2px solid #e2e8f0;">'
            + '<th style="text-align:left;padding:4px 6px;">File</th>'
            + '<th style="text-align:right;padding:4px 6px;">Size</th>'
            + '<th style="text-align:left;padding:4px 6px;">Modified</th>'
            + '<th style="text-align:center;padding:4px 6px;">Actions</th></tr>';

        files.forEach(function(f) {
            var esc = f.name.replace(/'/g, "\\'");
            var mod = f.modified.split('T')[0] + ' ' + f.modified.split('T')[1].substring(0, 5);
            html += '<tr style="border-bottom:1px solid #f0f0f0;">'
                + '<td style="padding:4px 6px;word-break:break-all;">' + f.name + '</td>'
                + '<td style="text-align:right;padding:4px 6px;white-space:nowrap;">' + laFormatSize(f.size) + '</td>'
                + '<td style="padding:4px 6px;white-space:nowrap;color:#666;">' + mod + '</td>'
                + '<td style="text-align:center;padding:4px 6px;">'
                + '<button onclick="laViewFile(\'' + esc + '\')" style="background:none;border:1px solid #2D3876;color:#2D3876;border-radius:3px;padding:2px 6px;cursor:pointer;font-size:0.7rem;margin-right:3px;">View</button>'
                + '<button onclick="laDeleteFile(\'' + esc + '\')" style="background:none;border:1px solid #ccc;border-radius:3px;padding:2px 6px;cursor:pointer;font-size:0.7rem;">Reset</button>'
                + '</td></tr>';
        });

        html += '</table>'
            + '<p style="font-size:0.72rem;color:#888;margin-top:6px;">' + files.length + ' file(s)</p>';
        container.innerHTML = html;
    } catch (e) { container.innerHTML = '<span style="color:#dc3545;">Error loading files</span>'; }
}

async function laViewFile(filename) {
    var existing = document.getElementById('la-viewer');
    if (existing) existing.remove();

    var viewer = document.createElement('div');
    viewer.id = 'la-viewer';
    viewer.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.6);z-index:1100;display:flex;justify-content:center;align-items:center;';

    var panel = document.createElement('div');
    panel.style.cssText = 'background:#fff;border-radius:12px;padding:24px;width:850px;max-width:95vw;max-height:90vh;overflow-y:auto;box-shadow:0 8px 32px rgba(0,0,0,0.25);';
    panel.innerHTML = '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">'
        + '<h3 style="margin:0;font-size:1rem;color:#2D3876;word-break:break-all;">' + filename + '</h3>'
        + '<button onclick="document.getElementById(\'la-viewer\').remove()" style="background:none;border:none;font-size:1.5rem;cursor:pointer;color:#888;">&times;</button>'
        + '</div>'
        + '<div id="la-viewer-content" style="font-size:0.85rem;">Loading...</div>';

    viewer.appendChild(panel);
    viewer.addEventListener('click', function(e) { if (e.target === viewer) viewer.remove(); });
    document.body.appendChild(viewer);

    try {
        var res = await umFetch('/api/logs/content?filename=' + encodeURIComponent(filename));
        if (!res.ok) { document.getElementById('la-viewer-content').innerHTML = '<span style="color:#dc3545;">Error loading file</span>'; return; }
        var data = await res.json();
        var container = document.getElementById('la-viewer-content');

        if (data.format === 'text') {
            container.innerHTML = '<pre style="white-space:pre-wrap;word-break:break-word;background:#f8fafc;padding:12px;border-radius:6px;border:1px solid #e2e8f0;max-height:65vh;overflow-y:auto;font-size:0.8rem;">'
                + laEscape(data.text) + '</pre>';
            return;
        }

        if (!data.entries || !data.entries.length) {
            container.innerHTML = '<p style="color:#888;">File is empty.</p>';
            return;
        }

        var html = '<p style="font-size:0.75rem;color:#888;margin-bottom:8px;">' + data.count + ' entries</p>';
        data.entries.forEach(function(entry, idx) {
            if (entry._raw) {
                html += '<div style="background:#f8fafc;border:1px solid #e2e8f0;border-radius:6px;padding:10px;margin-bottom:8px;">'
                    + '<pre style="white-space:pre-wrap;word-break:break-word;font-size:0.78rem;margin:0;">' + laEscape(entry._raw) + '</pre></div>';
                return;
            }
            var ts = (entry.timestamp || '').replace('T', ' ').substring(0, 19);
            var agent = entry.agent_name || entry.agent_id || '-';
            var user = entry.user_id ? entry.user_id.substring(0, 8) + '...' : '-';
            var domain = entry.email_domain || '';
            var session = entry.session_id ? entry.session_id.substring(0, 8) + '...' : '-';
            var question = entry.question || '';
            var response = entry.response || '';

            html += '<div style="background:#f8fafc;border:1px solid #e2e8f0;border-radius:6px;padding:10px;margin-bottom:8px;">'
                + '<div style="display:flex;flex-wrap:wrap;gap:10px;font-size:0.72rem;color:#666;margin-bottom:6px;">'
                + '<span><b>Time:</b> ' + ts + '</span>'
                + '<span><b>Agent:</b> ' + laEscape(agent) + '</span>'
                + '<span><b>User:</b> ' + user + (domain ? ' (' + domain + ')' : '') + '</span>'
                + '<span><b>Session:</b> ' + session + '</span>'
                + (entry.transparency_level ? '<span><b>Transparency:</b> ' + entry.transparency_level + '</span>' : '')
                + (entry.client_ip ? '<span><b>IP:</b> ' + entry.client_ip + '</span>' : '')
                + '</div>'
                + '<div style="margin-bottom:4px;"><span style="font-size:0.72rem;font-weight:600;color:#2D3876;">Q:</span> '
                + '<span style="font-size:0.82rem;">' + laEscape(question) + '</span></div>'
                + '<div><span style="font-size:0.72rem;font-weight:600;color:#555;">A:</span> '
                + '<span style="font-size:0.78rem;color:#444;">' + laEscape(response).substring(0, 300) + (response.length > 300 ? '...' : '') + '</span></div>'
                + '</div>';
        });

        container.innerHTML = html;
    } catch (e) {
        document.getElementById('la-viewer-content').innerHTML = '<span style="color:#dc3545;">Error loading file</span>';
    }
}

function laEscape(str) {
    var div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
}

async function laDeleteFile(filename) {
    if (!confirm('Delete log file "' + filename + '"? This cannot be undone.')) return;
    try {
        var res = await umFetch('/api/logs/' + encodeURIComponent(filename), { method: 'DELETE' });
        if (!res.ok) { var err = await res.json(); laMsg(err.detail || 'Error', false); return; }
        laMsg('Deleted ' + filename, true);
        laLoadFiles();
    } catch (e) { laMsg('Request failed', false); }
}
