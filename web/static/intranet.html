        .topbar button:hover { background: rgba(255,255,255,0.25); }

        /* Main content */
        .main { max-width: 1000px; margin: 0 auto; padding: 20px; }
        .welcome { margin-bottom: 20px; }
        .welcome h2 { color: #2D3876; font-size: 1.2em; margin-bottom: 4px; }

        /* Tabs */
        .wp-tabs { display: flex; gap: 0; border-bottom: 2px solid #e2e8f0; margin-bottom: 16px; overflow-x: auto; }

            padding: 8px 16px; font-size: 0.82em; font-weight: 600; color: #666;

        .tool-card {
            background: #fff; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.07);

// ── Tool registry (auto-derived) ──────────────────────────────────
// The Tool Visibility admin panel must show exactly the tools that are
// currently live — every WP tab and the UMA site — and nothing else. Rather
// than keep a second hand-maintained list in sync with SECTIONS (which is
// how stale entries for retired tools crept in before), the registry is
// built from SECTIONS itself: add a tool's card to a SECTIONS entry above
// and it appears in the panel automatically; remove/retire the card and it
// automatically disappears from the panel, no separate edit required.
var TOOL_REGISTRY = {};
SECTIONS.forEach(function(section) {
    section.tools.forEach(function(tool) {
        TOOL_REGISTRY[tool.id] = {
            name: tool.name,
            sectionTitle: section.title,
            emailDomain: section.emailDomain || null,
        };
    });
});

function toolLabel(toolId) {
    return (TOOL_REGISTRY[toolId] && TOOL_REGISTRY[toolId].name) || toolId;
}

function esc(s) {
    return s ? String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;') : '';
}

function canAccess(toolId, roles) {
    // Secure by default: a tool with no TOOL_ACCESS entry yet (e.g. a newly
    // added app nobody has configured in the Tool Visibility panel) is
    // visible only to superuser, not to everyone, until an admin opens it up.
    if (!TOOL_ACCESS[toolId]) return roles.indexOf('superuser') !== -1;
    if (TOOL_ACCESS[toolId].indexOf('public') !== -1) return true;
    for (var i = 0; i < roles.length; i++) {
        if (TOOL_ACCESS[toolId].indexOf(roles[i]) !== -1) return true;
    }
    return false;
}

function sectionVisible(section, roles) {
    // Sections gated by email domain (e.g. UMA-only tools) ignore role-based
    // visibility entirely — only an exact domain match on the user's login
    // email shows them, regardless of role or tool access.
    if (section.emailDomain) {
        var email = (authUser && authUser.username || '').toLowerCase();
        return email.endsWith('@' + section.emailDomain);
    }
    // A section is visible if the user can access at least one tool inside
    // it. This is derived entirely from TOOL_ACCESS (the same check used to
    // render each tool card) so a role granted a tool always sees the
    // section/tab that contains it — there is no separate list to update.
    return section.tools.some(function(tool) { return canAccess(tool.id, roles); });
}

// ── Auth ─────────────────────────────────────────────────────────
var authToken = localStorage.getItem('tommi_token') || localStorage.getItem('uninovis_token') || '';
var authUser = null;

async function checkAuth() {
    if (!authToken) { showLogin(); return; }
    try {
        var resp = await fetch('/api/auth/me', { headers: { 'Authorization': 'Bearer ' + authToken } });
        if (resp.ok) {
            authUser = await resp.json();
            // Guest/public sessions mean no real authentication — show login
            if (!authUser || authUser.role === 'public' || authUser.username === 'guest') {
                authToken = '';
                authUser = null;
                localStorage.removeItem('tommi_token');
                localStorage.removeItem('uninovis_token');
                showLogin();
                return;
            }
            if (authUser.provisional_password) {
                tommiOpenChangePasswordModal({ forced: true, onSuccess: function() { window.location.reload(); } });
                return;
            }
            var params = new URLSearchParams(window.location.search);
            var redirect = params.get('redirect');
            if (redirect) { window.location.href = redirect; return; }
            showMain();
        } else {
            authToken = '';
            showLogin();
        }
    } catch (e) { showLogin(); }
}

// ── Notification bubbles (superuser only) ──────────────────────────
// Pending access requests are shown on the "User Management" card, new
// user feedback on the "User Feedback" card, and their sum on the
// "Sys Admin" tab.
async function updatePendingRequestsBadge() {
    var count = 0;
    try {
        var res = await fetch('/api/auth/access-requests?status=pending', {
            headers: { 'Authorization': 'Bearer ' + authToken }
        });
        if (res.ok) {
            var requests = await res.json();
            count = requests.length;
        }
    } catch (e) { /* leave count at 0 */ }

    var feedbackCount = 0;
    try {
        var fres = await fetch('/feedback/api/count', {
            headers: { 'Authorization': 'Bearer ' + authToken }
        });
        if (fres.ok) feedbackCount = (await fres.json()).new || 0;
    } catch (e) { /* leave count at 0 */ }

    function setBadge(el, n, where) {
        if (!el) return;
        var existing = el.querySelector('.notif-badge');
        if (existing) existing.remove();
        if (n > 0) el.insertAdjacentHTML(where, '<span class="notif-badge">' + n + '</span>');
    }

    setBadge(document.querySelector('.wp-tab[data-tab="superuser"]'), count + feedbackCount, 'beforeend');
    setBadge(document.getElementById('tool-card-user_management'), count, 'afterbegin');
    setBadge(document.getElementById('tool-card-feedback'), feedbackCount, 'afterbegin');
}

function showLogin() {
    window.location.href = '/login?redirect=/';
}

async function showMain() {
    document.getElementById('mainContent').style.display = '';
    document.getElementById('topUserInfo').style.display = '';

    var roles = (authUser.roles && Array.isArray(authUser.roles)) ? authUser.roles : [authUser.role];

    tommiAttachUserMenu(document.getElementById('topUsername'), authUser.name || authUser.username);
    var roleBadges = roles.map(function(r) { return '<span class="roles-badge">' + r.replace('_', ' ') + '</span>'; }).join(' ');
    document.getElementById('welcomeMsg').innerHTML = 'Welcome to UNINOVIS Intranet site.<br><span style="font-size:0.75em;font-weight:400;color:#666;">From here you have access to services only accessible to UNINOVIS members.</span>';

    // Load server-side tool access overrides before rendering
    await loadToolAccess();

    // "Edit my profile" mirrors directory tool access — derived from
    // TOOL_ACCESS['directory'] so it never drifts out of sync with it.
    var canEditProfile = canAccess('directory', roles);
    if (!canEditProfile) {
        document.getElementById('editProfileLink').style.display = 'none';
    }

    renderSections(roles);

    if (roles.indexOf('superuser') !== -1) {
        updatePendingRequestsBadge();
    }

    renderGuidesMenu(document.getElementById('topGuidesSlot'), roles, authUser.username);
    var hasGuideLink = new URLSearchParams(window.location.search).has('guide');
    maybeAutoPlayGuideFromUrl(roles, authUser.username);
    if (!hasGuideLink && roles.indexOf('uninovis_staff') !== -1 && !authUser.seen_onboarding_tour) {
        playTourSteps(GUIDES.filter(function(g) { return g.id === 'portal_welcome'; })[0].steps, onboardingTourFinished);
    }
}

// ── Guides ───────────────────────────────────────────────────────────
// Registers this page's guides into the shared registry (window.GUIDES,
// defined in nav.js) — the portal's own welcome tour, plus one auto-generated
// "About" guide per tool, sourced directly from SECTIONS/TOOL_ACCESS so their
// visibility always matches who can actually access that tool.
// Wrapped in try/catch throughout: a guide-registration problem (e.g. a
// stale cached nav.js missing GUIDE_CONTENT) must never prevent checkAuth()
// at the bottom of this script from running — that would blank the whole
// portal for everyone, not just break guides.
try {
GUIDES.push({
    id: 'portal_welcome',
    title: 'Welcome to the UNINOVIS intranet',
    group: 'Getting started',
    roles: null,
    url: '/',
    primary: true,
    steps: [
        { text: 'Hello, welcome to the UNINOVIS intranet — here you can browse the different WP apps.' },
        { selector: '.wp-tabs', text: 'Select a tab to browse.' },
        { selector: '.wp-panel.active .server-badge', text: 'Check this label to know whether the app is part of the Gloria server or the Agora server.' },

// highlight the card -> navigate into the app -> continue with its real
// usage steps. Everything else (Agora-hosted external tools, and Gloria
// tools without deep content yet) keeps the simple single-step "About".
var LEARN_GUIDES = {

    mobility_planner: [{ id: 'learn_mobility_planner', title: 'Learn: Mobility Planner', content: 'mobility_planner' }],

    uninovis_uma_dashboard: [{ id: 'learn_uninovis_uma_dashboard', title: 'Learn: UNINOVIS-UMA Dashboard', roles: ['uninovis_staff', 'superuser'], emailDomain: 'uma.es', content: 'uninovis_uma_dashboard' }],

    ],

SECTIONS.forEach(function(section) {
    section.tools.forEach(function(tool) {
        // Each tool's guide registration is isolated: a problem with one
        // tool's entry (e.g. a bad GUIDE_CONTENT key) must not wipe out every
        // other tool's guide, and above all must never reach outside this
        // loop and block checkAuth() later in the script.
        try {
            var accessRoles = TOOL_ACCESS[tool.id];
            if (accessRoles && !accessRoles.length) return; // hidden for everyone (an explicitly empty TOOL_ACCESS entry)
            // No entry yet means superuser-only, matching canAccess() — the
            // guide must not be offered to roles that can't see the tool.
            var defaultRoles = (accessRoles && accessRoles.length) ? accessRoles : ['superuser'];

            if (LEARN_GUIDES[tool.id]) {
                LEARN_GUIDES[tool.id].forEach(function(lg) {
                    GUIDES.push({
                        id: lg.id,
                        title: lg.title,
                        group: section.title,
                        roles: lg.roles || defaultRoles,
                        emailDomain: lg.emailDomain,
                        url: '/',
                        tab: section.id, // the tool card only exists in the DOM while this WP tab is active
                        steps: [
                            { selector: '#tool-card-' + tool.id, text: tool.desc },
                            { navigate: tool.url },
                        ].concat(GUIDE_CONTENT[lg.content]),
                    });
                });
            } else {
                GUIDES.push({
                    id: 'about_' + tool.id,
                    title: 'About: ' + tool.name,
                    group: section.title,
                    roles: defaultRoles,
                    url: '/',
                    tab: section.id,
                    steps: [ { selector: '#tool-card-' + tool.id, text: tool.desc } ],
                });
            }
        } catch (e) { console.error('Guide registration failed for ' + tool.id + ':', e); }
    });
});

// ── Render card HTML for a tool ──────────────────────────────────
function renderToolCard(tool) {
    var tagClass = tool.status === 'active' ? 'tag-active' : tool.status === 'pilot' ? 'tag-pilot' : tool.status === 'data-update' ? 'tag-data-update' : tool.status === 'construction' ? 'tag-construction' : tool.status === 'prototype' ? 'tag-prototype' : 'tag-soon';
    var tagText = tool.status === 'active' ? 'Active' : tool.status === 'pilot' ? 'Pilot' : tool.status === 'data-update' ? 'Data update required' : tool.status === 'construction' ? 'In construction' : tool.status === 'prototype' ? 'Untested Prototype' : 'Pending';
    var href = (tool.status === 'active' || tool.status === 'pilot' || tool.status === 'data-update' || tool.status === 'construction' || tool.status === 'prototype') ? tool.url : '#';
    var clickAttr = '';
    if (tool.status === 'soon') {
        clickAttr = ' onclick="event.preventDefault();" style="opacity:0.6;cursor:default;"';
    } else if (tool.action) {
        clickAttr = ' onclick="event.preventDefault();' + tool.action + '()"';
        href = '#';
    }
    var targetAttr = tool.external ? ' target="_blank" rel="noopener"' : '';
    var isAgora = tool.url && tool.url.indexOf('uninovis.widening.eu') !== -1;
    var serverBadge = isAgora ? '<span class="server-badge server-agora">Agora</span>' : '<span class="server-badge server-gloria">Gloria</span>';
    return '<a class="tool-card" id="tool-card-' + tool.id + '" href="' + href + '"' + clickAttr + targetAttr + '>'
        + serverBadge
        + '<div class="tool-icon">' + tool.icon + '</div>'
        + '<h3>' + tool.name + '</h3>'
        + '<p>' + tool.desc + '</p>'
        + '<span class="tool-tag ' + tagClass + '">' + tagText + '</span>'
        + '</a>';
}

// Map each WP section to a user-friendly label
var FLAT_LABELS = {
    'learning': 'Learning & Mobility',
    'research': 'Research & Innovation',
    'events': 'Events & Communication',
    'admin': 'Administration',
    'platform': 'Digital Platform',
};

function renderFlatView(roles) {
    var html = '';
    // Use the same SECTIONS but with friendly labels, skip superuser
    SECTIONS.forEach(function(section) {
        if (section.id === 'superuser') return;
        if (!sectionVisible(section, roles)) return;
        var label = FLAT_LABELS[section.id] || section.title;
        var toolsHtml = '';
        section.tools.forEach(function(tool) {
            if (!canAccess(tool.id, roles)) return;
            toolsHtml += renderToolCard(tool);
        });
        if (!toolsHtml) return;
        html += '<div class="section">'
            + '<div class="section-title">' + label + '</div>'
            + '<div class="tools-grid">' + toolsHtml + '</div>'
            + '</div>';
    });

    if (!html) {
        html = '<p style="color:#888;text-align:center;">No tools available for your role. Contact an administrator.</p>';
    }
    document.getElementById('toolSections').innerHTML = html;
}

// ── Tabbed view for admin staff, testers, superusers ─────────────
function renderTabbedView(roles) {
    var visibleSections = SECTIONS.filter(function(s) { return sectionVisible(s, roles); });
    visibleSections.sort(function(a, b) {
        var aIsWP = a.title.match(/^WP(\d)/);
        var bIsWP = b.title.match(/^WP(\d)/);
        if (aIsWP && bIsWP) return parseInt(aIsWP[1]) - parseInt(bIsWP[1]);
        if (aIsWP) return -1;
        if (bIsWP) return 1;
        return a.title.localeCompare(b.title);
    });

    var statusOrder = ['active', 'pilot', 'data-update', 'construction', 'prototype', 'soon'];

    // A deep link (e.g. from another app's breadcrumb) can request a specific
    // tab via the URL hash, e.g. "#uma_holidays".
    var wantedTab = (window.location.hash || '').replace('#', '');
    var rendered = [];

    visibleSections.forEach(function(section) {
        // Tools may be organised into named sub-groups within a tab (e.g.
        // "Apps in development" under System Administration) — ungrouped
        // tools (no "group" field) render first with no heading, exactly as
        // before; each named group gets its own subheading beneath them.
        var groupOrder = [];
        var toolsByGroup = {};
        section.tools.forEach(function(tool) {
            if (!canAccess(tool.id, roles)) return;
            var g = tool.group || '';
            if (!toolsByGroup[g]) { toolsByGroup[g] = []; groupOrder.push(g); }
            toolsByGroup[g].push(tool);
        });

        // Build panel with rows sorted by status within each group
        var panelContent = '';
        groupOrder.forEach(function(g) {
            if (g) panelContent += '<div class="section-title">' + esc(g) + '</div>';
            var toolsByStatus = {};
            toolsByGroup[g].forEach(function(tool) {
                if (!toolsByStatus[tool.status]) toolsByStatus[tool.status] = [];
                toolsByStatus[tool.status].push(tool);
            });
            statusOrder.forEach(function(status) {
                if (!toolsByStatus[status]) return;
                panelContent += '<div class="tools-grid">';
                toolsByStatus[status].forEach(function(tool) {
                    panelContent += renderToolCard(tool);
                });
                panelContent += '</div>';
            });
        });

        if (!panelContent) return;
        var tabLabel = section.title.match(/^(WP\d)/) ? section.title.match(/^(WP\d)/)[1] : (section.id === 'superuser' ? 'Sys Admin' : section.title);
        rendered.push({ id: section.id, title: section.title, tabLabel: tabLabel, panelContent: panelContent });
    });

    var hasContent = rendered.length > 0;
    var activeIdx = 0;
    if (wantedTab) {
        var foundIdx = rendered.map(function(r) { return r.id; }).indexOf(wantedTab);
        if (foundIdx !== -1) activeIdx = foundIdx;
    }

    var tabsHtml = '<div class="wp-tabs">';
    var panelsHtml = '';
    rendered.forEach(function(r, idx) {
        var isActive = idx === activeIdx;
        tabsHtml += '<div class="wp-tab' + (isActive ? ' active' : '') + '" data-tab="' + r.id + '" onclick="switchTab(\'' + r.id + '\')" title="' + r.title + '">' + r.tabLabel + '</div>';
        panelsHtml += '<div class="wp-panel' + (isActive ? ' active' : '') + '" id="panel-' + r.id + '">'
            + r.panelContent
            + '</div>';
    });
    tabsHtml += '</div>';

    if (!hasContent) {
        document.getElementById('toolSections').innerHTML = '<p style="color:#888;text-align:center;">No tools available for your role. Contact an administrator.</p>';
    } else {
        document.getElementById('toolSections').innerHTML = tabsHtml + panelsHtml;
    }
}

// ── Main render function ─────────────────────────────────────────
function renderSections(roles) {
    var isAdmin = roles.indexOf('admin_staff') !== -1 || roles.indexOf('uninovis_staff') !== -1 || roles.indexOf('tester') !== -1 || roles.indexOf('content_manager') !== -1 || roles.indexOf('superuser') !== -1;
    if (isAdmin) {
        renderTabbedView(roles);
    } else {
        renderFlatView(roles);
    }
}

function switchTab(tabId) {
    document.querySelectorAll('.wp-tab').forEach(function(t) { t.classList.remove('active'); });
    document.querySelectorAll('.wp-panel').forEach(function(p) { p.classList.remove('active'); });
    var tab = document.querySelector('.wp-tab[data-tab="' + tabId + '"]');
    var panel = document.getElementById('panel-' + tabId);
    if (tab) tab.classList.add('active');
    if (panel) panel.classList.add('active');
}

    var sortedSections = SECTIONS.slice().sort(function(a, b) {

    var summaryHtml = '<div style="display:flex;gap:12px;flex-wrap:wrap;margin-bottom:14px;">';

async function loadToolAccess() {
    try {
        var res = await fetch('/api/tool-access', { headers: { 'Authorization': 'Bearer ' + authToken } });
        if (res.ok) {
            var data = await res.json();
            if (data.tool_access) {
                // Merge server overrides into client TOOL_ACCESS
                for (var key in data.tool_access) {
                    TOOL_ACCESS[key] = data.tool_access[key];
                }
            }
        }
    } catch (e) { /* Keep defaults if endpoint unavailable */ }
}

async function umBulkInvite(file) {
    var label = document.getElementById('um-invite-drop-label');
    var resultDiv = document.getElementById('um-invite-result');
    var fileInput = document.getElementById('um-invite-file-input');

    label.textContent = 'Uploading ' + file.name + '...';
    resultDiv.style.display = 'none';

    var formData = new FormData();
    formData.append('file', file);

    try {
        var res = await fetch('/api/auth/invite/bulk', {
            method: 'POST',
            headers: { 'Authorization': 'Bearer ' + authToken },
            body: formData
        });
        var data = await res.json();

        if (!res.ok) {
            resultDiv.style.display = '';
            resultDiv.style.color = '#dc2626';
            resultDiv.innerHTML = '<b>Error:</b> ' + (data.detail || 'Upload failed');
            label.textContent = 'Drop file here or click to select';
            return;
        }

        var html = '';
        if (data.total_invited > 0) html += '<span style="color:#16a34a;"><b>' + data.total_invited + '</b> invited</span>';
        if (data.total_no_email > 0) html += (html ? ' &middot; ' : '') + '<span style="color:#d97706;"><b>' + data.total_no_email + '</b> created, email not sent</span>';
        if (data.total_skipped > 0) html += (html ? ' &middot; ' : '') + '<span style="color:#d97706;"><b>' + data.total_skipped + '</b> skipped</span>';
        if (data.total_errors > 0) html += (html ? ' &middot; ' : '') + '<span style="color:#dc2626;"><b>' + data.total_errors + '</b> errors</span>';
        if (!data.smtp_configured) html += '<div style="margin-top:6px;color:#d97706;">SMTP is not configured — users were created but no emails were sent.</div>';
        if (data.skipped && data.skipped.length > 0) html += '<div style="margin-top:6px;color:#d97706;"><b>Skipped:</b> ' + data.skipped.join(', ') + '</div>';
        if (data.errors && data.errors.length > 0) {
            html += '<div style="margin-top:6px;color:#dc2626;"><b>Errors:</b><ul style="margin:4px 0 0 16px;padding:0;">';
            data.errors.forEach(function(e) { html += '<li>' + e + '</li>'; });
            html += '</ul></div>';
        }

        resultDiv.style.display = '';
        resultDiv.style.color = '';
        resultDiv.innerHTML = html;
        label.textContent = 'Drop file here or click to select';
        fileInput.value = '';
        umLoadUsers();
    } catch (e) {
        resultDiv.style.display = '';
        resultDiv.style.color = '#dc2626';
        resultDiv.innerHTML = '<b>Connection error</b>';
        label.textContent = 'Drop file here or click to select';
    }
}

// ── Pending access requests block (top of the User Management panel) ──
async function umLoadPendingRequests() {
    var section = document.getElementById('um-requests-section');
    var container = document.getElementById('um-requests-list');
    if (!section || !container) return;

    try {
        var res = await umFetch('/api/auth/access-requests?status=pending');
        var requests = await res.json();

        if (!res.ok || !requests.length) {
            section.style.display = 'none';
            updatePendingRequestsBadge();
            return;
        }

        section.style.display = '';
        var html = '';
        requests.forEach(function(r) {
            var date = new Date(r.created * 1000).toLocaleDateString();
            var deptInfo = r.department ? ' &middot; ' + esc(r.department) : '';
            var profileLink = r.profile_url ? ' &middot; <a href="' + esc(r.profile_url) + '" target="_blank" rel="noopener" style="color:#2563eb;">profile</a>' : '';
            var reasonInfo = r.reason ? '<div style="font-size:0.75rem;color:#78716c;margin-top:2px;">' + esc(r.reason) + '</div>' : '';

                + '<div style="font-size:0.78rem;color:#78716c;">' + esc(r.institution) + deptInfo + profileLink + ' &middot; ' + date + '</div>'
                + reasonInfo
                + '</div>'
                + '<div style="display:flex;flex-direction:column;gap:6px;">'
                + '<button onclick="umAcceptRequest(\'' + esc(r.email).replace(/'/g, '&#39;') + '\')" style="background:#16a34a;color:#fff;border:none;padding:5px 12px;border-radius:5px;cursor:pointer;font-size:0.8rem;white-space:nowrap;">Accept</button>'

async function umLoadUsers() {
    try {
        var res = await umFetch('/api/auth/users');
        _umUsers = await res.json();

        // Load directory data to get university and name info
        try {
            var dirRes = await umFetch('/directory/api/people');
            var dirData = await dirRes.json();
            _umDirUsers = {};
            (dirData || []).forEach(function(du) {
                if (du.email) {
                    du.email.toLowerCase().split(';').forEach(function(e) {
                        _umDirUsers[e.trim()] = du;
                    });
                }
            });
            // Populate university filter
            var unis = new Set();
            (dirData || []).forEach(function(du) { if (du.university) unis.add(du.university); });
            _umUniversities = Array.from(unis).sort();
            var uniSel = document.getElementById('um-uni-filter');
            if (uniSel) {
                var val = uniSel.value;
                uniSel.innerHTML = '<option value="">All universities</option>';
                _umUniversities.forEach(function(u) {
                    uniSel.innerHTML += '<option value="' + u + '">' + u + '</option>';
                });
                uniSel.value = val;
            }
        } catch (e) { /* Directory not available, continue without it */ }

        umRender();
    } catch (e) {
        document.getElementById('um-list').innerHTML = '<p style="color:#dc3545;">Error loading users</p>';
    }
}

function umGetDirInfo(username) {
    return _umDirUsers[username.toLowerCase()] || null;
}

function umRender() {
    var container = document.getElementById('um-list');
    if (!container) return;
    var search = (document.getElementById('um-search').value || '').toLowerCase();
    var roleFilter = document.getElementById('um-role-filter').value;
    var uniFilter = (document.getElementById('um-uni-filter') || {}).value || '';
    var sortBy = (document.getElementById('um-sort') || {}).value || 'name';

    // Enrich users with directory info
    var enriched = _umUsers.map(function(u) {
        var dir = umGetDirInfo(u.username);
        return {
            username: u.username,
            role: u.role,
            roles: u.roles || [u.role],
            provisional_password: u.provisional_password,
            pending_invite: u.pending_invite,
            name: u.name || (dir ? (dir.first_name + ' ' + dir.family_name) : ''),
            university: dir ? (dir.university || '') : '',
        };
    });

    // Filter
    var filtered = enriched.filter(function(u) {
        if (search) {
            var s = u.username.toLowerCase() + ' ' + u.name.toLowerCase();
            if (s.indexOf(search) === -1) return false;
        }
        if (roleFilter && u.roles.indexOf(roleFilter) === -1) return false;
        if (uniFilter && u.university !== uniFilter) return false;
        return true;
    });

    // Sort
    filtered.sort(function(a, b) {
        if (sortBy === 'name') {
            return (a.name || a.username).localeCompare(b.name || b.username);
        } else if (sortBy === 'email') {
            return a.username.localeCompare(b.username);
        } else {
            var c = (a.university || 'ZZZ').localeCompare(b.university || 'ZZZ');
            return c !== 0 ? c : (a.name || a.username).localeCompare(b.name || b.username);
        }
    });

    // Group by university if sorting by university
    var html = '';
    if (sortBy === 'university') {
        var groups = {};
        var order = [];
        filtered.forEach(function(u) {
            var uni = u.university || '(No university)';
            if (!groups[uni]) { groups[uni] = []; order.push(uni); }
            groups[uni].push(u);
        });
        order.forEach(function(uni) {
            html += '<div style="margin-top:10px;margin-bottom:4px;padding:4px 8px;background:#e9ecef;border-radius:4px;font-weight:600;font-size:0.82rem;color:#2D3876;">'
                + uni + ' <span style="font-weight:400;color:#666;">(' + groups[uni].length + ')</span></div>';
            html += umTableHtml(groups[uni]);
        });
    } else {
        html = umTableHtml(filtered);
    }

    html += '<p style="font-size:0.75rem;color:#888;margin-top:6px;">' + filtered.length + ' of ' + _umUsers.length + ' users</p>';
    container.innerHTML = html;
}

function umTableHtml(users) {
    var html = '<table style="width:100%;border-collapse:collapse;font-size:0.82rem;">'
        + '<tr style="border-bottom:2px solid #e2e8f0;"><th style="text-align:left;padding:6px;">Name</th><th style="text-align:left;padding:6px;">Email</th><th style="text-align:left;padding:6px;">Uni</th><th style="text-align:left;padding:6px;">Roles</th><th style="padding:6px;width:110px;">Actions</th></tr>';
    users.forEach(function(u) {
        var roleBadges = u.roles.map(function(r) {
            return '<span style="display:inline-block;background:#e8e0f0;color:#2D3876;padding:1px 6px;border-radius:8px;font-size:0.68rem;margin-right:2px;">' + r + '</span>';
        }).join('');
        var nameDisplay = u.name || '<span style="color:#aaa;">-</span>';
        var uniDisplay = u.university ? '<span style="font-size:0.72rem;">' + u.university + '</span>' : '<span style="color:#aaa;font-size:0.72rem;">-</span>';
        var statusBadge = '';
        if (u.pending_invite) statusBadge = ' <span style="color:#856404;font-size:0.65rem;background:#fff3cd;padding:1px 4px;border-radius:4px;">invited</span>';
        else if (u.provisional_password) statusBadge = ' <span style="color:#ea4335;font-size:0.65rem;">(prov.)</span>';
        var esc_user = u.username.replace(/'/g, "\\'");
        html += '<tr style="border-bottom:1px solid #f0f0f0;">'
            + '<td style="padding:4px 6px;">' + nameDisplay + statusBadge + '</td>'
            + '<td style="padding:4px 6px;font-size:0.78rem;color:#555;">' + u.username + '</td>'
            + '<td style="padding:4px 6px;">' + uniDisplay + '</td>'
            + '<td style="padding:4px 6px;">' + roleBadges + '</td>'
            + '<td style="padding:4px 6px;text-align:center;white-space:nowrap;">'
            + '<button onclick="umEditRoles(\'' + esc_user + '\')" style="background:none;border:1px solid #ccc;border-radius:3px;padding:2px 6px;cursor:pointer;font-size:0.7rem;margin-right:2px;">Roles</button>';
        if (u.pending_invite) {
            html += '<button onclick="umResendInvite(\'' + esc_user + '\')" style="background:none;border:1px solid #2D3876;color:#2D3876;border-radius:3px;padding:2px 6px;cursor:pointer;font-size:0.7rem;margin-right:2px;">Resend</button>';
        }
        html += '<button onclick="umDeleteUser(\'' + esc_user + '\')" style="background:none;border:1px solid #dc3545;color:#dc3545;border-radius:3px;padding:2px 6px;cursor:pointer;font-size:0.7rem;">Del</button>'
            + '</td></tr>';
    });
    html += '</table>';
    return html;
}

async function umCreateUser() {
    var username = document.getElementById('um-new-user').value.trim();
    var password = document.getElementById('um-new-pwd').value;
    var sel = document.getElementById('um-new-roles');
    var roles = [];
    for (var i = 0; i < sel.options.length; i++) {
        if (sel.options[i].selected) roles.push(sel.options[i].value);
    }
    if (!username || !password) { umMsg('Username and password required', false); return; }
    if (!roles.length) roles = ['student'];

async function umEditRoles(username) {
    var user = _umUsers.find(function(u) { return u.username === username; });
    if (!user) return;
    var currentRoles = user.roles || [user.role];
    // A superuser can freely edit their own other roles, but the server
    // refuses to remove 'superuser' from their own account (self-lockout
    // guard) — lock that one checkbox here so it's not a round-trip error.
    var isEditingSelf = !!(authUser && authUser.username === username);
    var checkboxes = Object.keys(USER_ROLES).map(function(r) {
        var checked = currentRoles.indexOf(r) !== -1 ? ' checked' : '';
        var lockSelfSuperuser = isEditingSelf && r === 'superuser';
        var disabled = lockSelfSuperuser ? ' disabled' : '';
        var hint = lockSelfSuperuser ? ' <span style="color:#999;font-size:0.75em;">(you)</span>' : '';
        return '<label style="display:block;font-size:0.85rem;margin:2px 0;"><input type="checkbox" value="' + r + '"' + checked + disabled + '> ' + r + hint + '</label>';
    }).join('');

    var dialog = document.createElement('div');
    dialog.id = 'um-role-dialog';
    dialog.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.4);z-index:1100;display:flex;justify-content:center;align-items:center;';

    } catch (e) {

    }

function tvRender() {
    var container = document.getElementById('tv-grid');
    if (!container) return;

    var roleLabels = Object.assign({ public: 'Public' }, USER_ROLES);

    var html = '<table style="width:100%;border-collapse:collapse;">'
        + '<tr style="border-bottom:2px solid #e2e8f0;"><th style="text-align:left;padding:6px 8px;">Tool</th>';
    ALL_ROLES.forEach(function(r) {
        var extra = r === 'superuser' ? ' <span style="font-size:0.65rem;color:#888;">(always)</span>'
                 : r === 'public' ? ' <span style="font-size:0.65rem;color:#888;">(no login)</span>' : '';
        html += '<th style="text-align:center;padding:6px 4px;font-size:0.78rem;">' + roleLabels[r] + extra + '</th>';
    });
    html += '</tr>';

    // Every currently-live tool (every WP tab + the UMA site, derived from
    // SECTIONS via TOOL_REGISTRY) gets a row, grouped by section, so a
    // retired tool's row disappears the moment its card is removed from
    // SECTIONS and a newly added tool's row appears with no extra wiring.
    var toolIds = Object.keys(TOOL_REGISTRY).sort(function(a, b) {
        var secA = TOOL_REGISTRY[a].sectionTitle, secB = TOOL_REGISTRY[b].sectionTitle;
        if (secA !== secB) return secA.localeCompare(secB);
        return toolLabel(a).localeCompare(toolLabel(b));
    });

    var lastSection = null;
    toolIds.forEach(function(toolId) {
        var info = TOOL_REGISTRY[toolId];
        if (info.sectionTitle !== lastSection) {
            lastSection = info.sectionTitle;
            html += '<tr><td colspan="' + (ALL_ROLES.length + 1) + '" style="padding:10px 8px 2px;font-size:0.72rem;font-weight:700;color:#888;text-transform:uppercase;letter-spacing:0.5px;">' + esc(lastSection) + '</td></tr>';
        }
        // Fall back to the built-in default roles for a tool that has never
        // been saved through this panel (e.g. it was added after the last save).
        var roles = _tvData.hasOwnProperty(toolId) ? _tvData[toolId] : (TOOL_ACCESS[toolId] || []);
        var label = toolLabel(toolId);
        var umaBadge = info.emailDomain ? ' <span style="color:#888;font-size:0.65rem;" title="Also requires a @' + esc(info.emailDomain) + ' login, enforced independently of the roles below">(@' + esc(info.emailDomain) + ' required)</span>' : '';
        html += '<tr style="border-bottom:1px solid #f0f0f0;">';
        html += '<td style="padding:6px 8px;font-weight:500;">' + esc(label) + umaBadge + ' <span style="color:#94a3b8;font-size:0.7rem;">' + esc(toolId) + '</span></td>';
        ALL_ROLES.forEach(function(r) {
            var checked = roles.indexOf(r) !== -1 ? ' checked' : '';
            var disabled = r === 'superuser' ? ' checked disabled' : '';
            html += '<td style="text-align:center;padding:6px 4px;">'
                + '<input type="checkbox" data-tool="' + toolId + '" data-role="' + r + '"' + checked + disabled + ' style="cursor:pointer;">'
                + '</td>';
        });
        html += '</tr>';
    });

    html += '</table>';
    container.innerHTML = html;
}

async function tvSave() {
    // Collect checkbox states
    var newAccess = {};
    var checkboxes = document.querySelectorAll('#tv-grid input[type="checkbox"]');
    checkboxes.forEach(function(cb) {
        var tool = cb.getAttribute('data-tool');
        var role = cb.getAttribute('data-role');
        if (!tool || !role) return;
        if (!newAccess[tool]) newAccess[tool] = [];
        if (cb.checked) newAccess[tool].push(role);
    });
    // Ensure superuser is always included
    for (var tool in newAccess) {
        if (newAccess[tool].indexOf('superuser') === -1) {
            newAccess[tool].push('superuser');
        }
    }

    try {
        var res = await umFetch('/api/tool-access', {
            method: 'PUT',
            body: JSON.stringify({ tool_access: newAccess })
        });
        if (!res.ok) { var err = await res.json(); tvMsg(err.detail || 'Error saving', false); return; }
        // Update local TOOL_ACCESS
        for (var key in newAccess) { TOOL_ACCESS[key] = newAccess[key]; }
        tvMsg('Saved. Changes take effect on next page load.', true);
    } catch (e) { tvMsg('Request failed', false); }
}

        + '<h3 style="margin:0 0 8px 0;font-size:0.9rem;">Request Summary</h3>'
        + '<div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center;">'
        + '<button onclick="laLoadSummary(\'hour\')" class="la-period-btn" id="la-btn-hour" style="background:#e8e0f0;color:#2D3876;border:1px solid #ccc;padding:5px 12px;border-radius:4px;cursor:pointer;font-size:0.82rem;">Last hour</button>'
        + '<button onclick="laLoadSummary(\'day\')" class="la-period-btn" id="la-btn-day" style="background:#2D3876;color:#fff;border:1px solid #2D3876;padding:5px 12px;border-radius:4px;cursor:pointer;font-size:0.82rem;">Last 24h</button>'
        + '<button onclick="laLoadSummary(\'3days\')" class="la-period-btn" id="la-btn-3days" style="background:#e8e0f0;color:#2D3876;border:1px solid #ccc;padding:5px 12px;border-radius:4px;cursor:pointer;font-size:0.82rem;">Last 3 days</button>'
        + '<button onclick="laLoadSummary(\'week\')" class="la-period-btn" id="la-btn-week" style="background:#e8e0f0;color:#2D3876;border:1px solid #ccc;padding:5px 12px;border-radius:4px;cursor:pointer;font-size:0.82rem;">Last 7 days</button>'
        + '<span style="color:#aaa;font-size:0.8rem;margin:0 4px;">|</span>'
        + '<input type="date" id="la-start" style="padding:4px 6px;border:1px solid #e2e8f0;border-radius:4px;font-size:0.8rem;">'
        + '<span style="font-size:0.8rem;color:#666;">to</span>'
        + '<input type="date" id="la-end" style="padding:4px 6px;border:1px solid #e2e8f0;border-radius:4px;font-size:0.8rem;">'
        + '<button onclick="laLoadCustom()" style="background:#2D3876;color:#fff;border:none;padding:5px 12px;border-radius:4px;cursor:pointer;font-size:0.82rem;">Go</button>'
        + '</div>'
        + '<div id="la-summary" style="margin-top:12px;font-size:0.85rem;color:#666;">Loading...</div>'
        + '</div>'
        // Log files
        + '<div style="padding:12px;background:#f8fafc;border-radius:8px;border:1px solid #e2e8f0;">'
        + '<h3 style="margin:0 0 8px 0;font-size:0.9rem;">Log Files</h3>'
        + '<div id="la-files" style="font-size:0.85rem;">Loading...</div>'
        + '</div>'
        + '<div style="display:flex;justify-content:space-between;margin-top:16px;">'
        + '<button onclick="document.getElementById(\'la-panel\').scrollTo({top:0,behavior:\'smooth\'})" style="background:none;border:1px solid #ccc;border-radius:4px;padding:5px 12px;cursor:pointer;font-size:0.82rem;color:#666;">&#8593; Inicio</button>'
        + '<button onclick="closeLogAnalytics()" style="background:#2D3876;color:#fff;border:none;border-radius:4px;padding:5px 12px;cursor:pointer;font-size:0.82rem;">Cerrar</button>'
        + '</div>';

    overlay.appendChild(panel);
    overlay.addEventListener('click', function(e) { if (e.target === overlay) closeLogAnalytics(); });
    document.body.appendChild(overlay);
    laLoadSummary('day');
    laLoadFiles();
}

function closeLogAnalytics() {
    var el = document.getElementById('la-overlay');
    if (el) el.remove();
}

function laMsg(text, ok) {
    var el = document.getElementById('la-message');
    if (!el) return;
    el.style.display = '';
    el.style.background = ok ? '#dcfce7' : '#fee2e2';
    el.style.color = ok ? '#166534' : '#991b1b';
    el.textContent = text;
    setTimeout(function() { el.style.display = 'none'; }, 3000);
}

function laSetActive(period) {
    ['hour', 'day', '3days', 'week'].forEach(function(p) {
        var btn = document.getElementById('la-btn-' + p);
        if (!btn) return;
        if (p === period) {
            btn.style.background = '#2D3876'; btn.style.color = '#fff'; btn.style.borderColor = '#2D3876';
        } else {
            btn.style.background = '#e8e0f0'; btn.style.color = '#2D3876'; btn.style.borderColor = '#ccc';
        }
    });
}

async function laLoadSummary(period) {
    laSetActive(period);
    var container = document.getElementById('la-summary');
    if (!container) return;
    container.innerHTML = 'Loading...';
    try {
        var res = await umFetch('/api/logs/summary?period=' + period);
        var data = await res.json();
        laRenderSummary(data, container);
    } catch (e) { container.innerHTML = '<span style="color:#dc3545;">Error loading summary</span>'; }
}

async function laLoadCustom() {
    var s = document.getElementById('la-start').value;
    var e = document.getElementById('la-end').value;
    if (!s || !e) { laMsg('Select both start and end dates', false); return; }
    laSetActive('');
    var container = document.getElementById('la-summary');
    if (!container) return;
    container.innerHTML = 'Loading...';
    try {
        var res = await umFetch('/api/logs/summary?start=' + encodeURIComponent(s) + '&end=' + encodeURIComponent(e + 'T23:59:59'));
        var data = await res.json();
        laRenderSummary(data, container);
    } catch (err) { container.innerHTML = '<span style="color:#dc3545;">Error loading summary</span>'; }
}

function laRenderSummary(data, container) {
    var t = data.totals;
    var periodLabel = data.period === 'hour' ? 'Last hour' : data.period === 'day' ? 'Last 24 hours' : data.period === '3days' ? 'Last 3 days' : data.period === 'week' ? 'Last 7 days' : data.start.split('T')[0] + ' to ' + data.end.split('T')[0];

    var html = '<div style="display:flex;gap:16px;flex-wrap:wrap;margin-bottom:12px;">'
        + '<div style="background:#fff;padding:10px 16px;border-radius:8px;border:1px solid #e2e8f0;text-align:center;min-width:100px;">'
        + '<div style="font-size:1.4rem;font-weight:700;color:#2D3876;">' + t.requests + '</div>'
        + '<div style="font-size:0.72rem;color:#888;">Requests</div></div>'
        + '<div style="background:#fff;padding:10px 16px;border-radius:8px;border:1px solid #e2e8f0;text-align:center;min-width:100px;">'
        + '<div style="font-size:1.4rem;font-weight:700;color:#2D3876;">' + t.sessions + '</div>'
        + '<div style="font-size:0.72rem;color:#888;">Sessions</div></div>'
        + '</div>';

    html += '<div style="font-size:0.75rem;color:#888;margin-bottom:6px;">' + periodLabel + '</div>';

    // Only show Research Explorer agents
    var EXPLORER_AGENTS = {
        'responsible_ai3': 'EH: Responsible AI',
        'health_wellbeing_sistems': 'EH: Health & Wellbeing Systems',
        'nlp_eh': 'EH: AI & Language',
        'robotics_ai': 'EH: AI & Robotics',
        'proyectoseuopeos': 'European Projects'
    };
    var agents = Object.keys(data.per_agent).filter(function(a) { return EXPLORER_AGENTS[a]; });
    if (agents.length > 0) {
        agents.sort(function(a, b) { return data.per_agent[b].requests - data.per_agent[a].requests; });
        html += '<table style="width:100%;border-collapse:collapse;font-size:0.82rem;">'
            + '<tr style="border-bottom:2px solid #e2e8f0;"><th style="text-align:left;padding:4px 6px;">Agent</th>'
            + '<th style="text-align:right;padding:4px 6px;">Requests</th>'
            + '<th style="text-align:right;padding:4px 6px;">Sessions</th></tr>';
        agents.forEach(function(aid) {
            var a = data.per_agent[aid];
            html += '<tr style="border-bottom:1px solid #f0f0f0;">'
                + '<td style="padding:4px 6px;">' + (EXPLORER_AGENTS[aid] || aid) + '</td>'
                + '<td style="text-align:right;padding:4px 6px;">' + a.requests + '</td>'
                + '<td style="text-align:right;padding:4px 6px;">' + a.sessions + '</td></tr>';
        });
        html += '</table>';
    } else {
        html += '<p style="color:#888;">No activity in this period.</p>';
    }

    container.innerHTML = html;
}

function laFormatSize(bytes) {
    if (bytes < 1024) return bytes + ' B';
    if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
    return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
}

async function laLoadFiles() {
    var container = document.getElementById('la-files');
    if (!container) return;
    try {
        var res = await umFetch('/api/logs/files');
        var files = await res.json();
        if (!files.length) { container.innerHTML = '<p style="color:#888;">No log files.</p>'; return; }

        var html = '<table style="width:100%;border-collapse:collapse;font-size:0.82rem;">'
            + '<tr style="border-bottom:2px solid #e2e8f0;">'
            + '<th style="text-align:left;padding:4px 6px;">File</th>'
            + '<th style="text-align:right;padding:4px 6px;">Size</th>'
            + '<th style="text-align:left;padding:4px 6px;">Modified</th>'
            + '<th style="text-align:center;padding:4px 6px;">Actions</th></tr>';

        files = files.filter(function(f) { return f.name.endsWith('.jsonl'); });
        files.forEach(function(f) {
            var esc = f.name.replace(/'/g, "\\'");
            var mod = f.modified.split('T')[0] + ' ' + f.modified.split('T')[1].substring(0, 5);
            html += '<tr style="border-bottom:1px solid #f0f0f0;">'
                + '<td style="padding:4px 6px;word-break:break-all;">' + f.name + '</td>'
                + '<td style="text-align:right;padding:4px 6px;white-space:nowrap;">' + laFormatSize(f.size) + '</td>'
                + '<td style="padding:4px 6px;white-space:nowrap;color:#666;">' + mod + '</td>'
                + '<td style="text-align:center;padding:4px 6px;">'
                + '<button onclick="laViewFile(\'' + esc + '\')" style="background:none;border:1px solid #2D3876;color:#2D3876;border-radius:3px;padding:2px 6px;cursor:pointer;font-size:0.7rem;margin-right:3px;">View</button>'
                + '<button onclick="laDeleteFile(\'' + esc + '\')" style="background:none;border:1px solid #ccc;border-radius:3px;padding:2px 6px;cursor:pointer;font-size:0.7rem;margin-right:3px;">Reset</button>'
                + (f.name.indexOf('algoria_map') >= 0 ? '<a href="/algoria-map-report" target="_blank" style="border:1px solid #2563eb;color:#2563eb;border-radius:3px;padding:2px 6px;font-size:0.7rem;text-decoration:none;">Report</a>' : '')
                + '</td></tr>';
        });

        html += '</table>'
            + '<p style="font-size:0.72rem;color:#888;margin-top:6px;">' + files.length + ' file(s)</p>';
        container.innerHTML = html;
    } catch (e) { container.innerHTML = '<span style="color:#dc3545;">Error loading files</span>'; }
}

async function laViewFile(filename) {
    var existing = document.getElementById('la-viewer');
    if (existing) existing.remove();

    var viewer = document.createElement('div');
    viewer.id = 'la-viewer';
    viewer.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.6);z-index:1100;display:flex;justify-content:center;align-items:center;';

    var panel = document.createElement('div');
    panel.style.cssText = 'background:#fff;border-radius:12px;padding:24px;width:850px;max-width:95vw;max-height:90vh;overflow-y:auto;box-shadow:0 8px 32px rgba(0,0,0,0.25);';
    panel.id = 'la-viewer-panel';
    panel.innerHTML = '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">'
        + '<h3 style="margin:0;font-size:1rem;color:#2D3876;word-break:break-all;">' + filename + '</h3>'
        + '<div style="display:flex;gap:6px;align-items:center;">'
        + '<button onclick="document.getElementById(\'la-viewer-panel\').scrollTo({top:document.getElementById(\'la-viewer-panel\').scrollHeight,behavior:\'smooth\'})" style="background:none;border:1px solid #ccc;border-radius:4px;padding:2px 8px;cursor:pointer;font-size:0.8rem;color:#666;" title="Ir al final">&#8595; Final</button>'
        + '<button onclick="document.getElementById(\'la-viewer\').remove()" style="background:none;border:none;font-size:1.5rem;cursor:pointer;color:#888;">&times;</button>'
        + '</div></div>'
        + '<div id="la-viewer-content" style="font-size:0.85rem;">Loading...</div>';

    viewer.appendChild(panel);
    viewer.addEventListener('click', function(e) { if (e.target === viewer) viewer.remove(); });
    document.body.appendChild(viewer);

    try {
        var res = await umFetch('/api/logs/content?filename=' + encodeURIComponent(filename));
        if (!res.ok) { document.getElementById('la-viewer-content').innerHTML = '<span style="color:#dc3545;">Error loading file</span>'; return; }
        var data = await res.json();
        var container = document.getElementById('la-viewer-content');

        if (data.format === 'text') {
            container.innerHTML = '<pre style="white-space:pre-wrap;word-break:break-word;background:#f8fafc;padding:12px;border-radius:6px;border:1px solid #e2e8f0;max-height:65vh;overflow-y:auto;font-size:0.8rem;">'
                + laEscape(data.text) + '</pre>';
            return;
        }

        if (!data.entries || !data.entries.length) {
            container.innerHTML = '<p style="color:#888;">File is empty.</p>';
            return;
        }

        var html = '<p style="font-size:0.75rem;color:#888;margin-bottom:8px;">' + data.count + ' entries</p>';
        data.entries.forEach(function(entry, idx) {
            if (entry._raw) {
                html += '<div style="background:#f8fafc;border:1px solid #e2e8f0;border-radius:6px;padding:10px;margin-bottom:8px;">'
                    + '<pre style="white-space:pre-wrap;word-break:break-word;font-size:0.78rem;margin:0;">' + laEscape(entry._raw) + '</pre></div>';
                return;
            }
            var ts = (entry.timestamp || '').replace('T', ' ').substring(0, 19);
            var agent = entry.agent_name || entry.agent_id || '-';
            var user = entry.user_id ? entry.user_id.substring(0, 8) + '...' : '-';
            var domain = entry.email_domain || '';
            var session = entry.session_id ? entry.session_id.substring(0, 8) + '...' : '-';
            var question = entry.question || '';
            var response = entry.response || '';

            html += '<div style="background:#f8fafc;border:1px solid #e2e8f0;border-radius:6px;padding:10px;margin-bottom:8px;">'
                + '<div style="display:flex;flex-wrap:wrap;gap:10px;font-size:0.72rem;color:#666;margin-bottom:6px;">'
                + '<span><b>Time:</b> ' + ts + '</span>'
                + '<span><b>Agent:</b> ' + laEscape(agent) + '</span>'
                + '<span><b>User:</b> ' + user + (domain ? ' (' + domain + ')' : '') + '</span>'
                + '<span><b>Session:</b> ' + session + '</span>'
                + (entry.transparency_level ? '<span><b>Transparency:</b> ' + entry.transparency_level + '</span>' : '')
                + (entry.client_ip ? '<span><b>IP:</b> ' + entry.client_ip + '</span>' : '')
                + '</div>'
                + '<div style="margin-bottom:4px;"><span style="font-size:0.72rem;font-weight:600;color:#2D3876;">Q:</span> '
                + '<span style="font-size:0.82rem;">' + laEscape(question) + '</span></div>'
                + '<div><span style="font-size:0.72rem;font-weight:600;color:#555;">A:</span> '
                + '<span style="font-size:0.78rem;color:#444;">' + laEscape(response).substring(0, 300) + (response.length > 300 ? '...' : '') + '</span></div>'
                + '</div>';
        });

        html += '<div style="display:flex;justify-content:space-between;margin-top:16px;">'
            + '<button onclick="document.getElementById(\'la-viewer-panel\').scrollTo({top:0,behavior:\'smooth\'})" style="background:none;border:1px solid #ccc;border-radius:4px;padding:5px 12px;cursor:pointer;font-size:0.82rem;color:#666;">&#8593; Inicio</button>'
            + '<button onclick="document.getElementById(\'la-viewer\').remove()" style="background:#2D3876;color:#fff;border:none;border-radius:4px;padding:5px 12px;cursor:pointer;font-size:0.82rem;">Cerrar</button>'
            + '</div>';
        container.innerHTML = html;
    } catch (e) {
        document.getElementById('la-viewer-content').innerHTML = '<span style="color:#dc3545;">Error loading file</span>';
    }
}

function laEscape(str) {
    var div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
}

async function laDeleteFile(filename) {
    if (!confirm('Archive log file "' + filename + '"? The file will be renamed with its date range and a new empty log will start.')) return;
    try {
        var res = await umFetch('/api/logs/' + encodeURIComponent(filename), { method: 'DELETE' });
        if (!res.ok) { var err = await res.json(); laMsg(err.detail || 'Error', false); return; }
        var data = await res.json();
        laMsg(data.message || 'Archived', true);
        laLoadFiles();
    } catch (e) { laMsg('Request failed', false); }
}

</script>
</body>
</html>
