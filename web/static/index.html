<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tommi. Cooperative AI Agents</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <link rel="stylesheet" href="/static/style.css?v=19">
    <!-- Leaflet.js for inline maps -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- Marked.js for rendering markdown -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- Matomo -->
    <script>
      var _paq = window._paq = window._paq || [];
      /* tracker methods like "setCustomDimension" should be called before "trackPageView" */
      _paq.push(['trackPageView']);
      _paq.push(['enableLinkTracking']);
      (function() {
        var u="https://uninovis.matomo.cloud/";
        _paq.push(['setTrackerUrl', u+'matomo.php']);
        _paq.push(['setSiteId', '3']);
        var d=document, g=d.createElement('script'), s=d.getElementsByTagName('script')[0];
        g.async=true; g.src='https://cdn.matomo.cloud/uninovis.matomo.cloud/matomo.js'; s.parentNode.insertBefore(g,s);
      })();
    </script>
    <!-- End Matomo Code --  >
</head>
<body>
    <div class="container">
        <!-- Sidebar with agent selector -->
        <aside class="sidebar">
            <!-- Top section with UMA logo (white background) -->
            <div class="sidebar-top">
                <div class="logo-uma">
                    <img src="/static/logo_uma.png" alt="Universidad de Málaga">
                </div>
            </div>
            <!-- Bottom section with selector and UNINOVIS logo -->
            <div class="sidebar-bottom" style="background-image: url('/static/fondo.png'); background-size: cover; background-position: center;">
                <div class="agent-selector">
                    <select id="agent-select">
                        <option value="">Loading agents...</option>
                    </select>
                </div>
                <div id="agent-info-section" class="agent-section-wrapper hidden">
                    <div style="display:inline-flex;align-items:center;gap:8px;" id="agent-info-row">
                        <img id="agent-type-icon" src="" alt="" style="height:26px;cursor:help;">
                        <img id="llm-provider-icon" src="" alt="" style="width:24px;height:24px;cursor:help;">
                        <img id="transparency-type-icon" src="" alt="" style="width:24px;height:24px;cursor:help;">
                        <img id="transparency-level-icon" src="" alt="" style="width:24px;height:24px;cursor:help;" class="hidden">
                        <span id="prompt-level-icon" style="font-size:18px;cursor:help;" class="hidden"></span>
                        <button id="btn-agent-config" class="hidden" title="Change agent settings" style="background:none;border:none;color:#cbd5e1;cursor:pointer;padding:0;display:inline-flex;align-items:center;">
                            <svg width="24" height="24" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M11.49 3.17c-.38-1.56-2.6-1.56-2.98 0a1.532 1.532 0 01-2.286.948c-1.372-.836-2.942.734-2.106 2.106.54.886.061 2.042-.947 2.287-1.561.379-1.561 2.6 0 2.978a1.532 1.532 0 01.947 2.287c-.836 1.372.734 2.942 2.106 2.106a1.532 1.532 0 012.287.947c.379 1.561 2.6 1.561 2.978 0a1.533 1.533 0 012.287-.947c1.372.836 2.942-.734 2.106-2.106a1.533 1.533 0 01.947-2.287c1.561-.379 1.561-2.6 0-2.978a1.532 1.532 0 01-.947-2.287c.836-1.372-.734-2.942-2.106-2.106a1.532 1.532 0 01-2.287-.947zM10 13a3 3 0 100-6 3 3 0 000 6z" clip-rule="evenodd"/></svg>
                        </button>
                    </div>
                    <span id="agent-type-label" style="display:none;"></span>
                    <span id="llm-provider-label" style="display:none;"></span>
                </div>
                <p id="agent-description" class="agent-description hidden"></p>
                <div id="example-queries" class="example-queries hidden">
                    <details>
                        <summary style="cursor:pointer;font-weight:bold;font-size:0.95em;color:#fff;">Example queries</summary>
                        <div id="examples-container"></div>
                    </details>
                </div>
                <div id="query-history" class="query-history hidden">
                    <details id="history-details" open>
                        <summary>📋 Query history</summary>
                        <div id="history-container"></div>
                    </details>
                </div>
                <div class="logo-uninovis">
                    <img src="/static/logo_uninovis.png" alt="UNINOVIS">
                </div>
                <div class="create-agent-link">
                    <a href="/create-agent">+ Create New Agent</a>
                </div>
            </div>
        </aside>

        <!-- Chat area -->
        <main class="chat-area">
            <!-- Top section with same background as sidebar -->
            <div class="chat-area-top" style="display: flex; justify-content: space-between; align-items: flex-start;">
                <div class="disclaimer" style="flex: 1;">
                    <p class="disclaimer-title">TOMMI Cooperative AI Agents</p>
                    <p><small>Agents are NOT AUTHORITIES, they are TOOLS</small></p>
                    <p id="logging-notice" style="display: none;">In agreement with EU AI Act all conversations will be anonymized and save to future accountability .</p>
                </div>
            </div>
            <!-- Bottom section with messages and form -->
            <div class="chat-area-bottom">
                <div id="chat-messages" class="chat-messages">
                    <div class="welcome-message">
                        <p>Select an agent to start chatting.</p>
                    </div>
                </div>

                <form id="chat-form" class="chat-form">
                    <input
                        type="text"
                        id="message-input"
                        placeholder="Type your message..."
                        autocomplete="off"
                        disabled
                    >
                    <button type="submit" id="send-button" disabled>Send</button>
                </form>
            </div>
        </main>
    </div>

    <script src="/static/app.js?v=70"></script>
</body>
</html>
