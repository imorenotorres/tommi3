      /* tracker methods like "setCustomDimension" should be called before "trackPageView" */
      _paq.push(['disableCookies']);
  _paq.push(['trackPageView']);
      _paq.push(['enableLinkTracking']);
      (function() {
        var u="https://uninovis.matomo.cloud/";
        _paq.push(['setTrackerUrl', u+'matomo.php']);
        _paq.push(['setSiteId', '3']);
        var d=document, g=d.createElement('script'), s=d.getElementsByTagName('script')[0];

<body>
    <div class="uninovis-nav" id="main-nav">
        <div class="uninovis-nav-left">
            <a class="uninovis-nav-brand" href="/">UNINOVIS</a>
            <span class="uninovis-nav-sep">/</span>
            <span class="uninovis-nav-current">AI Agents</span>
        </div>
        <div class="uninovis-nav-right">
            <span class="uninovis-nav-user" id="uninovis-nav-user"></span>
        </div>
    </div>
    <div class="container">
        <!-- Sidebar with agent selector -->
        <aside class="sidebar">
            <div class="sidebar-content">
                <div class="agent-selector">
                    <select id="agent-select">
                        <option value="">Loading agents...</option>
                    </select>
                </div>
                <div id="agent-info-section" class="agent-section-wrapper hidden">
                    <div style="display:inline-flex;align-items:center;gap:8px;" id="agent-info-row">
                        <img id="agent-type-icon" src="" alt="" style="height:26px;cursor:help;">
                        <img id="llm-provider-icon" src="" alt="" style="width:24px;height:24px;cursor:help;">
                        <span id="prompt-level-icon" style="font-size:14px;cursor:help;background:rgba(255,255,255,0.85);border-radius:4px;padding:2px 4px;" class="hidden"></span>
                        <img id="transparency-level-icon" src="" alt="" style="width:24px;height:24px;cursor:help;" class="hidden">
                        <img id="agent-transparency-icon" src="" alt="" style="width:24px;height:24px;cursor:help;" class="hidden">
                        <button id="btn-agent-config" class="hidden" title="Change agent settings" style="background:rgba(255,255,255,0.85);border:none;color:#333;cursor:pointer;padding:3px;display:inline-flex;align-items:center;border-radius:4px;">
                            <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M11.49 3.17c-.38-1.56-2.6-1.56-2.98 0a1.532 1.532 0 01-2.286.948c-1.372-.836-2.942.734-2.106 2.106.54.886.061 2.042-.947 2.287-1.561.379-1.561 2.6 0 2.978a1.532 1.532 0 01.947 2.287c-.836 1.372.734 2.942 2.106 2.106a1.532 1.532 0 012.287.947c.379 1.561 2.6 1.561 2.978 0a1.533 1.533 0 012.287-.947c1.372.836 2.942-.734 2.106-2.106a1.533 1.533 0 01.947-2.287c1.561-.379 1.561-2.6 0-2.978a1.532 1.532 0 01-.947-2.287c.836-1.372-.734-2.942-2.106-2.106a1.532 1.532 0 01-2.287-.947zM10 13a3 3 0 100-6 3 3 0 000 6z" clip-rule="evenodd"/></svg>
                        </button>
                    </div>
                    <span id="agent-type-label" style="display:none;"></span>
                    <span id="llm-provider-label" style="display:none;"></span>
                </div>
                <p id="agent-description" class="agent-description hidden"></p>
                <div id="example-queries" class="example-queries hidden">
                    <details>
                        <summary style="cursor:pointer;font-weight:bold;font-size:0.95em;color:#fff;">Example queries</summary>
                        <div id="examples-container"></div>
                    </details>
                </div>
                <div id="query-history" class="query-history hidden">
                    <details id="history-details" open>
                        <summary>Query history</summary>
                        <div id="history-container"></div>
                    </details>
                </div>
                <div class="sidebar-footer">
                    <div class="logo-uninovis">
                        <img src="/static/logo_uninovis.png" alt="UNINOVIS">
                    </div>
                    <div class="create-agent-link">
                        <a href="/create-agent">+ Create New Agent</a>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Chat area -->
        <main class="chat-area">
            <div class="chat-area-bottom" style="margin-top:0;">
                <div id="chat-messages" class="chat-messages">
                    <div class="welcome-message">
                        <p>Select an agent to start chatting.</p>
                    </div>
                </div>

                <form id="chat-form" class="chat-form">
                    <input
                        type="text"
                        id="message-input"
                        placeholder="Type your message..."
                        autocomplete="off"
                        disabled
                    >
                    <button type="submit" id="send-button" disabled>Send</button>
                </form>
            </div>
        </main>
    </div>

    <script src="/static/app.js?v=79"></script>
</body>
</html>
