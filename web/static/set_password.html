<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tommi - Set your password</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <style>
        :root {
            --primary-color: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-color: #f8fafc;
            --border-color: #e2e8f0;
            --text-muted: #64748b;
            --error-color: #dc2626;
            --success-color: #16a34a;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-image: url('/static/fondo.png');
            background-size: cover;
            background-position: center;
        }
        .card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.12);
            padding: 2.5rem;
            width: 100%;
            max-width: 420px;
        }
        .card .logo { text-align: center; margin-bottom: 1.5rem; }
        .card .logo img { max-width: 180px; }
        .card h2 { text-align: center; color: #1e293b; margin-bottom: 0.5rem; font-size: 1.25rem; }
        .card .subtitle { text-align: center; color: var(--text-muted); font-size: 0.875rem; margin-bottom: 1.5rem; }
        .form-group { margin-bottom: 1rem; }
        .form-group label { display: block; font-size: 0.875rem; font-weight: 500; color: #374151; margin-bottom: 0.35rem; }
        .form-group input {
            width: 100%; padding: 0.6rem 0.75rem; border: 1px solid var(--border-color);
            border-radius: 6px; font-size: 0.95rem; outline: none; transition: border-color 0.15s;
        }
        .form-group input:focus { border-color: var(--primary-color); box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.15); }
        .btn {
            width: 100%; padding: 0.65rem; border: none; border-radius: 6px;
            font-size: 0.95rem; font-weight: 500; cursor: pointer; margin-top: 0.5rem;
            background-color: var(--primary-color); color: white; transition: background-color 0.15s;
        }
        .btn:hover { background-color: var(--primary-hover); }
        .btn:disabled { background-color: #94a3b8; cursor: not-allowed; }
        .message {
            padding: 0.5rem 0.75rem; border-radius: 6px; font-size: 0.85rem;
            margin-bottom: 1rem; display: none;
        }
        .message.error { background: #fef2f2; color: var(--error-color); border: 1px solid #fecaca; display: block; }
        .message.success { background: #f0fdf4; color: var(--success-color); border: 1px solid #bbf7d0; display: block; }
        .password-hint { font-size: 0.8rem; color: var(--text-muted); margin-top: 0.25rem; }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo">
            <img src="/static/logo_uninovis.png" alt="UNINOVIS Alliance" style="max-width:250px;">
        </div>
        <p style="text-align:center; font-size:1rem; font-weight:600; color:#1e293b; margin-bottom:1rem;">TOMMI Cooperative Agents Platform</p>

        <div id="form-section">
            <h2>Set your password</h2>
            <p class="subtitle" id="subtitle">Create a password to access Tommi Agents</p>
            <div id="msg" class="message"></div>
            <form id="set-pwd-form">
                <div class="form-group">
                    <label for="pwd1">Password</label>
                    <input type="password" id="pwd1" required minlength="8" autofocus>
                    <p class="password-hint">Min. 8 chars, uppercase, lowercase, digit, and special character</p>
                </div>
                <div class="form-group">
                    <label for="pwd2">Confirm password</label>
                    <input type="password" id="pwd2" required>
                </div>
                <button type="submit" class="btn" id="submit-btn">Set password</button>
            </form>
        </div>

        <div id="invalid-section" style="display:none; text-align:center;">
            <h2>Invalid or expired link</h2>
            <p class="subtitle">This invitation link is no longer valid. Please contact your administrator for a new one.</p>
            <a href="/login" class="btn" style="display:inline-block; text-decoration:none; text-align:center; margin-top:1rem;">Go to login</a>
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const token = params.get('token');

        if (!token) {
            document.getElementById('form-section').style.display = 'none';
            document.getElementById('invalid-section').style.display = 'block';
        } else {
            // Validate token on load
            fetch('/api/auth/invite/validate?token=' + encodeURIComponent(token))
                .then(r => r.json())
                .then(data => {
                    if (!data.valid) {
                        document.getElementById('form-section').style.display = 'none';
                        document.getElementById('invalid-section').style.display = 'block';
                    } else {
                        document.getElementById('subtitle').textContent =
                            'Create a password for ' + data.username;
                    }
                })
                .catch(() => {
                    document.getElementById('form-section').style.display = 'none';
                    document.getElementById('invalid-section').style.display = 'block';
                });
        }

        function showMsg(text, type) {
            const el = document.getElementById('msg');
            el.textContent = text;
            el.className = 'message ' + type;
        }

        function checkPasswordComplexity(pwd) {
            if (pwd.length < 8) return 'Password must be at least 8 characters';
            if (!/[A-Z]/.test(pwd)) return 'Must contain at least one uppercase letter';
            if (!/[a-z]/.test(pwd)) return 'Must contain at least one lowercase letter';
            if (!/[0-9]/.test(pwd)) return 'Must contain at least one digit';
            if (!/[^A-Za-z0-9]/.test(pwd)) return 'Must contain at least one special character (!@#$%...)';
            return null;
        }

        document.getElementById('set-pwd-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const pwd1 = document.getElementById('pwd1').value;
            const pwd2 = document.getElementById('pwd2').value;

            if (pwd1 !== pwd2) { showMsg('Passwords do not match', 'error'); return; }
            const pwdErr = checkPasswordComplexity(pwd1);
            if (pwdErr) { showMsg(pwdErr, 'error'); return; }

            const btn = document.getElementById('submit-btn');
            btn.disabled = true;
            btn.textContent = 'Setting password...';

            try {
                const res = await fetch('/api/auth/invite/set-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, password: pwd1 })
                });
                const data = await res.json();

                if (!res.ok) {
                    showMsg(data.detail || 'Error setting password', 'error');
                    btn.disabled = false;
                    btn.textContent = 'Set password';
                    return;
                }

                showMsg('Password set successfully! Redirecting to login...', 'success');
                setTimeout(() => { window.location.href = '/login'; }, 2000);
            } catch {
                showMsg('Connection error', 'error');
                btn.disabled = false;
                btn.textContent = 'Set password';
            }
        });
    </script>
</body>
</html>
