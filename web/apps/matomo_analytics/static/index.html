<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UNINOVIS — Site Analytics</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <link rel="stylesheet" href="/static/nav.css?v=2">
    <script src="/static/nav.js?v=4"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f0f2f5; color: #333; }
        .container { max-width: 1100px; margin: 0 auto; padding: 20px 24px; }

        .controls {
            display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
            margin-bottom: 16px; padding: 12px 16px;
            background: #fff; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }
        .controls label { font-size: 0.78rem; font-weight: 600; color: #555; }
        .controls select, .controls input[type=text] {
            padding: 5px 8px; border: 1px solid #d1d5db; border-radius: 6px;
            font-size: 0.78rem; background: #fff;
        }
        .controls input[type=text] { width: 160px; }
        .controls button {
            padding: 8px 28px; border: none; border-radius: 6px;
            background: #2D3876; color: #fff; font-size: 0.92rem;
            cursor: pointer; font-weight: 700; letter-spacing: 0.5px;
        }
        .controls button:hover { background: #4a5299; }
        .controls .sep { width: 1px; height: 22px; background: #e2e8f0; }

        .kpi-row {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 10px; margin-bottom: 16px;
        }
        .kpi-card {
            background: #fff; border-radius: 10px; padding: 12px 14px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06); text-align: center;
        }
        .kpi-card .kv { font-size: 1.5rem; font-weight: 700; color: #2D3876; }
        .kpi-card .kl { font-size: 0.72rem; color: #888; margin-top: 2px; }

        .panel {
            background: #fff; border-radius: 10px; padding: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06); margin-bottom: 16px;
        }
        .panel h3 { font-size: 0.88rem; color: #2D3876; margin-bottom: 8px; }

        /* Line chart */
        .lchart { position: relative; width: 100%; height: 320px; }
        .lchart svg { width: 100%; height: 100%; overflow: visible; }
        .lchart .grid-line { stroke: #e5e7eb; stroke-width: 0.5; }
        .lchart .axis-label { font-size: 9px; fill: #94a3b8; }
        .lchart .line { fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
        .lchart .dot { cursor: default; }
        .lchart .dot:hover { r: 6; }
        .lchart .tooltip-area { fill: transparent; cursor: crosshair; }
        .chart-tooltip {
            position: absolute; background: #1e293b; color: #fff;
            padding: 6px 12px; border-radius: 6px; font-size: 0.72rem;
            white-space: pre; line-height: 1.5; pointer-events: none;
            opacity: 0; transition: opacity 0.15s; z-index: 10;
        }
        .chart-tooltip.show { opacity: 1; }
        .x-labels { display: flex; justify-content: space-between; margin-top: 4px; font-size: 0.65rem; color: #94a3b8; }

        .legend { display: flex; gap: 14px; margin-bottom: 6px; font-size: 0.72rem; flex-wrap: wrap; }
        .legend-item { display: flex; align-items: center; gap: 4px; }
        .ldot { width: 10px; height: 10px; border-radius: 2px; flex-shrink: 0; }

        /* Horizontal bar */
        .hrow { display: flex; align-items: center; gap: 8px; margin-bottom: 5px; font-size: 0.78rem; }
        .hlbl { width: 200px; text-align: right; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #555; flex-shrink: 0; }
        .htrack { flex: 1; background: #e5e7eb; border-radius: 4px; height: 18px; }
        .hfill { height: 100%; border-radius: 4px; min-width: 2px; background: #2D3876; }
        .hval { width: 50px; font-weight: 600; color: #2D3876; font-size: 0.78rem; }

        .tab-row { display: flex; gap: 4px; margin-bottom: 14px; flex-wrap: wrap; }
        .tab-btn { padding: 5px 12px; border: 1px solid #d1d5db; border-radius: 6px; background: #fff; cursor: pointer; font-size: 0.75rem; }
        .tab-btn.active { background: #2D3876; color: #fff; border-color: #2D3876; }

        .loading { text-align: center; padding: 24px; color: #888; font-size: 0.85rem; }
        .error { color: #dc3545; text-align: center; padding: 16px; font-size: 0.82rem; }
        .note { font-size: 0.7rem; color: #94a3b8; margin-top: 4px; }

        .country-pill {
            padding: 3px 10px; border: 1px solid #d1d5db; border-radius: 12px;
            font-size: 0.7rem; cursor: pointer; background: #fff; color: #555;
            transition: all 0.15s;
        }
        .country-pill:hover { border-color: #2D3876; color: #2D3876; }
        .country-pill.active { background: #2D3876; color: #fff; border-color: #2D3876; }
        .country-pill.uninovis-group { background: #ede9fe; border-color: #a78bfa; color: #5b21b6; }
        .country-pill.uninovis-group.active { background: #7c3aed; color: #fff; border-color: #7c3aed; }

        .hrow:hover { background: #f8fafc; border-radius: 4px; }
    </style>
    <!-- Matomo -->
    <script>
      var _paq = window._paq = window._paq || [];
      _paq.push(['disableCookies']);
  _paq.push(['trackPageView']);
      _paq.push(['enableLinkTracking']);
      (function() {
        var u="https://uninovis.matomo.cloud/";
        _paq.push(['setTrackerUrl', u+'matomo.php']);
        _paq.push(['setSiteId', '3']);
        var d=document, g=d.createElement('script'), s=d.getElementsByTagName('script')[0];
        g.async=true; g.src='https://cdn.matomo.cloud/uninovis.matomo.cloud/matomo.js'; s.parentNode.insertBefore(g,s);
      })();
    </script>
</head>
<body>
<script>uninovisNav({ crumbs: [{label:'Administration', href:'/#admin'}], current: 'Site Analytics' });</script>

<div class="container">
    <!-- 1. Filters -->
    <div class="controls">
        <label>Site:</label>
        <select id="selSite"><option value="all">All sites</option></select>
        <div class="sep"></div>
        <label>Page:</label>
        <select id="selPage" onchange="loadAll()"><option value="">All pages</option></select>
        <div class="sep"></div>
        <label>Country:</label>
        <select id="selCountry" onchange="onCountryChange()">
            <option value="all">All</option>
            <option value="uninovis">All UNINOVIS</option>
        </select>
    </div>
    <div class="controls" style="margin-top:-8px;">
        <label>Period:</label>
        <select id="selPeriod">
            <option value="day">Daily</option>
            <option value="week" selected>Weekly</option>
            <option value="month">Monthly</option>
        </select>
        <label>Range:</label>
        <select id="selRange">
            <option value="last4">Last 4</option>
            <option value="last8" selected>Last 8</option>
            <option value="last12">Last 12</option>
            <option value="last26">Last 26</option>
            <option value="last52">Last 52</option>
        </select>
        <div class="sep"></div>
        <label>Metric:</label>
        <select id="selMetric" onchange="onMetricChange()">
            <option value="visits">Visits</option>
            <option value="both">Visits + Unique</option>
            <option value="unique">Unique Visitors</option>
        </select>
        <div style="flex:1;"></div>
        <button onclick="loadAll(true)">Apply</button>
        <a href="/matomo-analytics/setup" style="font-size:0.72rem;color:#2D3876;text-decoration:none;margin-left:4px;" title="Configure tracked URLs">&#9881; Setup</a>
    </div>

    <!-- 2. Visits by Country -->
    <div class="panel" id="countryChartPanel">
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px;">
            <h3 id="countryChartTitle" style="margin:0;flex:1;">Visits by Country</h3>
            <label style="font-size:0.72rem;font-weight:600;color:#555;">Show:</label>
            <select id="selCountryLimit" onchange="loadCountryChart()" style="padding:3px 6px;border:1px solid #d1d5db;border-radius:6px;font-size:0.72rem;">
                <option value="10">Top 10</option>
                <option value="20" selected>Top 20</option>
                <option value="30">Top 30</option>
                <option value="-1">All</option>
            </select>
        </div>
        <div id="countryChart"></div>
        <div class="note" id="countryChartNote" style="margin-top:4px;"></div>
    </div>

    <!-- 3. Visits/Visitors Over Time -->
    <div class="panel">
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px;">
            <h3 id="chartTitle" style="margin:0;flex:1;">Visits Over Time</h3>
            <label id="lblShowAgg" style="display:none;font-size:0.72rem;cursor:pointer;color:#555;user-select:none;">
                <input type="checkbox" id="chkShowAgg" checked onchange="loadChart()" style="vertical-align:middle;cursor:pointer;"> Show aggregated
            </label>
        </div>
        <div id="chart" class="lchart"><div class="loading">Loading...</div></div>
        <div class="note" id="chartNote"></div>
    </div>

    <!-- Hidden: used by KPI logic -->
    <div style="display:none;">
        <span id="kvVisits"></span><span id="kvUniq"></span><span id="kvPages"></span>
        <span id="kvTime"></span><span id="kvBounce"></span>
        <select id="selNonUninovis"></select>
    </div>

    <!-- 4. Top Pages (only when "All pages" is selected) -->
    <div id="tabsSection">
        <div class="tab-row">
            <button class="tab-btn active" data-tab="pages" onclick="showTab('pages',this)">Top Pages</button>
            <button class="tab-btn" data-tab="referrers" onclick="showTab('referrers',this)">Referrers</button>
            <button class="tab-btn" data-tab="countries" onclick="showTab('countries',this)">Countries</button>
            <button class="tab-btn" data-tab="devices" onclick="showTab('devices',this)">Devices</button>
            <div style="flex:1;"></div>
            <label style="font-size:0.75rem;font-weight:600;color:#555;">View:</label>
            <select id="selView" onchange="reloadCurrentTab()" style="padding:4px 6px;border:1px solid #d1d5db;border-radius:6px;font-size:0.75rem;">
                <option value="detailed">Detailed</option>
                <option value="grouped">Grouped</option>
            </select>
            <label style="font-size:0.75rem;font-weight:600;color:#555;margin-left:6px;">Show:</label>
            <select id="selLimit" onchange="reloadCurrentTab()" style="padding:4px 6px;border:1px solid #d1d5db;border-radius:6px;font-size:0.75rem;">
                <option value="10">Top 10</option>
                <option value="20" selected>Top 20</option>
                <option value="50">Top 50</option>
                <option value="-1">All</option>
            </select>
        </div>
        <div class="panel" id="tabContent"><div class="loading">Loading...</div></div>
        <div class="note" id="tabNote" style="margin-top:4px;">Click on a page name to see visits over time (to that page)</div>
    </div>

    <!-- Drill-down panel for a specific page -->
    <div class="panel" id="drillPanel" style="display:none;">
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px;">
            <h3 id="drillTitle" style="flex:1;font-size:0.88rem;color:#2D3876;margin:0;"></h3>
            <button class="tab-btn" onclick="closeDrill()" style="font-size:0.7rem;">&#10005; Close</button>
        </div>
        <div id="drillChart" class="lchart" style="height:140px;"></div>
        <div class="note" id="drillNote"></div>
        <div class="legend" id="drillLegend"></div>
    </div>
</div>

<script>
var API = '/matomo-analytics/api/proxy';
var SITES = {};
var COLORS = { visits: '#2D3876', uniq: '#60a5fa' };
var PALETTE = ['#2D3876','#e74c3c','#27ae60','#f39c12','#8e44ad','#00bcd4','#e67e22','#e91e63'];
var URL_CONFIG = { urls: [] };
var UNINOVIS_COUNTRIES = ['al','de','es','fi','fr','it','lt','nl'];
var chartFilter = { country: 'all' }; // country selected via country bar chart

function $$(id) { return document.getElementById(id); }
function site() {
    var v = $$('selSite').value;
    if (v === 'persite') return 'all';
    if (selectedPageUrl()) return 'all'; // page filter overrides site
    return v;
}
function isPerSite() { return $$('selSite').value === 'persite' && !selectedPageUrl(); }
function per() { return $$('selPeriod').value; }
function rng() { return $$('selRange').value; }
function tabLimit() { return $$('selLimit').value; }
function viewMode() { return $$('selView').value; }
function isAll() { return site() === 'all'; } // true for both 'all' and 'persite'
function fmt(n) { return n == null ? '-' : Number(n).toLocaleString(); }
function fmtT(s) { s = Math.round(s||0); return s < 60 ? s+'s' : Math.floor(s/60)+'m '+(s%60)+'s'; }
function periodLabel() {
    var p = per(), r = rng();
    var n = r.replace('last', '');
    var unit = {day: 'days', week: 'weeks', month: 'months'}[p] || p;
    return 'Last ' + n + ' ' + unit;
}

// Page filter: returns the URL pattern from the dropdown (or '' for all)
function selectedPageUrl() {
    var sel = $$('selPage');
    return sel ? sel.value : '';
}
function selectedPageLabel() {
    var sel = $$('selPage');
    if (!sel || !sel.value) return '';
    return sel.options[sel.selectedIndex].textContent;
}

function populatePageDropdown() {
    var sel = $$('selPage');
    var cur = sel.value;
    // Temporarily disable onchange to prevent recursive loadAll
    sel.onchange = null;
    sel.innerHTML = '<option value="">All pages</option>';
    // Collect configured paths
    var configuredPaths = {};
    var configuredEntries = [];
    if (URL_CONFIG.urls) {
        URL_CONFIG.urls.forEach(function(u) {
            if (!u.url || u.included === false) return;
            configuredPaths[u.url.replace(/\/$/, '')] = true;
            configuredEntries.push(u);
        });
    }
    sel.value = cur || '';
    sel.onchange = function() { loadAll(); };
    // Fetch page data from ALL sites to get accurate visit counts
    q('Actions.getPageUrls', { flat: '1', filter_limit: '-1', idSite: 'all' }).then(function(raw) {
        // Collect visit counts for all pages
        var allPages = {};
        function collect(items) {
            if (!Array.isArray(items)) return;
            items.forEach(function(item) {
                var label = item.label || '';
                var url = item.url || '';
                if (url.indexOf('localhost') !== -1) return;
                if (!label || label === '/') return;
                var norm = label.replace(/\/$/, '');
                if (!allPages[norm]) allPages[norm] = 0;
                allPages[norm] += (item.nb_visits || 0);
            });
        }
        // Always process as multi-site (we forced idSite=all)
        for (var sid in raw) {
            var sd = raw[sid];
            if (typeof sd !== 'object') continue;
            for (var dk in sd) collect(sd[dk]);
        }

        // Rebuild dropdown with counts
        sel.onchange = null;
        sel.innerHTML = '<option value="">All pages</option>';

        // Configured pages with visit counts
        configuredEntries.forEach(function(u) {
            var norm = u.url.replace(/\/$/, '');
            var visits = allPages[norm] || 0;
            // For prefix patterns (like /news), sum all matching sub-pages
            if (!visits) {
                for (var p in allPages) {
                    if (p === norm || p.indexOf(norm + '/') === 0) visits += allPages[p];
                }
            }
            var o = document.createElement('option');
            o.value = u.url;
            o.textContent = (u.description || u.url) + ' (' + fmt(visits) + ')';
            sel.appendChild(o);
        });

        // Other pages (not in config)
        var minV = (URL_CONFIG.minVisits != null) ? URL_CONFIG.minVisits : 100;
        var otherPages = {};
        for (var p in allPages) {
            if (configuredPaths[p]) continue;
            otherPages[p] = allPages[p];
        }
        var sorted = Object.keys(otherPages).filter(function(p) { return otherPages[p] >= minV; })
            .sort(function(a, b) { return otherPages[b] - otherPages[a]; });
        if (sorted.length && configuredEntries.length > 0) {
            var sep = document.createElement('option');
            sep.disabled = true;
            sep.textContent = '── Other pages ──';
            sel.appendChild(sep);
        }
        sorted.forEach(function(path) {
            var o = document.createElement('option');
            o.value = path;
            o.textContent = path + ' (' + pages[path] + ')';
            sel.appendChild(o);
        });
        sel.value = cur || '';
    }).catch(function() {});
}

// URL config helpers
function urlMatches(urlPath, pattern) {
    // Exact match or path-prefix match (pattern must align on path boundaries)
    if (!pattern) return false;
    if (pattern === '/') return urlPath === '/';
    // Normalize: remove trailing slash for comparison
    var p = pattern.replace(/\/$/, '');
    var u = urlPath.replace(/\/$/, '');
    return u === p || u.indexOf(p + '/') === 0 || u.indexOf(p + '?') === 0;
}

function getUrlDescription(urlPath) {
    if (!URL_CONFIG.urls || !URL_CONFIG.urls.length) return null;
    for (var i = 0; i < URL_CONFIG.urls.length; i++) {
        var u = URL_CONFIG.urls[i];
        if (urlMatches(urlPath, u.url) && u.description) {
            return u.description;
        }
    }
    return null;
}

function isUrlExcluded(urlPath) {
    if (!URL_CONFIG.urls || !URL_CONFIG.urls.length) return false;
    for (var i = 0; i < URL_CONFIG.urls.length; i++) {
        var u = URL_CONFIG.urls[i];
        if (urlMatches(urlPath, u.url) && u.included === false) {
            return true;
        }
    }
    return false;
}

function groupByDescription(items) {
    // Group pages that share the same description, summing their visits.
    // Pages without a matching description remain as individual rows.
    var groups = {};
    var ungrouped = [];
    items.forEach(function(r) {
        var desc = getUrlDescription(r.label || '');
        if (desc) {
            if (!groups[desc]) groups[desc] = { label: desc, nb_visits: 0, nb_hits: 0, _urls: [] };
            groups[desc].nb_visits += (r.nb_visits || 0);
            groups[desc].nb_hits += (r.nb_hits || 0);
            groups[desc]._urls.push(r.label);
        } else {
            ungrouped.push(r);
        }
    });
    var grouped = Object.values(groups);
    // Merge grouped + ungrouped and sort by visits descending
    return grouped.concat(ungrouped).sort(function(a, b) { return (b.nb_visits||0) - (a.nb_visits||0); });
}

async function loadUrlConfig() {
    try {
        var resp = await fetch('/matomo-analytics/api/url-config');
        URL_CONFIG = await resp.json();
    } catch(e) { URL_CONFIG = { urls: [] }; }
    populatePageDropdown();
}

// Short label for date keys
function shortDate(k) {
    if (k.length === 10) return k.substring(5);
    if (k.indexOf(',') > -1) return k.split(',')[0].substring(5);
    return k.length > 7 ? k.substring(0,7) : k;
}

// ── Shared line chart renderer ──
// series: [ { name, data: {dateKey: value}, color } ]
function renderLineChart(el, keys, series) {
    if (!keys.length || !series.length) {
        el.innerHTML = '<span class="error">No data for this selection.</span>'; return;
    }

    var W = el.clientWidth || 600;
    var H = el.clientHeight || 160;
    var pad = { top: 10, right: 12, bottom: 4, left: 40 };
    var cw = W - pad.left - pad.right;
    var ch = H - pad.top - pad.bottom;

    var maxV = 0;
    series.forEach(function(s) {
        keys.forEach(function(k) { if ((s.data[k]||0) > maxV) maxV = s.data[k]; });
    });
    if (!maxV) maxV = 1;

    function x(i) { return pad.left + (keys.length === 1 ? cw/2 : (i / (keys.length - 1)) * cw); }
    function y(v) { return pad.top + ch - (v / maxV) * ch; }

    var svg = '<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none">';

    // Y-axis grid
    var gridSteps = 4;
    for (var g = 0; g <= gridSteps; g++) {
        var gy = pad.top + (g / gridSteps) * ch;
        var gv = Math.round(maxV * (1 - g / gridSteps));
        svg += '<line x1="'+pad.left+'" y1="'+gy+'" x2="'+(W-pad.right)+'" y2="'+gy+'" class="grid-line"/>';
        svg += '<text x="'+(pad.left-4)+'" y="'+(gy+3)+'" class="axis-label" text-anchor="end">'+fmt(gv)+'</text>';
    }

    // Draw each series
    series.forEach(function(s) {
        var path = '';
        keys.forEach(function(k, i) {
            path += (i === 0 ? 'M' : 'L') + x(i).toFixed(1) + ',' + y(s.data[k]||0).toFixed(1);
        });
        svg += '<path d="'+path+'" class="line" style="stroke:'+s.color+';"/>';
        keys.forEach(function(k, i) {
            svg += '<circle cx="'+x(i).toFixed(1)+'" cy="'+y(s.data[k]||0).toFixed(1)+'" r="'+(series.length > 4 ? 3 : 4)+'" class="dot" fill="'+s.color+'" stroke="#fff" stroke-width="1"/>';
        });
    });

    svg += '</svg>';

    // X-axis labels
    var xlabels = '<div class="x-labels">';
    var step = Math.max(1, Math.floor(keys.length / 8));
    keys.forEach(function(k, i) {
        if (i % step === 0 || i === keys.length - 1) {
            xlabels += '<span>'+shortDate(k)+'</span>';
        }
    });
    xlabels += '</div>';

    // Legend
    var legendHtml = '<div class="legend">';
    series.forEach(function(s) {
        legendHtml += '<div class="legend-item"><div class="ldot" style="background:'+s.color+';"></div> '+s.name+'</div>';
    });
    legendHtml += '</div>';

    // Tooltip
    var tooltipId = 'tip_' + Math.random().toString(36).substr(2,6);
    var tooltipDiv = '<div class="chart-tooltip" id="'+tooltipId+'"></div>';

    el.innerHTML = tooltipDiv + legendHtml + svg + xlabels;

    var svgEl = el.querySelector('svg');
    var tipEl = el.querySelector('#'+tooltipId);
    svgEl.addEventListener('mousemove', function(e) {
        var rect = svgEl.getBoundingClientRect();
        var mx = e.clientX - rect.left;
        var idx = Math.round((mx - pad.left) / (cw || 1) * (keys.length - 1));
        idx = Math.max(0, Math.min(keys.length - 1, idx));
        var k = keys[idx];
        var text = k;
        series.forEach(function(s) { text += '\n' + s.name + ': ' + fmt(s.data[k]||0); });
        tipEl.textContent = text;
        tipEl.classList.add('show');
        tipEl.style.left = Math.min(mx, W - 120) + 'px';
        tipEl.style.top = '0px';
    });
    svgEl.addEventListener('mouseleave', function() {
        tipEl.classList.remove('show');
    });
}

// Helper to build series from visits/uniques dicts
function makeStandardSeries(visits, uniques) {
    var s = [];
    if (visits) s.push({ name: 'Visits', data: visits, color: COLORS.visits });
    if (uniques) s.push({ name: 'Unique', data: uniques, color: COLORS.uniq });
    return s;
}

async function loadSites() {
    try {
        var r = await (await fetch('/matomo-analytics/api/sites')).json();
        var sel = $$('selSite');
        sel.innerHTML = '';
        // Individual sites first
        (r.sites||[]).forEach(function(s) {
            SITES[s.id] = s.name;
            var o = document.createElement('option');
            o.value = s.id; o.textContent = s.name;
            sel.appendChild(o);
        });
        // Separator + aggregate options
        var sep = document.createElement('option');
        sep.disabled = true; sep.textContent = '──────────';
        sel.appendChild(sep);
        var oAll = document.createElement('option');
        oAll.value = 'all'; oAll.textContent = 'All sites (aggregated)';
        sel.appendChild(oAll);
        var oPer = document.createElement('option');
        oPer.value = 'persite'; oPer.textContent = 'All sites (separately)';
        sel.appendChild(oPer);
        // Default to first site
        sel.value = 'all';
    } catch(e) {}
}

async function q(method, extra) {
    var p = new URLSearchParams({ method:method, period:per(), date:rng(), idSite:site() });
    if (extra) for (var k in extra) p.set(k, extra[k]);
    var r = await fetch(API+'?'+p.toString());
    if (!r.ok) throw new Error('API '+r.status);
    return r.json();
}

// ── Client-side page-filtered visit series ──
// Since Matomo Cloud segments don't work with this token,
// we fetch Actions.getPageUrls and sum visits for matching pages per date.
// exactMatch: true = only exact label match (for page dropdown)
//             false = prefix match (for drill-down from grouped view)
// Find the configured siteId restriction for a page URL
function getConfiguredSiteId(pageUrl) {
    if (!URL_CONFIG.urls) return '';
    var norm = pageUrl.replace(/\/$/, '');
    for (var i = 0; i < URL_CONFIG.urls.length; i++) {
        var u = URL_CONFIG.urls[i];
        if (u.url && u.url.replace(/\/$/, '') === norm && u.siteId) return u.siteId;
    }
    return '';
}

async function getPageFilteredSeries(pagePattern, exactMatch) {
    var raw = await q('Actions.getPageUrls', { flat: '1', filter_limit: '-1' });
    var visits = {}, uniques = {};
    var restrictSite = getConfiguredSiteId(pagePattern);

    function matches(label, pattern) {
        if (exactMatch) {
            var l = label.replace(/\/$/, '').split('?')[0];
            var p = pattern.replace(/\/$/, '').split('?')[0];
            return l === p;
        }
        return urlMatches(label, pattern);
    }

    function processItems(items, dk) {
        if (!Array.isArray(items)) return;
        items.forEach(function(item) {
            var label = item.label || '';
            var url = item.url || '';
            if (url.indexOf('localhost') !== -1) return;
            if (!matches(label, pagePattern)) return;
            if (!visits[dk]) visits[dk] = 0;
            if (!uniques[dk]) uniques[dk] = 0;
            visits[dk] += (item.nb_visits || 0);
            uniques[dk] += (item.sum_daily_nb_uniq_visitors || 0);
        });
    }

    if (isAll()) {
        for (var sid in raw) {
            if (restrictSite && sid !== restrictSite) continue;
            var sd = raw[sid];
            if (typeof sd !== 'object' || !sd) continue;
            for (var dk in sd) processItems(sd[dk], dk);
        }
    } else {
        for (var dk in raw) processItems(raw[dk], dk);
    }
    return { visits: visits, uniques: uniques };
}

// ── Page + Country cross-reference via Live API ──
// Fetches visits only from the site that has the page, then caches.
var liveCache = { key: '', visits: [], unavailable: false };

// Detect which site(s) contain a given page path
async function findSitesForPage(pagePattern, exactMatch) {
    // If a specific site is configured for this page, use only that site
    var restrictSite = getConfiguredSiteId(pagePattern);
    if (restrictSite) return [restrictSite];
    if (!isAll()) return [site()];
    // Fetch page data from all sites and check which ones have the page
    var raw = await q('Actions.getPageUrls', { flat: '1', filter_limit: '-1' });
    var found = {};
    for (var sid in raw) {
        var sd = raw[sid];
        if (typeof sd !== 'object' || !sd) continue;
        for (var dk in sd) {
            if (!Array.isArray(sd[dk])) continue;
            for (var i = 0; i < sd[dk].length; i++) {
                var item = sd[dk][i];
                var label = item.label || '';
                var url = item.url || '';
                if (url.indexOf('localhost') !== -1) continue;
                var match = exactMatch
                    ? label.replace(/\/$/, '') === pagePattern.replace(/\/$/, '')
                    : urlMatches(label, pagePattern);
                if (match) { found[sid] = true; break; }
            }
            if (found[sid]) break;
        }
    }
    var result = Object.keys(found);
    return result.length ? result : Object.keys(SITES);
}

async function fetchLiveVisits(pagePattern, exactMatch) {
    var p = per(), r = rng();
    var numPeriods = parseInt(r.replace('last','')) || 8;
    var dateRange = computeDateRange(p, numPeriods);
    var cacheKey = pagePattern + '|' + dateRange;

    if (liveCache.key === cacheKey) return;

    var siteIds = await findSitesForPage(pagePattern, exactMatch);
    var allVisits = [];
    var unavailable = false;

    var fetches = siteIds.map(function(sid) {
        return q('Live.getLastVisitsDetails', {
            idSite: sid, period: 'range', date: dateRange, filter_limit: '10000'
        }).then(function(raw) {
            if (raw && raw.result === 'error') { unavailable = true; return; }
            if (Array.isArray(raw)) allVisits = allVisits.concat(raw);
        }).catch(function(e) {
            console.error('Live API error for site ' + sid + ':', e);
            unavailable = true;
        });
    });
    await Promise.all(fetches);

    liveCache = { key: cacheKey, visits: allVisits, unavailable: unavailable };
}

function filterLiveVisits(pagePattern, countryCode, exactMatch) {
    var p = per();
    var numPeriods = parseInt(rng().replace('last','')) || 8;
    var visits = {}, uniques = {};

    liveCache.visits.forEach(function(v) {
        var vCountry = v.countryCode || 'xx';

        // Country filter
        var countryMatch = false;
        if (countryCode === 'all') countryMatch = true;
        else if (countryCode === 'uninovis') countryMatch = UNINOVIS_COUNTRIES.indexOf(vCountry) !== -1;
        else if (countryCode === 'non-uninovis') countryMatch = UNINOVIS_COUNTRIES.indexOf(vCountry) === -1;
        else countryMatch = (vCountry === countryCode);
        if (!countryMatch) return;

        // Page filter
        var actions = v.actionDetails || [];
        var pageMatch = false;
        for (var ai = 0; ai < actions.length; ai++) {
            var aUrl = actions[ai].url || '';
            if (aUrl.indexOf('localhost') !== -1) continue;
            if (actions[ai].type !== 'action') continue;
            var path = aUrl.replace(/^https?:\/\/[^\/]+/, '');
            if (exactMatch) {
                if (path.replace(/\/$/, '') === pagePattern.replace(/\/$/, '')) { pageMatch = true; break; }
            } else {
                if (urlMatches(path, pagePattern)) { pageMatch = true; break; }
            }
        }
        if (!pageMatch) return;

        var visitDate = v.serverDate || '';
        var dk = dateToBucket(visitDate, p, numPeriods);
        if (!dk) return;

        if (!visits[dk]) visits[dk] = 0;
        if (!uniques[dk]) uniques[dk] = 0;
        visits[dk]++;
        uniques[dk]++;
    });

    return { visits: visits, uniques: uniques };
}

async function getPageCountrySeries(pagePattern, countryCode, exactMatch) {
    await fetchLiveVisits(pagePattern, exactMatch);
    if (liveCache.unavailable && liveCache.visits.length === 0) return null;
    return filterLiveVisits(pagePattern, countryCode, exactMatch);
}

// Compute a date range string for the Live API (e.g., "2026-06-01,2026-07-12")
function computeDateRange(period, numPeriods) {
    var end = new Date();
    var start = new Date();
    if (period === 'day') {
        start.setDate(end.getDate() - numPeriods);
    } else if (period === 'week') {
        // Align to Monday (Matomo weeks start on Monday)
        var day = end.getDay(); // 0=Sun
        var endMonday = new Date(end);
        endMonday.setDate(end.getDate() - (day === 0 ? 6 : day - 1));
        var startMonday = new Date(endMonday);
        startMonday.setDate(endMonday.getDate() - (numPeriods - 1) * 7);
        start = startMonday;
        // End on Sunday of current week
        end = new Date(endMonday);
        end.setDate(endMonday.getDate() + 6);
    } else if (period === 'month') {
        start.setMonth(end.getMonth() - numPeriods);
        start.setDate(1);
    }
    function fmt(d) {
        return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
    }
    return fmt(start) + ',' + fmt(end);
}

// Assign a visit date to a period bucket key matching the format from other Matomo APIs
function dateToBucket(dateStr, period, numPeriods) {
    if (!dateStr) return null;
    if (period === 'month') return dateStr.substring(0, 7);
    if (period === 'day') return dateStr;
    if (period === 'week') {
        // Find Monday of the week
        var d = new Date(dateStr + 'T00:00:00');
        var day = d.getDay(); // 0=Sun
        var diff = (day === 0 ? 6 : day - 1);
        var monday = new Date(d);
        monday.setDate(d.getDate() - diff);
        var sunday = new Date(monday);
        sunday.setDate(monday.getDate() + 6);
        function fmt(d) {
            return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
        }
        return fmt(monday) + ',' + fmt(sunday);
    }
    return dateStr;
}

        var useVisits = (met !== 'unique');

                var totalVal = useVisits ? totalV : totalU;

                var color = isUninovis ? '#2D3876' : '#e74c3c';
                html += '<div class="hrow">'
                    + '<div class="hlbl" title="'+c.label+'">'+c.label+'</div>'
                    + '<div class="htrack"><div class="hfill" style="width:'+(v/max*100)+'%;background:'+color+';"></div></div>'
                    + '<div class="hval">'+fmt(v)+'</div></div>';

    } catch(e) {
        el.innerHTML = '<span class="error">Error: '+e.message+'</span>';
    }
}

// Unwrap values that Matomo may return as [{nb_visits:N}] instead of N
function unwrap(v) {
    if (Array.isArray(v) && v.length === 1 && typeof v[0] === 'object') return v[0].nb_visits || v[0].nb_uniq_visitors || 0;
    if (Array.isArray(v) && v.length === 0) return 0;
    return v;
}

// Normalise a date-keyed object: unwrap arrays to plain values
function norm(data) {
    var out = {};
    for (var k in data) {
        var v = data[k];
        out[k] = unwrap(v);
    }
    return out;
}

// ── Flatten multi-site data (numeric) ──
function flatN(data) {
    if (!isAll()) return norm(data);
    var m = {};
    for (var sid in data) {
        var sd = data[sid]; if (typeof sd !== 'object' || !sd) continue;
        for (var dk in sd) {
            var v = unwrap(sd[dk]);
            if (typeof v === 'number') m[dk] = (m[dk]||0) + v;
            else if (typeof v === 'object' && v && !Array.isArray(v)) {
                if (!m[dk]) m[dk] = {};
                for (var f in v) if (typeof v[f] === 'number') m[dk][f] = (m[dk][f]||0) + v[f];
            }
        }
    }
    return m;
}

// ── Flatten multi-site arrays (pages, referrers, etc.) ──
function flatA(data) {
    if (!isAll()) return data;
    var m = {};
    for (var sid in data) {
        var sd = data[sid]; var arrs = [];
        if (Array.isArray(sd)) arrs.push(sd);
        else if (typeof sd === 'object') for (var k in sd) if (Array.isArray(sd[k])) arrs.push(sd[k]);
        arrs.forEach(function(a) { a.forEach(function(i) {
            var url = i.url||'';
            if (url.indexOf('localhost') !== -1) return;
            var key = i.label||'';
            // Skip if this page is restricted to a different site
            var restrictSite = getConfiguredSiteId(key);
            if (restrictSite && restrictSite !== sid) return;
            if (!m[key]) m[key] = {label:key, nb_visits:0, nb_hits:0, url:url, code:i.code||''};
            m[key].nb_visits += (i.nb_visits||0);
            m[key].nb_hits += (i.nb_hits||0);
        }); });
    }
    return Object.values(m).sort(function(a,b){return b.nb_visits-a.nb_visits;});
}

// Arrayify single-site multi-period
function arrify(data) {
    if (Array.isArray(data)) return data;
    var m = {};
    if (typeof data !== 'object') return [];
    Object.values(data).forEach(function(arr) {
        if (!Array.isArray(arr)) return;
        arr.forEach(function(i) {
            var url = i.url||'';
            if (url.indexOf('localhost') !== -1) return;
            var k = i.label||'';
            if (!m[k]) m[k] = {label:k, nb_visits:0, nb_hits:0, url:url, code:i.code||''};
            m[k].nb_visits += (i.nb_visits||0);
            m[k].nb_hits += (i.nb_hits||0);
        });
    });
    return Object.values(m).sort(function(a,b){return b.nb_visits-a.nb_visits;});
}

// ── Extract per-country time series from UserCountry.getCountry ──
function extractCountrySeries(countryData, code) {
    // countryData: { date: [ {code, nb_visits, nb_uniq_visitors, ...}, ... ] }
    // or multi-site: { siteId: { date: [...] } }
    var series = {};

    function processDateMap(dateMap) {
        for (var dk in dateMap) {
            if (!Array.isArray(dateMap[dk])) continue;
            var match = dateMap[dk].filter(function(c) { return c.code === code; });
            var visits = 0, uniq = 0;
            match.forEach(function(c) { visits += (c.nb_visits||0); uniq += (c.nb_uniq_visitors||0); });
            if (!series[dk]) series[dk] = { visits: 0, uniq: 0 };
            series[dk].visits += visits;
            series[dk].uniq += uniq;
        }
    }

    if (isAll()) {
        for (var sid in countryData) processDateMap(countryData[sid]);
    } else {
        processDateMap(countryData);
    }
    return series;
}

// ── KPIs ──
async function loadKPIs() {
    try {
        var cc = selectedCountry();
        var pageFilter = selectedPageUrl();

        if (pageFilter) {
            var resolvedCC = cc.indexOf('other:') === 0 ? cc.substring(6) : cc;
            var kpiData = null;
            if (cc !== 'all') {
                var countryParam = (cc === 'uninovis' || cc === 'non-uninovis') ? cc : resolvedCC;
                kpiData = await getPageCountrySeries(pageFilter, countryParam, true);
                if (kpiData && Object.keys(kpiData.visits).length === 0) kpiData = null;
            }
            if (!kpiData) {

            }
            var totV = 0;
            for (var dk in kpiData.visits) totV += kpiData.visits[dk];
            $$('kvVisits').textContent = fmt(totV);
            $$('kvUniq').textContent = '-';
            $$('kvPages').textContent = '-';
            $$('kvTime').textContent = '-';
            $$('kvBounce').textContent = '-';
            return;
        }

        if (cc !== 'all') {
            var raw = await q('UserCountry.getCountry', { filter_limit: '-1' });
            var resolvedCC = cc.indexOf('other:') === 0 ? cc.substring(6) : cc;
            var codes = (cc === 'uninovis') ? UNINOVIS_COUNTRIES :
                        (cc === 'non-uninovis') ? null : [resolvedCC];
            var totV = 0, totU = 0;
            if (cc === 'non-uninovis') {
                var allSeries = extractAllCountrySeries(raw);
                for (var code in allSeries) {
                    if (UNINOVIS_COUNTRIES.indexOf(code) === -1) {
                        var s = allSeries[code];
                        for (var dk in s) { totV += s[dk].visits; totU += s[dk].uniq; }
                    }
                }
            } else {
                codes.forEach(function(code) {
                    var series = extractCountrySeries(raw, code);
                    for (var dk in series) { totV += series[dk].visits; totU += series[dk].uniq; }
                });
            }
            $$('kvVisits').textContent = fmt(totV);
            $$('kvUniq').textContent = fmt(totU);
            $$('kvPages').textContent = '-';
            $$('kvTime').textContent = '-';
            $$('kvBounce').textContent = '-';
            return;
        }

        var raw = await q('VisitsSummary.get');
        var data = flatN(raw);
        var t = {nb_visits:0,nb_actions:0,nb_uniq_visitors:0,avg_time_on_site:0,bounce_rate:''};
        var keys = Object.keys(data);
        if (keys.length && typeof data[keys[0]] === 'object' && data[keys[0]] !== null) {
            var n = 0;
            keys.forEach(function(k) {
                var d = data[k]; if (!d || typeof d !== 'object') return;
                t.nb_visits += (d.nb_visits||0);
                t.nb_actions += (d.nb_actions||0);
                t.nb_uniq_visitors += (d.nb_uniq_visitors||0);
                t.avg_time_on_site += (d.avg_time_on_site||0);
                var br = parseFloat(String(d.bounce_rate||'0').replace('%',''))||0;
                t.bounce_rate = (parseFloat(t.bounce_rate)||0) + br;
                n++;
            });
            if (n) { t.avg_time_on_site /= n; t.bounce_rate = (t.bounce_rate/n).toFixed(0)+'%'; }
        } else { t = data; }
        $$('kvVisits').textContent = fmt(t.nb_visits);
        $$('kvUniq').textContent = fmt(t.nb_uniq_visitors);
        $$('kvPages').textContent = fmt(t.nb_actions);
        $$('kvTime').textContent = fmtT(t.avg_time_on_site);
        $$('kvBounce').textContent = t.bounce_rate || '-';
    } catch(e) { console.error('KPIs:', e); }
}

// Extract all countries as { code: { date: {visits, uniq} } }
function extractAllCountrySeries(countryData) {
    var all = {};
    function processDateMap(dateMap) {
        for (var dk in dateMap) {
            if (!Array.isArray(dateMap[dk])) continue;
            dateMap[dk].forEach(function(c) {
                var code = c.code;
                if (!code || code === 'xx') return;
                if (!all[code]) all[code] = {};
                if (!all[code][dk]) all[code][dk] = { visits: 0, uniq: 0 };
                all[code][dk].visits += (c.nb_visits||0);
                all[code][dk].uniq += (c.nb_uniq_visitors||0);
            });
        }
    }
    if (isAll()) {
        for (var sid in countryData) processDateMap(countryData[sid]);
    } else {
        processDateMap(countryData);
    }
    return all;
}

// Extract country series for a specific site from multi-site data
// countryData structure: { siteId: { date: [ {code, nb_visits, ...} ] } }
function extractCountrySeriesForSite(countryData, siteId, countryCode) {
    var series = {};
    var siteData = countryData[siteId];
    if (!siteData || typeof siteData !== 'object') return series;
    for (var dk in siteData) {
        if (!Array.isArray(siteData[dk])) continue;
        var match = siteData[dk].filter(function(c) { return c.code === countryCode; });
        var visits = 0, uniq = 0;
        match.forEach(function(c) { visits += (c.nb_visits||0); uniq += (c.nb_uniq_visitors||0); });
        if (visits > 0 || uniq > 0) {
            series[dk] = { visits: visits, uniq: uniq };
        }
    }
    return series;
}

function extractAllCountriesForSite(countryData, siteId) {
    var totals = {};
    var siteData = countryData[siteId];
    if (!siteData || typeof siteData !== 'object') return totals;
    for (var dk in siteData) {
        if (!Array.isArray(siteData[dk])) continue;
        siteData[dk].forEach(function(c) {
            var code = c.code;
            if (!code || code === 'xx') return;
            if (!totals[dk]) totals[dk] = { visits: 0, uniq: 0 };
            totals[dk].visits += (c.nb_visits||0);
            totals[dk].uniq += (c.nb_uniq_visitors||0);
        });
    }
    return totals;
}

                } else if (cc === 'uninovis') {

                    UNINOVIS_COUNTRIES.forEach(function(code) {

                        for (var dk in cs) {
                            if (!siteSeries[dk]) siteSeries[dk] = { visits: 0, uniq: 0 };
                            siteSeries[dk].visits += cs[dk].visits;
                            siteSeries[dk].uniq += cs[dk].uniq;
                        }
                    });
                } else if (cc === 'non-uninovis') {
                    siteSeries = {};
                    var siteData = rawC[sid];
                    if (siteData) {
                        for (var dk in siteData) {
                            if (!Array.isArray(siteData[dk])) continue;
                            siteData[dk].forEach(function(c) {
                                if (!c.code || c.code === 'xx') return;
                                if (UNINOVIS_COUNTRIES.indexOf(c.code) !== -1) return;
                                if (!siteSeries[dk]) siteSeries[dk] = { visits: 0, uniq: 0 };
                                siteSeries[dk].visits += (c.nb_visits||0);
                                siteSeries[dk].uniq += (c.nb_uniq_visitors||0);
                            });
                        }
                    }
                } else {
                    siteSeries = extractCountrySeriesForSite(rawC, sid, resolvedCC);
                }
                var data = {};

            chartSeries.forEach(function(s) { keys.forEach(function(k) { if (!(k in s.data)) s.data[k] = 0; }); });
        } else {

                                visits[dk] += s[dk].visits;
                                uniques[dk] += s[dk].uniq;

// ── Tabs ──
var tabCache = {};
var _tabGen = 0;
async function loadTab(tab) {
    var gen = ++_tabGen;
    var el = $$('tabContent');
    var lim = tabLimit();
    var vm = viewMode();
    var cc = selectedCountry();
    var ck = [tab,site(),cc,per(),rng(),selectedPageUrl(),lim,vm].join('_');
    if (tabCache[ck]) { el.innerHTML = tabCache[ck]; return; }
    el.innerHTML = '<div class="loading">Loading...</div>';
    try {
        var raw, items, html;
        var fetchLimit = lim === '-1' ? '-1' : String(Math.max(parseInt(lim)*2, 100));
        var countryFiltered = (cc !== 'all');

        if (countryFiltered && (tab === 'pages' || tab === 'referrers' || tab === 'devices')) {
            // Country-filtered: use Live API
            el.innerHTML = '<div class="loading">Loading (Live API)...</div>';
            var resolvedCC = cc.indexOf('other:') === 0 ? cc.substring(6) : cc;
            var p = per(), r = rng();
            var numPeriods = parseInt(r.replace('last','')) || 8;
            var dateRange = computeDateRange(p, numPeriods);
            var siteIds = isAll() ? Object.keys(SITES) : [site()];
            var allLiveVisits = [];
            var fetches = siteIds.map(function(sid) {
                return q('Live.getLastVisitsDetails', {
                    idSite: sid, period: 'range', date: dateRange, filter_limit: '10000'
                }).then(function(raw) {
                    if (Array.isArray(raw)) allLiveVisits = allLiveVisits.concat(raw);
                }).catch(function() {});
            });
            await Promise.all(fetches);
            if (gen !== _tabGen) return;

            // Filter visits by country
            function matchCountry(vCountry) {
                if (cc === 'uninovis') return UNINOVIS_COUNTRIES.indexOf(vCountry) !== -1;
                if (cc === 'non-uninovis') return UNINOVIS_COUNTRIES.indexOf(vCountry) === -1 && vCountry !== 'xx';
                return vCountry === resolvedCC;
            }

            var counts = {};
            allLiveVisits.forEach(function(v) {
                if (!matchCountry(v.countryCode || 'xx')) return;

                if (tab === 'pages') {
                    var actions = v.actionDetails || [];
                    var seen = {};
                    actions.forEach(function(a) {
                        var url = a.url || '';
                        if (url.indexOf('localhost') !== -1) return;
                        if (a.type !== 'action') return;
                        var path = url.replace(/^https?:\/\/[^\/]+/, '');
                        if (!seen[path]) {
                            seen[path] = true;
                            if (!counts[path]) counts[path] = { label: path, nb_visits: 0 };
                            counts[path].nb_visits++;
                        }
                    });
                } else if (tab === 'referrers') {
                    var ref = v.referrerName || v.referrerUrl || 'Direct Entry';
                    if (!counts[ref]) counts[ref] = { label: ref, nb_visits: 0 };
                    counts[ref].nb_visits++;
                } else if (tab === 'devices') {
                    var dev = v.deviceType || 'Unknown';
                    if (!counts[dev]) counts[dev] = { label: dev, nb_visits: 0 };
                    counts[dev].nb_visits++;
                }
            });
            items = Object.values(counts).sort(function(a,b) { return b.nb_visits - a.nb_visits; });
        } else {
            switch (tab) {
                case 'pages':
                    raw = await q('Actions.getPageUrls', {flat:'1',filter_limit:fetchLimit});
                    items = isAll() ? flatA(raw) : arrify(raw); break;
                case 'referrers':
                    raw = await q('Referrers.getWebsites', {filter_limit:fetchLimit});
                    items = isAll() ? flatA(raw) : arrify(raw); break;
                case 'countries':
                    raw = await q('UserCountry.getCountry', {filter_limit:fetchLimit});
                    items = isAll() ? flatA(raw) : arrify(raw); break;
                case 'devices':
                    raw = await q('DevicesDetection.getType', {filter_limit:fetchLimit});
                    items = isAll() ? flatA(raw) : arrify(raw); break;
            }
            if (gen !== _tabGen) return;
            // For countries tab with country filter: filter from API data
            if (tab === 'countries' && countryFiltered && items) {
                var resolvedCC2 = cc.indexOf('other:') === 0 ? cc.substring(6) : cc;
                items = items.filter(function(r) {
                    var code = (r.code || r.label || '').toLowerCase();
                    if (cc === 'uninovis') return UNINOVIS_COUNTRIES.indexOf(code) !== -1;
                    if (cc === 'non-uninovis') return UNINOVIS_COUNTRIES.indexOf(code) === -1;
                    return code === resolvedCC2;
                });
            }
        }
        // For pages tab: apply exclusions, min visits, optionally group
        if (tab === 'pages') {
            // When country-filtered, don't apply minVisits (counts are naturally lower)
            var minV = countryFiltered ? 0 : ((URL_CONFIG.minVisits != null) ? URL_CONFIG.minVisits : 100);
            items = items.filter(function(r) {
                if (URL_CONFIG.urls && URL_CONFIG.urls.length && isUrlExcluded(r.label||'')) return false;
                // Apply min visits; only bypass for pages explicitly configured (exact URL match in config)
                if (minV > 0 && (r.nb_visits||0) < minV) {
                    var isConfigured = URL_CONFIG.urls && URL_CONFIG.urls.some(function(u) {
                        return u.url && u.included !== false && u.url.replace(/\/$/,'') === (r.label||'').replace(/\/$/,'');
                    });
                    if (!isConfigured) return false;
                }
                return true;
            });
            if (vm === 'grouped') {
                items = groupByDescription(items);
            }
        }
        // Apply limit
        if (lim !== '-1') {
            items = items.slice(0, parseInt(lim));
        }
        if (gen !== _tabGen) return;
        html = renderH(items, tab);
        tabCache[ck] = html;
        el.innerHTML = html;
    } catch(e) { el.innerHTML = '<span class="error">Error: '+e.message+'</span>'; }
}

function reloadCurrentTab() {
    tabCache = {};
    var act = document.querySelector('.tab-btn.active');
    loadTab(act ? act.dataset.tab : 'pages');
}

function renderH(items, tab) {
    if (!items || !items.length) return '<p style="color:#888;font-size:0.85rem;">No data.</p>';
    var isPages = (tab === 'pages');
    var max = Math.max.apply(null, items.map(function(r){return r.nb_visits||0;}))||1;
    return items.map(function(r) {
        var l = r.label||'?', v = r.nb_visits||0;
        var display = l;
        var tooltip = l;
        var clickAttr = '';
        if (isPages) {
            if (r._urls) {
                tooltip = r._urls.join('\n');
                var patternUrl = findConfigUrlForLabel(r._urls[0]);
                if (patternUrl) {
                    clickAttr = ' onclick="openDrill(\''+escAttr(patternUrl)+'\',\''+escAttr(display)+'\',true)"';
                }
            } else {
                // Show description only for exact config matches (not prefix matches)
                if (URL_CONFIG.urls) {
                    for (var ui = 0; ui < URL_CONFIG.urls.length; ui++) {
                        var uc = URL_CONFIG.urls[ui];
                        if (uc.url && uc.description && uc.url.replace(/\/$/,'') === l.replace(/\/$/,'')) {
                            display = uc.description;
                            tooltip = l;
                            break;
                        }
                    }
                }
                clickAttr = ' onclick="openDrill(\''+escAttr(l)+'\',\''+escAttr(display)+'\',false)"';
            }
        }
        return '<div class="hrow"'+clickAttr+' style="'+(isPages ? 'cursor:pointer;' : '')+'">'
            + '<div class="hlbl" title="'+tooltip.replace(/"/g,'&quot;')+'">'+display+'</div>'
            + '<div class="htrack"><div class="hfill" style="width:'+(v/max*100)+'%;"></div></div>'
            + '<div class="hval">'+fmt(v)+'</div></div>';
    }).join('');
}

function escAttr(s) { return s.replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/"/g,'&quot;'); }

function findConfigUrlForLabel(urlPath) {
    if (!URL_CONFIG.urls || !URL_CONFIG.urls.length) return null;
    for (var i = 0; i < URL_CONFIG.urls.length; i++) {
        var u = URL_CONFIG.urls[i];
        if (u.url && urlMatches(urlPath, u.url)) return u.url;
    }
    return null;
}

function showTab(tab, btn) {
    document.querySelectorAll('.tab-btn').forEach(function(b){b.classList.remove('active');});
    if (btn) btn.classList.add('active');
    loadTab(tab);

}

function closeDrill() {
    $$('drillPanel').style.display = 'none';
}

async function loadDrillChart() {
    var el = $$('drillChart');
    var noteEl = $$('drillNote');
    el.innerHTML = '<div class="loading">Loading...</div>';
    el.className = 'lchart';
    noteEl.textContent = '';

    try {
        var pageSeries = await getPageFilteredSeries(drillState.pagePattern, drillState.exact);
        var chartSeries = makeStandardSeries(pageSeries.visits, null);
        var keys = Object.keys(pageSeries.visits).sort();
        renderLineChart(el, keys, chartSeries);
    } catch(e) {
        el.innerHTML = '<span class="error">Error: '+e.message+'</span>';
    }
}

Promise.all([loadSites(), loadUrlConfig()]).then(function(){ loadAll(true); });
</script>
