<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UNINOVIS Admin Tools (UAT)</title>
    <link rel="stylesheet" href="/static/nav.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f0f2f5;
            color: #333;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 20px;
        }
        .header { text-align: center; margin-bottom: 12px; }
        .header h1 { color: #4250b3; font-size: 1.5em; margin-bottom: 4px; }
        .header .subtitle { color: #666; font-size: 0.85em; }

        .auth-bar {
            text-align: center; margin-bottom: 12px;
            font-size: 0.9em; color: #666;
        }
        .auth-bar button {
            background: #e9ecef; border: 1px solid #ccc; border-radius: 4px;
            padding: 5px 14px; cursor: pointer; font-size: 0.85em; margin-left: 6px;
        }
        .auth-bar button:hover { background: #d0d4d9; }

        .tools-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 12px;
            max-width: 960px;
            width: 100%;
        }
        .tool-card {
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            padding: 16px 16px;
            text-decoration: none;
            color: #333;
            transition: transform 0.15s, box-shadow 0.15s;
            display: flex;
            flex-direction: column;
            border-left: 4px solid #4250b3;
        }
        .tool-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(0,0,0,0.12);
        }
        .tool-card .tool-icon {
            font-size: 1.5em;
            margin-bottom: 6px;
        }
        .tool-card h2 {
            color: #4250b3;
            font-size: 0.95em;
            margin-bottom: 4px;
        }
        .tool-card p {
            color: #666;
            font-size: 0.78em;
            line-height: 1.4;
            flex: 1;
        }
        .tool-card .tool-tag {
            margin-top: 8px;
            font-size: 0.68em;
            font-weight: 600;
            padding: 3px 10px;
            border-radius: 10px;
            display: inline-block;
            align-self: flex-start;
        }
        .tag-active { background: #e8e0f0; color: #374399; }
        .tag-pilot { background: #cce5ff; color: #004085; }
        .tag-soon { background: #fff3cd; color: #856404; }

        .footer {
            margin-top: 48px;
            text-align: center;
            color: #aaa;
            font-size: 0.8em;
        }

        /* Login modal */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); z-index: 100; align-items: center; justify-content: center; }
        .modal.active { display: flex; }
        .modal-box { background: #fff; border-radius: 10px; padding: 28px; max-width: 360px; width: 90%; box-shadow: 0 8px 32px rgba(0,0,0,0.2); }
        .modal-box h3 { color: #4250b3; margin-bottom: 16px; }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-weight: 600; margin-bottom: 4px; color: #4250b3; font-size: 0.85em; }
        .form-group input { width: 100%; padding: 8px 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 0.95em; }
        .modal-footer { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
        .btn { background: #4250b3; color: #fff; border: none; padding: 8px 20px; border-radius: 6px; font-size: 0.9em; cursor: pointer; }
        .btn:hover { background: #374399; }
        .btn-small { background: #e9ecef; border: 1px solid #ccc; border-radius: 4px; padding: 5px 12px; cursor: pointer; font-size: 0.85em; }
    </style>
    <!-- Matomo -->
    <script>
      var _paq = window._paq = window._paq || [];
      /* tracker methods like "setCustomDimension" should be called before "trackPageView" */
      _paq.push(['disableCookies']);
  _paq.push(['trackPageView']);
      _paq.push(['enableLinkTracking']);
      (function() {
        var u="https://uninovis.matomo.cloud/";
        _paq.push(['setTrackerUrl', u+'matomo.php']);
        _paq.push(['setSiteId', '3']);
        var d=document, g=d.createElement('script'), s=d.getElementsByTagName('script')[0];
        g.async=true; g.src='https://cdn.matomo.cloud/uninovis.matomo.cloud/matomo.js'; s.parentNode.insertBefore(g,s);
      })();
    </script>
    <!-- End Matomo Code -->
</head>
<body>
<script src="/static/nav.js"></script>
<script>uninovisNav({ current: 'Admin Tools (UAT)' });</script>
    <div class="header">
        <h1>UNINOVIS Admin Tools (UAT)</h1>
        <p class="subtitle" id="versionLine">Version 1.0 May 6th 2026</p>
    </div>

    <div class="auth-bar">
        <span id="authInfo"></span>
        <button id="loginBtn" onclick="showLogin()">Login to Edit</button>
        <button id="logoutBtn" style="display:none" onclick="doLogout()">Logout</button>
    </div>

    <div class="tools-grid" id="toolsGrid"></div>

    <div class="footer">UNINOVIS Data for life</div>

    <!-- Login modal -->
    <div class="modal" id="loginModal">
        <div class="modal-box">
            <h3>Login</h3>
            <div class="form-group"><label>Username</label><input type="text" id="loginUser"></div>
            <div class="form-group"><label>Password</label><input type="password" id="loginPass"></div>
            <p id="loginError" style="color:#dc3545;font-size:0.85em;"></p>
            <div class="modal-footer">
                <button class="btn-small" onclick="closeLogin()">Cancel</button>
                <button class="btn" onclick="doLogin()">Login</button>
            </div>
        </div>
    </div>

<script>
    // ── Tool registry — add new tools here ────────────────────────
    // Tool access rules (mirrors TOOL_ACCESS in auth.py)
    var TOOL_ACCESS = {
        'directory':          ['admin_staff', 'uninovis_staff', 'teaching_staff', 'tester', 'superuser'],
        'mobility_planner':   ['admin_staff', 'uninovis_staff', 'teaching_staff', 'tester', 'superuser'],
        'intranet_services':  ['admin_staff', 'uninovis_staff', 'teaching_staff', 'tester', 'superuser'],
        'unigracon':          ['teaching_staff', 'tester', 'superuser'],
        'researcher_connect': ['teaching_staff', 'tester', 'superuser'],
        'research_proposals': ['teaching_staff', 'tester', 'superuser'],
        'tommi_agents':       ['teaching_staff', 'tester', 'superuser'],
        'virtual_campus':     ['student', 'tester', 'superuser'],
        'student_admin':      ['student', 'tester', 'superuser'],
    };

    function canAccessTool(toolId, roles) {
        if (!TOOL_ACCESS[toolId]) return true;
        for (var i = 0; i < roles.length; i++) {
            if (TOOL_ACCESS[toolId].indexOf(roles[i]) !== -1) return true;
        }
        return false;
    }

    var TOOLS = [
        {
            id: 'directory',
            name: 'UNINOVIS Directory',
            icon: '\uD83D\uDCCB',
            description: 'Internal staff directory. Manage contacts, groups, and org charts for all UNINOVIS partners.',
            url: '/directory/',
            status: 'pilot',
        },
        {
            id: 'unigracon',
            name: 'UNIGRACON',
            icon: '\uD83C\uDF93',
            description: 'Grade converter between UNINOVIS partner universities. Supports formulas and conversion tables.',
            url: '/unigracon/',
            status: 'pilot',
        },
        {
            id: 'researcher_connect',
            name: 'Researcher Connect',
            icon: '\uD83D\uDD2C',
            description: 'Find and connect with researchers across UNINOVIS partner universities. Search by interests, keywords, and expertise.',
            url: '/researcher_connect/',
            status: 'pilot',
        },
        {
            id: 'research_proposals',
            name: 'Research Proposals',
            icon: '\uD83D\uDCDD',
            description: 'Post and discover research collaboration opportunities. Share funding calls, collaboration needs, and partner profiles.',
            url: '/research_proposals/',
            status: 'pilot',
        },
        {
            id: 'mobility_planner',
            name: 'Mobility Planner',
            icon: '\u2708\uFE0F',
            description: 'Compute call opening dates for mobility activities, accounting for administrative periods and holidays.',
            url: '/mobility_planner/',
            status: 'pilot',
        },
        {
            id: 'intranet_services',
            name: 'Intranet Services',
            icon: '\uD83D\uDDA5\uFE0F',
            description: 'Complete catalogue of all UNINOVIS digital services: administrative tools, AI agents, Agora platform, and external services.',
            url: '/uninovis/services',
            status: 'pilot',
        },
        {
            id: 'tommi_agents',
            name: 'TOMMI Agents',
            icon: '\uD83E\uDD16',
            description: 'Chat with UNINOVIS AI agents for research, project management, and administrative support.',
            url: '/agents',
            status: 'pilot',
        },
        {
            id: 'virtual_campus',
            name: 'Virtual Campus',
            icon: '\uD83C\uDFEB',
            description: 'Access your courses, learning materials, and virtual classrooms.',
            url: '#',
            status: 'soon',
        },
        {
            id: 'student_admin',
            name: 'Student Administration',
            icon: '\uD83D\uDCDD',
            description: 'Grades, curriculum, enrolment, and academic records.',
            url: '#',
            status: 'soon',
        },
    ];

    // ── Auth ──────────────────────────────────────────────────────
    var authToken = localStorage.getItem('uninovis_token') || localStorage.getItem('uninovis_admin_token') || localStorage.getItem('tommi_token');
    var authUser = null;

    async function checkAuth() {
        if (!authToken) { updateUI(); return; }
        try {
            // Use any app's auth-check (they all share the same auth)
            var resp = await fetch('/directory/api/auth-check', { headers: { 'Authorization': 'Bearer ' + authToken } });
            if (resp.ok) {
                authUser = await resp.json();
            } else {
                authToken = null; authUser = null;
                localStorage.removeItem('uninovis_token'); localStorage.removeItem('uninovis_admin_token');
            }
        } catch (e) { authUser = null; }
        updateUI();
    }

    function getUserRoles() {
        if (!authUser) return [];
        if (authUser.roles && Array.isArray(authUser.roles)) return authUser.roles;
        return authUser.role ? [authUser.role] : [];
    }

    function updateUI() {
        var roles = getUserRoles();
        var rolesLabel = roles.length ? roles.join(', ') : '';
        document.getElementById('authInfo').textContent = authUser ? 'Logged in as ' + authUser.username + (rolesLabel ? ' (' + rolesLabel + ')' : '') : '';
        document.getElementById('loginBtn').style.display = authUser ? 'none' : '';
        document.getElementById('logoutBtn').style.display = authUser ? '' : 'none';
        renderTools();
    }

    function showLogin() {
        document.getElementById('loginUser').value = '';
        document.getElementById('loginPass').value = '';
        document.getElementById('loginError').textContent = '';
        document.getElementById('loginModal').classList.add('active');
        document.getElementById('loginUser').focus();
    }

    function closeLogin() { document.getElementById('loginModal').classList.remove('active'); }

    async function doLogin() {
        var username = document.getElementById('loginUser').value.trim();
        var password = document.getElementById('loginPass').value;
        if (!username || !password) { document.getElementById('loginError').textContent = 'Enter username and password'; return; }
        try {
            var resp = await fetch('/api/auth/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username: username, password: password }) });
            if (!resp.ok) { document.getElementById('loginError').textContent = 'Invalid credentials'; return; }
            var data = await resp.json();
            authToken = data.token;
            localStorage.setItem('uninovis_token', authToken); localStorage.setItem('uninovis_admin_token', authToken);
            closeLogin();
            await checkAuth();
        } catch (e) { document.getElementById('loginError').textContent = 'Login failed'; }
    }

    function doLogout() {
        authToken = null; authUser = null;
        localStorage.removeItem('uninovis_token'); localStorage.removeItem('uninovis_admin_token');
        updateUI();
    }

    document.getElementById('loginPass').addEventListener('keydown', function(e) { if (e.key === 'Enter') doLogin(); });
    document.getElementById('loginModal').addEventListener('click', function(e) { if (e.target.id === 'loginModal') closeLogin(); });

    // ── Render tools ──────────────────────────────────────────────
    function renderTools() {
        var roles = getUserRoles();
        var html = '';
        TOOLS.forEach(function(tool) {
            // Filter by role: if user is logged in, only show tools they can access
            if (authUser && !canAccessTool(tool.id, roles)) return;
            // If not logged in, only show tools that don't require auth (none now — all require role check)
            if (!authUser) return;
            var isClickable = tool.status === 'active' || tool.status === 'pilot';
            var tagClass = tool.status === 'active' ? 'tag-active' : tool.status === 'pilot' ? 'tag-pilot' : 'tag-soon';
            var tagText = tool.status === 'active' ? 'Active' : tool.status === 'pilot' ? 'Pilot' : 'Coming soon';
            var href = isClickable ? tool.url : '#';
            var clickAttr = !isClickable ? ' onclick="event.preventDefault();" style="opacity:0.6;cursor:default;"' : '';

            html += '<a class="tool-card" href="' + href + '"' + clickAttr + '>'
                + '<div class="tool-icon">' + tool.icon + '</div>'
                + '<h2>' + tool.name + '</h2>'
                + '<p>' + tool.description + '</p>'
                + '<span class="tool-tag ' + tagClass + '">' + tagText + '</span>'
                + '</a>';
        });
        if (!html && authUser) {
            html = '<p style="color:#888;text-align:center;grid-column:1/-1;">No tools available for your role. Contact an administrator.</p>';
        } else if (!html) {
            html = '<p style="color:#888;text-align:center;grid-column:1/-1;">Please log in to see available tools.</p>';
        }
        document.getElementById('toolsGrid').innerHTML = html;
    }

    // ── Version line with current time ─────────────────────────────
    function updateVersionTime() {
        var now = new Date();
        var h = String(now.getHours()).padStart(2, '0');
        var m = String(now.getMinutes()).padStart(2, '0');
        document.getElementById('versionLine').textContent = 'Version 1.0 May 6th 2026 ' + h + ':' + m;
    }
    updateVersionTime();
    setInterval(updateVersionTime, 60000);

    // ── Init ──────────────────────────────────────────────────────
    checkAuth();
</script>
<script>
    function sendHeight() {
        var height = document.documentElement.scrollHeight;
        window.parent.postMessage({ type: 'iframeHeight', height: height }, 'https://uninovis.widening.eu');
    }
    window.addEventListener('load', sendHeight);
    window.addEventListener('resize', sendHeight);
    var observer = new MutationObserver(sendHeight);
    observer.observe(document.body, { childList: true, subtree: true, attributes: true });
</script>
</body>
</html>
