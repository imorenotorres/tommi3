<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Results Dashboard</title>
    <style>
        :root { --accent: #3498db; --green: #27ae60; --red: #e74c3c; --yellow: #f39c12; --text: #2c3e50; --bg: #f5f6fa; --card: #fff; --border: #dcdde1; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: var(--text); line-height: 1.5; padding: 20px; }
        .container { max-width: 1000px; margin: 0 auto; }
        h1 { font-size: 1.5em; margin-bottom: 5px; }
        .subtitle { color: #7f8c8d; font-size: 0.9em; margin-bottom: 20px; }
        .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 25px; }
        .card { background: var(--card); border-radius: 10px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); text-align: center; }
        .card .number { font-size: 2em; font-weight: 700; color: var(--accent); }
        .card .label { font-size: 0.85em; color: #7f8c8d; margin-top: 4px; }

        .section { background: var(--card); border-radius: 10px; padding: 25px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); margin-bottom: 20px; }
        .section h2 { font-size: 1.15em; margin-bottom: 15px; border-bottom: 1px solid var(--border); padding-bottom: 8px; }

        /* Bar chart */
        .bar-chart { display: flex; flex-direction: column; gap: 12px; }
        .bar-row { display: flex; align-items: center; gap: 10px; }
        .bar-label { width: 120px; font-size: 0.85em; text-align: right; flex-shrink: 0; }
        .bar-track { flex: 1; height: 28px; background: #eee; border-radius: 6px; position: relative; overflow: hidden; }
        .bar-fill { height: 100%; border-radius: 6px; display: flex; align-items: center; justify-content: flex-end; padding-right: 8px; font-size: 0.8em; font-weight: 600; color: white; min-width: 30px; transition: width 0.5s; }
        .bar-fill.inf { background: var(--accent); }
        .bar-fill.coop { background: var(--green); }
        .bar-max { position: absolute; right: 4px; top: 50%; transform: translateY(-50%); font-size: 0.7em; color: #999; }

        /* Preference */
        .pref-bar { display: flex; height: 40px; border-radius: 8px; overflow: hidden; margin-top: 10px; }
        .pref-segment { display: flex; align-items: center; justify-content: center; font-size: 0.85em; font-weight: 600; color: white; transition: width 0.5s; }
        .pref-segment.content { background: var(--accent); }
        .pref-segment.no_difference { background: #95a5a6; }
        .pref-segment.procedural { background: var(--green); }
        .pref-legend { display: flex; gap: 20px; margin-top: 8px; font-size: 0.8em; }
        .pref-legend span::before { content: ''; display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 5px; vertical-align: middle; }
        .pref-legend .l-inf::before { background: var(--accent); }
        .pref-legend .l-none::before { background: #95a5a6; }
        .pref-legend .l-coop::before { background: var(--green); }

        /* Table */
        table { width: 100%; border-collapse: collapse; font-size: 0.85em; }
        th, td { padding: 8px 10px; text-align: left; border-bottom: 1px solid var(--border); }
        th { font-weight: 600; color: #7f8c8d; font-size: 0.8em; text-transform: uppercase; }
        .comment { max-width: 200px; font-size: 0.8em; color: #666; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .comment:hover { white-space: normal; }

        .actions { display: flex; gap: 10px; margin-bottom: 20px; }
        .actions a { padding: 8px 16px; background: var(--accent); color: white; border-radius: 6px; text-decoration: none; font-size: 0.85em; font-weight: 600; }
        .actions a:hover { opacity: 0.85; }
        .actions button { padding: 8px 16px; background: var(--green); color: white; border: none; border-radius: 6px; font-size: 0.85em; font-weight: 600; cursor: pointer; }

        .loading { text-align: center; padding: 40px; color: #7f8c8d; }
        .empty { text-align: center; padding: 40px; color: #7f8c8d; font-style: italic; }
    </style>
</head>
<body>

<div class="container">
    <h1>Study Results Dashboard</h1>
    <p class="subtitle">Agent-to-Human Interaction: Content-Based Transparency vs. Procedural Guidance</p>

    <div class="actions">
        <a href="/rag-study/api/export">Export CSV</a>
        <button onclick="loadData()">Refresh</button>
    </div>

    <div id="content"><div class="loading">Loading results...</div></div>
</div>

<script>
const API = '/rag-study';

async function loadData() {
    const el = document.getElementById('content');
    try {
        const res = await fetch(`${API}/api/stats`);
        const data = await res.json();
        render(data);
    } catch(e) {
        el.innerHTML = '<div class="empty">Error loading data. Is the server running?</div>';
    }
}

function render(data) {
    const el = document.getElementById('content');

    if (data.completed === 0) {
        el.innerHTML = '<div class="empty">No completed responses yet.</div>';
        return;
    }

    const a = data.averages;
    const pref = data.preference_counts;
    const total_pref = (pref.content || 0) + (pref.no_difference || 0) + (pref.procedural || 0);

    function pct(v) { return total_pref ? Math.round((v / total_pref) * 100) : 0; }
    function barW(v) { return v ? Math.round((v / 7) * 100) : 0; }

    let html = `
    <div class="cards">
        <div class="card"><div class="number">${data.total_registered}</div><div class="label">Registered</div></div>
        <div class="card"><div class="number">${data.completed}</div><div class="label">Completed</div></div>
        <div class="card"><div class="number">${data.order_counts.informator_first || 0}</div><div class="label">Informator first</div></div>
        <div class="card"><div class="number">${data.order_counts.cooperator_first || 0}</div><div class="label">Cooperator first</div></div>
    </div>

    <div class="section">
        <h2>Average Ratings (1-7 scale)</h2>
        <div class="bar-chart">
            <div class="bar-row">
                <div class="bar-label">Usefulness</div>
                <div class="bar-track">
                    <div class="bar-fill inf" style="width:${barW(a.useful_informator)}%">${a.useful_informator ?? '—'}</div>
                </div>
                <div class="bar-track">
                    <div class="bar-fill coop" style="width:${barW(a.useful_cooperator)}%">${a.useful_cooperator ?? '—'}</div>
                </div>
            </div>
            <div class="bar-row">
                <div class="bar-label">Difficulty</div>
                <div class="bar-track">
                    <div class="bar-fill inf" style="width:${barW(a.effort_informator)}%">${a.effort_informator ?? '—'}</div>
                </div>
                <div class="bar-track">
                    <div class="bar-fill coop" style="width:${barW(a.effort_cooperator)}%">${a.effort_cooperator ?? '—'}</div>
                </div>
            </div>
            <div class="bar-row">
                <div class="bar-label">Trust change</div>
                <div class="bar-track">
                    <div class="bar-fill inf" style="width:${barW(a.trust_informator)}%">${a.trust_informator ?? '—'}</div>
                </div>
                <div class="bar-track">
                    <div class="bar-fill coop" style="width:${barW(a.trust_cooperator)}%">${a.trust_cooperator ?? '—'}</div>
                </div>
            </div>
        </div>
        <div class="pref-legend" style="margin-top:12px;">
            <span class="l-inf">Informator</span>
            <span class="l-coop">Cooperator</span>
        </div>
    </div>

    <div class="section">
        <h2>Overall Preference</h2>
        <div class="pref-bar">
            <div class="pref-segment content" style="width:${pct(pref.content || 0)}%">${pref.content || 0}</div>
            <div class="pref-segment no_difference" style="width:${pct(pref.no_difference || 0)}%">${pref.no_difference || 0}</div>
            <div class="pref-segment procedural" style="width:${pct(pref.procedural || 0)}%">${pref.procedural || 0}</div>
        </div>
        <div class="pref-legend">
            <span class="l-inf">Informator (${pct(pref.content || 0)}%)</span>
            <span class="l-none">No difference (${pct(pref.no_difference || 0)}%)</span>
            <span class="l-coop">Cooperator (${pct(pref.procedural || 0)}%)</span>
        </div>
    </div>

    <div class="section">
        <h2>Individual Responses</h2>
        <table>
            <tr>
                <th>ID</th>
                <th>Order</th>
                <th>Question</th>
                <th>Useful (I/C)</th>
                <th>Difficulty (I/C)</th>
                <th>Trust (I/C)</th>
                <th>Preference</th>
                <th>Comment</th>
            </tr>
            ${data.responses.map(r => `
            <tr>
                <td>${r.id}</td>
                <td>${r.order === 'informator_first' ? 'Inf first' : 'Coop first'}</td>
                <td>${r.question}</td>
                <td>${r.useful_inf ?? '—'} / ${r.useful_coop ?? '—'}</td>
                <td>${r.effort_inf ?? '—'} / ${r.effort_coop ?? '—'}</td>
                <td>${r.trust_inf ?? '—'} / ${r.trust_coop ?? '—'}</td>
                <td>${{content:'Informator', procedural:'Cooperator', no_difference:'No diff.'}[r.preference] || r.preference}</td>
                <td class="comment" title="${(r.comment || '').replace(/"/g, '&quot;')}">${r.comment || '—'}</td>
            </tr>
            `).join('')}
        </table>
    </div>
    `;

    el.innerHTML = html;
}

loadData();
</script>
</body>
</html>
