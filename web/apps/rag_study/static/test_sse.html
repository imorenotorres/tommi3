<!DOCTYPE html>
<html><head><meta charset="UTF-8"><title>SSE Test</title>
<!-- Matomo -->
<script>
  var _paq = window._paq = window._paq || [];
  /* tracker methods like "setCustomDimension" should be called before "trackPageView" */
  _paq.push(['trackPageView']);
  _paq.push(['enableLinkTracking']);
  (function() {
    var u="https://uninovis.matomo.cloud/";
    _paq.push(['setTrackerUrl', u+'matomo.php']);
    _paq.push(['setSiteId', '3']);
    var d=document, g=d.createElement('script'), s=d.getElementsByTagName('script')[0];
    g.async=true; g.src='https://cdn.matomo.cloud/uninovis.matomo.cloud/matomo.js'; s.parentNode.insertBefore(g,s);
  })();
</script>
<!-- End Matomo Code -->
</head>
<body>
<h1>SSE Replay Test</h1>
<button onclick="testReplay()">Test Replay</button>
<pre id="log"></pre>
<script>
function log(msg) {
    document.getElementById('log').textContent += msg + '\n';
}

function testReplay() {
    log('Starting EventSource...');
    const es = new EventSource('/rag-study/api/replay?agent_id=responsible_ai2');
    
    es.onmessage = function(e) {
        log('DATA: ' + e.data.substring(0, 80) + '...');
    };
    es.addEventListener('status', function(e) {
        log('STATUS: ' + e.data);
    });
    es.addEventListener('badge', function(e) {
        log('BADGE: ' + e.data.substring(0, 80) + '...');
    });
    es.addEventListener('done', function(e) {
        log('DONE event received!');
        es.close();
    });
    es.onerror = function(e) {
        log('ERROR event - readyState=' + es.readyState);
    };
}
</script>
</body></html>
