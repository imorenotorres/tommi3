<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UNINOVIS Directory</title>
    <link rel="stylesheet" href="/static/nav.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f0f2f5; color: #333; padding: 20px; }
        h1 { text-align: center; color: #1a3a5c; margin-bottom: 4px; }
        .subtitle { text-align: center; color: #666; margin-bottom: 24px; font-size: 0.95em; }
        .container { max-width: 1100px; margin: 0 auto; }
        .card { background: #fff; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); padding: 24px; margin-bottom: 24px; }
        .card h2 { color: #1a3a5c; margin-bottom: 16px; font-size: 1.15em; }

        /* Tabs */
        .tabs { display: flex; gap: 4px; margin-bottom: 24px; }
        .tab { padding: 10px 20px; border: 1px solid #ccc; border-radius: 6px 6px 0 0; background: #e9ecef; cursor: pointer; font-weight: 600; color: #555; }
        .tab.active { background: #fff; border-bottom: 1px solid #fff; color: #1a3a5c; }

        /* Tables */
        table { width: 100%; border-collapse: collapse; font-size: 0.9em; }
        th { padding: 8px 10px; border-bottom: 2px solid #ddd; text-align: left; color: #1a3a5c; font-size: 0.85em; }
        td { padding: 6px 10px; border-bottom: 1px solid #eee; }
        tr:hover { background: #f8f9fa; }

        .table-scroll { overflow-x: auto; }
        .table-scroll table { min-width: 760px; }

        /* Buttons */
        .btn { display: inline-block; background: #1a3a5c; color: #fff; border: none; padding: 8px 20px; border-radius: 6px; font-size: 0.9em; cursor: pointer; }
        .btn:hover { background: #24527a; }
        .btn:disabled { background: #94a3b8; cursor: not-allowed; }
        .btn-small { background: #e9ecef; border: 1px solid #ccc; border-radius: 4px; padding: 4px 10px; cursor: pointer; font-size: 0.82em; }
        .btn-small:hover { background: #d0d4d9; }

        /* Search */
        .search-bar { margin-bottom: 16px; }
        .search-bar input { max-width: 350px; padding: 8px 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 0.95em; width: 100%; }

        .filter-bar { margin-bottom: 12px; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
        .filter-bar select { padding: 8px 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 0.95em; background: #fff; width: auto; min-width: 160px; }

        .badge { font-size: 0.72em; font-weight: 600; padding: 2px 8px; border-radius: 10px; white-space: nowrap; }
        .badge-uni { background: #e9ecef; color: #495057; margin-right: 3px; margin-bottom: 2px; display: inline-block; }
        .badge-unit { background: #d1ecf1; color: #0c5460; margin-right: 3px; margin-bottom: 2px; display: inline-block; }

        .sync-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; flex-wrap: wrap; gap: 8px; }
        .sync-info { font-size: 0.82em; color: #666; }

        /* Org tree (shared by Units and Org Chart tabs) */
        .org-tree { padding: 0; }
        .org-tree ul { list-style: none; padding-left: 24px; position: relative; }
        .org-tree > ul { padding-left: 0; }
        .org-tree li { position: relative; padding: 4px 0 4px 20px; }
        .org-tree li::before {
            content: ''; position: absolute; left: 0; top: 0;
            border-left: 2px solid #b0bec5; height: 100%;
        }
        .org-tree li::after {
            content: ''; position: absolute; left: 0; top: 16px;
            border-top: 2px solid #b0bec5; width: 16px;
        }
        .org-tree li:last-child::before { height: 16px; }
        .org-tree > ul > li::before, .org-tree > ul > li::after { display: none; }
        .org-tree > ul > li { padding-left: 0; }

        .org-node { display: inline-block; padding: 8px 16px; border-radius: 8px; font-size: 0.9em; font-weight: 600; margin: 2px 0; }
        .org-node-root { background: #1a3a5c; color: #fff; font-size: 1.05em; padding: 12px 24px; }
        .org-node-unit { background: #d1ecf1; color: #0c5460; border: 1px solid #b8daff; }
        .org-node-member { background: #fff; color: #333; border: 1px solid #ddd; font-weight: 400; font-size: 0.85em; }
        .org-role-tag { font-size: 0.75em; color: #888; font-weight: 400; margin-left: 6px; }

        .empty-note { color: #888; text-align: center; padding: 20px; }
    </style>
    <!-- Matomo -->
    <script>
      var _paq = window._paq = window._paq || [];
      _paq.push(['disableCookies']);
      _paq.push(['trackPageView']);
      _paq.push(['enableLinkTracking']);
      (function() {
        var u="https://uninovis.matomo.cloud/";
        _paq.push(['setTrackerUrl', u+'matomo.php']);
        _paq.push(['setSiteId', '3']);
        var d=document, g=d.createElement('script'), s=d.getElementsByTagName('script')[0];
        g.async=true; g.src='https://cdn.matomo.cloud/uninovis.matomo.cloud/matomo.js'; s.parentNode.insertBefore(g,s);
      })();
    </script>
</head>
<body>
<script src="/static/nav.js?v=4"></script>
<script>uninovisNav({ crumbs: [{label:'Administration', href:'/#admin'}], current: 'Directory' });</script>
    <div class="container">
        <h1>UNINOVIS Directory</h1>
        <p class="subtitle">UNINOVIS staff directory</p>

        <div class="sync-bar">
            <span class="sync-info" id="syncInfo"></span>
            <div style="display:flex;gap:8px;">
                <button class="btn-small" id="btnImportJson" style="display:none;" onclick="openImportJsonModal()">Import JSON</button>
                <button class="btn" id="btnAddSubunit" style="display:none;" onclick="openAddSubunitModal()">+ Add Subunit</button>
                <button class="btn" id="btnAddEntry" style="display:none;" onclick="openAddModal()">+ Add Person / Unit</button>
            </div>
        </div>

        <div class="tabs">
            <div class="tab active" data-tab="people" onclick="switchTab('people')">People</div>
            <div class="tab" data-tab="units" onclick="switchTab('units')">Units</div>
            <div class="tab" data-tab="universities" onclick="switchTab('universities')">Universities</div>
            <div class="tab" data-tab="orgchart" onclick="switchTab('orgchart')">Org Chart</div>
        </div>

        <!-- ══ PEOPLE TAB ══ -->
        <div id="tab-people">
            <div class="card">
                <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
                    <h2 style="margin:0">Directory People</h2>
                    <button class="btn-small" id="btnEditPeople" style="display:none;" onclick="togglePeopleEditMode()">Edit</button>
                </div>
                <div class="filter-bar">
                    <input type="text" id="peopleSearch" placeholder="Search by name, email, or position..." style="max-width:280px;flex:1;padding:8px 10px;border:1px solid #ccc;border-radius:6px;" oninput="renderPeople()">
                    <select id="peopleUniFilter" onchange="renderPeople()"><option value="">All universities</option></select>
                </div>
                <div id="peopleTable" class="table-scroll"></div>
            </div>
        </div>

        <!-- ══ UNITS TAB ══ -->
        <div id="tab-units" style="display:none">
            <div class="card">
                <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:8px;">
                    <h2 style="margin:0">Units &amp; Subunits</h2>
                    <select id="unitsUniFilter" onchange="renderUnits()"><option value="">All universities</option></select>
                </div>
                <div id="unitsArea"></div>
            </div>
        </div>

        <!-- ══ UNIVERSITIES TAB ══ -->
        <div id="tab-universities" style="display:none">
            <div class="card">
                <h2>Partner Universities</h2>
                <div id="uniTable"></div>
            </div>
        </div>

        <!-- ══ ORG CHART TAB ══ -->
        <div id="tab-orgchart" style="display:none">
            <div class="card">
                <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
                    <h2 style="margin:0">Org Chart</h2>
                    <select id="orgChartUni" onchange="renderOrgChart()" style="min-width:220px;"></select>
                </div>
                <div id="orgChartArea"></div>
            </div>
        </div>
    </div>

    <script>
    var BASE = '/new-directory';
    var authToken = localStorage.getItem('uninovis_token') || localStorage.getItem('tommi_token');
    var people = [];
    var units = [];
    var universities = [];
    var status = {};
    var currentUser = null;

    function esc(s) { return s ? String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;') : ''; }

    function authFetch(url, opts) {
        opts = opts || {};
        opts.headers = opts.headers || {};
        if (authToken) opts.headers['Authorization'] = 'Bearer ' + authToken;
        return fetch(url, opts);
    }

    // ── Tabs ──────────────────────────────────────────────────────

    function switchTab(tab) {
        document.querySelectorAll('.tab').forEach(function(t) { t.classList.toggle('active', t.dataset.tab === tab); });
        ['people', 'units', 'universities', 'orgchart'].forEach(function(t) {
            document.getElementById('tab-' + t).style.display = (t === tab) ? '' : 'none';
        });
        if (tab === 'units') renderUnits();
        if (tab === 'orgchart') renderOrgChart();
    }

    // ── Copy-to-clipboard helpers ─────────────────────────────────

    function copyEmail(email, btn) {
        if (!email) return;
        navigator.clipboard.writeText(email).then(function() {
            var orig = btn.innerHTML;
            btn.innerHTML = '&#10003;';
            setTimeout(function() { btn.innerHTML = orig; }, 1200);
        });
    }

    function emailBtn(email) {
        if (!email) return '';
        return ' <button class="btn-small" onclick="event.stopPropagation();copyEmail(\'' + esc(email) + '\', this)" style="font-size:0.7em;padding:1px 5px;margin-left:4px;" title="' + esc(email) + '">&#9993;</button>';
    }

    function collectMemberEmails(node, out) {
        (node.members || []).forEach(function(m) { if (m.email) out.push(m.email); });
        (node.subunits || []).forEach(function(sub) { collectMemberEmails(sub, out); });
    }

    function copyAllEmailsBtn(node, label) {
        var id = 'copyall-' + node.id;
        return ' <button class="btn-small" id="' + id + '" onclick="event.stopPropagation();copyAllEmails(' + node.id + ', this)" style="font-size:0.75em;padding:2px 6px;margin-left:6px;">Copy ' + esc(label) + ' emails</button>';
    }

    window._unitNodesById = {};

    function indexUnitNodes(node) {
        window._unitNodesById[node.id] = node;
        (node.subunits || []).forEach(indexUnitNodes);
    }

    function copyAllEmails(unitId, btn) {
        var node = window._unitNodesById[unitId];
        if (!node) return;
        var emails = [];
        collectMemberEmails(node, emails);
        emails = emails.filter(function(e, i) { return e && emails.indexOf(e) === i; });
        if (emails.length === 0) return;
        navigator.clipboard.writeText(emails.join('; ')).then(function() {
            var orig = btn.textContent;
            btn.textContent = 'Copied!';
            setTimeout(function() { btn.textContent = orig; }, 1500);
        });
    }

    // ── People ────────────────────────────────────────────────────

    function populateUniFilters() {
        ['peopleUniFilter', 'unitsUniFilter'].forEach(function(id) {
            var sel = document.getElementById(id);
            var current = sel.value;
            sel.innerHTML = '<option value="">All universities</option>';
            universities.forEach(function(u) {
                sel.innerHTML += '<option value="' + esc(u.code) + '">' + esc(u.code) + ' — ' + esc(u.name) + '</option>';
            });
            sel.value = current;
        });
        var orgSel = document.getElementById('orgChartUni');
        var currentOrg = orgSel.value;
        orgSel.innerHTML = '';
        universities.forEach(function(u) {
            orgSel.innerHTML += '<option value="' + esc(u.code) + '">' + esc(u.code) + ' — ' + esc(u.name) + '</option>';
        });
        if (currentOrg) orgSel.value = currentOrg;
    }

    function renderPeople() {
        var search = document.getElementById('peopleSearch').value.trim().toLowerCase();
        var uniFilter = document.getElementById('peopleUniFilter').value;
        var rows = people.filter(function(p) {
            if (uniFilter && p.university !== uniFilter) return false;
            if (!search) return true;
            var hay = (p.first_name + ' ' + p.family_name + ' ' + p.email + ' ' + p.position).toLowerCase();
            return hay.indexOf(search) !== -1;
        });
        rows.sort(function(a, b) { return (a.family_name || '').localeCompare(b.family_name || '') || (a.first_name || '').localeCompare(b.first_name || ''); });

        var html = '<table><tr><th>Name</th><th>University</th><th>Position</th><th>Email</th><th>Phone</th><th>Units</th></tr>';
        rows.forEach(function(p) {
            var nameCell = esc(p.first_name + ' ' + p.family_name);
            if (peopleEditMode && canEditPerson(p)) {
                nameCell = '<button class="btn-small" onclick="event.stopPropagation();confirmDeletePerson(' + p.id + ')" style="color:#dc3545;border-color:#dc3545;font-size:0.75em;padding:1px 6px;margin-right:4px;" title="Delete">&times;</button>'
                    + '<button class="btn-small" onclick="event.stopPropagation();openEditPersonModal(' + p.id + ')" style="font-size:0.75em;padding:1px 6px;margin-right:6px;" title="Edit">Edit</button>'
                    + nameCell;
            }
            html += '<tr>'
                + '<td>' + nameCell + '</td>'
                + '<td><span class="badge badge-uni">' + esc(p.university || '—') + '</span></td>'
                + '<td>' + esc(p.position) + '</td>'
                + '<td>' + esc(p.email) + emailBtn(p.email) + '</td>'
                + '<td>' + esc(p.phone) + '</td>'
                + '<td>' + (p.units || []).map(function(n) { return '<span class="badge badge-unit">' + esc(n) + '</span>'; }).join('') + '</td>'
                + '</tr>';
        });
        html += '</table>';
        if (rows.length === 0) html = '<p class="empty-note">No people found.' + (people.length === 0 ? ' Run a sync to load directory data.' : '') + '</p>';
        document.getElementById('peopleTable').innerHTML = html;
    }

    // ── Units ─────────────────────────────────────────────────────

    function leadersBtn(node) {
        if (!canManageDirectory()) return '';
        var leaders = node.leaders || [];
        var label = leaders.length ? ('Leaders (' + leaders.length + ')') : 'Set leader';
        return ' <button class="btn-small" onclick="event.stopPropagation();editUnitLeaders(' + node.id + ')" style="font-size:0.72em;padding:1px 6px;margin-left:4px;" title="'
            + esc(leaders.join(', ') || 'No leaders set — WP leaders can add subunits under a unit they lead') + '">' + esc(label) + '</button>';
    }

    async function editUnitLeaders(unitId) {
        var node = window._unitNodesById[unitId];
        var current = ((node && node.leaders) || []).join(', ');
        var input = prompt('Comma-separated emails of people who lead this unit (they can then add subunits under it):', current);
        if (input === null) return;
        var leaders = input.split(',').map(function(s) { return s.trim(); }).filter(Boolean);
        try {
            var resp = await authFetch(BASE + '/api/units/' + unitId + '/leaders', {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ leaders: leaders })
            });
            if (!resp.ok) { var err = await resp.json(); alert(err.detail || 'Error updating leaders'); return; }
            await loadAll();
            var activeTab = document.querySelector('.tab.active').dataset.tab;
            if (activeTab === 'orgchart') renderOrgChart();
        } catch (e) { alert('Connection error'); }
    }

    function renderUnitNode(node, isRoot) {
        indexUnitNodes(node);
        var html = '<li><span class="org-node ' + (isRoot ? 'org-node-root' : 'org-node-unit') + '">' + esc(node.name) + '</span>';
        html += copyAllEmailsBtn(node, node.name);
        html += leadersBtn(node);
        html += '<ul>';
        node.members.forEach(function(m) {
            html += '<li><span class="org-node org-node-member">' + esc(m.first_name + ' ' + m.family_name)
                + (m.position ? '<span class="org-role-tag">' + esc(m.position) + '</span>' : '')
                + emailBtn(m.email) + '</span></li>';
        });
        node.subunits.forEach(function(sub) {
            html += renderUnitNode(sub, false);
        });
        html += '</ul></li>';
        return html;
    }

    function renderUnits() {
        var uniFilter = document.getElementById('unitsUniFilter').value;
        window._unitNodesById = {};
        var byUni = {};
        units.forEach(function(root) {
            var uni = root.university || 'Other';
            if (uniFilter && uni !== uniFilter) return;
            byUni[uni] = byUni[uni] || [];
            byUni[uni].push(root);
        });

        var html = '';
        Object.keys(byUni).sort().forEach(function(uni) {
            var uniInfo = universities.find(function(u) { return u.code === uni; });
            var uniLabel = uniInfo ? (uni + ' — ' + uniInfo.name) : uni;
            html += '<h3 style="color:#1a3a5c;font-size:1em;margin:16px 0 8px;">' + esc(uniLabel) + '</h3>';
            html += '<div class="org-tree"><ul>';
            byUni[uni].forEach(function(root) { html += renderUnitNode(root, false); });
            html += '</ul></div>';
        });

        if (!html) html = '<p class="empty-note">No units found.' + (units.length === 0 ? ' Run a sync to load directory data.' : '') + '</p>';
        document.getElementById('unitsArea').innerHTML = html;
    }

    // ── Universities ──────────────────────────────────────────────

    function renderUniversities() {
        var html = '<table><tr><th>Code</th><th>Name</th><th>Country</th><th>Website</th><th>Staff</th></tr>';
        universities.forEach(function(u) {
            html += '<tr>'
                + '<td><strong>' + esc(u.code) + '</strong></td>'
                + '<td>' + esc(u.name) + '</td>'
                + '<td>' + esc(u.country) + '</td>'
                + '<td>' + (u.website ? '<a href="' + esc(u.website) + '" target="_blank" rel="noopener">' + esc(u.website) + '</a>' : '—') + '</td>'
                + '<td>' + u.staff_count + '</td>'
                + '</tr>';
        });
        html += '</table>';
        document.getElementById('uniTable').innerHTML = html;
    }

    // ── Org Chart ─────────────────────────────────────────────────

    async function renderOrgChart() {
        var uni = document.getElementById('orgChartUni').value;
        if (!uni) { document.getElementById('orgChartArea').innerHTML = ''; return; }
        var resp = await authFetch(BASE + '/api/units?university=' + encodeURIComponent(uni));
        var tree = await resp.json();
        window._unitNodesById = {};

        var uniInfo = universities.find(function(u) { return u.code === uni; });
        var html = '<div class="org-tree"><ul><li><span class="org-node org-node-root">' + esc(uni) + ' — ' + esc(uniInfo ? uniInfo.name : uni) + '</span><ul>';
        tree.forEach(function(root) { html += renderUnitNode(root, false); });
        html += '</ul></li></ul></div>';

        if (tree.length === 0) html = '<p class="empty-note">No units found for ' + esc(uni) + '.</p>';
        document.getElementById('orgChartArea').innerHTML = html;
    }

    // ── Add Person / Unit (content_manager / superuser, or unit-only for wp_leader) ───────

    var addMode = 'person';
    var addScopeIds = null; // null = unrestricted; array of unit ids = wp_leader scope

    function flattenUnits(nodes, depth, out) {
        var sorted = (nodes || []).slice().sort(function(a, b) { return a.name.localeCompare(b.name); });
        sorted.forEach(function(n) {
            out.push({ id: n.id, name: n.name, depth: depth });
            flattenUnits(n.subunits, depth + 1, out);
        });
        return out;
    }

    function fieldRow(label, inputHtml) {
        return '<div style="margin-bottom:12px;"><label style="display:block;font-weight:600;font-size:0.85em;color:#1a3a5c;margin-bottom:4px;">'
            + esc(label) + '</label>' + inputHtml + '</div>';
    }

    function universityOptions(noneLabel, selected) {
        var html = '<option value="">' + esc(noneLabel) + '</option>';
        universities.forEach(function(u) {
            var sel = (selected && u.code === selected) ? ' selected' : '';
            html += '<option value="' + esc(u.code) + '"' + sel + '>' + esc(u.code) + ' — ' + esc(u.name) + '</option>';
        });
        return html;
    }

    function unitSelectOptions(noneLabel, selectedId, allowedIds) {
        var flat = flattenUnits(units, 0, []);
        if (allowedIds) flat = flat.filter(function(u) { return allowedIds.indexOf(u.id) !== -1; });
        var html = noneLabel ? '<option value="">' + esc(noneLabel) + '</option>' : '';
        flat.forEach(function(u) {
            var indent = new Array(u.depth + 1).join(' ');
            var sel = (selectedId != null && u.id === selectedId) ? ' selected' : '';
            html += '<option value="' + u.id + '"' + sel + '>' + indent + esc(u.name) + '</option>';
        });
        return html;
    }

    // A WP leader may only create subunits within the work package(s) they
    // lead (auth-check returns their directly-led unit ids); this expands
    // that to include every descendant, since managing the whole subtree
    // they're responsible for is the point, not just direct children.
    function collectUnitIds(node, out) {
        out.push(node.id);
        (node.subunits || []).forEach(function(sub) { collectUnitIds(sub, out); });
    }

    function computeLedScopeIds(ledUnitIds) {
        var ledSet = {};
        (ledUnitIds || []).forEach(function(id) { ledSet[id] = true; });
        var out = [];
        function walk(nodes) {
            (nodes || []).forEach(function(n) {
                if (ledSet[n.id]) collectUnitIds(n, out);
                walk(n.subunits);
            });
        }
        walk(units);
        return out.filter(function(id, i) { return out.indexOf(id) === i; });
    }

    var npUnitRowCounter = 0;

    function npUnitRowHtml(assignment) {
        npUnitRowCounter++;
        var rowId = 'np-unit-row-' + npUnitRowCounter;
        var unitId = assignment ? assignment.unit_id : null;
        var role = assignment ? (assignment.role || '') : '';
        return '<div class="np-unit-row" id="' + rowId + '" style="display:flex;gap:6px;margin-bottom:6px;align-items:center;">'
            + '<select class="np-unit-select" style="flex:2;padding:6px 8px;border:1px solid #ccc;border-radius:6px;">' + unitSelectOptions('— select unit —', unitId) + '</select>'
            + '<input type="text" class="np-unit-role-input" placeholder="Role (optional)" value="' + esc(role) + '" style="flex:1;padding:6px 8px;border:1px solid #ccc;border-radius:6px;">'
            + '<button type="button" onclick="document.getElementById(\'' + rowId + '\').remove()" style="background:none;border:none;color:#dc3545;cursor:pointer;font-size:1.1em;padding:0 4px;" title="Remove">&times;</button>'
            + '</div>';
    }

    function addUnitRow(listId) {
        document.getElementById(listId || 'np-units-list').insertAdjacentHTML('beforeend', npUnitRowHtml());
    }

    function collectUnitRows(listId) {
        var payload = [];
        document.querySelectorAll('#' + listId + ' .np-unit-row').forEach(function(row) {
            var sel = row.querySelector('.np-unit-select');
            var roleInput = row.querySelector('.np-unit-role-input');
            if (sel && sel.value) {
                payload.push({ unit_id: parseInt(sel.value, 10), role: roleInput.value.trim() });
            }
        });
        return payload;
    }

    function personFormHtml() {
        npUnitRowCounter = 0;
        return fieldRow('First name *', '<input type="text" id="np-first" style="width:100%;padding:8px 10px;border:1px solid #ccc;border-radius:6px;">')

        el.style.display = '';

        el.style.color = ok ? '#166534' : '#991b1b';

    async function submitAdd() {
        if (addMode === 'person') {
            var firstName = document.getElementById('np-first').value.trim();
            var familyName = document.getElementById('np-family').value.trim();
            if (!firstName || !familyName) { addMsg('First name and family name are required', false); return; }
            var unitsPayload = collectUnitRows('np-units-list');
            var body = {
                first_name: firstName,
                family_name: familyName,
                email: document.getElementById('np-email').value.trim(),
                phone: document.getElementById('np-phone').value.trim(),
                position: document.getElementById('np-position').value.trim(),
                university: document.getElementById('np-university').value,
                units: unitsPayload,
            };
            try {
                var resp = await authFetch(BASE + '/api/people', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                });
                if (!resp.ok) { var err = await resp.json(); addMsg(err.detail || 'Error creating person', false); return; }
                closeAddModal();
                await loadAll();
            } catch (e) { addMsg('Connection error', false); }
        } else {
            var name = document.getElementById('nu-name').value.trim();
            if (!name) { addMsg('Unit name is required', false); return; }
            var parentVal = document.getElementById('nu-parent').value;
            if (addScopeIds && !parentVal) { addMsg('Select a unit within a work package you lead', false); return; }
            var uniEl = document.getElementById('nu-university');
            var body2 = {
                name: name,
                parent_id: parentVal ? parseInt(parentVal, 10) : null,
                university: uniEl ? uniEl.value : '',
            };
            try {
                var resp2 = await authFetch(BASE + '/api/units', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body2)
                });
                if (!resp2.ok) { var err2 = await resp2.json(); addMsg(err2.detail || 'Error creating unit', false); return; }
                closeAddModal();
                await loadAll();
            } catch (e) { addMsg('Connection error', false); }
        }
    }

    // ── Sync ──────────────────────────────────────────────────────

    function formatSyncInfo() {
        var el = document.getElementById('syncInfo');
        if (typeof status.people !== 'number' || typeof status.units !== 'number') {
            return; // leave existing text (e.g. "Loading...") rather than show "undefined"
        }
        if (!status.last_sync) {
            el.textContent = status.people + ' people, ' + status.units + ' units';
            return;
        }
        var d = new Date(status.last_sync);
        el.textContent = 'Data as of ' + d.toLocaleString() + ' — ' + status.people + ' people, ' + status.units + ' units';
    }

    async function loadStatus() {
        try {
            var resp = await authFetch(BASE + '/api/status');
            if (!resp.ok) return;
            status = await resp.json();
            formatSyncInfo();
        } catch (e) { /* leave existing text */ }
    }

        if (!authToken) return;
        try {
            var resp = await authFetch(BASE + '/api/auth-check');
            if (resp.ok) currentUser = await resp.json();
        } catch (e) { /* stay in read-only mode */ }
    }

    function canManageDirectory() {
        if (!currentUser) return false;
        var roles = currentUser.roles || [currentUser.role];
        return roles.indexOf('content_manager') !== -1 || roles.indexOf('superuser') !== -1;
    }

    function isSuperuser() {
        if (!currentUser) return false;
        var roles = currentUser.roles || [currentUser.role];
        return roles.indexOf('superuser') !== -1;
    }

    // A content_manager may edit/delete people from their own university only
    // (matched via their own directory entry); superuser may edit anyone.
    // Mirrors the server-side check in _require_person_edit_access.
    function canEditPerson(p) {
        if (!currentUser) return false;
        if (isSuperuser()) return true;
        var roles = currentUser.roles || [currentUser.role];
        if (roles.indexOf('content_manager') === -1) return false;
        return !!currentUser.own_university && p.university === currentUser.own_university;
    }

    var peopleEditMode = false;

    function togglePeopleEditMode() {
        peopleEditMode = !peopleEditMode;
        var btn = document.getElementById('btnEditPeople');
        if (btn) btn.textContent = peopleEditMode ? 'Done' : 'Edit';
        renderPeople();
    }

    // WP leaders get the scoped "+ Add Subunit" button instead of full
    // directory management; canManageDirectory() users already have that
    // (and more) via "+ Add Person / Unit", so this only applies to leaders
    // who aren't also content_manager/superuser.
    function canLeadUnits() {
        if (!currentUser || canManageDirectory()) return false;
        return !!(currentUser.led_unit_ids && currentUser.led_unit_ids.length);
    }

    function canImportJson() {
        if (!currentUser) return false;
        var roles = currentUser.roles || [currentUser.role];
        return roles.indexOf('superuser') !== -1;
    }

    async function loadAll() {
        var [peopleResp, unitsResp, uniResp] = await Promise.all([
            authFetch(BASE + '/api/people'),
            authFetch(BASE + '/api/units'),
            authFetch(BASE + '/api/universities'),
        ]);
        people = await peopleResp.json();
        units = await unitsResp.json();
        universities = await uniResp.json();
        populateUniFilters();
        renderPeople();
        renderUniversities();
        var activeTab = document.querySelector('.tab.active').dataset.tab;
        if (activeTab === 'units') renderUnits();
        if (activeTab === 'orgchart') renderOrgChart();
        await loadStatus();

        var addBtn = document.getElementById('btnAddEntry');
        if (addBtn) addBtn.style.display = canManageDirectory() ? '' : 'none';

        var editPeopleBtn = document.getElementById('btnEditPeople');
        if (editPeopleBtn) editPeopleBtn.style.display = canManageDirectory() ? '' : 'none';

        var addSubunitBtn = document.getElementById('btnAddSubunit');
        if (addSubunitBtn) addSubunitBtn.style.display = canLeadUnits() ? '' : 'none';

        var importBtn = document.getElementById('btnImportJson');
        if (importBtn) importBtn.style.display = canImportJson() ? '' : 'none';
    }

    async function init() {
        await checkAuth();
        await loadAll();
        if (window.location.hash === '#my-profile') openMyProfileModal();
    }

    window.addEventListener('hashchange', function() {
        if (window.location.hash === '#my-profile') openMyProfileModal();
    });

    init();
    </script>
</body>
</html>
