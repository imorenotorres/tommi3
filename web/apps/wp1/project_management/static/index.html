<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UNINOVIS Project Management</title>
<link rel="stylesheet" href="/static/nav.css">
<style>
:root {
  --primary: #2D3876;
  --primary-light: #4a5299;
  --bg: #f5f6fa;
  --card: #fff;
  --text: #333;
  --text-light: #666;
  --border: #e0e0e0;
  --radius: 8px;
  --shadow: 0 2px 8px rgba(0,0,0,0.08);
  --warn: #b45309;
  --warn-bg: #fff7ed;
  --ok: #2e7d32;
  --danger: #ea4335;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); }

.controls { padding: 12px 24px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; background: var(--card); border-bottom: 1px solid var(--border); }
.seg { display: flex; }
.seg button { padding: 6px 14px; border: 1px solid var(--border); background: var(--card); cursor: pointer; font-size: 0.85rem; margin-left: -1px; }
.seg button:first-child { border-radius: var(--radius) 0 0 var(--radius); margin-left: 0; }
.seg button:last-child { border-radius: 0 var(--radius) var(--radius) 0; }
.seg button.active { background: var(--primary); color: #fff; border-color: var(--primary); }
.controls select, .controls input[type="search"] { padding: 6px 10px; border: 1px solid var(--border); border-radius: var(--radius); font-size: 0.85rem; font-family: inherit; background: #fff; }
.controls input[type="search"] { min-width: 200px; flex: 1; max-width: 320px; }
.controls label.chk { display: inline-flex; align-items: center; gap: 6px; font-size: 0.8rem; color: var(--text-light); cursor: pointer; }
.spacer { flex: 1; }
.btn-add { background: var(--primary); color: #fff; border: none; border-radius: var(--radius); padding: 8px 18px; cursor: pointer; font-size: 0.9rem; font-weight: 500; }
.btn-add:hover { background: var(--primary-light); }

.event-filter { margin: 12px 24px 0; padding: 8px 12px; background: #f0f4ff; border: 1px solid #c8d4f0; border-radius: var(--radius); font-size: 0.85rem; display: flex; align-items: center; gap: 8px; }
.event-filter button { background: none; border: none; color: var(--primary); cursor: pointer; text-decoration: underline; font-size: 0.85rem; }

.stats-bar { padding: 10px 24px 0; font-size: 0.8rem; color: var(--text-light); display: flex; gap: 16px; flex-wrap: wrap; }
.stats-bar strong { color: var(--text); }

.board { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; padding: 12px 24px 24px; }
.board.with-cancelled { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.column { background: #eceef5; border-radius: var(--radius); padding: 10px; min-height: 120px; }
.column h3 { font-size: 0.85rem; color: var(--primary); margin: 2px 4px 10px; display: flex; justify-content: space-between; }
.column h3 .count { color: var(--text-light); font-weight: 500; }
.column.drop-target { outline: 2px dashed var(--primary); outline-offset: -4px; }
.empty-col { font-size: 0.8rem; color: var(--text-light); text-align: center; padding: 16px 4px; }

.card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 10px 12px; margin-bottom: 8px; cursor: pointer; border-left: 4px solid var(--primary); }
.card:hover { box-shadow: 0 3px 12px rgba(0,0,0,0.14); }
.card.kind-complete_event_info { border-left-color: #fbbc04; }
.card.kind-review_event { border-left-color: #34a853; }
.card.prio-high .card-title::after { content: ' \2191'; color: var(--danger); }
.card-title { font-size: 0.9rem; font-weight: 600; margin-bottom: 4px; }
.card-event { font-size: 0.8rem; color: var(--text-light); margin-bottom: 6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card-meta { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
.badge { display: inline-block; font-size: 0.7rem; padding: 1px 7px; border-radius: 10px; background: #e9ecef; color: var(--text); white-space: nowrap; }
.badge.wp { background: #e6f4ea; color: #1e6b34; }
.badge.uni { background: #e3f2fd; color: #1565c0; }
.badge.due { background: #f3e8ff; color: #6b21a8; }
.badge.due.overdue { background: #fde8e8; color: #b91c1c; }
.badge.warn { background: var(--warn-bg); color: var(--warn); }
.badge.ok { background: #e8f5e9; color: var(--ok); }
.card-assignees { font-size: 0.75rem; color: var(--text-light); margin-top: 6px; }

/* List view — same table pattern as the UNINOVIS-UMA Dashboard */
.list-wrap { padding: 12px 24px 24px; }
.task-table-wrap { overflow-x: auto; border-radius: var(--radius); box-shadow: var(--shadow); }
.task-table { width: 100%; border-collapse: collapse; font-size: 0.88rem; background: var(--card); }
.task-table th { background: #f8f9fc; padding: 10px 12px; text-align: left; font-size: 0.75rem; color: var(--text-light); border-bottom: 2px solid var(--border); cursor: pointer; user-select: none; white-space: nowrap; }
.task-table th:hover { color: var(--primary); }
.task-table td { padding: 8px 12px; border-bottom: 1px solid #f0f0f0; vertical-align: middle; }
.task-table tr.task-row { cursor: pointer; }
.task-table tr.task-row:hover td { background: #f8f9fc; }
.task-table .sort-arrow { font-size: 0.7em; margin-left: 3px; color: #aaa; }
.task-table .t-title { font-weight: 600; }
.task-table .t-sub { font-size: 0.75rem; color: var(--text-light); }
.task-table .muted { color: #999; }
.assignee-chip { font-size: 0.75rem; padding: 3px 9px; border-radius: 12px; background: #f5f5f5; border: 1px solid #ddd; display: inline-flex; align-items: center; gap: 5px; margin: 1px 2px 1px 0; white-space: nowrap; }
.assignee-chip .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.status-badge { font-size: 0.68rem; font-weight: 700; padding: 3px 10px; border-radius: 10px; white-space: nowrap; text-transform: uppercase; letter-spacing: 0.04em; }
.no-results { text-align: center; padding: 40px; color: #999; font-size: 1rem; background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); }

.modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.45); z-index: 1000; justify-content: center; align-items: center; }
.modal-overlay.open { display: flex; }
.modal { background: var(--card); border-radius: var(--radius); width: 92%; max-width: 620px; max-height: 90vh; overflow-y: auto; box-shadow: 0 8px 32px rgba(0,0,0,0.2); }
.modal-header { padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.modal-header h2 { font-size: 1.1rem; }
.modal-close { background: none; border: none; font-size: 1.5rem; cursor: pointer; color: var(--text-light); }
.modal-body { padding: 20px; }
.modal-body label { display: block; font-size: 0.85rem; font-weight: 500; margin: 12px 0 4px; }
.modal-body label:first-child { margin-top: 0; }
.modal-body input, .modal-body select, .modal-body textarea { width: 100%; padding: 8px 12px; border: 1px solid var(--border); border-radius: var(--radius); font-size: 0.9rem; font-family: inherit; }
.modal-body textarea { resize: vertical; min-height: 70px; }
.row2 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
.modal-footer { padding: 12px 20px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; }
.btn { padding: 8px 16px; border-radius: var(--radius); border: 1px solid var(--border); cursor: pointer; font-size: 0.88rem; background: var(--card); }
.btn:hover { background: #eee; }
.btn-primary { background: var(--primary); color: #fff; border-color: var(--primary); }
.btn-primary:hover { background: var(--primary-light); }
.btn-danger { background: var(--danger); color: #fff; border-color: var(--danger); }
.btn-danger:hover { background: #c5362b; }

.detail-field { margin-bottom: 12px; }
.detail-field .dl { font-size: 0.75rem; color: var(--text-light); font-weight: 600; text-transform: uppercase; margin-bottom: 3px; }
.detail-field .dv { font-size: 0.92rem; line-height: 1.4; }
.detail-field .dv a { color: var(--primary); }
.missing-list { display: flex; flex-wrap: wrap; gap: 4px; }
.note { font-size: 0.82rem; padding: 8px 10px; border-radius: var(--radius); background: var(--warn-bg); color: var(--warn); border: 1px solid #fed7aa; margin-bottom: 12px; }
.checks { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
.checks th { text-align: left; font-size: 0.72rem; color: var(--text-light); font-weight: 600; padding: 4px 6px; border-bottom: 1px solid var(--border); }
.checks td { padding: 5px 6px; border-bottom: 1px solid #f0f0f0; vertical-align: top; }
.checks .yes { color: var(--ok); }
.checks .no { color: var(--danger); }
.checks .email { font-size: 0.72rem; color: var(--text-light); }
.status-row { display: flex; gap: 8px; align-items: center; }
.status-row select { width: auto; padding: 6px 10px; border: 1px solid var(--border); border-radius: var(--radius); font-size: 0.88rem; }
.history { list-style: none; font-size: 0.8rem; border-left: 2px solid var(--border); padding-left: 10px; max-height: 220px; overflow-y: auto; }
.history li { margin-bottom: 6px; }
.history .when { color: var(--text-light); font-size: 0.72rem; }
.comment-row { display: flex; gap: 6px; margin-top: 8px; }
.comment-row input { flex: 1; padding: 6px 10px; border: 1px solid var(--border); border-radius: var(--radius); font-size: 0.85rem; font-family: inherit; }

.picker-selected { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 6px; }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 3px 10px; border-radius: 12px; background: #e8e0f0; color: var(--primary); font-size: 0.78rem; }
.chip button { background: none; border: none; cursor: pointer; color: var(--primary); font-size: 0.9rem; line-height: 1; }
.picker-results { max-height: 150px; overflow-y: auto; border: 1px solid var(--border); border-radius: var(--radius); margin-top: 4px; display: none; }
.picker-results.open { display: block; }
.picker-results div { padding: 6px 10px; font-size: 0.82rem; cursor: pointer; border-bottom: 1px solid #f3f3f3; }
.picker-results div:hover { background: #f5f7ff; }
.picker-results .sub { color: var(--text-light); font-size: 0.72rem; }

.error-banner { margin: 16px 24px; padding: 12px; background: #fde8e8; color: #b91c1c; border-radius: var(--radius); font-size: 0.88rem; display: none; }

@media (max-width: 900px) {
  .board, .board.with-cancelled { grid-template-columns: 1fr; }
  .row2 { grid-template-columns: 1fr; }
  .controls, .board, .stats-bar, .list-wrap { padding-left: 16px; padding-right: 16px; }
  .event-filter, .error-banner { margin-left: 16px; margin-right: 16px; }
  .controls input[type="search"] { max-width: none; min-width: 0; }
}
</style>

<body>

<script src="/static/nav.js?v=14"></script>
<script>uninovisNav({ crumbs: [{label:'WP1: Administration', href:'/#admin'}], current: 'Project Management' });</script>

<div class="controls">
  <div class="seg" id="viewToggle">
    <button data-view="mine" class="active">My tasks</button>
    <button data-view="all">All tasks</button>
  </div>
  <div class="seg" id="layoutToggle">
    <button data-layout="board" class="active">Board</button>
    <button data-layout="list">List</button>
  </div>
  <input type="search" id="search" placeholder="Search tasks or events…">
  <select id="fKind">
    <option value="">All types</option>
    <option value="complete_event_info">Complete Event information</option>
    <option value="review_event">Review New Event</option>
    <option value="manual">Manual tasks</option>
  </select>
  <select id="fWp"><option value="">All WPs</option></select>
  <select id="fUni"><option value="">All universities</option></select>
  <label class="chk"><input type="checkbox" id="fUnassigned"> Needs attention</label>
  <label class="chk"><input type="checkbox" id="fCancelled"> Show cancelled</label>
  <span class="spacer"></span>
  <button class="btn-add" id="btnNewTask" style="display:none;">+ New task</button>
</div>

<div class="event-filter" id="eventFilter" style="display:none;"></div>
<div class="error-banner" id="errorBanner"></div>
<div class="stats-bar" id="statsBar"></div>
<div class="board" id="board"></div>
<div class="list-wrap" id="list" style="display:none;"></div>

<!-- Task detail -->
<div class="modal-overlay" id="detailModal">
  <div class="modal">
    <div class="modal-header"><h2 id="detailTitle"></h2><button class="modal-close" onclick="closeModal('detailModal')">&times;</button></div>
    <div class="modal-body" id="detailBody"></div>
    <div class="modal-footer" id="detailFooter"></div>
  </div>
</div>

<!-- Create / edit task -->
<div class="modal-overlay" id="editModal">
  <div class="modal">
    <div class="modal-header"><h2 id="editTitle">New task</h2><button class="modal-close" onclick="closeModal('editModal')">&times;</button></div>
    <div class="modal-body">
      <input type="hidden" id="editId">
      <label for="editName">Title *</label>
      <input id="editName" maxlength="200">
      <label for="editDesc">Description</label>
      <textarea id="editDesc"></textarea>
      <div class="row2">
        <div><label for="editStatus">Status</label>
          <select id="editStatus"><option value="todo">To do</option><option value="in_progress">In progress</option><option value="done">Done</option><option value="cancelled">Cancelled</option></select></div>
        <div><label for="editPriority">Priority</label>
          <select id="editPriority"><option value="low">Low</option><option value="normal" selected>Normal</option><option value="high">High</option></select></div>
        <div><label for="editDue">Due date</label><input type="date" id="editDue"></div>
      </div>
      <label for="editEvent">Related event</label>
      <select id="editEvent"><option value="">— None —</option></select>
      <label for="pickerInput">Assignees</label>
      <div class="picker-selected" id="pickerSelected"></div>
      <input id="pickerInput" placeholder="Search the Directory by name, email or university…" autocomplete="off">
      <div class="picker-results" id="pickerResults"></div>
    </div>
    <div class="modal-footer">
      <button class="btn" onclick="closeModal('editModal')">Cancel</button>
      <button class="btn btn-primary" onclick="saveTask()">Save</button>
    </div>
  </div>
</div>

<script>
let TOKEN = '';
let me = '';
let roles = [];
let canCreate = false;
let isManager = false;
let tasks = [];
let people = [];
let peopleByEmail = {};
let events = [];
let eventsById = {};
let view = 'mine';
// Board or list; remembered per browser, but the page works without storage.
let layout = 'board';
try { if (localStorage.getItem('pm_layout') === 'list') layout = 'list'; } catch (e) {}
let listSortCol = 'due';
let listSortAsc = true;
let eventFilterId = new URLSearchParams(location.search).get('event') || '';
let editAssignees = [];

const STATUS_COLUMNS = [
  { id: 'todo', label: 'To do' },
  { id: 'in_progress', label: 'In progress' },
  { id: 'done', label: 'Done' },
  { id: 'cancelled', label: 'Cancelled' },
];
const STATUS_LABEL = Object.fromEntries(STATUS_COLUMNS.map(s => [s.id, s.label]));
const KIND_LABEL = { complete_event_info: 'Complete Event information', review_event: 'Review New Event', manual: 'Manual' };

// HTML-escape for both text content and quoted attribute values.
function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;'); }
// Safe JS string-literal argument for an inline handler inside a double-quoted
// attribute: JSON-quote, then HTML-escape (the browser decodes entities before
// running the handler, so the JS sees an intact string literal).
function jsArg(v) { return esc(JSON.stringify(String(v == null ? '' : v))); }

async function api(method, path, body) {
  const opts = { method, headers: { 'Authorization': 'Bearer ' + TOKEN, 'Content-Type': 'application/json' } };
  if (body) opts.body = JSON.stringify(body);
  const res = await fetch('/project-management' + path, opts);
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw Object.assign(new Error(err.detail || res.statusText), { status: res.status });
  }
  return res.json();
}

// -- Init --------------------------------------------------------------------
(async function init() {
  TOKEN = localStorage.getItem('tommi_token') || new URLSearchParams(location.search).get('token') || '';
  if (!TOKEN) { window.location.href = '/login?redirect=' + encodeURIComponent(location.pathname + location.search); return; }
  let auth;
  try { auth = await api('GET', '/api/auth-check'); }
  catch (e) {
    // Logged in but not granted this tool in Tool Visibility: say so rather
    // than bouncing to a login page they've already passed.
    if (e.status === 403) {
      document.querySelector('.controls').style.display = 'none';
      showError('You do not have access to Project Management. Ask a superuser to enable it for your role in Tool Visibility.');
      return;
    }
    window.location.href = '/login?redirect=' + encodeURIComponent(location.pathname + location.search); return;
  }

  try {
    if (window.GUIDE_CONTENT && GUIDE_CONTENT.project_management) {
      GUIDES.push({ id: 'project_management_overview', title: 'About: Project Management', group: 'WP1: Administration',
        roles: null, url: '/project-management/', primary: true, steps: GUIDE_CONTENT.project_management });
    }
  } catch (e) { console.error('Guide registration failed:', e); }

  me = (auth.username || '').toLowerCase();
  roles = auth.roles || [auth.role];
  canCreate = auth.can_create;
  isManager = auth.is_manager;
  if (canCreate) document.getElementById('btnNewTask').style.display = '';
  // Managers are most likely here to oversee everyone's work.
  if (isManager || eventFilterId) setView('all', false);

  document.querySelectorAll('#viewToggle button').forEach(b => b.onclick = () => setView(b.dataset.view));
  document.querySelectorAll('#layoutToggle button').forEach(b => b.onclick = () => setLayout(b.dataset.layout));
  setLayout(layout, false);
  ['search', 'fKind', 'fWp', 'fUni', 'fUnassigned', 'fCancelled'].forEach(id => {
    const el = document.getElementById(id);
    el.addEventListener(el.tagName === 'INPUT' && el.type === 'search' ? 'input' : 'change', render);
  });
  document.getElementById('btnNewTask').onclick = () => openEdit(null);
  document.querySelectorAll('.modal-overlay').forEach(o => o.addEventListener('click', e => { if (e.target === o) o.classList.remove('open'); }));
  setupPicker();

  await loadAll();
  try { maybeAutoPlayGuideFromUrl(roles, me); } catch (e) { console.error('Guide auto-play failed:', e); }
})();

function setView(v, rerender = true) {
  view = v;
  document.querySelectorAll('#viewToggle button').forEach(b => b.classList.toggle('active', b.dataset.view === v));
  if (rerender) render();
}

function setLayout(l, rerender = true) {
  layout = l;
  try { localStorage.setItem('pm_layout', l); } catch (e) {}
  document.querySelectorAll('#layoutToggle button').forEach(b => b.classList.toggle('active', b.dataset.layout === l));
  document.getElementById('board').style.display = l === 'board' ? '' : 'none';
  document.getElementById('list').style.display = l === 'list' ? '' : 'none';
  if (rerender) render();
}

async function loadAll() {
  try {
    const [t, p] = await Promise.all([api('GET', '/api/tasks'), api('GET', '/api/people')]);
    tasks = t; people = p;
    peopleByEmail = Object.fromEntries(people.map(x => [x.email, x]));
  } catch (e) {
    showError('Could not load tasks: ' + e.message);
    return;
  }
  // Events are only used to link tasks back to the calendar; the board still
  // works if the Event Tracker is unavailable to this user.
  try {
    const res = await fetch('/event-tracker/api/events', { headers: { 'Authorization': 'Bearer ' + TOKEN } });
    events = res.ok ? await res.json() : [];
  } catch { events = []; }
  eventsById = Object.fromEntries(events.map(e => [e.id, e]));
  buildFilters();
  render();
}

function showError(msg) {
  const el = document.getElementById('errorBanner');
  el.textContent = msg; el.style.display = msg ? 'block' : 'none';
}

function buildFilters() {
  const fill = (id, values, allLabel) => {
    const sel = document.getElementById(id), cur = sel.value;
    sel.innerHTML = `<option value="">${allLabel}</option>` + values.map(v => `<option value="${esc(v)}">${esc(v)}</option>`).join('');
    sel.value = values.includes(cur) ? cur : '';
  };
  const wps = [...new Set(tasks.map(t => t.wp).filter(Boolean))].sort((a, b) => parseInt(a.slice(2)) - parseInt(b.slice(2)));
  fill('fWp', wps, 'All WPs');
  fill('fUni', [...new Set(tasks.map(t => t.university).filter(Boolean))].sort(), 'All universities');
}

// -- Helpers -----------------------------------------------------------------
function personName(email) { const p = peopleByEmail[email]; return p ? p.name : email; }

function needsAttention(t) {
  if (t.status === 'done' || t.status === 'cancelled') return false;
  if (!t.assignees.length) return true;
  return t.kind !== 'manual' && (t.assignee_checks || []).some(c => t.assignees.includes(c.email) && c.verified === false);
}

function isOverdue(t) {
  if (!t.due_date || t.status === 'done' || t.status === 'cancelled') return false;
  return t.due_date < new Date().toISOString().slice(0, 10);
}

function fmtDate(iso) {
  if (!iso) return '';
  const d = new Date(iso.length === 10 ? iso + 'T00:00:00' : iso);
  return isNaN(d) ? iso : d.toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' });
}
function fmtDateTime(iso) {
  const d = new Date(iso);
  return isNaN(d) ? iso : d.toLocaleString(undefined, { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
}

function canChangeStatus(t) { return isManager || t.assignees.includes(me) || (t.created_by || '').toLowerCase() === me; }
function canEditTask(t) { return isManager || (t.created_by || '').toLowerCase() === me; }

function filtered() {
  const q = document.getElementById('search').value.trim().toLowerCase();
  const kind = document.getElementById('fKind').value;
  const wp = document.getElementById('fWp').value;
  const uni = document.getElementById('fUni').value;
  const attention = document.getElementById('fUnassigned').checked;
  return tasks.filter(t => {
    if (eventFilterId && t.event_id !== eventFilterId) return false;
    if (view === 'mine' && !t.assignees.includes(me)) return false;
    if (kind && t.kind !== kind) return false;
    if (wp && t.wp !== wp) return false;
    if (uni && t.university !== uni) return false;
    if (attention && !needsAttention(t)) return false;
    if (q) {
      const hay = [t.title, t.description, t.event_name, t.wp, t.university, ...t.assignees.map(personName)].join(' ').toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
}

// -- Board -------------------------------------------------------------------
function render() {
  const showCancelled = document.getElementById('fCancelled').checked;
  const list = filtered();
  const cols = STATUS_COLUMNS.filter(c => c.id !== 'cancelled' || showCancelled);

  const ef = document.getElementById('eventFilter');
  if (eventFilterId) {
    const ev = eventsById[eventFilterId];
    const name = ev ? ev.name : (tasks.find(t => t.event_id === eventFilterId) || {}).event_name || eventFilterId;
    ef.innerHTML = `Showing tasks for event <strong>${esc(name)}</strong> <button onclick="clearEventFilter()">Show all tasks</button>`;
    ef.style.display = '';
  } else ef.style.display = 'none';

  const open = list.filter(t => t.status === 'todo' || t.status === 'in_progress');
  document.getElementById('statsBar').innerHTML =
    `<span><strong>${open.length}</strong> open</span>` +
    `<span><strong>${open.filter(isOverdue).length}</strong> overdue</span>` +
    `<span><strong>${open.filter(needsAttention).length}</strong> need attention (unassigned or unverified)</span>` +
    (view === 'mine' && !open.length && tasks.length ? '<span>Nothing assigned to you — switch to “All tasks” to see the team’s work.</span>' : '');

  if (layout === 'list') {
    renderList(list.filter(t => t.status !== 'cancelled' || showCancelled));
    return;
  }

  const board = document.getElementById('board');
  board.classList.toggle('with-cancelled', showCancelled);
  board.innerHTML = cols.map(c => {
    const colTasks = list.filter(t => t.status === c.id).sort(sortTasks);
    return `<div class="column" data-status="${c.id}">
      <h3>${c.label} <span class="count">${colTasks.length}</span></h3>
      ${colTasks.map(cardHtml).join('') || '<div class="empty-col">No tasks</div>'}
    </div>`;
  }).join('');

  board.querySelectorAll('.card').forEach(el => {
    el.onclick = () => showDetail(el.dataset.id);
    el.ondragstart = e => { e.dataTransfer.setData('text/plain', el.dataset.id); };
  });
  board.querySelectorAll('.column').forEach(col => {
    col.ondragover = e => { e.preventDefault(); col.classList.add('drop-target'); };
    col.ondragleave = () => col.classList.remove('drop-target');
    col.ondrop = e => { e.preventDefault(); col.classList.remove('drop-target'); changeStatus(e.dataTransfer.getData('text/plain'), col.dataset.status); };
  });
}

function sortTasks(a, b) {
  const pr = { high: 0, normal: 1, low: 2 };
  if ((pr[a.priority] ?? 1) !== (pr[b.priority] ?? 1)) return (pr[a.priority] ?? 1) - (pr[b.priority] ?? 1);
  if ((a.due_date || '9') !== (b.due_date || '9')) return (a.due_date || '9') < (b.due_date || '9') ? -1 : 1;
  return (b.created_at || '').localeCompare(a.created_at || '');
}

function cardHtml(t) {
  const badges = [];
  if (t.wp) badges.push(`<span class="badge wp">${esc(t.wp)}</span>`);
  if (t.university) badges.push(`<span class="badge uni">${esc(t.university)}</span>`);
  if (t.due_date) badges.push(`<span class="badge due${isOverdue(t) ? ' overdue' : ''}">Due ${esc(fmtDate(t.due_date))}</span>`);
  if (needsAttention(t)) badges.push(`<span class="badge warn">${t.assignees.length ? '⚠ Unverified assignee' : '⚠ Unassigned'}</span>`);
  const who = t.assignees.length ? t.assignees.map(personName).join(', ') : 'Nobody assigned';
  return `<div class="card kind-${esc(t.kind)} prio-${esc(t.priority)}" data-id="${esc(t.id)}" draggable="${canChangeStatus(t)}">
    <div class="card-title">${esc(t.title)}</div>
    ${t.event_name ? `<div class="card-event">📅 ${esc(t.event_name)}</div>` : ''}
    <div class="card-meta">${badges.join('')}</div>
    <div class="card-assignees">👤 ${esc(who)}</div>
  </div>`;
}

// -- List (table) -------------------------------------------------------------
const STATUS_COLOR = { todo: '#4250b3', in_progress: '#e67e00', done: '#2e7d32', cancelled: '#757575' };

function statusBadgeHtml(s) {
  const c = STATUS_COLOR[s] || '#757575';
  return `<span class="status-badge" style="background:${c}22;color:${c};border:1px solid ${c}55;">${esc(STATUS_LABEL[s] || s)}</span>`;
}

// Dot colour on each assignee chip: green = confirmed by Directory and
// platform role, amber = only partly confirmed, grey = hand-picked.
function assigneeChip(t, email) {
  const check = (t.assignee_checks || []).find(c => c.email === email);
  let color = '#9e9e9e', title = 'Assigned by hand';
  if (check && check.verified === true) { color = '#2e7d32'; title = 'Verified in the Directory and platform account'; }
  else if (check && check.verified === false) { color = '#e67e00'; title = 'Not fully verified'; }
  return `<span class="assignee-chip" title="${title}"><span class="dot" style="background:${color};"></span>${esc(personName(email))}</span>`;
}

function listSortValue(t) {
  switch (listSortCol) {
    case 'title': return (t.title || '').toLowerCase();
    case 'event': return (t.event_name || '').toLowerCase();
    case 'related': return ((t.wp || '') + ' ' + (t.university || '')).trim().toLowerCase();
    case 'assigned': return t.assignees.length ? personName(t.assignees[0]).toLowerCase() : '';
    case 'due': return t.due_date || '9999-99-99';
    case 'status': return STATUS_COLUMNS.findIndex(s => s.id === t.status);
    default: return '';
  }
}

function sortList(col) {
  if (listSortCol === col) listSortAsc = !listSortAsc;
  else { listSortCol = col; listSortAsc = true; }
  render();
}

function renderList(rows) {
  const el = document.getElementById('list');
  if (!rows.length) {
    el.innerHTML = '<div class="no-results">No tasks found. Try adjusting your filters, or create a new one.</div>';
    return;
  }
  rows = [...rows].sort((a, b) => {
    const va = listSortValue(a), vb = listSortValue(b);
    const cmp = typeof va === 'number' ? va - vb : String(va).localeCompare(String(vb));
    // Ties fall back to the board's own order (priority, due date, newest).
    return (listSortAsc ? cmp : -cmp) || sortTasks(a, b);
  });
  const arrow = col => listSortCol === col ? `<span class="sort-arrow">${listSortAsc ? '▲' : '▼'}</span>` : '';
  const th = (col, label) => `<th onclick="sortList('${col}')">${label}${arrow(col)}</th>`;
  let html = '<div class="task-table-wrap"><table class="task-table"><thead><tr>' +
    th('title', 'Title') + th('event', 'Event') + th('related', 'WP / University') +
    th('assigned', 'Assigned to') + th('due', 'Due date') + th('status', 'Status') +
    '</tr></thead><tbody>';
  rows.forEach(t => {
    const related = [t.wp, t.university].filter(Boolean).map(esc).join(' · ');
    const warn = needsAttention(t) ? ` <span class="badge warn">${t.assignees.length ? '⚠ Unverified' : '⚠ Unassigned'}</span>` : '';
    html += `<tr class="task-row" data-id="${esc(t.id)}">` +
      `<td><span class="t-title">${esc(t.title)}</span>${t.priority === 'high' ? ' <span style="color:var(--danger)" title="High priority">↑</span>' : ''}</td>` +
      `<td>${t.event_name ? esc(t.event_name) : '<span class="muted">—</span>'}</td>` +
      `<td>${related || '<span class="muted">—</span>'}</td>` +
      `<td>${t.assignees.map(e => assigneeChip(t, e)).join('') || '<span class="muted">—</span>'}${warn}</td>` +
      `<td>${t.due_date ? `<span class="badge due${isOverdue(t) ? ' overdue' : ''}">${esc(fmtDate(t.due_date))}</span>` : '<span class="muted">—</span>'}</td>` +
      `<td>${statusBadgeHtml(t.status)}</td>` +
      '</tr>';
  });
  html += '</tbody></table></div>';
  el.innerHTML = html;
  el.querySelectorAll('.task-row').forEach(r => r.onclick = () => showDetail(r.dataset.id));
}

function clearEventFilter() {
  eventFilterId = '';
  history.replaceState(null, '', location.pathname);
  render();
}

async function changeStatus(id, status) {
  const t = tasks.find(x => x.id === id);
  if (!t || t.status === status) return;
  if (!canChangeStatus(t)) { alert('Only the task’s assignees, creator, or a content manager can change its status.'); return; }
  try {
    const updated = await api('PUT', `/api/tasks/${encodeURIComponent(id)}/status`, { status });
    replaceTask(updated);
    render();
    if (document.getElementById('detailModal').classList.contains('open')) showDetail(id);
  } catch (e) { alert('Error: ' + e.message); }
}

function replaceTask(updated) {
  const i = tasks.findIndex(x => x.id === updated.id);
  if (i >= 0) tasks[i] = updated; else tasks.push(updated);
}

// -- Detail ------------------------------------------------------------------
function yn(v) { return v === undefined ? '—' : (v ? '<span class="yes">✔</span>' : '<span class="no">✘</span>'); }

function showDetail(id) {
  const t = tasks.find(x => x.id === id);
  if (!t) return;
  document.getElementById('detailTitle').textContent = t.title;
  const ev = t.event_id ? eventsById[t.event_id] : null;
  let html = '';

  if (t.assignment_note) html += `<div class="note">${esc(t.assignment_note)}</div>`;

  html += `<div class="detail-field"><div class="dl">Status</div><div class="dv status-row">` +
    (canChangeStatus(t)
      ? `<select onchange="changeStatus(${jsArg(t.id)}, this.value)">${STATUS_COLUMNS.map(s => `<option value="${s.id}"${s.id === t.status ? ' selected' : ''}>${s.label}</option>`).join('')}</select>`
      : esc(STATUS_LABEL[t.status] || t.status)) +
    ` <span class="badge">${esc(t.priority)} priority</span>` +
    (t.due_date ? ` <span class="badge due${isOverdue(t) ? ' overdue' : ''}">Due ${esc(fmtDate(t.due_date))}</span>` : '') +
    `</div></div>`;

  if (t.description) html += `<div class="detail-field"><div class="dl">Description</div><div class="dv">${esc(t.description)}</div></div>`;

  if (t.event_id) {
    const name = ev ? ev.name : (t.event_name || t.event_id);
    html += `<div class="detail-field"><div class="dl">Event</div><div class="dv">` +
      `<a href="/event-tracker/?event=${encodeURIComponent(t.event_id)}">${esc(name)}</a>` +
      (ev ? '' : ' <span class="badge">no longer in the Event Tracker</span>') +
      (t.series_id ? ' <span class="badge">recurring series</span>' : '') + `</div></div>`;
  }

  if (t.kind === 'complete_event_info') {
    html += `<div class="detail-field"><div class="dl">Missing information</div><div class="dv missing-list">` +
      (t.missing_fields.length ? t.missing_fields.map(f => `<span class="badge warn">${esc(f)}</span>`).join('') : '<span class="badge ok">Nothing missing</span>') +
      `</div></div>`;
  }
  if (t.wp || t.university) {
    html += `<div class="detail-field"><div class="dl">${t.wp ? 'Work package' : 'Organising university'}</div><div class="dv">${esc(t.wp || t.university)}${t.wp && t.university ? ' · organised by ' + esc(t.university) : ''}</div></div>`;
  }

  html += `<div class="detail-field"><div class="dl">Assignees</div><div class="dv">`;
  const checks = t.assignee_checks || [];
  if (checks.length) {
    const auto = t.kind !== 'manual';
    html += `<table class="checks"><thead><tr><th>Person</th><th>In Directory</th>${auto ? '<th>Role in Directory</th><th>Platform role</th><th>Verified</th>' : ''}<th>Assigned</th></tr></thead><tbody>` +
      checks.map(c => `<tr><td>${esc(c.name)}${c.university ? ' (' + esc(c.university) + ')' : ''}<div class="email">${esc(c.email)}</div></td>` +
        `<td>${yn(c.in_directory)}</td>` +
        (auto ? `<td>${yn(c.directory_role)}</td><td>${c.platform_account === false ? '<span class="no">no account</span>' : yn(c.platform_role)}</td><td>${yn(c.verified)}</td>` : '') +
        `<td>${yn(t.assignees.includes(c.email))}</td></tr>`).join('') +
      `</tbody></table>`;
  } else {
    html += t.assignees.length ? esc(t.assignees.map(personName).join(', ')) : '<em>Nobody assigned</em>';
  }
  html += `</div></div>`;

  html += `<div class="detail-field"><div class="dl">Activity</div><ul class="history">` +
    [...(t.history || [])].reverse().map(h => `<li><span class="when">${esc(fmtDateTime(h.at))} · ${esc(h.by === 'system' ? 'System' : personName(h.by))}</span><br>${esc(h.text)}</li>`).join('') +
    `</ul>` +
    (canChangeStatus(t) ? `<div class="comment-row"><input id="commentInput" placeholder="Add a comment…" maxlength="2000"><button class="btn" onclick="addComment(${jsArg(t.id)})">Add</button></div>` : '') +
    `</div>`;

  document.getElementById('detailBody').innerHTML = html;

  let footer = '';
  if (isManager && t.kind !== 'manual') footer += `<button class="btn" onclick="recheck(${jsArg(t.id)})" title="Look up the content manager / WP leader again in the Directory">Re-check assignees</button>`;
  if (canEditTask(t)) {
    footer += `<button class="btn btn-danger" onclick="deleteTask(${jsArg(t.id)})">Delete</button>`;
    footer += `<button class="btn btn-primary" onclick="closeModal('detailModal');openEdit(${jsArg(t.id)})">Edit</button>`;
  }
  footer += `<button class="btn" onclick="closeModal('detailModal')">Close</button>`;
  document.getElementById('detailFooter').innerHTML = footer;
  document.getElementById('detailModal').classList.add('open');
}

function closeModal(id) { document.getElementById(id).classList.remove('open'); }

async function addComment(id) {
  const input = document.getElementById('commentInput');
  const text = input.value.trim();
  if (!text) return;
  try { replaceTask(await api('POST', `/api/tasks/${encodeURIComponent(id)}/comments`, { text })); showDetail(id); }
  catch (e) { alert('Error: ' + e.message); }
}

async function recheck(id) {
  try { replaceTask(await api('POST', `/api/tasks/${encodeURIComponent(id)}/recheck-assignees`)); render(); showDetail(id); }
  catch (e) { alert('Error: ' + e.message); }
}

async function deleteTask(id) {
  if (!confirm('Delete this task? This cannot be undone.')) return;
  try {
    await api('DELETE', `/api/tasks/${encodeURIComponent(id)}`);
    tasks = tasks.filter(t => t.id !== id);
    closeModal('detailModal'); buildFilters(); render();
  } catch (e) { alert('Error: ' + e.message); }
}

// -- Create / edit -----------------------------------------------------------
function openEdit(id) {
  const t = id ? tasks.find(x => x.id === id) : null;
  document.getElementById('editTitle').textContent = t ? 'Edit task' : 'New task';
  document.getElementById('editId').value = t ? t.id : '';
  document.getElementById('editName').value = t ? t.title : '';
  document.getElementById('editDesc').value = t ? t.description : '';
  document.getElementById('editStatus').value = t ? t.status : 'todo';
  document.getElementById('editPriority').value = t ? t.priority : 'normal';
  document.getElementById('editDue').value = t ? (t.due_date || '') : '';

  const sel = document.getElementById('editEvent');
  const internal = events.filter(e => e.source !== 'catalogue').sort((a, b) => (b.start_date || '').localeCompare(a.start_date || ''));
  const current = t ? t.event_id : (eventFilterId || '');
  let opts = '<option value="">— None —</option>';
  if (current && !eventsById[current]) opts += `<option value="${esc(current)}">${esc((t && t.event_name) || current)} (deleted)</option>`;
  opts += internal.map(e => `<option value="${esc(e.id)}">${esc(e.name)}${e.start_date ? ' — ' + esc(fmtDate(e.start_date)) : ''}</option>`).join('');
  sel.innerHTML = opts;
  sel.value = current;

  editAssignees = t ? [...t.assignees] : [];
  renderPicked();
  document.getElementById('pickerInput').value = '';
  document.getElementById('pickerResults').classList.remove('open');
  document.getElementById('editModal').classList.add('open');
  document.getElementById('editName').focus();
}

async function saveTask() {
  const id = document.getElementById('editId').value;
  const body = {
    title: document.getElementById('editName').value.trim(),
    description: document.getElementById('editDesc').value.trim(),
    status: document.getElementById('editStatus').value,
    priority: document.getElementById('editPriority').value,
    due_date: document.getElementById('editDue').value,
    assignees: editAssignees,
    event_id: document.getElementById('editEvent').value,
  };
  if (!body.title) { alert('Title is required.'); return; }
  try {
    const saved = id
      ? await api('PUT', `/api/tasks/${encodeURIComponent(id)}`, body)
      : await api('POST', '/api/tasks', body);
    replaceTask(saved);
    closeModal('editModal'); buildFilters(); render();
  } catch (e) { alert('Error: ' + e.message); }
}

function setupPicker() {
  const input = document.getElementById('pickerInput');
  const results = document.getElementById('pickerResults');
  input.addEventListener('input', () => {
    const q = input.value.trim().toLowerCase();
    if (!q) { results.classList.remove('open'); return; }
    const matches = people
      .filter(p => !editAssignees.includes(p.email) && (p.name + ' ' + p.email + ' ' + p.university).toLowerCase().includes(q))
      .slice(0, 20);
    results.innerHTML = matches.map(p => `<div data-email="${esc(p.email)}">${esc(p.name)} <span class="sub">${esc(p.email)}${p.university ? ' · ' + esc(p.university) : ''}</span></div>`).join('')
      || '<div class="sub" style="cursor:default;">No one in the Directory matches</div>';
    results.classList.add('open');
  });
  results.addEventListener('click', e => {
    const row = e.target.closest('[data-email]');
    if (!row) return;
    editAssignees.push(row.dataset.email);
    input.value = ''; results.classList.remove('open');
    renderPicked(); input.focus();
  });
}

function renderPicked() {
  const el = document.getElementById('pickerSelected');
  el.innerHTML = editAssignees.map((e, i) => `<span class="chip">${esc(personName(e))}<button type="button" data-i="${i}" title="Remove">&times;</button></span>`).join('');
  el.querySelectorAll('button').forEach(b => b.onclick = () => { editAssignees.splice(+b.dataset.i, 1); renderPicked(); });
}
</script>
</body>
</html>
