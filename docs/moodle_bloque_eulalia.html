<!--
  Bloque HTML para Moodle — Acceso SSO a Eulalia

  INSTRUCCIONES:
  1. En tu curso de Moodle, activa edición
  2. Añade un bloque "HTML" (o "Texto")
  3. Cambia a modo código/HTML y pega este contenido
  4. Cambia SERVIDOR_TOMMI por la URL real de tu servidor
  5. Cambia SECRETO por el mismo valor que LALI_MOODLE_SECRET en el servidor

  NOTA: El secreto está en el código JS, pero solo lo ven usuarios autenticados
  en Moodle. El enlace generado caduca en 5 minutos.
-->
<div id="eulalia-block" style="text-align: center; padding: 10px;">
  <p style="font-size: 13px; color: #475569; margin-bottom: 10px;">Tutora virtual
    de Lingüística Aplicada a la Logopedia</p>
  <a id="eulalia-link"
    style="display: inline-block; background: #4250b3; color: #fff; padding: 10px 24px; border-radius: 8px; text-decoration: none; font-size: 14px; font-weight: 600;"
    href="#"> Abrir Eulalia </a>
  <p id="eulalia-status"
    style="font-size: 11px; color: #94a3b8; margin-top: 6px;"></p>
</div>
<p>
  <script>
    (function() {
      // ══════════════════════════════════════════════════════════════
      // CONFIGURACIÓN — Cambia estos valores
      // ══════════════════════════════════════════════════════════════
      var SERVIDOR_TOMMI =
        'http://localhost:8000'; // URL del servidor TOMMI (sin / final)
      var SECRETO =
        'lali20267'; // Mismo valor que LALI_MOODLE_SECRET
      // ══════════════════════════════════════════════════════════════

      // Obtener email del usuario logueado en Moodle via API interna
      var userEmail = '';
      var sessKey = M && M.cfg && M.cfg.sesskey ? M.cfg.sesskey : '';

      if (!sessKey) {
        document.getElementById('eulalia-status').textContent =
          'No se pudo acceder a la sesión de Moodle.';
        return;
      }

      // Llamada a la API interna de Moodle para obtener datos del usuario
      try {
        var xhr = new XMLHttpRequest();
        xhr.open('POST', '/lib/ajax/service.php?sesskey=' + sessKey, false);
        xhr.setRequestHeader('Content-Type', 'application/json');
        xhr.send(JSON.stringify([{
          index: 0,
          methodname: 'core_user_get_users_by_field',
          args: { field: 'id', values: [M.cfg.userId] }
        }]));
        if (xhr.status === 200) {
          var resp = JSON.parse(xhr.responseText);
          if (resp[0] && !resp[0].error && resp[0].data && resp[0].data[0]) {
            userEmail = resp[0].data[0].email || '';
          }
        }
      } catch (e) {}

      // Fallback: buscar email en el DOM
      if (!userEmail) {
        var emailEl = document.querySelector('.userprofile .email a') ||
          document.querySelector('.myprofileitem.email a');
        if (emailEl) userEmail = emailEl.textContent.trim();
      }
      if (!userEmail) {
        var userMenu = document.querySelector('.usermenu .usertext') ||
          document.querySelector('.userbutton .usertext') ||
          document.querySelector('[data-action="user-menu"] .usertext');
        if (userMenu) {
          var text = userMenu.textContent.trim();
          if (text.indexOf('@') >= 0) userEmail = text;
        }
      }

      if (!userEmail) {
        document.getElementById('eulalia-status').textContent =
          'No se pudo detectar tu email de Moodle. Contacta con el profesor.';
        return;
      }

      userEmail = userEmail.toLowerCase();

      // Generar firma HMAC-SHA256
      var timestamp = Math.floor(Date.now() / 1000).toString();
      var mensaje = userEmail + ':' + timestamp;

      var encoder = new TextEncoder();
      crypto.subtle.importKey(
        'raw', encoder.encode(SECRETO), {
          name: 'HMAC',
          hash: 'SHA-256'
        }, false, ['sign']
      ).then(function(key) {
        return crypto.subtle.sign('HMAC', key, encoder.encode(mensaje));
      }).then(function(signature) {
        var sig = Array.from(new Uint8Array(signature))
          .map(function(b) {
            return b.toString(16).padStart(2, '0');
          })
          .join('');
        var url = SERVIDOR_TOMMI +
          '/api/public-agent/eulalia/moodle-login' +
          '?user=' + encodeURIComponent(userEmail) +
          '&ts=' + timestamp + '&sig=' + sig;

        document.getElementById('eulalia-link').href = url;
        document.getElementById('eulalia-link').target = '_blank';
        document.getElementById('eulalia-status').textContent =
          'Accediendo como: ' + userEmail;
      }).catch(function(err) {
        document.getElementById('eulalia-status').textContent =
          'Error al generar acceso: ' + err.message;
      });
    })();
  </script>
</p>
