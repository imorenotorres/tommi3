<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bloom's Taxonomy Trainer</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: system-ui, -apple-system, sans-serif; background: #f8fafc; color: #1e293b; min-height: 100vh; }

/* ── Header & tabs ── */
.header { background: #7c3aed; padding: 12px 20px; }
.header-row { display: flex; align-items: center; gap: 12px; }
.logo { color: #fff; font-weight: 800; font-size: 18px; }
.user-info { color: rgba(255,255,255,0.75); font-size: 12px; margin-left: auto; }

.tabs { display: flex; background: #6d28d9; padding: 0 20px; }
.tab { padding: 10px 20px; font-size: 13px; font-weight: 600; color: rgba(255,255,255,0.65);
       border: none; background: none; cursor: pointer; border-bottom: 3px solid transparent; white-space: nowrap; }
.tab.active { color: #fff; border-bottom-color: #fff; }
.tab:hover:not(.active) { color: rgba(255,255,255,0.9); }

/* ── Container ── */
.container { max-width: 720px; margin: 0 auto; padding: 24px 20px 48px; }

/* ── Buttons ── */
.btn { padding: 8px 18px; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; }
.btn-primary { background: #7c3aed; color: #fff; }
.btn-primary:hover { background: #6d28d9; }
.btn-sm { padding: 5px 14px; font-size: 12px; }
.controls { display: flex; gap: 12px; align-items: flex-end; margin-bottom: 20px; flex-wrap: wrap; }
.control-group { display: flex; flex-direction: column; gap: 4px; }
.control-group label { font-size: 12px; font-weight: 600; color: #475569; }
.control-group select { padding: 8px 12px; border: 2px solid #e2e8f0; border-radius: 6px; font-size: 14px; background: #fff; }

/* ── Problem card ── */
.problem-card { background: #fff; border: 2px solid #e2e8f0; border-radius: 12px; padding: 18px 20px; margin-bottom: 16px; }
.problem-card h2 { font-size: 16px; color: #7c3aed; margin-bottom: 6px; font-weight: 700; }
.problem-card .desc { font-size: 13px; color: #64748b; line-height: 1.6; }

/* ── Steps ── */
.step { background: #fff; border: 2px solid #e2e8f0; border-radius: 10px; padding: 16px 18px; margin-bottom: 10px; }
.step.active   { border-color: #7c3aed; }
.step.correct  { border-color: #16a34a; background: #f0fdf4; }
.step.incorrect { border-color: #dc2626; }
.step.locked   { opacity: 0.4; pointer-events: none; }
.step .prompt  { font-size: 14px; font-weight: 600; color: #1e293b; margin-bottom: 12px; line-height: 1.6; }
.step .feedback { font-size: 13px; margin-top: 8px; line-height: 1.6; }
.step .feedback.ok    { color: #16a34a; }
.step .feedback.wrong { color: #dc2626; }
.hint-btn { font-size: 12px; color: #7c3aed; cursor: pointer; border: none; background: none; text-decoration: underline; }
.hint { font-size: 12px; color: #6d28d9; background: #faf5ff; border-left: 3px solid #7c3aed; padding: 6px 10px; border-radius: 4px; margin-top: 6px; display: none; }

/* ── Level buttons (1-6) ── */
.level-btns { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
.level-btn {
    padding: 8px 14px; border: none; border-radius: 8px; font-size: 12px; font-weight: 700;
    color: #fff; cursor: pointer; transition: filter 0.1s, transform 0.1s, box-shadow 0.1s;
    white-space: nowrap;
}
.level-btn:hover { filter: brightness(1.1); transform: translateY(-1px); }
.level-btn.selected { box-shadow: 0 0 0 3px #fff, 0 0 0 5px currentColor; transform: translateY(-1px); }

/* ── Choice buttons (A/B/C/D) ── */
.choice-btns { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
.choice-btn {
    padding: 8px 18px; border: 2px solid #e2e8f0; border-radius: 8px;
    font-size: 14px; font-weight: 800; background: #fff; cursor: pointer; color: #475569;
    transition: all 0.1s;
}
.choice-btn:hover { border-color: #7c3aed; color: #7c3aed; }
.choice-btn.selected { background: #7c3aed; border-color: #7c3aed; color: #fff; }

/* ── Results ── */
.results { background: #fff; border: 2px solid #e2e8f0; border-radius: 12px;
           padding: 24px; text-align: center; display: none; margin-top: 8px; }
.results h3 { font-size: 18px; color: #7c3aed; margin-bottom: 8px; }
.score { font-size: 40px; font-weight: 800; }
.score.good { color: #16a34a; }
.score.mid  { color: #f59e0b; }
.score.bad  { color: #dc2626; }

/* ── Pyramid tab ── */
.pyramid-wrap { max-width: 460px; margin: 0 auto 20px; }
.bloom-band {
    display: block; margin: 3px auto; padding: 13px 10px;
    text-align: center; color: #fff; font-weight: 700; font-size: 13px;
    border-radius: 6px; cursor: pointer; transition: filter 0.15s, transform 0.1s;
    user-select: none;
}
.bloom-band:hover  { filter: brightness(1.1); transform: scaleX(1.02); }
.bloom-band.active { outline: 3px solid #fff; box-shadow: 0 0 0 5px rgba(0,0,0,0.25); }

.level-panel {
    background: #fff; border: 2px solid #e2e8f0; border-radius: 12px;
    padding: 18px 20px; margin-top: 16px; min-height: 100px;
}
.level-panel .lp-title { font-size: 18px; font-weight: 800; margin-bottom: 4px; }
.level-panel .lp-desc  { font-size: 13px; color: #475569; margin-bottom: 12px; line-height: 1.5; }
.level-panel .lp-section { font-size: 11px; font-weight: 700; color: #94a3b8; text-transform: uppercase; margin-bottom: 6px; }
.verb-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
.verb-chip  { padding: 3px 10px; border-radius: 10px; font-size: 12px; font-weight: 600;
              background: #f3f4f6; color: #374151; }
.obj-list { list-style: none; }
.obj-list li { font-size: 13px; color: #475569; padding: 5px 0; border-bottom: 1px solid #f1f5f9; line-height: 1.5; }
.obj-list li:last-child { border-bottom: none; }
.obj-list em { color: #1e293b; font-style: normal; font-weight: 600; }

.pyramid-hint { font-size: 13px; color: #94a3b8; text-align: center; padding: 24px; }
</style>
</head>
<body>

<div class="header">
    <div style="font-size:12px;margin-bottom:4px;color:rgba(255,255,255,0.7);">
        <a href="/ultir" style="color:rgba(255,255,255,0.7);text-decoration:none;">UltiR</a>
        <span style="margin:0 5px;opacity:.5;">›</span>Bloom's Taxonomy Trainer
    </div>
    <div class="header-row">
        <span class="logo">&#127919; Bloom's Taxonomy Trainer</span>
        <span class="user-info" id="user-info"></span>
    </div>
</div>

<div class="tabs">
    <button class="tab active" onclick="switchTab('pyramid',this)">&#9651; Pyramid</button>
    <button class="tab" onclick="switchTab('exercises',this)">&#9998; Exercises</button>
</div>

<div class="container">

    <!-- ════ Pyramid tab ════ -->
    <div id="tab-pyramid">
        <div class="pyramid-wrap">
            <div class="bloom-band" style="width:20%;background:#8b5cf6;" onclick="showLevel(6,this)">6 · Create</div>
            <div class="bloom-band" style="width:34%;background:#f97316;" onclick="showLevel(5,this)">5 · Evaluate</div>
            <div class="bloom-band" style="width:48%;background:#f59e0b;" onclick="showLevel(4,this)">4 · Analyze</div>
            <div class="bloom-band" style="width:62%;background:#10b981;" onclick="showLevel(3,this)">3 · Apply</div>
            <div class="bloom-band" style="width:76%;background:#3b82f6;" onclick="showLevel(2,this)">2 · Understand</div>
            <div class="bloom-band" style="width:90%;background:#64748b;" onclick="showLevel(1,this)">1 · Remember</div>
        </div>
        <div class="level-panel" id="level-panel">
            <p class="pyramid-hint">&#8593; Click any level to see its description, verbs and example objectives.</p>
        </div>
    </div>

    <!-- ════ Exercises tab ════ -->
    <div id="tab-exercises" style="display:none;">
        <div class="controls">
            <div class="control-group">
                <label>Exercise type</label>
                <select id="ex-type">
                    <option value="classify">Classify the Objective</option>
                    <option value="verb_match">Classify the Verb</option>
                    <option value="design">Identify the Level — and Escalate</option>
                </select>
            </div>
            <button class="btn btn-primary" onclick="newExercise()">New exercise</button>
        </div>
        <div id="exercise-area"></div>
        <div class="results" id="results">
            <h3>Exercise complete</h3>
            <div class="score" id="score-text"></div>
            <div style="margin-top:14px;">
                <button class="btn btn-primary" onclick="newExercise()">New exercise</button>
            </div>
        </div>
    </div>

</div>

<script>
// ════════════════════════════════════════════════════════════
// Taxonomy data (client-side for pyramid)
// ════════════════════════════════════════════════════════════
var BLOOM = [null,
    { name:"Remember",   es:"Recordar",   color:"#64748b",
      desc:"Retrieve knowledge from long-term memory: recognise or recall facts, definitions, concepts.",
      verbs:["define","list","recall","identify","name","state","recognize","label","enumerate","memorize","reproduce","match"],
      objs:[
        'define the concept of <em>formative assessment</em>',
        'list the main characteristics of constructivist learning',
        'identify the six levels of Bloom\'s revised taxonomy',
        'recall Piaget\'s four stages of cognitive development',
      ]},
    { name:"Understand", es:"Comprender", color:"#3b82f6",
      desc:"Construct meaning from instructional messages: interpret, classify, compare, explain, infer.",
      verbs:["explain","summarize","classify","describe","interpret","compare","outline","discuss","paraphrase","illustrate","predict","translate"],
      objs:[
        'explain the role of the zone of proximal development in guided learning',
        'compare direct instruction with inquiry-based learning',
        'summarize the main principles of cooperative learning',
        'describe how socioeconomic context influences student motivation',
      ]},
    { name:"Apply",      es:"Aplicar",    color:"#10b981",
      desc:"Carry out or use a procedure: execute a known procedure or implement it in a new context.",
      verbs:["apply","demonstrate","implement","use","solve","calculate","operate","practice","show","carry out","execute","produce"],
      objs:[
        'apply Bloom\'s taxonomy to write measurable lesson objectives',
        'demonstrate a classroom management strategy in a micro-teaching session',
        'implement UDL principles to adapt an existing lesson plan',
        'solve a classroom conflict using restorative dialogue techniques',
      ]},
    { name:"Analyze",    es:"Analizar",   color:"#f59e0b",
      desc:"Break material into parts; determine how they relate to each other and to an overall structure.",
      verbs:["analyze","differentiate","examine","distinguish","deconstruct","break down","organize","test","inspect","relate","attribute"],
      objs:[
        'analyze factors contributing to school failure in a case study',
        'differentiate between behaviourist and constructivist feedback approaches',
        'examine how assessment design influences students\' learning strategies',
        'deconstruct a lesson plan to identify its pedagogical assumptions',
      ]},
    { name:"Evaluate",   es:"Evaluar",    color:"#f97316",
      desc:"Make judgements based on criteria and standards through checking and critiquing.",
      verbs:["evaluate","judge","justify","critique","assess","recommend","defend","argue","select","prioritize","appraise","weigh"],
      objs:[
        'evaluate the effectiveness of an intervention using pre- and post-test data',
        'justify the pedagogical choices made in a lesson plan',
        'critique a research study in terms of its methodology',
        'recommend evidence-based strategies to improve student engagement',
      ]},
    { name:"Create",     es:"Crear",      color:"#8b5cf6",
      desc:"Put elements together to form a new, coherent whole: reorganise, generate, plan, produce.",
      verbs:["design","create","develop","formulate","plan","produce","compose","construct","generate","invent","devise","draft"],
      objs:[
        'design an inclusive unit of work applying UDL principles',
        'create an assessment rubric aligned with learning objectives',
        'formulate a research question and propose a methodology',
        'develop a professional development plan for a newly qualified teacher',
      ]},
];

// ════════════════════════════════════════════════════════════
// API & session
// ════════════════════════════════════════════════════════════
var TOKEN = new URLSearchParams(window.location.search).get('token') || '';
var BASE  = '/lti/bloom/api';

function api(path, opts) {
    var sep = path.indexOf('?') >= 0 ? '&' : '?';
    return fetch(BASE + path + sep + 'token=' + TOKEN, opts || {});
}

api('/session').then(function(r) { return r.json(); }).then(function(d) {
    document.getElementById('user-info').textContent =
        (d.name || '') + (d.course_name ? ' — ' + d.course_name : '');
}).catch(function(){});

// ════════════════════════════════════════════════════════════
// Tab switching
// ════════════════════════════════════════════════════════════
function switchTab(name, btn) {
    document.querySelectorAll('.tab').forEach(function(t) { t.classList.remove('active'); });
    btn.classList.add('active');
    document.getElementById('tab-pyramid').style.display   = name === 'pyramid'   ? 'block' : 'none';
    document.getElementById('tab-exercises').style.display = name === 'exercises' ? 'block' : 'none';
}

// ════════════════════════════════════════════════════════════
// Pyramid
// ════════════════════════════════════════════════════════════
function showLevel(n, el) {
    document.querySelectorAll('.bloom-band').forEach(function(b) { b.classList.remove('active'); });
    el.classList.add('active');
    var L = BLOOM[n];
    var chips = L.verbs.map(function(v) {
        return '<span class="verb-chip">' + v + '</span>';
    }).join('');
    var objs = L.objs.map(function(o) {
        return '<li>The student will be able to ' + o + '.</li>';
    }).join('');
    document.getElementById('level-panel').innerHTML =
        '<div class="lp-title" style="color:' + L.color + ';">Level ' + n + ': ' + L.name + ' <span style="font-size:14px;font-weight:400;color:#64748b;">(' + L.es + ')</span></div>' +
        '<p class="lp-desc">' + L.desc + '</p>' +
        '<div class="lp-section">Key verbs</div>' +
        '<div class="verb-chips">' + chips + '</div>' +
        '<div class="lp-section">Example objectives</div>' +
        '<ul class="obj-list">' + objs + '</ul>';
}

// ════════════════════════════════════════════════════════════
// Exercise engine
// ════════════════════════════════════════════════════════════
var exState = { mode:'classify', problem:null, seed:0, answered:{}, correct:0, total:0 };

async function newExercise() {
    exState.mode     = document.getElementById('ex-type').value;
    exState.seed     = Math.floor(Math.random() * 1e6);
    exState.answered = {};
    exState.correct  = 0;
    exState.total    = 0;
    document.getElementById('results').style.display = 'none';
    document.getElementById('exercise-area').innerHTML =
        '<div style="color:#64748b;font-size:14px;padding:10px;">Loading…</div>';

    var r = await api('/exercise?type=' + exState.mode + '&seed=' + exState.seed);
    exState.problem = await r.json();
    exState.total   = exState.problem.n_steps;
    renderExercise();
}

function renderExercise() {
    var p = exState.problem;
    if (!p) return;

    var html = '<div class="problem-card">'
             + '<h2>' + p.title + '</h2>'
             + '<p class="desc">' + p.description + '</p>'
             + '</div>';

    p.steps.forEach(function(step, i) {
        var done     = exState.answered[step.id];
        var unlocked = i === 0 || exState.answered[p.steps[i-1].id];
        var cls      = 'step' + (done ? (done.correct ? ' correct' : ' incorrect') : (unlocked ? ' active' : ' locked'));

        html += '<div class="' + cls + '" id="s-' + step.id + '">';
        html += '<div class="prompt">Step ' + (i+1) + ': ' + step.prompt + '</div>';

        if (done) {
            var levelName = (done.expected >= 1 && done.expected <= 6 && step.input_type === 'level')
                ? ' (' + BLOOM[done.expected].name + ')' : '';
            var choiceLetter = (step.input_type === 'choice') ? ' (option ' + 'ABCD'[done.expected-1] + ')' : '';
            html += '<div class="feedback ' + (done.correct ? 'ok' : 'wrong') + '">';
            if (done.correct) {
                html += '&#10003; Correct: Level ' + done.expected + levelName + choiceLetter;
            } else {
                html += '&#10007; Your answer: ' + done.student + '<br>';
                html += 'Correct: ' + done.expected + levelName + choiceLetter + '<br>';
                html += '<span style="color:#64748b;font-size:12px;">' + done.formula + '</span>';
            }
            html += '</div>';
        } else if (unlocked) {
            if (step.input_type === 'level') {
                html += '<div class="level-btns">';
                var colors = ['#64748b','#3b82f6','#10b981','#f59e0b','#f97316','#8b5cf6'];
                for (var k = 1; k <= 6; k++) {
                    html += '<button class="level-btn" style="background:' + colors[k-1] + '" '
                          + 'onclick="selectLevel(\'' + step.id + '\',' + k + ',this)">'
                          + k + ' · ' + BLOOM[k].name + '</button>';
                }
                html += '</div>';
            } else if (step.input_type === 'choice') {
                html += '<div class="choice-btns">';
                for (var k = 0; k < 4; k++) {
                    html += '<button class="choice-btn" onclick="selectChoice(\'' + step.id + '\',' + (k+1) + ',this)">'
                          + 'ABCD'[k] + '</button>';
                }
                html += '</div>';
            }
            html += '<input type="hidden" id="inp-' + step.id + '" value="">';
            html += '<div style="display:flex;gap:8px;align-items:center;margin-top:4px;">'
                  + '<button class="btn btn-primary btn-sm" onclick="doCheck(\'' + step.id + '\')">Check</button>'
                  + '<button class="hint-btn" onclick="toggleHint(\'' + step.id + '\')">Hint</button>'
                  + '</div>';
            html += '<div class="hint" id="h-' + step.id + '">' + step.hint + '</div>';
        }
        html += '</div>';
    });

    document.getElementById('exercise-area').innerHTML = html;
}

function selectLevel(stepId, level, btn) {
    document.getElementById('inp-' + stepId).value = level;
    btn.closest('.level-btns').querySelectorAll('.level-btn').forEach(function(b) { b.classList.remove('selected'); });
    btn.classList.add('selected');
}

function selectChoice(stepId, choice, btn) {
    document.getElementById('inp-' + stepId).value = choice;
    btn.closest('.choice-btns').querySelectorAll('.choice-btn').forEach(function(b) { b.classList.remove('selected'); });
    btn.classList.add('selected');
}

function toggleHint(stepId) {
    var el = document.getElementById('h-' + stepId);
    if (el) el.style.display = el.style.display === 'none' ? 'block' : 'none';
}

async function doCheck(stepId) {
    var input = document.getElementById('inp-' + stepId);
    if (!input || input.value === '') return;

    var r = await fetch(BASE + '/check?token=' + TOKEN, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
            type: exState.problem.type,
            seed: exState.seed,
            step_id: stepId,
            answer: parseFloat(input.value)
        })
    });
    var result = await r.json();

    exState.answered[stepId] = {
        correct: result.correct, expected: result.expected,
        formula: result.formula, student: input.value
    };
    if (result.correct) exState.correct++;

    renderExercise();

    if (Object.keys(exState.answered).length === exState.total) {
        var pct = Math.round(exState.correct / exState.total * 100);
        var el  = document.getElementById('score-text');
        el.textContent = exState.correct + '/' + exState.total + ' (' + pct + '%)';
        el.className   = 'score ' + (pct >= 75 ? 'good' : pct >= 50 ? 'mid' : 'bad');
        document.getElementById('results').style.display = 'block';
        document.getElementById('results').scrollIntoView({ behavior: 'smooth' });
    }
}

// ════════════════════════════════════════════════════════════
// Hide header inside iframe
// ════════════════════════════════════════════════════════════
if (window.self !== window.top) {
    var h = document.querySelector('.header');
    if (h) h.style.display = 'none';
}
</script>
</body>
</html>
