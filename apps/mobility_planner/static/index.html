<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UNINOVIS Mobility Planner</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f4f6f9;
            color: #333;
            padding: 20px;
        }
        h1 {
            text-align: center;
            margin-bottom: 6px;
            color: #1a3a5c;
        }
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 0.95em;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        .card {
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            padding: 24px;
            margin-bottom: 24px;
        }
        .form-group {
            margin-bottom: 18px;
        }
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 6px;
            color: #1a3a5c;
        }
        label .hint {
            font-weight: 400;
            color: #888;
            font-size: 0.85em;
        }
        select, input[type="date"] {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 1em;
            background: #fff;
        }
        select[multiple] {
            height: 180px;
        }
        button {
            display: inline-block;
            background: #1a3a5c;
            color: #fff;
            border: none;
            padding: 12px 32px;
            border-radius: 6px;
            font-size: 1em;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background: #274d73; }
        button:disabled { background: #aaa; cursor: default; }
        .btn-row { text-align: center; margin-top: 8px; }

        /* Results */
        .results-title {
            font-size: 1.1em;
            font-weight: 700;
            color: #1a3a5c;
            margin-bottom: 16px;
        }
        .result-card {
            background: #f9fbfd;
            border-left: 4px solid #1a3a5c;
            border-radius: 6px;
            padding: 16px 20px;
            margin-bottom: 14px;
        }
        .result-card h3 {
            margin-bottom: 10px;
            color: #1a3a5c;
            font-size: 1em;
        }
        .timeline {
            display: flex;
            align-items: center;
            gap: 0;
            margin: 14px 0;
            flex-wrap: wrap;
        }
        .tl-node {
            text-align: center;
            padding: 8px 14px;
            border-radius: 6px;
            font-size: 0.85em;
            line-height: 1.4;
            min-width: 120px;
        }
        .tl-node.call   { background: #d4edda; border: 1px solid #28a745; }
        .tl-node.docs   { background: #fff3cd; border: 1px solid #ffc107; }
        .tl-node.activity { background: #cce5ff; border: 1px solid #007bff; }
        .tl-arrow {
            font-size: 0.8em;
            color: #666;
            padding: 4px 8px;
            text-align: center;
            min-width: 80px;
        }
        .detail-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px 20px;
            font-size: 0.9em;
        }
        .detail-grid dt { color: #666; }
        .detail-grid dd { font-weight: 600; }
        .holiday-note {
            margin-top: 6px;
            font-size: 0.85em;
            color: #b45309;
            font-style: italic;
        }
        #results { display: none; }
        .error { color: #dc3545; font-weight: 600; text-align: center; }
    </style>
</head>
<body>
    <div class="container">
        <h1>UNINOVIS Mobility Planner</h1>
        <p class="subtitle">Compute when to open mobility calls, accounting for administrative periods and holidays</p>

        <div class="card">
            <div class="form-group">
                <label for="receiving">Receiving University</label>
                <select id="receiving"><option value="">Loading...</option></select>
            </div>

            <div class="form-group">
                <label for="sending">Sending Universities <span class="hint">(hold Ctrl / Cmd to select multiple)</span></label>
                <select id="sending" multiple><option value="">Loading...</option></select>
            </div>

            <div class="form-group">
                <label for="activityDate">Activity Start Date</label>
                <input type="date" id="activityDate">
            </div>

            <div class="btn-row">
                <button id="computeBtn" disabled>Compute Deadlines</button>
            </div>
        </div>

        <div id="results" class="card">
            <div class="results-title">Results</div>
            <div id="resultsBody"></div>
        </div>
    </div>

    <script>
        const receivingSel = document.getElementById('receiving');
        const sendingSel   = document.getElementById('sending');
        const dateInput    = document.getElementById('activityDate');
        const computeBtn   = document.getElementById('computeBtn');
        const resultsDiv   = document.getElementById('results');
        const resultsBody  = document.getElementById('resultsBody');

        let universities = {};

        // Set default date to 3 months from now
        const defaultDate = new Date();
        defaultDate.setMonth(defaultDate.getMonth() + 3);
        dateInput.value = defaultDate.toISOString().split('T')[0];

        async function init() {
            const resp = await fetch('/api/universities');
            universities = await resp.json();

            // Sort by acronym
            const sorted = Object.entries(universities).sort((a, b) => a[0].localeCompare(b[0]));

            receivingSel.innerHTML = '<option value="">-- Select receiving university --</option>';
            sendingSel.innerHTML = '';
            for (const [acro, info] of sorted) {
                const label = `${acro} - ${info.name} (${info.country})`;
                receivingSel.innerHTML += `<option value="${acro}">${label}</option>`;
                sendingSel.innerHTML += `<option value="${acro}">${label}</option>`;
            }
            computeBtn.disabled = false;
        }

        computeBtn.addEventListener('click', async () => {
            const receiving = receivingSel.value;
            const sending = Array.from(sendingSel.selectedOptions).map(o => o.value);
            const activityDate = dateInput.value;

            if (!receiving) { alert('Please select a receiving university.'); return; }
            if (sending.length === 0) { alert('Please select at least one sending university.'); return; }
            if (!activityDate) { alert('Please select the activity start date.'); return; }

            computeBtn.disabled = true;
            computeBtn.textContent = 'Computing...';

            try {
                const resp = await fetch('/api/compute', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        receiving_university: receiving,
                        sending_universities: sending,
                        activity_date: activityDate,
                    }),
                });
                const data = await resp.json();
                if (data.error) {
                    resultsBody.innerHTML = `<p class="error">${data.error}</p>`;
                } else {
                    renderResults(data.results);
                }
                resultsDiv.style.display = 'block';
            } catch (e) {
                resultsBody.innerHTML = `<p class="error">Request failed: ${e.message}</p>`;
                resultsDiv.style.display = 'block';
            }
            computeBtn.disabled = false;
            computeBtn.textContent = 'Compute Deadlines';
        });

        function fmtDate(iso) {
            const d = new Date(iso + 'T00:00:00');
            return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
        }

        function renderResults(results) {
            if (results.length === 0) {
                resultsBody.innerHTML = '<p>No results.</p>';
                return;
            }

            const recvName = results[0].receiving_name;
            const recvAcro = results[0].receiving_university;
            const actDate  = results[0].activity_date;

            let html = `<p style="margin-bottom:16px;">Receiving: <strong>${recvAcro}</strong> (${recvName}) &mdash; Activity date: <strong>${fmtDate(actDate)}</strong></p>`;

            for (const r of results) {
                const sendHolNote = r.sending_holidays_hit.length > 0
                    ? `<p class="holiday-note">+${r.sending_holiday_days_added} day(s) added due to ${r.sending_university} holidays: ${r.sending_holidays_hit.join(', ')}</p>`
                    : '';
                const recvHolNote = r.receiving_holidays_hit.length > 0
                    ? `<p class="holiday-note">+${r.receiving_holiday_days_added} day(s) added due to ${r.receiving_university} holidays: ${r.receiving_holidays_hit.join(', ')}</p>`
                    : '';

                html += `
                <div class="result-card">
                    <h3>${r.sending_university} (${r.sending_name})</h3>
                    <div class="timeline">
                        <div class="tl-node call">
                            <strong>Call opens</strong><br>${fmtDate(r.call_open_date)}
                        </div>
                        <div class="tl-arrow">
                            ${r.sending_period_days} days<br>sending
                            ${r.sending_holiday_days_added > 0 ? '<br>(+' + r.sending_holiday_days_added + ' hol.)' : ''}
                        </div>
                        <div class="tl-node docs">
                            <strong>Docs arrive</strong><br>${fmtDate(r.docs_arrival_date)}
                        </div>
                        <div class="tl-arrow">
                            ${r.receiving_period_days} days<br>receiving
                            ${r.receiving_holiday_days_added > 0 ? '<br>(+' + r.receiving_holiday_days_added + ' hol.)' : ''}
                        </div>
                        <div class="tl-node activity">
                            <strong>Activity</strong><br>${fmtDate(r.activity_date)}
                        </div>
                    </div>
                    <dl class="detail-grid">
                        <dt>Total calendar days needed:</dt>
                        <dd>${r.total_calendar_days} days</dd>
                        <dt>Sending period:</dt>
                        <dd>${r.sending_period_days} days${r.sending_holiday_days_added > 0 ? ' + ' + r.sending_holiday_days_added + ' holiday' : ''}</dd>
                        <dt>Receiving period:</dt>
                        <dd>${r.receiving_period_days} days${r.receiving_holiday_days_added > 0 ? ' + ' + r.receiving_holiday_days_added + ' holiday' : ''}</dd>
                    </dl>
                    ${sendHolNote}${recvHolNote}
                </div>`;
            }
            resultsBody.innerHTML = html;
        }

        init();
    </script>
</body>
</html>
