<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <h1>TOMMI Claim Checker</h1>
    <p class="subtitle">Detect hallucinations in any text</p>

    <div class="field">
      <label for="backendUrl">Backend URL</label>
      <input type="text" id="backendUrl" placeholder="http://localhost:8100">
    </div>

    <div class="field">
      <label for="strategy">Strategy</label>
      <select id="strategy">
        <option value="reference">Reference text comparison</option>
        <option value="web_search" disabled>Web search (coming soon)</option>
        <option value="llm" disabled>LLM assessment (coming soon)</option>
      </select>
    </div>

    <div class="field">
      <label for="referenceText">Reference / source text</label>
      <textarea id="referenceText" rows="8" placeholder="Paste the trusted source text here (e.g. Wikipedia article, paper abstract, official documentation)..."></textarea>
    </div>

    <div class="actions">
      <button id="saveBtn" class="btn-primary">Save settings</button>
      <button id="clearBtn" class="btn-secondary">Clear highlights</button>
    </div>

    <div id="status" class="status"></div>

    <div class="help">
      <strong>How to use:</strong>
      <ol>
        <li>Paste trusted reference text above</li>
        <li>Click "Save settings"</li>
        <li>Select text on any web page</li>
        <li>Right-click → "Check claims with TOMMI"</li>
      </ol>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
